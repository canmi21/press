<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Overview</title>
	</head>
	<body>
		<div class="app-shell">
			<div class="native-titlebar" data-tauri-drag-region aria-hidden="true"></div>
			<aside class="sidebar" aria-label="CMS navigation">
				<header class="sidebar-header">
					<strong>%SITE_TITLE%</strong>
				</header>

				<nav class="sidebar-nav" aria-label="Pages">
					<button class="page-link" type="button" data-page="overview" aria-current="page">
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<rect width="7" height="9" x="3" y="3" rx="1" />
							<rect width="7" height="5" x="14" y="3" rx="1" />
							<rect width="7" height="9" x="14" y="12" rx="1" />
							<rect width="7" height="5" x="3" y="16" rx="1" />
						</svg>
						<span>Overview</span>
					</button>
					<button class="page-link" type="button" data-page="articles">
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5Z" />
							<path d="M14 2v6h6M8 13h8M8 17h8M8 9h2" />
						</svg>
						<span>Articles</span>
					</button>
					<button class="page-link" type="button" data-page="media">
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<rect width="18" height="18" x="3" y="3" rx="2" />
							<circle cx="8.5" cy="8.5" r="1.5" />
							<path d="m21 15-5-5L5 21" />
						</svg>
						<span>Media</span>
					</button>
					<button class="page-link" type="button" data-page="derived">
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 9 9 9 9 0 0 1-9 9 9 9 0 0 1-9-9Z" />
							<path d="M12 7v5l3 3" />
						</svg>
						<span>Derived</span>
					</button>

					<hr />

					<button class="page-link" type="button" data-page="automations">
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<path d="M21 12a9 9 0 0 0-15.2-6.5L3 8" />
							<path d="M3 3v5h5M3 12a9 9 0 0 0 15.2 6.5L21 16" />
							<path d="M16 16h5v5" />
						</svg>
						<span>Automations</span>
					</button>
					<button class="page-link" type="button" data-page="activity">
						<svg aria-hidden="true" viewBox="0 0 24 24">
							<path d="M22 12h-4l-3 9L9 3l-3 9H2" />
						</svg>
						<span>Activity</span>
					</button>
				</nav>
			</aside>

			<!-- The page's name is the highlighted item in the sidebar and the window's own title
			     bar; repeating it as an <h1> at the top of the content spent the first fold of
			     every page restating what two other things already said. The accessible name stays,
			     because "which region am I in" is a question a screen reader still has to answer
			     without either of those cues. `data-page-label` is kept in sync with the window
			     title rather than being a second source for it. -->
			<section class="page-shell" aria-label="Overview" data-page="overview" data-page-label>
				<main class="page-content">
					<div class="overview" data-overview aria-live="polite">
						<header class="overview-brief">
							<div class="overview-title">
								<span
									class="overview-status-icon"
									data-overview-status-icon
									data-state="loading"
									aria-hidden="true"
								>
									<span class="overview-cheer" data-state-icon="ready">🎉</span>
									<svg data-state-icon="attention" aria-hidden="true" viewBox="0 0 24 24">
										<path
											d="M10.3 3.7 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"
										/>
										<path d="M12 9v4M12 17h.01" />
									</svg>
									<svg data-state-icon="error" aria-hidden="true" viewBox="0 0 24 24">
										<circle cx="12" cy="12" r="9" />
										<path d="m9 9 6 6M15 9l-6 6" />
									</svg>
								</span>
								<h1 data-overview-title>Reading workspace…</h1>
							</div>
							<p class="overview-lede" data-overview-lede>Checking content and referenced media.</p>
							<div class="overview-meta" aria-label="Workspace summary">
								<span data-overview-content>Reading articles…</span>
								<span data-overview-media>Reading media…</span>
							</div>
						</header>

						<section class="overview-section attention-section" data-attention hidden>
							<div class="overview-section-title">
								<svg aria-hidden="true" viewBox="0 0 24 24">
									<path
										d="M10.3 3.7 2.6 17a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 3.7a2 2 0 0 0-3.4 0Z"
									/>
									<path d="M12 9v4M12 17h.01" />
								</svg>
								<h2>Needs attention</h2>
							</div>
							<ul class="health-list" data-health-list></ul>
						</section>

						<section class="overview-section recent-section" data-recent>
							<h2>Recently updated</h2>
							<ul class="recent-list" data-recent-list></ul>
							<!-- The three most recent are a glance, not a listing. This is the way out to the
							     whole library, and it stays hidden while there is nothing beyond the three
							     already on screen -- an exit to a page holding exactly what is above it. -->
							<button class="recent-all" type="button" data-recent-all data-goto-page="articles" hidden>
								<span data-recent-all-label></span>
								<svg aria-hidden="true" viewBox="0 0 24 24">
									<path d="M5 12h14M13 6l6 6-6 6" />
								</svg>
							</button>
						</section>
					</div>

					<div class="articles" data-articles aria-live="polite" hidden>
						<header class="view-head">
							<div class="view-title">
								<h1>Articles</h1>
								<!-- Reserved. Global controls -- search, a primary create action, the signed-in
								     identity -- belong to the window rather than to this page, so the slot is
								     held open here and stays empty until they exist. -->
								<div class="view-global"></div>
							</div>
							<div class="view-actions">
								<div class="tabs" role="tablist" aria-label="Group articles by" data-group-tabs>
									<button type="button" role="tab" data-group="status" aria-selected="true">
										<span data-tab-icon="status"></span>Status
									</button>
									<button type="button" role="tab" data-group="section" aria-selected="false">
										<span data-tab-icon="section"></span>Section
									</button>
									<!-- One bar that moves, rather than an underline per tab. See client/motion.ts. -->
									<span class="tab-indicator" data-tab-indicator aria-hidden="true"></span>
								</div>
								<div class="view-controls">
									<div class="menu-anchor">
										<button type="button" class="control" data-menu="filter" aria-expanded="false">
											<svg aria-hidden="true" viewBox="0 0 24 24">
												<path d="M3 5h18M7 12h10M11 19h2" />
											</svg>
											<span data-menu-label="filter">Filter</span>
										</button>
									</div>
									<div class="menu-anchor">
										<button type="button" class="control" data-menu="sort" aria-expanded="false">
											<svg aria-hidden="true" viewBox="0 0 24 24">
												<path d="M4 6h10M4 12h7M4 18h4M17 5v14M17 19l3-3M17 19l-3-3" />
											</svg>
											<span data-menu-label="sort">Recent</span>
										</button>
									</div>
								</div>
							</div>
						</header>
						<!-- Marks, authored here rather than built in script: an SVG element needs its
						     namespace, and the document is the one place that already carries it. -->
						<template data-icon="status">
							<svg class="mark" aria-hidden="true" viewBox="0 0 24 24">
								<circle cx="12" cy="12" r="8.5" />
								<path d="M12 7.5v5l3 2" />
							</svg>
						</template>
						<template data-icon="section">
							<svg class="mark" aria-hidden="true" viewBox="0 0 24 24">
								<path d="M4 6h16M4 12h16M4 18h10" />
							</svg>
						</template>
						<template data-icon="todo">
							<svg class="mark" aria-hidden="true" viewBox="0 0 24 24">
								<circle cx="12" cy="12" r="8.5" />
							</svg>
						</template>
						<template data-icon="progress">
							<svg class="mark" aria-hidden="true" viewBox="0 0 24 24">
								<circle cx="12" cy="12" r="8.5" />
								<path d="M12 3.5a8.5 8.5 0 0 1 0 17Z" fill="currentColor" stroke="none" />
							</svg>
						</template>
						<template data-icon="complete">
							<svg class="mark" aria-hidden="true" viewBox="0 0 24 24">
								<circle cx="12" cy="12" r="8.5" />
								<path d="M8.5 12.2l2.4 2.3 4.6-4.8" />
							</svg>
						</template>
						<template data-icon="more">
							<svg class="mark" aria-hidden="true" viewBox="0 0 24 24">
								<circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none" />
								<circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none" />
								<circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none" />
							</svg>
						</template>
						<template data-icon="check">
							<svg class="mark" aria-hidden="true" viewBox="0 0 24 24">
								<path d="M5 12.5l4.2 4L19 7" />
							</svg>
						</template>
						<div class="groups" data-articles-list></div>
						<p class="view-error" data-articles-error hidden></p>
					</div>

					<div class="derived" data-derived aria-live="polite" hidden>
						<header class="page-subheading">
							<span data-derived-total>— record classes</span>
							<span data-derived-state>Reading…</span>
						</header>
						<section class="task-runs" data-task-runs aria-label="Live task runs" hidden>
							<ul data-task-run-list></ul>
						</section>
						<ul class="derived-list" data-derived-list></ul>
					</div>
				</main>
			</section>
		</div>
		<script type="module" src="/client/main.ts"></script>
	</body>
</html>
