[package]
name = "cms"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Blocking HTTP with no async runtime behind it. A local tool fetching a handful of icons has
# nothing to gain from tokio, and the compile time and binary size are the price of admission.
# If parallelism is ever needed here, threads are enough.
ureq = "3"
# A real HTML5 tokenizer, not the regexes the upstream worker used. That choice was forced by
# a Worker's bundle budget, and this runs locally, so the constraint is gone. Measured against
# adversarial input, regex matching picked up a commented-out <link>, a <link> written inside a
# <script> string, and left `&amp;` undecoded in the href -- three wrong icons, all silent.
# `tl` is far lighter and got two of those three wrong as well. scraper got all of them right.
scraper = "0.27"
# For `sizes="16x16 32x32"` and the prefers-color-scheme media query. Small, and clearer than
# hand-rolled splitting.
regex = "1"
# Resolving a possibly-relative href against the page it came from is the one piece of URL
# handling worth not writing by hand.
url = "2"
# Package URLs percent-encode reserved characters in names and versions. OpenGraph route slugs
# use the readable browser spelling, so the record key has to be decoded rather than copied.
percent-encoding = "2"

# Content addressing. BLAKE3 truncated to 128 bits, which leaves roughly 64-bit collision
# resistance -- ample for addressing personal assets, and deliberately not a tamper-evidence
# claim. See spec/architecture/data.md.
blake3 = "1"
# Decoding whatever was handed to us, and encoding PNG where lossy formats are the wrong tool.
image = "0.25"
# SIMD resampling. Measurably better than the `image` crate's own filters at this size.
fast_image_resize = { version = "6", features = ["image"] }
# AVIF, via rav1e. Pure Rust and slow; both are acceptable for a local one-off per image.
ravif = "0.13"
rgb = "0.8"
# WebP, via libwebp. A C dependency, which a local tool can afford -- see spec/code.md.
webp = "0.3"
# The compact placeholder that gets compiled into an article so a page paints before any
# image request is made.
thumbhash = "0.1"
# The manifest, which is read by the site build and by the metadata API.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Timestamps. Only ever formatted as ISO 8601 in UTC, so the record means the same thing on
# any machine that reads it.
jiff = "0.2"
base64 = "0.23.1"
claude-codes = "2.1.232"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
indicatif = "0.18.6"
cosmic-text = "0.19.0"
tiny-skia = "0.12.0"
serde_yaml_ng = "0.10.0"
rand = "0.10.2"
kamadak-exif = "0.6.1"
heic = "0.1.6"
tzf-rs = "1.3.7"
rstar = "0.13.0"
semver = "1.0.28"
rayon = "1.12.0"
# Argument parsing. The hand-rolled version read `--limit` with `.parse().ok()`, so a typo in the
# value -- or in the flag name -- left the limit unset, and unset means no limit on five commands
# that spend money per item. Rejecting what it does not recognise is the property being bought,
# and derive is what makes it free: the flag set is the type, so there is no second list to keep.
clap = { version = "4.6.6", features = ["derive"] }
# The palette clap paints its own help with. Cargo's colours rather than clap's defaults, because
# this is a local Rust CLI and cargo is the one its user already has muscle memory for.
anstyle = "1.0.14"
