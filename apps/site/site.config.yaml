# Site identity, baked in at build via the `virtual:site` module (see
# vite.config.ts). Hexo-style single config: change rarely, e.g. when standing
# the site up somewhere new. Not environment variables — compiled to a plain
# object, never shipped as env. URLs/ports live in libs/urls, not here.

name: サボり記
tagline: One developer's journey through code, circuits, pixels — and life in between.

# The site's address as a label, drawn on the OpenGraph card. Not a URL: nothing resolves it,
# it is read by a person looking at a picture, which is why it may live outside libs/urls. The
# resolvable address is still declared there alone, and a test holds the two to the same host.
domain: canmi.net

author:
  name: Canmi
  # How the home page introduces the author, and what its OpenGraph card repeats. Kept here
  # rather than written into the page, because a card rendered by `cms og` and a page rendered
  # by SvelteKit have no other way to agree. Not translated: a name is a name, and a job title
  # is one of the things this site leaves in English on purpose.
  fullName: Canmi Wu
  role: Systems Engineer
  email: t@canmi.net
  # Handles, not URLs. Where to reach them is libs/urls' business; who they identify lives here.
  telegram: canmimua
  twitter: canmi21
  github: canmi21
  # GitHub addresses an avatar by the account's numeric id, which never changes when the handle
  # does. A handle in its place would break the picture the day the account is renamed, and the
  # two are the same fact -- who this is -- so both belong here rather than in the page.
  githubId: 72544151
  fediverse: canmi
  # Bluesky identifies an account by a domain the owner proves; the handle being the site's
  # domain is that proof, not a second copy of the address.
  bluesky: canmi.net

feed:
  id: tag:canmi.net,2023:atom
  followDescription: feedId:259981957098517504+userId:125528261992773632

# The IndexNow key. Public by construction: proving ownership means serving this exact string
# at `/<key>.txt`, so anyone who can read the file can read the key. It is written here in
# plain text for the same reason the analytics client id is -- see spec/analytics.md -- rather
# than pretending a secret store could hide something the protocol requires be published.
#
# It is not a URL, so it does not belong in libs/urls; it is an identity this site proves, like
# the Bluesky handle above. The route that serves it and the script that submits with it both
# read it from here, so rotating the key is a one-line edit. See spec/indexing.md.
indexnow: 4db98e0b887a45b1b983c3f5715afa90

# The search index's application id and its search-only key. Both reach the browser, so both
# are public by construction and are written here in plain text rather than pretending a secret
# store could hide what ships in a bundle -- the same treatment as the IndexNow key above and
# the analytics client id, see spec/analytics.md. What restricts them is the key's own scoping
# and rate limit. The write key is a different credential entirely and is never in this file;
# it lives encrypted in secrets.json. See spec/search.md.
algolia:
  appId: KDD8OEZHPB
  searchKey: 1c92e54e4e374d247b4fda440a67fd9f
  # The index every locale shares. Named for what it holds rather than for the site that holds
  # it -- the application id above is already the namespace, so a `press_` prefix would be the
  # same fact written twice. Read by the browser client and by `mise run search`, which is why
  # it is here and not a constant in either of them.
  index: articles

# Extra static 301 redirects (from: to), baked into the Cloudflare _redirects
# file at build (see vite.config.ts). Built-in redirects (feed aliases, favicon)
# are hardcoded in vite.config.ts and not configured here — this list is only
# for site-specific moves like legacy article paths.
redirects:
  /posts/note/less-than-an-hour: /mirror/less-than-an-hour
  /posts/milestone/less-is-more: /milestone/less-is-more
  /posts/development/rust-build-config-cranelift-profile-optimization: /development/rust-cargo-cranelift-tuning
  /posts/architecture/compile-time-rendering: /architecture/compile-time-rendering
