# Site identity, baked in at build via the `virtual:site` module (see
# vite.config.ts). Hexo-style single config: change rarely, e.g. when standing
# the site up somewhere new. Not environment variables — compiled to a plain
# object, never shipped as env. URLs/ports live in libs/urls, not here.

name: サボり記
tagline: One developer's journey through code, circuits, pixels — and life in between.

author:
  name: Canmi
  # How the home page introduces the author, and what its OpenGraph card repeats. Kept here
  # rather than written into the page, because a card rendered by `cms og` and a page rendered
  # by SvelteKit have no other way to agree. Not translated: a name is a name, and a job title
  # is one of the things this site leaves in English on purpose.
  fullName: Canmi Wu
  role: Systems Engineer
  email: t@canmi.net
  # Handles, not URLs. Where to reach them is libs/urls' business; who they identify lives here.
  telegram: canmimua
  x: canmi21

feed:
  id: tag:canmi.net,2023:atom
  followDescription: feedId:259981957098517504+userId:125528261992773632

# Extra static 301 redirects (from: to), baked into the Cloudflare _redirects
# file at build (see vite.config.ts). Built-in redirects (feed aliases, favicon)
# are hardcoded in vite.config.ts and not configured here — this list is only
# for site-specific moves like legacy article paths.
redirects:
  /posts/note/less-than-an-hour: /mirror/less-than-an-hour
  /posts/milestone/less-is-more: /milestone/less-is-more
  /posts/development/rust-build-config-cranelift-profile-optimization: /development/rust-cargo-cranelift-tuning
  /posts/architecture/compile-time-rendering: /architecture/compile-time-rendering
