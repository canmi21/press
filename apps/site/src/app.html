<!doctype html>
<html lang="%language.tag%" class="%theme.class%" data-locale="%language.code%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#fbfbfb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
		<script>
			%theme.script%
		</script>
		<script>
			%article.hash.script%
		</script>
		<!-- Third-party hosts (analytics, fonts) are emitted from +layout.svelte's head, where
		     they can read libs/urls; this static template cannot import anything. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			%article.rail.script%
		</script>
	</body>
</html>
