<!doctype html>
<html lang="%language.tag%" class="%theme.class%" data-locale="%language.code%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#fbfbfb" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
		<script>
			%theme.script%
		</script>
		<script
			defer
			fetchpriority="low"
			src="https://cloud.umami.is/script.js"
			data-website-id="2b0a1e79-405a-47c0-a263-05732e0a130c"
			data-domains="canmi.net"
			data-exclude="/@/*"
		></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:ital@1&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
