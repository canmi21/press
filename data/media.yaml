        text: Ein Screenshot der Dokumentationsseite der Bytecode Alliance für Cranelift, mit einer oberen Navigationsleiste, die zu Documentation, API Reference, Contributing, Chat und einem GitHub‑Symbol führt. Unter einer großen Überschrift „Cranelift“ beschreibt der Text, dass es sich um ein schnelles, sicheres, relativ einfaches und innovatives Compiler‑Backend handelt, das in Rust geschrieben ist und Zwischenrepräsentationen in ausführbaren Maschinencode kompiliert. Es wird von der Wasmtime‑WebAssembly‑Virtuellen Maschine für JIT‑ und AOT‑Kompilierung verwendet und experimentell als Backend für den Rust‑Compiler eingesetzt. Weiterhin wird angegeben, dass Cranelift derzeit die Plattformen x86‑64, aarch64 (ARM64), s390x (IBM Z) und riscv64 unterstützt, retargetierbar ist und weitere ISA‑Beiträge willkommen heißt. Zudem wird erwähnt, dass es aktiv gepflegt wird, um sandboxed, nicht vertrauenswürdigen Code mit nahezu nativer Leistung auszuführen, und dabei den Release‑ und Sicherheitspolitiken von Wasmtime folgt. Die Seite dient als Nachweis für den Projektumfang von Cranelift, die unterstützten Architekturen und seine Rolle im Bytecode‑Alliance‑Ökosystem.
