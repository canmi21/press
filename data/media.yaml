        text: 'Dies ist ein Balkendiagramm, das die Linkzeiten von vier Linkern – GNU ld 2.42, GNU gold 2.38, LLVM lld 19.0.0 und mold 2.4.0 – bei drei Programmen zunehmender Binärgröße vergleicht: MySQL 8.3 (0,47 GiB), Clang 19.0 (1,56 GiB) und Chromium 124 (1,35 GiB), wobei die Linkzeit in Sekunden auf der vertikalen Achse angezeigt wird. GNU ld benötigt etwa 11 Sekunden für MySQL und rund 42 Sekunden für Clang, für Chromium gibt es keinen Balken. GNU gold steigt von etwa 7,5 Sekunden über 33 Sekunden auf 27 Sekunden bei den drei Programmen. LLVM lld und mold bleiben dagegen deutlich niedriger, wobei lld etwa 2, 5 und 6 Sekunden und mold durchgehend unter 2 Sekunden liegt. Das Diagramm zeigt, dass mold und LLVM lld mit der Binärgröße viel besser skalieren als die traditionellen Linker GNU ld und gold, deren Linkzeiten bei größeren Programmen deutlich stärker ansteigen.'
