        text: 'Ein gruppiertes Balkendiagramm, das vier Unix-Linker vergleicht — GNU ld 2.42 (blau), GNU gold 2.38 (rot), LLVM lld 19.0.0 (gelb) und mold 2.4.0 (grün) — anhand der Linkzeit in Sekunden auf einer y-Achse von 0 bis 50, über drei Programme hinweg, die mit ihren Binärgrößen auf der x-Achse angegeben sind: MySQL 8.3 mit 0,47 GiB, Clang 19.0 mit 1,56 GiB und Chromium 124 mit 1,35 GiB. Für MySQL liegen die vier Balken bei etwa 11, 7,5, 1,7 und 0,5 Sekunden; für Clang bei 42, 33, 5,3 und 1,4; für Chromium fehlt der blaue Balken vollständig, gold liegt bei etwa 27, lld bei etwa 6 und mold bei etwa 1,4. Der Abstand vergrößert sich mit der Binärgröße, und der fehlende GNU-ld-Balken legt nahe, dass dieser Linker Chromium nicht linken konnte, sodass das Diagramm als Beleg dafür zu lesen ist, dass mold bei großen Builds rund eine Größenordnung schneller ist als lld und etwa zwanzig- bis dreißigmal schneller als die traditionellen GNU-Linker.'
