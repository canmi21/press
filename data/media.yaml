        text: |-
          Ein Screenshot der Landingpage einer macOS-App namens Typeless, dargestellt auf schlichtem weißem Hintergrund, mit einer Wortmarke und einem kleinen dunklen Glyph oben links, einer zentrierten Navigation aus Manifesto, Pricing und About sowie einem schwarzen Pill-Button mit der Aufschrift "Download for macOS" oben rechts. Die Hero-Überschrift steht riesig und zentriert — "Speak," in fast Schwarz, gefolgt von "don't type" in mittlerem Grau — über einer zweizeiligen Unterzeile, die Grau und schwarze Schriftstärke zur Hervorhebung mischt: "Speak naturally, and Typeless will turn your words into polished messages, emails, and documents that read like you carefully typed them - in real time. 4x faster than typing." Eine zweite, größere Kopie desselben schwarzen "Download for macOS"-Buttons sitzt unter dem Text, und die untere Hälfte des Bildausschnitts ist leeres Weiß.

          Das wirkt wie eine festgehaltene Referenz eines Marketing-Hero-Bereichs — ein Diktier- bzw. Speech-to-Text-Produkt, das sich über Geschwindigkeit und ausgefeilte Ausgabe positioniert — vermutlich als Design- oder Copywriting-Beispiel gespeichert.
