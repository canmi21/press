  milestone/less-is-more.md:
    provider: openai
    model: gpt-5-6-sol-high
    at: 2026-08-03T02:24:12.936745Z
    tokens: 20034
    segments:
      03a7b723b0bf91095124a7d8c7cf04c7:
        source: 奇怪的是，放手之后质量并没有变差。我想这大概是因为之前那些"古法"编程的日子没有白费；早在 GPT-2 时代我就开始用 AI 了，但那时候我还在老老实实地写每一行代码、理解每一个概念。那段经历给了我底子，与其说后来 Vibe Coding 不如说是 Context Coding，该有的判断力还在，并没有因为放手就出什么低级错误或者说是事故。
        spans:
        - phrase: '"古法"编程'
          guidance: “古法”通常形容传统手工工艺，加引号用于戏称逐行亲手写代码已经像 AI 时代的古老技艺。
      0718215ea97d512da49fb3554686b339:
        source: 说"想"其实不太准确，更像是一个执念。在早期我还不会写前后端，不会写嵌入式代码的时候就有了，当时还在玩电子，偶然间看到了 [@ushio](https://github.com/sakura-ushio) 的 B站视频 和 网站，窝觉得很好玩我也要。后来花了小半年时间，从零学会了写 C 和一点点 JS CSS 用 Hexo 搭了一个静态博客部署在 Github Pages，也算是有了自己的小天地。
        spans:
        - phrase: 窝觉得很好玩我也要
          guidance: “窝”是把“我”写成同音近音字的卖萌式网络用法，直译会丢掉刻意稚拙的口吻。
      943bc9082d74c7867db730a57a3c5d75:
        source: AI 时代的节奏太快了。模型一个接一个迭代，新技术一轮接一轮冒出来，我越来越焦虑，好像停下来就要被超越。最疯的时候一天写 16个 小时代码，Token 一天就能烧 $1.9k USD ~~(大概2月的时候吧)~~，人快废了。但让这一切停下来的不是什么顿悟，就是单纯的累了。在越来越紧的节奏下，最后一根稻草压下来，我反而释然了，想开了，摆烂了；这样，也挺好的。
        spans:
        - phrase: 摆烂了
          guidance: “摆烂”是中文网络俚语，指因疲惫或无力而主动放弃挣扎，语气比普通的“放弃”更自嘲。
      b60e899dca8ebe5689336bfe87e8278c:
        source: 从 Next.js 13 鸽到 Next.js 16
        spans:
        - phrase: 从 Next.js 13 鸽到 Next.js 16
          guidance: “鸽”是中文网络俚语，指一再拖延或爽约，这里还借版本跨度调侃博客被拖了数年。
  mirror/less-than-an-hour.md:
    provider: openai
    model: gpt-5-6-sol-high
    at: 2026-08-03T02:24:36.825872Z
    tokens: 20909
    segments:
      32c72537542b299f6e68c64f0ac0f610:
        source: 回去的时候走了一条完全不同的路，从小区后门绕进去，经过地下车库。小时候经常在车库里玩，虽然后来搬过一次家，不知怎么又搬回来了。车库是我成长记忆里唯一不常去的地方，样子变没变我看不出来，但我记得它的味道。小时候车库里有一种很清新的气息，有点像薄荷，浓浓的但没有香气，只剩下一个"清"字可以形容，再夹着一点地下室特有的阴凉。我其实还挺喜欢那个味道的。但是现在走进去，那股清气没了。只剩下阴冷的湿气，闷闷地贴在空气里。车开过来的时候带起一点风，大概是从入口灌进来的，但那个风也不对，什么都不对，哪哪都不对了，我已经想想不出来那个样子了，但是绝对就是你在那就能感受到的不同。
        spans:
        - phrase: 只剩下一个"清"字可以形容
          guidance: 这里直接借汉字“清”的多重联想来同时表达清凉、清新和澄净，其他语言很难用一个对应字保留这种感官叠合。
      86c5fbdb33d50086883e7552c0b7c428:
        source: 我是一个很宅的人，也不知道从什么时候起，「出门」对我来说已经是一个很陌生的词汇了。我常常一个月只在必要的时候才出门，即使出门也是两点一线的生活，还常常坐车。仔细想想，我已经很久没有真正离开过室内了。在经历了 AI 时代的泡沫和焦虑后，我染上了一个坏习惯——常常凌晨写代码，似乎已经和生活的世界不在一个"时区"了。今天早上也是挨到了十二点多才起床，一天只吃两餐，醒来就坐到书房，打开电脑开始写。写代码本身是一件很好玩的事情，但 AI 时代的写代码已经不是了。盯着屏幕盯到下午，什么都写不出来，没有设计灵感，觉得一切都不完美。
        spans:
        - phrase: 两点一线的生活
          guidance: “Two points joined by one line” is a fixed Chinese image for a life confined to shuttling between two places, usually home and work, which a literal translation would not convey.
      ece3bf55829edba4e5b445a3313f4642:
        source: 打开屏幕的那一刻我就知道完了。果果的屏幕亮度在户外根本不够看。稍微尝试了一下各种角度，背光、顺光，甚至把自己调整到和太阳在同一条线上——怎么调都看不清。挺可怜的，说实话。在室内觉得自己还是个程序员，结果到了户外发现连屏幕都点不亮。算了，这代码不写也罢，但是我还是不死心，合上笔记本，决定去马路对面的树荫里碰碰运气。离开栏杆之前，我又往江面看了一眼。远看其实还行，水面在多云伴随阳光的天气下看起来还是那种记忆里的样子。但稍稍低头把视线下压一点看向岸边看，就能发现水面上浮着一层东西——水藻、树叶、零零碎碎的漂浮物。不多，但江水已经不清了，水面比记忆中的静，但岸边很显然已经没人搭理了，「早几年疫情的时候我其实就出来看过，自那时候起其实就这样了」~~但是每次走过还是有些许感慨~~。
        spans:
        - phrase: 果果
          guidance: 这是由“苹果”缩成的昵称，既把 Apple 拟人化又保留了品牌双关，译成普通的“电脑”或“Mac”都会丢失这种语气。
