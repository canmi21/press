# Globs are safe here: pnpm only picks up directories that contain a package.json and
# ignores the rest, so Rust-only libraries under libs/ are simply invisible to it. Cargo
# has no such tolerance, which is why Cargo.toml lists its members by hand instead.
packages:
  - libs/*
  - apps/*

# A package listed here may run arbitrary code during install. pnpm blocks that by default,
# and the default is right -- an install script is the shortest path from a compromised
# package to a compromised machine, and it runs before anybody reads a line of the code.
#
# These are allowed because they cannot work otherwise: each ships a platform-specific native
# binary that the install step fetches and unpacks. Nothing goes in this list to make a warning
# go away.
allowBuilds:
  '@sentry/cli': true
  esbuild: true
  workerd: true

# Supply-chain delay: a version must have been public for at least 24 hours before it
# can be installed. Most npm compromises are caught and yanked well inside that window.
# The unit is minutes. Applies to transitive dependencies too.
minimumReleaseAge: 1440

# Exempt only packages where waiting a day costs more than it protects: toolchain and
# type packages that get bumped constantly and are read at build time, not shipped.
# Keep this list short -- every entry is an accepted risk.
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types'
  - '@types/node'
  - vite
  - wrangler
