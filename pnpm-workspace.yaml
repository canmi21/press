# Globs are safe here: pnpm only picks up directories that contain a package.json and
# ignores the rest, so Rust-only libraries under libs/ are simply invisible to it. Cargo
# has no such tolerance, which is why Cargo.toml lists its members by hand instead.
packages:
  - libs/*
  - apps/*

# SvelteKit 2 retains cookie 0.6 for compatibility with invalid cookie attributes. Match only
# that vulnerable edge, so a future upstream range starting at 0.7 or a newer SvelteKit major
# takes precedence automatically.
overrides:
  '@sveltejs/kit@2>cookie@<0.7.0': 0.7.2

  # tauri-mcp-server pins ws 8.18.3 exactly. Keep the override on that exact edge so a future
  # server release owns its dependency again, while the current development tool gets both
  # the memory-disclosure and fragmented-message DoS fixes in ws 8.21.
  '@hypothesi/tauri-mcp-server@0.12.0>ws@8.18.3': 8.21.0

  # miniflare pins undici exactly, and the release that carries the fix is only on its alpha
  # line. Both are development-only -- a deployed Worker uses workerd's own fetch and never
  # loads undici -- so this buys a clean alert list rather than production safety, at the cost
  # of a patch-level bump across an exact pin. Drop it once a stable miniflare ships 7.29.
  'miniflare>undici': ^7.29.0

  # drizzle-kit still pulls the deprecated @esbuild-kit loaders, which pin ~0.18.20 and can
  # therefore never reach the patched 0.25. The advisory is about esbuild's dev server, which
  # this chain never starts; the override exists so the alert does not mask a real one later.
  '@esbuild-kit/core-utils>esbuild': ^0.25.12

# A package listed here may run arbitrary code during install. pnpm blocks that by default,
# and the default is right -- an install script is the shortest path from a compromised
# package to a compromised machine, and it runs before anybody reads a line of the code.
#
# These are allowed because they cannot work otherwise: each ships a platform-specific native
# binary that the install step fetches and unpacks. Nothing goes in this list to make a warning
# go away.
allowBuilds:
  '@sentry/cli': true
  cn-font-split: true
  esbuild: true
  workerd: true

# Supply-chain delay: a version must have been public for at least 24 hours before it
# can be installed. Most npm compromises are caught and yanked well inside that window.
# The unit is minutes. Applies to transitive dependencies too.
minimumReleaseAge: 1440

# Exempt only packages where waiting a day costs more than it protects: toolchain and
# type packages that get bumped constantly and are read at build time, not shipped.
# Keep this list short -- every entry is an accepted risk.
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types'
  - '@types/node'
  - vite
  - wrangler
