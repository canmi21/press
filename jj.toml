# Repo-scoped jj configuration, loaded by JJ_CONFIG (set in mise.toml).
#
# jj's own `--repo` config lives in ~/.config/jj/repos/<hash>/config.toml, outside the
# working copy, so it cannot be version controlled and does not survive a fresh clone.
# JJ_CONFIG takes a colon-separated list and merges left to right, so pointing it at the
# user config plus this file keeps personal settings intact while adding repo rules.

# `jj fix` pipes file content through these tools and rewrites the revisions in place,
# descendants included. This is strictly more than a pre-commit hook could do: it repairs
# history rather than only guarding the next commit.
[fix.tools.oxfmt]
command = ["oxfmt", "--stdin-filepath=$path"]
patterns = [
	"glob:'**/*.ts'",
	"glob:'**/*.tsx'",
	"glob:'**/*.mts'",
	"glob:'**/*.cts'",
	"glob:'**/*.js'",
	"glob:'**/*.mjs'",
	"glob:'**/*.cjs'",
	"glob:'**/*.jsx'",
	"glob:'**/*.css'",
	"glob:'**/*.json'",
	"glob:'**/*.jsonc'",
	"glob:'**/*.md'",
	"glob:'**/*.svelte'",
]

[fix.tools.rustfmt]
command = ["rustfmt", "--emit", "stdout"]
patterns = ["glob:'**/*.rs'"]
