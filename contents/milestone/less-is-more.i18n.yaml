  ffb2a6a34cb5ebc79cbf51e93c1f9641:
    de-DE:
      text: 'Am Ende drehte ich mich im Kreis und landete wieder bei Serverless. Das Konzept von Vercel ist gut, aber ich mag Next.js nicht; außerdem steckt bei Vercel zu viel „Magie“, und das Middleware‑Design, das im Voraus kompiliert wird, um am Edge zu laufen, führt letztlich zu einer Zersplitterung und sogar zu mehreren CVEs. Es wäre besser, alles auf dem Origin‑Server zu betreiben. Cloudflare Workers hingegen sind großartig und erreichen ein extremes Szenario: Produkte unter 10 MB werden zu WASM kompiliert und können echte Geschäftslogik am Edge ausführen – genau das, was ich will. Abgesehen von den Kosten gibt es kaum Nachteile – obwohl man das nicht wirklich als Nachteil bezeichnen kann, denn gesparte Zeit ist Geld.'
      provider: openai
      model: gpt-oss-120b-medium
      at: 2026-08-01T02:28:14.111657Z
      seconds: 16.593084083
      tokens: 18584
      review: false
    en-US:
      text: 'Finally, after going around in circles, I’m back to serverless. Vercel’s concept is good, but I don’t like Next.js; moreover, Vercel has too much “magic,” and the middleware design that pre‑compiles to run on the Edge ends up fragmented, even causing a few CVEs. It would be better to have everything on the origin. On the other hand, Cloudflare Workers are great, achieving another extreme: products under 10 MB compiled to WASM can run real business logic on the Edge, which is exactly what I want. Apart from the cost, there are essentially no drawbacks—though it’s not really a drawback, since the time saved is money.'
      provider: openai
      model: gpt-oss-120b-medium
      at: 2026-08-01T02:28:14.111657Z
      seconds: 16.593084083
      tokens: 18584
      review: false
    es-ES:
      text: 'Al final, después de dar muchas vueltas, termino volviendo al serverless. El concepto de Vercel es bueno, pero no me gusta Next.js; además, Vercel tiene demasiada “magia” y el diseño del middleware que se compila por adelantado para ejecutarse en el Edge termina fragmentado, incluso provocando varios CVE. Sería mejor que todo estuviera en el origen. Por otro lado, Cloudflare Workers es excelente, alcanzando otro extremo: compilar productos de menos de 10 MB a WASM permite ejecutar lógica de negocio real en el Edge, que es justo lo que quiero. Aparte del gasto, no tiene verdaderos defectos, aunque técnicamente no es un defecto, ya que el tiempo ahorrado equivale a dinero.'
      provider: openai
      model: gpt-oss-120b-medium
      at: 2026-08-01T02:28:14.111657Z
      seconds: 16.593084083
      tokens: 18584
      review: false
    fr-FR:
      text: 'En fin de compte, après un long détour, je reviens au serverless. Le concept de Vercel est bon, mais je n’aime pas Next.js ; de plus, Vercel recourt à trop de « magie », et le design du middleware pré‑compilé pour s’exécuter sur l’Edge finit par être fragmenté, voire à l’origine de plusieurs CVE. Il vaudrait mieux tout centraliser sur l’origine. En revanche, Cloudflare Workers est excellent : il atteint un autre extrême en compilant des produits de moins de 10 Mo en WASM, capables d’exécuter la véritable logique métier sur l’Edge, exactement ce que je recherche. En dehors du coût, il n’y a vraiment aucun inconvénient – même si ce n’est pas vraiment un défaut, car le temps économisé représente de l’argent.'
      provider: openai
      model: gpt-oss-120b-medium
      at: 2026-08-01T02:28:14.111657Z
      seconds: 16.593084083
      tokens: 18584
