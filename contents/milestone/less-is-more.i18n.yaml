    de-DE:
      text: Wenn ich auf die Umwege zurückblicke, die ich früher genommen habe, bereue ich das? Nein, ich bereue es nicht. Manchmal versteht man etwas nie, wenn man es nicht selbst ausprobiert. Vor allem im Zeitalter der KI gibt es praktisch keine Chance mehr, den alten Weg, den ich damals ging, nachzuvollziehen; zu viele Arbeitsabläufe haben sich bereits geändert. Außerdem ist dieses Projekt [Taki](https://github.com/canmi21/taki), zu 100 % KI‑Programmierung, aber das bedeutet nicht, dass es nicht langfristig gepflegt werden kann, noch dass es keinen menschlichen Touch hat. Eigentlich ist es egal, ob KI beteiligt ist oder nicht; außerdem liebe ich nicht das reine Schreiben von Code, sondern das Bauen von etwas…
