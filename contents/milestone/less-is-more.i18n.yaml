    de-DE:
      text: 'Der Speicher ist genauso. Da ich Object Storage zu teuer finde, wollte ich die Festplatten meines eigenen Servers nutzen und schrieb RFS, ein VFS für atomare Deduplizierung und Zusammenführung einzelner Dateien, revivierte sogar das Registrierungs‑Konzept der 80er‑90er Jahre und mountete es schließlich über FUSE. Das Ergebnis: Ich habe noch mehr Zeit damit verbracht, ein nicht besonders gutes Rad zu bauen, der Server lief ein Jahr lang leer, es war ein komplett verlustreiches Geschäft.'
      provider: openai
      model: gpt-oss-120b-medium
      at: 2026-08-01T02:26:58.899536Z
      seconds: 13.558828833
      tokens: 17979
      review: false
    en-US:
      text: Storage is the same. I find object storage expensive, so I wanted to use the hard drives of my own server, and wrote RFS, a kind of VFS for atomic deduplication and merging of single files, even revived the registry concept from the 80s‑90s, and finally mounted it via FUSE. The result? I spent even more time building a less‑than‑ideal wheel, the server sat idle for a year, and it was a completely loss‑making business.
      provider: openai
      model: gpt-oss-120b-medium
      at: 2026-08-01T02:26:58.899536Z
      seconds: 13.558828833
      tokens: 17979
