      text: 'Lo más irónico es que, en principio, todo esto debía hacerse después de tener el blog, documentándolo sobre la marcha. Pero el blog se fue :tn[posponiendo una y otra vez]{is="El original usa gē, literalmente paloma, como un verbo de la jerga de Internet que alude con humor a aplazar repetidamente algo prometido."}, las ideas no dejaban de acumularse y no había ningún lugar donde registrarlas. Por un lado, una voz interior me recriminaba que, si había prometido terminar Vane, no podía detenerme; por otro, sentía la impotencia de alejarme cada vez más cuanto más avanzaba. Nunca olvidé lo que tenía que hacer, pero sencillamente era incapaz de hacerlo. Pensándolo bien, hacía ya mucho tiempo que no me sentaba a escribir nada. Ahora, al mirar atrás, todo apunta a lo mismo: sobreingeniería.'
