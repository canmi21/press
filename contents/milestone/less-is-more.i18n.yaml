    zh-CN:
      text: 回归工程的本质：「Make it function, make it correct, then make it exceptional.」我终于走上了正轨，让它 functional 了。现在的博客简陋吗？简陋。不完整吗？确实不完整。但总比没有好。如果你连上线都没有，一直在做那个“也许需要”的东西，一直在追求看不见的完美，最后什么都拿不出来。这不是妥协，而是工程上的取舍，反正我已经想开了。所以我想开了。不再执着于细节，反而走出了门。手机相册里已经很久没有户外的照片了，随手拍了一下路边的——已经很久没出门了。
