    de-DE:
      text: 'Aber das ist nur die Spitze des Eisbergs. Nachdem ich React entdeckt hatte, ging ich von der Steinzeit von Hexo und Vanilla JS über zu Next.js 13 Page Router, wandte mich dann Vue zu, studierte SPA‑Routing, verstand das index.html‑Fallback und erstellte unzählige neue Projekte. Ich kaufte einen Server, bastelte an Docker, Nginx, NAS; fand 1Panel unschön und schrieb das Canopy‑Panel selbst, erforschte NAS‑Speicher-Arrays und schrieb RFS. Beim SSL‑Handling machte die heimische Umgebung mit acme.sh so viel Ärger, dass ich einen Reverse‑Proxy in Rust schrieb: Vane & Lazyacme. Was ursprünglich ein dreistündiges, 800‑Zeilen‑“Müllprojekt” war, entwickelte sich nach der Ermutigung eines Freundes zu vier Monaten Arbeit, in die ich HTTP/3, Zero‑Copy, das Layer‑Modell und die Flow‑Engine stopfte. Später kam noch Seam dazu, ein Full‑Stack‑Framework, das ebenfalls ein Albtraum ist – darüber später mehr.'
