  7ee9767101581747f4ff96ad967dabb1:
    de-DE:
      text: 'Das Ironischste daran ist, dass all diese Dinge eigentlich erst entstehen sollten, nachdem ich einen Blog hatte, sodass ich ihre Umsetzung nebenbei dokumentieren konnte. Stattdessen wurde der Blog :tn[immer wieder aufgeschoben]{is="Im Original steht gē, wörtlich Taube, als scherzhaftes Internetverb für das wiederholte Aufschieben einer versprochenen Sache."}, die Ideen wurden immer zahlreicher, doch es gab keinen Ort, an dem ich sie festhalten konnte. Einerseits machte ich mir innerlich Vorwürfe: Ich hatte mir vorgenommen, Vane fertigzustellen, also durfte ich nicht aufhören; andererseits fühlte ich mich machtlos, weil ich mich mit jedem weiteren Schritt nur noch weiter vom Ziel entfernte. Ich wusste die ganze Zeit, was ich tun wollte, konnte es aber einfach nicht umsetzen. Wenn ich genau darüber nachdenke, hatte ich mich schon lange nicht mehr hingesetzt, um etwas zu schreiben. Rückblickend weist all das auf dasselbe hin: Überentwicklung.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T12:44:49.131529Z
      seconds: 99.844297667
      tokens: 20027
      review: false
    en-US:
      text: 'The greatest irony is that all these things were originally supposed to be done after I had a blog, documenting them as I went. Instead, the blog :tn[kept getting postponed]{is="The original uses gē, literally pigeon, as a playful internet verb for repeatedly putting off something promised."}, ideas kept multiplying, and there was nowhere to record them. On one side, a voice inside berated me: I had said I would finish Vane, so I could not stop; on the other was the helpless feeling that the more I worked, the farther I strayed. I always remembered what I was supposed to do, but I simply could not do it. Come to think of it, I had not sat down to write anything in a very long time. Looking back now, it all points to the same thing—overengineering.'
      provider: openai
