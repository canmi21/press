  ffb2a6a34cb5ebc79cbf51e93c1f9641:
    de-DE:
      text: 'Nach einem großen Umweg bin ich am Ende doch wieder beim Serverless-Computing gelandet. Das Konzept von Vercel ist gut, aber Next.js gefällt mir nicht; außerdem steckt bei Vercel zu viel Magie dahinter. Auch das Middleware-Design, bei dem sie vorkompiliert und am Edge ausgeführt wird, führt letztlich zu einer fragmentierten Architektur und hat sogar mehrere CVEs hervorgebracht. Dann kann man gleich alles gemeinsam auf dem Ursprungsserver ausführen. Cloudflare Workers hingegen ist hervorragend und treibt das Ganze in ein anderes Extrem: Artefakte unter 10 MB werden zu WASM kompiliert, sodass echte Geschäftslogik am Edge laufen kann. Genau das will ich. Der einzige Nachteil sind die Kosten – aber eigentlich ist selbst das keiner, denn gesparte Zeit ist Geld.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:43:10.182529Z
      seconds: 67.18108725
      tokens: 19149
      review: false
    en-US:
      text: 'After one long detour, I ended up back at serverless after all. Vercel’s concept is good, but I don’t like Next.js; Vercel also relies on too much magic, and its middleware design—precompiling it to run at the edge—still leaves the system fragmented in the end and has even led to several CVEs. You might as well run everything together at the origin. Cloudflare Workers, on the other hand, is excellent: it takes things to another extreme by compiling artifacts under 10 MB to WASM, allowing real business logic to run at the edge. That’s exactly what I want. Its only drawback is the cost—but that hardly counts as a drawback, since time saved is money.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:43:10.182529Z
      seconds: 67.18108725
      tokens: 19149
      review: false
    es-ES:
      text: 'Después de dar un gran rodeo, al final volví a la computación sin servidor. El concepto de Vercel es bueno, pero no me gusta Next.js; además, Vercel depende de demasiada magia, y su diseño de software intermediario, precompilado para ejecutarse en el borde de la red, termina fragmentando el sistema e incluso ha dado lugar a varias CVE. Para eso, más vale ejecutarlo todo junto en el servidor de origen. Cloudflare Workers, en cambio, es excelente y lleva las cosas a otro extremo: compila en WASM los artefactos de menos de 10 MB, lo que permite ejecutar lógica de negocio real en el borde. Eso es exactamente lo que quiero. No tiene más inconveniente que el coste, aunque, pensándolo bien, tampoco es realmente un inconveniente, porque el tiempo ahorrado es dinero.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:43:10.182529Z
      seconds: 67.18108725
      tokens: 19149
      review: false
    fr-FR:
      text: 'Après un long détour, je suis finalement revenu à l’informatique sans serveur. Le concept de Vercel est bon, mais je n’aime pas Next.js ; Vercel repose aussi sur beaucoup trop de magie, et son architecture de logiciel intermédiaire, précompilé pour s’exécuter en périphérie du réseau, finit malgré tout par fragmenter le système et a même donné lieu à plusieurs CVE. Autant tout exécuter ensemble sur le serveur d’origine. Cloudflare Workers, en revanche, est excellent et pousse les choses vers un autre extrême : les artefacts de moins de 10 Mo sont compilés en WASM, ce qui permet d’exécuter une véritable logique métier en périphérie. C’est exactement ce que je veux. Son seul défaut est son coût — mais à bien y réfléchir, ce n’en est pas vraiment un, puisque le temps gagné, c’est de l’argent.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:43:10.182529Z
      seconds: 67.18108725
      tokens: 19149
      review: false
    ja-JP:
      text: 結局、ずいぶん遠回りした末にサーバーレスへ戻ってきた。Vercel のコンセプトはよいが、Next.js は好きではない。それに Vercel は魔法が多すぎるし、ミドルウェアを事前コンパイルしてエッジで動かす設計も、結局は分断を生み、CVE までいくつか発生した。それなら、いっそすべてをオリジンサーバーでまとめて動かすほうがましだ。一方、Cloudflare Workers はとてもよく、別の極端に到達している。10 MB 未満の成果物を WASM にコンパイルし、エッジ上で本物のビジネスロジックを動かせる。これこそ私が求めていたものだ。お金がかかること以外に欠点はない――とはいえ、それも欠点とはいえない。結局、節約できる時間はお金なのだから。
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:43:10.182529Z
      seconds: 67.18108725
      tokens: 19149
