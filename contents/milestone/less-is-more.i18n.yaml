    zh-TW:
      text: 第一次還是 Next.js 13 Page Router 那會兒。那時候我只懵懵懂懂地知道單頁應用程式是什麼，對 SSR、SSG、ISR 這些概念一竅不通，但看別人說 SSR 好，我也就想用。結果寫著寫著，發現自己根本不理解這些架構究竟在解決什麼問題，於是做不下去了。後來，我轉向了 Vue 2 的純單頁應用程式。為什麼選 Vue？說來慚愧，只是覺得名字好聽，反正對我來說也是新東西，就試試吧。結果也沒撐多久。第三次，我回到 React，從單純的 JSX 開始，學會了 TypeScript 和 TSX，理解了 CJS 與 ESM 的差異，愛上了響應式程式設計，也用上了 Lucide、Framer Motion、Radix UI 這些日後再也離不開的函式庫——這一次終於像點樣子了。但我還是失敗了，因為本質上我只是在模仿：別人用什麼，我就拿來用。看起來有模有樣，實際上我根本不明白為什麼要這麼做。再加上 AI 幻覺的助力，很多東西都能先跑出一個最小可行產品，可一到擴大規模的時候，處處都是坑。
