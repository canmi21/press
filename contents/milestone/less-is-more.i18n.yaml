  03a7b723b0bf91095124a7d8c7cf04c7:
    de-DE:
      text: 'Das Seltsame ist: Nachdem ich losgelassen hatte, wurde die Qualität nicht schlechter. Ich glaube, das liegt daran, dass die Zeit des :tn[Programmierens „nach alter Väter Sitte“]{is="Im Original steht 古法, ‚die alte Methode‘ — die Formel, mit der chinesische Lebensmittel- und Handwerksmarken traditionelle Herstellung bewerben. Auf das zeilenweise Schreiben von Code angewandt, ist das ein Witz über den Kunsthandwerker im Maschinenzeitalter."} nicht umsonst war. Schon zu GPT-2-Zeiten habe ich KI benutzt, aber damals schrieb ich noch brav jede einzelne Zeile Code und verstand jedes einzelne Konzept. Diese Zeit hat mir das Fundament gegeben. Was danach kam, war weniger Vibe Coding als Context Coding — das nötige Urteilsvermögen war noch da, und das Loslassen hat weder zu dummen Fehlern noch zu Unfällen geführt.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:17:07.805001Z
      seconds: 44.320156084
      tokens: 31253
      review: false
    en-US:
      text: The strange thing is that quality didn't get worse after I let go. I think it's probably because those days of :tn[hand-forged, artisanal]{is="The original says 古法 — ‘the ancient method,’ the phrase Chinese food and craft brands stamp on products to promise they were made the old way. Applying it to writing code by hand is a joke about being a heritage craftsman in an age of machines."} coding weren't wasted. I started using AI back in the GPT-2 days, but at that time I was still dutifully writing every line of code and understanding every concept. That period gave me my foundation. What came later was less Vibe Coding than Context Coding — the judgment I needed was still there, and letting go didn't lead to any stupid mistakes, or accidents for that matter.
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:17:07.805001Z
      seconds: 44.320156084
      tokens: 31253
      review: false
    es-ES:
      text: 'Lo extraño es que, después de soltar, la calidad no empeoró. Creo que se debe a que aquellos días de programación :tn[«artesanal, como se hacía antes»]{is="El original dice 古法, «el método antiguo», la fórmula con que las marcas chinas de alimentación y artesanía prometen una elaboración tradicional. Aplicada a escribir código línea a línea, convierte al autor en un artesano de oficio en plena era de las máquinas."} no fueron en vano. Ya usaba IA en la época de GPT-2, pero entonces seguía escribiendo con honradez cada línea de código y entendiendo cada concepto. Aquella etapa me dio la base. Lo que vino después fue menos Vibe Coding que Context Coding: el criterio necesario seguía ahí, y soltar no me llevó a ningún error de principiante ni a ningún accidente.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:17:07.805001Z
      seconds: 44.320156084
      tokens: 31253
      review: false
    fr-FR:
      text: 'Le plus étrange, c''est que la qualité n''a pas baissé une fois que j''ai lâché prise. Je crois que c''est parce que ces journées de programmation :tn[« à l''ancienne, comme autrefois »]{is="L''original dit 古法, « la méthode ancienne », la formule que les marques chinoises d''alimentation et d''artisanat impriment sur leurs produits pour promettre une fabrication traditionnelle. Appliquée au fait d''écrire son code ligne à ligne, elle fait de l''auteur un artisan d''art à l''ère des machines."} n''ont pas été perdues. J''utilisais déjà l''IA à l''époque de GPT-2, mais j''écrivais encore consciencieusement chaque ligne de code et je comprenais chaque concept. Cette période m''a donné mes bases. Ce qui a suivi tenait moins du Vibe Coding que du Context Coding : le discernement nécessaire était toujours là, et lâcher prise ne m''a valu ni erreur grossière ni accident.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:17:07.805001Z
      seconds: 44.320156084
      tokens: 31253
      review: false
    ja-JP:
      text: 不思議なことに、手を離しても品質は落ちなかった。おそらく、あの:tn[「古式製法」]{is="原文は「古法」。食品や工芸品の広告で「昔ながらの製法」を謳うときの決まり文句で、それを一行ずつ手で書くコーディングに当てはめている。機械の時代に伝統工芸を守る職人を気取る、時代錯誤の自嘲が込められている。"}のプログラミングの日々が無駄ではなかったからだと思う。GPT-2 の時代からすでに AI は使っていたが、当時の自分はまだ一行ずつ真面目にコードを書き、一つひとつの概念を理解していた。あの経験が土台になっている。後の日々は Vibe Coding というより Context Coding で、必要な判断力は残ったままだった。手を離したせいで初歩的なミスをすることも、事故を起こすこともなかった。
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:17:07.805001Z
      seconds: 44.320156084
      tokens: 31253
      review: false
    ko-KR:
      text: 이상한 건, 손을 놓은 뒤에도 품질이 나빠지지 않았다는 것이다. 아마 예전의 그 :tn[「전통 방식」]{is="원문은 古法, 즉 ‘옛 방식’이다. 중국의 식품이나 수공예 브랜드가 ‘옛날 방식으로 만들었다’고 광고할 때 쓰는 상투어인데, 한 줄씩 손으로 코드를 쓰는 일에 갖다 붙여 기계의 시대에 옛 기술을 지키는 장인인 척하는 시대착오적 농담을 만든다."} 프로그래밍의 나날이 헛되지 않아서일 것이다. GPT-2 시절부터 이미 AI를 쓰고 있었지만, 그때의 나는 여전히 한 줄 한 줄 성실하게 코드를 쓰고 개념 하나하나를 이해하고 있었다. 그 경험이 밑바탕이 되었다. 그 뒤의 것은 Vibe Coding이라기보다 Context Coding이었고, 있어야 할 판단력은 그대로 남아 있었다. 손을 놓았다고 해서 저급한 실수를 하거나 사고를 낸 적은 없었다.
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:17:07.805001Z
      seconds: 44.320156084
      tokens: 31253
      review: false
    zh-CN:
      text: 奇怪的是，放手之后质量并没有变差。我想大概是因为之前那些:tn[「古法」]{is="原文用的就是「古法」，本是食品和手工艺品牌上「古法制作」的宣传话术。把它按在逐行手写代码上，是在自嘲自己像个守着老手艺的匠人，这层时代错位的反讽换成直白说法就没了。"}编程的日子没有白费。早在 GPT-2 的年代我就开始用 AI 了，但那时候我还老老实实地写每一行代码、弄懂每一个概念。那段经历给了我底子。后来与其说是 Vibe Coding，不如说是 Context Coding——该有的判断力还在，并没有因为放手就犯什么低级错误，更没出什么事故。
