      text: 'Le plus ironique, c’est que tout cela aurait dû être réalisé une fois le blog créé, en documentant chaque étape au fur et à mesure. Mais le blog a été :tn[reporté encore et encore]{is="L’original emploie gē, littéralement pigeon, comme un verbe d’argot Internet désignant avec humour le fait de repousser sans cesse une chose promise."}, les idées se sont multipliées et il n’y avait pourtant aucun endroit où les consigner. D’un côté, une voix intérieure me reprochait de ne pas tenir parole : puisque j’avais promis de terminer Vane, je ne pouvais pas m’arrêter ; de l’autre, je ressentais l’impuissance de m’éloigner toujours davantage à mesure que j’avançais. Je n’ai jamais oublié ce que je devais faire, mais j’étais tout simplement incapable de le faire. À bien y réfléchir, cela faisait déjà très longtemps que je ne m’étais pas assis pour écrire quoi que ce soit. Avec le recul, tout converge vers la même chose : la suringénierie.'
