  03a7b723b0bf91095124a7d8c7cf04c7:
    de-DE:
      text: 'Seltsamerweise wurde die Qualität nicht schlechter, nachdem ich losgelassen hatte. Ich vermute, das liegt daran, dass die früheren Tage des Programmierens nach :tn[„traditioneller Rezeptur“]{is="Im Original steht das chinesische gǔfǎ, eine Werbeformel für nach althergebrachten Verfahren hergestellte Produkte. Auf das eigenhändige Schreiben jeder Codezeile angewandt, macht sie daraus scherzhaft ein traditionelles Handwerk."} nicht umsonst waren; schon zu Zeiten von GPT-2 begann ich, KI zu nutzen, doch damals schrieb ich noch gewissenhaft jede einzelne Codezeile und verstand jedes Konzept. Diese Erfahrung gab mir ein solides Fundament. Was später kam, war weniger Programmieren nach Gefühl als kontextgeleitetes Programmieren: Mein Urteilsvermögen war weiterhin da, und das Loslassen führte weder zu Anfängerfehlern noch, wenn man so will, zu Zwischenfällen.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:39:59.028057Z
      seconds: 147.20532775
      tokens: 22435
      review: false
    en-US:
      text: 'Oddly enough, quality did not decline after I let go. I suspect that is because all those days of :tn[“traditionally crafted”]{is="The original uses gǔfǎ, a marketing term for goods made by traditional methods. Calling line-by-line manual programming this jokingly turns it into an ancestral craft."} programming were not wasted; I had already started using AI back in the GPT-2 era, but at the time I was still diligently writing every line of code and understanding every concept. That experience gave me a solid foundation. What came later was less vibe coding than context coding: I still had the judgment I needed, and letting go did not cause any rookie mistakes—or outright incidents.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:39:59.028057Z
      seconds: 147.20532775
      tokens: 22435
      review: false
    es-ES:
      text: 'Lo curioso es que, después de dejar de aferrarme, la calidad no empeoró. Supongo que se debe a que aquellos días de programar :tn[«con métodos ancestrales»]{is="El original usa el chino gǔfǎ, una fórmula publicitaria para productos elaborados con métodos tradicionales. Aplicada a escribir a mano cada línea de código, convierte en broma la programación en un oficio ancestral."} no fueron en vano; ya había empezado a usar inteligencia artificial en tiempos de GPT-2, pero entonces todavía escribía concienzudamente cada línea de código y entendía cada concepto. Aquella experiencia me dio una base sólida. Lo que vino después fue menos programación por intuición que programación contextual: conservaba el criterio necesario, y soltar no hizo que cometiera errores de principiante ni, por así decirlo, que provocara incidentes.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:39:59.028057Z
      seconds: 147.20532775
      tokens: 22435
      review: false
    fr-FR:
