    ko-KR:
      text: 첫 번째 시도는 아직 Next.js 13의 Page Router를 쓰던 시절이었다. 당시 나는 단일 페이지 애플리케이션이 무엇인지 어렴풋이 아는 정도였고 SSR, SSG, ISR 같은 개념은 하나도 제대로 이해하지 못했다. 그래도 남들이 SSR이 좋다고 하니 나도 써야겠다고 생각했다. 하지만 계속 만들다 보니 이런 아키텍처가 어떤 문제를 해결하려는 것인지 전혀 이해하지 못하고 있다는 사실을 깨달았고, 결국 더 진행할 수 없었다. 그다음에는 Vue 2 기반의 순수 단일 페이지 애플리케이션으로 전환했다. 왜 Vue였냐고? 부끄러운 이야기지만 이름이 듣기 좋았고, 어차피 내게는 새로운 것이니 한번 해 보자는 마음이었다. 그것도 오래가지는 못했다. 세 번째 시도에서는 React로 돌아가 단순한 JSX부터 시작했다. TypeScript를 배우고 TSX를 익혔으며 CJS와 ESM의 차이를 이해했고, 반응형 프로그래밍에 매료되어 훗날 없이는 못 살게 될 Lucide, Framer Motion, Radix UI 같은 라이브러리도 사용하기 시작했다. 이번에는 드디어 제법 그럴듯해 보였다. 하지만 나는 또 실패했다. 본질적으로 그저 남을 따라 하고 있었기 때문이다. 남들이 쓰는 것은 무엇이든 가져다 썼고, 겉보기에는 그럴듯했지만 왜 그렇게 해야 하는지는 전혀 이해하지 못했다. 거기에 AI의 환각까지 더해지니 많은 것을 최소 기능 제품으로 작동하게 만들 수는 있었지만, 규모를 확장하려 하면 온통 함정투성이였다.
