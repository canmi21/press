    de-DE:
      text: Doch das war nur die Spitze des Eisbergs. Nachdem ich React entdeckt hatte, arbeitete ich mich von der Steinzeit mit Hexo und reinem JavaScript bis zum Seitenrouter von Next.js 13 vor, machte dann einen Abstecher zu Vue, beschäftigte mich mit der Routensteuerung von Einzelseitenanwendungen, verstand schließlich den Rückfall auf index.html und setzte das Projekt unzählige Male neu auf. Ich kaufte einen Server und experimentierte mit Docker, Nginx und einem netzgebundenen Speichersystem; weil ich 1Panel hässlich fand, schrieb ich kurzerhand das Canopy-Bedienfeld selbst, erforschte Speicherverbünde und entwickelte RFS, und als mich bei der Einrichtung von Zertifikaten für die sichere Socket-Schicht das im chinesischen Umfeld ständig streikende acme.sh zur Verzweiflung brachte, schrieb ich in Rust einen Reverse-Proxy namens Vane & Lazyacme. Ursprünglich waren das nur achthundert Zeilen Schrott, die ich an einem Abend in drei Stunden hingehackt hatte, doch nachdem mich ein paar Leute aus der Chatgruppe angestachelt hatten, arbeitete ich vier Monate daran und stopfte HTTP/3, kopierfreie Verarbeitung, ein Schichtenmodell und eine Fluss-Engine hinein. Danach kam noch Seam, ein Full-Stack-Framework und ebenfalls ein bodenloses Fass – aber davon ein andermal.
