      text: 'Zurück zum Wesentlichen des Engineerings: „Make it function, make it correct, then make it exceptional.“ Endlich war ich auf dem richtigen Weg und hatte es zum Laufen gebracht. Ist der Blog gerade rudimentär? Ist er. Unvollständig? Definitiv. Aber immer noch besser als gar nichts. Wenn du noch nicht einmal etwas online gestellt hast, ständig an dem arbeitest, was du „vielleicht brauchst“, und einer unsichtbaren Perfektion hinterherjagst, wirst du am Ende gar nichts vorweisen können. Das ist kein Kompromiss, sondern eine Abwägung aus Sicht des Engineerings. Jedenfalls habe ich gelernt, loszulassen. Also ließ ich los. Als ich aufhörte, mich an einem einzigen Detail festzubeißen, ging ich stattdessen tatsächlich vor die Tür. In meinen Handyfotos gab es schon ewig keine Aufnahmen von draußen mehr, also machte ich einen schnellen Schnappschuss am Straßenrand — ich war schließlich schon lange nicht mehr draußen gewesen ('
