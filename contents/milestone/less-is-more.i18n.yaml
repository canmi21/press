    ko-KR:
      text: 엔지니어링의 본질은 “Make it function, make it correct, then make it exceptional.”입니다. 나는 마침내 올바른 길을 찾아 functional하게 만들었습니다. 현재 블로그가 소박한가요? 소박합니다. 완전하지 않은가요? 확실히 완전하지 않습니다. 하지만 전혀 없는 것보다는 낫습니다. 만약 출시조차 없고 “아마 필요할지도” 하는 것을 계속 만들면서 보이지 않는 완벽을 추구한다면 결국 아무것도 내놓지 못하게 됩니다. 이는 타협이 아니라 엔지니어링상의 선택입니다. 어쨌든 나는 마음을 열었습니다. 그래서 마음을 열었습니다. 이제는 하나의 세부 사항에 집착하지 않고 밖으로 나갔습니다. 휴대폰 앨범에 야외 사진이 오래 없었기에 길가를 즉흥적으로 찍었는데, 정말 오랜만에 밖에 나왔습니다.
      provider: openai
