    ko-KR:
      text: Rust 설계에서 LLVM은 사실 조금 편한 길을 택한 셈이지만, 아주 좋은 선택이기도 하다. Go처럼 기계어에 이르는 과정을 직접 유지보수하는 대신, LLVM의 거대한 생태계에 성숙한 최적화를 맡기는 것이기 때문이다. Rust의 컴파일 과정은 대략 소스 코드를 어휘 분석과 구문 분석에 통과시켜 AST를 만들고, 이어서 매크로 확장과 HIR 하향 변환으로 평탄화한 뒤, 일반적인 타입 검사와 :tn[아주 조금만]{is="원문은 ‘조금’을 뜻하는 말을 ‘억’이라는 엄청난 수량을 포함한 동음 표현으로 바꿔, 빌림 검사의 작업량을 반어적으로 과장한다."} 빌림 검사를 거쳐 최종적으로 MIR를 생성한다고 볼 수 있다. 여기까지는 모두 Rust 컴파일러 자체의 프런트엔드가 하는 일이다. MIR 이후의 일은 LLVM에 맡긴다. 예를 들어 MIR를 LLVM IR로 번역하고, LLVM이 O0부터 O3까지의 최적화 pass를 실행한 뒤, 대상 플랫폼의 기계어를 생성하고, 마지막으로 링커가 이를 BIN 실행 파일로 조립한다.
