  f431cfd98af980adfd9c279f26cf0ff0:
    de-DE:
      text: 'Kommen wir außerdem zu `codegen-units`. Dieser Parameter steuert, in wie viele kleinste Einheiten der Compiler eine Crate aufteilt, damit das Backend sie parallel verarbeitet. Standardmäßig sind es im Debug-Modus 256 und im Release-Modus 16 Einheiten. Je höher die Zahl, desto stärker die Parallelisierung und desto schneller die Kompilierung, weil mehrere CPU-Kerne gleichzeitig die Codegenerierung des Backends ausführen können. Dafür fällt die Optimierung schwächer aus: Da jede Einheit separat optimiert wird, steht LLVM (oder Cranelift) weniger Kontext zur Verfügung, sodass es weniger Möglichkeiten zur einheitenübergreifenden Inline-Ersetzung und Optimierung gibt.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:38:37.186324Z
      seconds: 58.058962875
      tokens: 18305
      review: false
    en-US:
      text: 'As for `codegen-units`, it is a parameter that controls how many minimal units the compiler divides a crate into for parallel processing by the back end. By default, there are 256 units in debug mode and 16 in release mode. The higher the number, the greater the parallelism and the faster the compilation, since multiple CPU cores can perform back-end code generation simultaneously. The trade-off is less effective optimization: because each unit is optimized independently, LLVM (or Cranelift) has less context, leaving fewer opportunities for cross-unit inlining and optimization.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:38:37.186324Z
      seconds: 58.058962875
      tokens: 18305
      review: false
    es-ES:
      text: 'Hablemos también de `codegen-units`. Este parámetro controla en cuántas unidades mínimas divide el compilador una crate para que el motor de compilación las procese en paralelo. De forma predeterminada, se usan 256 unidades en modo de depuración y 16 en modo de publicación. Cuanto mayor sea el número, mayor será el paralelismo y más rápida la compilación, ya que varios núcleos de la CPU pueden ejecutar simultáneamente la generación de código del motor. El coste es una optimización menos eficaz: como cada unidad se optimiza por separado, LLVM (o Cranelift) dispone de menos contexto, por lo que hay menos oportunidades de inserción en línea y optimización entre unidades.'
