  9f059c827d113b5922837414055cc9cb:
    de-DE:
      text: 'Lange Zeit hielten wir all das für Nachteile von Rust. Tatsächlich lassen sich die ersten beiden jedoch durch das Schulen der eigenen Denk- und Wahrnehmungsweise überwinden; die langsame Kompilierung dagegen bremst meinen Arbeitsablauf bis heute aus. Vor einigen Jahren schien das noch in Ordnung zu sein: Bevor AI alles überrollte, hatte ich vor allem Geduld und arbeitete für einen Algorithmus oder eine Funktion oft bis tief in die Nacht. Aber heute? Ich kann kaum behaupten, dass ich mich nicht verändert hätte. Ich bin völlig ungeduldig geworden, möchte überhaupt nicht mehr darüber nachdenken, wie man Rust-Code schreibt, und kann den endlosen Fortschrittsbalken von Cargo nicht mehr abwarten. Besonders schlimm ist die ld-Phase, in der nicht einmal ein Fortschritt angezeigt wird und alles jedes Mal einfach hängen bleibt. Das ist wirklich frustrierend.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:37:31.36274Z
      seconds: 60.625540125
      tokens: 18374
      review: false
    en-US:
      text: 'For a long time, we all regarded these as Rust’s shortcomings. In reality, the first two can be overcome by training the way we think and understand things, but slow compilation has continued to drag down my workflow. A few years ago, that seemed fine: before AI swept in, patience was what I had, and I would often stay up until dawn working on an algorithm or feature. But now? I can hardly claim I haven’t changed. I have become utterly impatient: I do not want to think about how to write Rust code, I cannot stand waiting for Cargo’s interminable progress bar, and the ld stage is especially bad because it shows no progress at all—it just sits there every time. It is genuinely painful.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:37:31.36274Z
      seconds: 60.625540125
      tokens: 18374
      review: false
    es-ES:
      text: 'Durante mucho tiempo, todos consideramos que estos eran defectos de Rust. Sin embargo, los dos primeros pueden superarse ejercitando nuestra forma de pensar y comprender, mientras que la lentitud de la compilación sigue entorpeciendo mi flujo de trabajo. Hace unos años, todo esto parecía estar bien: antes de que la AI lo arrasara todo, me sobraba paciencia y a menudo me quedaba hasta la madrugada trabajando en un algoritmo o una función. ¿Pero ahora? Difícilmente puedo decir que no he cambiado. Me he vuelto completamente impaciente: no quiero pensar en absoluto cómo escribir código Rust, no soporto esperar la interminable barra de progreso de Cargo y, sobre todo, la fase de ld ni siquiera muestra avance alguno; cada vez se queda ahí, aparentemente bloqueada. Es realmente frustrante.'
