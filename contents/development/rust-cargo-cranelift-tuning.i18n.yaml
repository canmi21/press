    ja-JP:
      text: しかし、これは解けないわけではなく、実際には `cfg` でバックエンドを選択し、Cranelift モードでは `ring` をコンパイラに渡すだけで済みます。上述の通りに dev と release のプロファイルを設定したら、CLI のコンパイル比較を簡単に実行できます。このケースでは、開発ビルドはリリースビルドより少なくとも 3 倍速く、しかもコールドコンパイルでインクリメンタルがない状態です；さらに O0 を使用し LTO を無効にすれば、dev プロファイルは今後のインクリメンタル更新でリリースより何十倍も速くなるはずです。LTO などの魔法は実際には各 crate の境界を平坦化することで実現されており、すべてが一体になるとコードの一箇所を変更しただけで全体が再コンパイルされ、正しくインクリメンタル更新できなくなります。
