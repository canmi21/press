    es-ES:
      text: 'Yo mismo soy un :tn[fanático de MUSL]{is="El original dice «MUSL 厨». El sufijo 厨, llegado de la cultura de internet japonesa al chino, señala a alguien como admirador fanático de algo; aquí el autor se lo aplica a sí mismo con un tono de autoburla."} y odio profundamente GNU glibc, pero para desarrollar te sigo recomendando `x86_64-unknown-linux-gnu`. ¿Por qué? Porque es rápido. El mayor punto fuerte de MUSL es que puede generar binarios enlazados de forma completamente estática: no dependen de ninguna biblioteca dinámica del sistema, así que copias lo compilado a cualquier máquina Linux y funciona, algo especialmente adecuado para contenedores y sistemas embebidos. Pero la lentitud también viene de ese enlazado estático: el enlazador tiene que empaquetarlo todo, y la fase de enlazado supone bastante más trabajo que el enlazado dinámico.'
