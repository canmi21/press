    ja-JP:
      text: 私は自分でも :tn[MUSLの熱狂的なファン]{is="原語の「厨」は日本のネットスラングに由来し、対象に極端に熱中するファンを指す。ここでは自嘲的に使われている。"}で、GNU glibcは大嫌いですが、開発時にはそれでも `x86_64-unknown-linux-gnu` の使用を勧めます。なぜかというと、速いからです。MUSLの最大の売りは完全静的リンクのバイナリを生成できることです。つまり、システム上の動的ライブラリに一切依存せず、コンパイルしたものをどのLinuxマシンにコピーしても動かせます。コンテナや組み込みシステムには特に向いていますが、遅い理由も静的リンクにあります。リンカーがすべてを梱包する必要があるため、リンク段階の作業量は動的リンクよりかなり多くなります。
