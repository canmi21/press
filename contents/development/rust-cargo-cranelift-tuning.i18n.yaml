      text: 'Im Kern wird ein großer Teil der langsamen Compile-Zeit also nicht im Rust-Frontend selbst, sondern in LLVM, dem „Schwergewichts-Backend“, verbracht. Da stellt sich die Frage: Kann man es weglassen? ~~:tn[Die Antwort lautet ja, miau]{is="Das ursprüngliche miao ist ein absichtlich niedlicher, katzenhafter chinesischer Netz-Ausdruck und verleiht der technischen Antwort einen verspielten Ton."}~~ Es gibt ein Backend namens Cranelift, das genau für diesen Bedarf entwickelt wurde. Es hieß ursprünglich Cretonne, wurde 2016 gestartet und von der [Bytecode Alliance](https://bytecodealliance.org) entwickelt. Zunächst war es ein für [Wasmtime](https://github.com/bytecodealliance/wasmtime) :tn[gepackter Teigtaschen-Happen]{is="Das Original nennt es einen jiaozi und vergleicht Cranelift scherzhaft mit einer nach Wasmtimes Vorgaben zubereiteten Teigtasche, um seine ursprüngliche Begleitrolle zu betonen."}, also ein dafür konzipiertes Codegenerierungs-Backend; später wurde es vom offiziellen Rust-Projekt :tn[in die regulären Reihen eingegliedert]{is="Das Original verwendet einen militärischen Ausdruck für die Eingliederung irregulärer Truppen in eine reguläre Armee und scherzt damit über Cranelifts Aufnahme in Rusts offizielles Umfeld."} und als optionales codegen-Backend übernommen.'
