    zh-CN:
      text: 在 Rust 的设计中，LLVM 其实有点偷懒，但也选得很好：不像 Go 一样自己维护通往机器码的过程，让 LLVM 庞大的生态来完成成熟的优化其实很好。整个 Rust 的编译流程大致可以说是，源码先经过词法分析、语法分析生成 AST，再经过宏展开、HIR 降级拍平；然后进入常规类型检查、:tn[亿点点]{is="原文故意把表示少量的“一点点”写成同音却数量巨大的“亿点点”，以反话夸张借用检查的工作量。"}借用检查，最终生成 MIR。到这里为止，都是 Rust 编译器自己的前端在干活。而 MIR 之后的事情，就交给 LLVM，比如把 MIR 翻译成 LLVM IR，然后 LLVM 跑一遍它那套优化 pass（从 O0 到 O3 不等），最后生成目标平台的机器码，再交给链接器拼成 BIN 可执行文件。
