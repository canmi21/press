    fr-FR:
      text: 'Alors, à quel moment Cranelift est-il censé être plus rapide exactement ? C’est pendant la phase de développement qu’il est le plus avantageux. À ce stade, vous n’avez peut-être absolument pas besoin d’un code machine presque parfait, dont l’efficacité d’exécution aurait été optimisée à l’extrême ; vous avez peut-être seulement besoin d’un retour rapide. Il suffit que ce code machine moins performant soit sémantiquement équivalent à celui correctement produit par LLVM. Les premières versions de Cranelift n’y parvenaient pas vraiment en raison de nombreux cas limites. Il en subsiste encore aujourd’hui, mais la situation s’est beaucoup améliorée : la probabilité que Cranelift fonctionne alors que LLVM échoue est désormais à peu près équivalente à celle de déclencher une erreur interne de rustc en écrivant du Rust. Pour générer un code machine optimisé à l’extrême, LLVM exécute des dizaines d’étapes d’optimisation, comme le déroulage des boucles, la vectorisation, la propagation des constantes ou l’élimination du code mort… et bien d’autres encore, affinant le code couche après couche. Cranelift suit une philosophie de conception totalement différente : il réduit radicalement ces étapes d’optimisation, ne réalise que l’allocation élémentaire des registres et la sélection des instructions, puis achève la génération du code en un seul balayage linéaire, sans itérations répétées. Sa représentation intermédiaire est également plus légère et spécialement conçue pour traduire rapidement une représentation intermédiaire de plus haut niveau en code machine, contrairement à LLVM IR, qui porte le poids de plusieurs décennies de généralisation.'
