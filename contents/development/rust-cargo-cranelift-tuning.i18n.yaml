    en-US:
      text: 'So where exactly is Cranelift supposed to be faster? Its ideal stage is development, when you may not need nearly perfect machine code optimized to the absolute limit of execution efficiency at all—you may just need fast feedback. It is enough for this less-than-stellar machine code to be semantically equivalent to the machine code properly generated by LLVM. Early versions of Cranelift could not actually guarantee that because of numerous edge cases. Those still exist today, but things have improved considerably: the likelihood of Cranelift working while LLVM breaks is now roughly the same as that of your Rust code triggering an internal compiler error in rustc. To produce machine code optimized to the extreme, LLVM runs dozens of optimization passes—loop unrolling, vectorization, constant propagation, dead-code elimination, and many, many others—polishing the code layer by layer. Cranelift follows a completely different design philosophy: it drastically reduces these optimization stages, performs only basic register allocation and instruction selection, and completes code generation with a single linear scan instead of iterating repeatedly. Its intermediate representation is also more lightweight, designed specifically for rapid translation from a higher-level intermediate representation into machine code, unlike LLVM IR, which carries decades of general-purpose baggage.'
      provider: openai
