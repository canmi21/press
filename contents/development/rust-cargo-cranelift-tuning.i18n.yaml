    fr-FR:
      text: 'Un bon code doit donc comporter des tests couvrant une catégorie de chemins de réussite et au moins un chemin d’erreur. Pour une même catégorie de chemins d’erreur, un seul cas suffit à vérifier que l’erreur est renvoyée sous forme d’Err ; on peut alors écrire une logique de repli, puis tout naturellement l’énumérer avec `thiserror` ou l’intercepter avec `anyhow`, l’aplatir, l’afficher et le journaliser. En bref, votre code vous oblige à créer des mécanismes pour gérer ces situations. Une fois ce niveau atteint, `panic` ne vous sert plus à rien : vous pouvez considérer cela comme « théoriquement impossible », mais seulement en théorie. Dans le monde réel, il reste les erreurs du système d’exploitation, les erreurs de mémoire, les inversions de bit provoquées par un électron issu du rayonnement cosmique, les débordements étranges… Vous ne pourrez jamais couvrir toutes ces situations. Alors pourquoi éviter de déclencher une panique ? Parce que ces situations ont de fortes chances — 90 % — de ne pas être dues à votre code. `panic` consiste essentiellement, lorsqu’il se produit, à faire remonter Rust dans la pile d’appels, niveau après niveau, en invoquant le destructeur (drop) de chaque cadre pour libérer les ressources. Ce processus oblige le compilateur à générer une table `unwind` supplémentaire destinée à repérer les erreurs dans votre logique métier. Si l’erreur elle-même ne vient probablement pas de votre code, quelle valeur cette information a-t-elle ? Sa présence augmente aussi la taille de l’artefact compilé et la charge de travail de l’éditeur de liens ; la désactiver est donc la bonne solution. Si votre code est suffisamment testé et que vous avez assez confiance en lui, je recommande de configurer `panic = abort`.'
