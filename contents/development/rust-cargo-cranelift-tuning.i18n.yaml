    en-US:
      text: On the other hand, the CLI package below is not quite suitable. Having many dependencies isn't really a problem—in theory, this better demonstrates efficiency—but here there is a classic either-or choice. You can see in the upper left corner that the `ring` dependency is marked as optional; that's because the project originally used `aws-lc-rs`, both of which are cryptographic algorithm Backends in Rust. But why make it optional? That is because `ring` is written in pure Rust, while the other is brought in via Asm assembly FFI, specifically designed for assembly acceleration on mainstream cpu architectures like x86 and arm64. Yet that is also where it falls short, because Cranelift's magic is limited strictly to pure Rust. Once you introduce Unsafe Code, or FFI C, ASM, etc., Cranelift's compatibility actually becomes extremely poor.
