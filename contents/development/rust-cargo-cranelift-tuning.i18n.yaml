    ja-JP:
      text: では、いったい何が問題なのでしょうか。答えは実に単純です。LLVM は非常に重量級の基盤であり、本番環境ではその重さがむしろ適切です。コンパイル時間と引き換えに実行時間を短縮するのは優れた考え方です。LLVM は上位層の Rust をはじめ、C、C++、Swift など数多くの言語を橋渡ししています。つまり、その最適化パイプラインは「最適な機械語を生成する」ために設計されており、「コンパイルを素早く終える」ためのものではありません。release モードで数十個もの最適化パスを一通り実行すると、非常に長い時間がかかります。debug モードの O0 であっても、LLVM は中間表現の生成から機械語の生成まで一連の工程をすべて通る必要があり、この工程自体が決して軽量ではありません。さらに、Rust のジェネリクスの単相化によってコンパイル時に大量のコードが展開されるため、LLVM に渡される中間表現はソースコードから想像するよりはるかに大きくなり、それに伴って LLVM の処理量も当然膨れ上がります。
      provider: openai
