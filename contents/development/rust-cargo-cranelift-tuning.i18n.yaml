  0f01aca1b9a9cb57f08a05c7403d77bd:
    de-DE:
      text: 'Unter Linux verwendet Rust standardmäßig GNU ld (bfd) – ja, genau den ältesten und langsamsten Linker. Er arbeitet mit nur einem Thread, und sowohl die Symbolauflösung als auch die Relokation erfolgen durch sequenzielle Durchläufe, sodass er bei größeren Projekten deutlich zum Flaschenhals wird. Unter Linux kann man den von [@Rui Ueyama](https://github.com/rui314) entwickelten Linker [mold](https://github.com/rui314/mold) ausprobieren; die Konfiguration ist denkbar einfach: Man muss lediglich eine Zeile in `.cargo/config.toml` einfügen.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:34:48.781049Z
