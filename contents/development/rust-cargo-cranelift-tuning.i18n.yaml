  0f01aca1b9a9cb57f08a05c7403d77bd:
    de-DE:
      text: Unter Linux verwendet Rust standardmäßig GNU ld (bfd), genau das älteste und langsamste Programm. Es arbeitet einstellig und führt Symbolauflösung sowie Relocation in seriellem Scan durch, sodass bei großen Projekten eindeutig ein Flaschenhals entsteht. Unter Linux kann man das von [@Rui Ueyama](https://github.com/rui314) geschriebene [mold](https://github.com/rui314/mold) ausprobieren; die Konfiguration ist sehr einfach`.cargo/config.toml` einfach eine Zeile hinzufügen.
      provider: openai
      model: gpt-oss-120b-medium
      at: 2026-08-03T01:34:44.650107Z
      seconds: 36.583913833
      tokens: 18077
      review: false
    en-US:
      text: On Linux, Rust uses GNU ld (bfd) by default, yes, the oldest and slowest one. It runs single‑threaded and both symbol resolution and relocation are performed by serial scans, so large projects clearly become a bottleneck. On Linux you can try the [mold](https://github.com/rui314/mold) written by [@Rui Ueyama](https://github.com/rui314); it’s easy to set up`.cargo/config.toml` just add a line.
      provider: openai
      model: gpt-oss-120b-medium
      at: 2026-08-03T01:34:44.650107Z
      seconds: 36.583913833
