    fr-FR:
      text: 'Parlons également de `codegen-units`. Ce paramètre détermine en combien d’unités minimales le compilateur divise une crate afin que le moteur de compilation les traite en parallèle. Par défaut, il y en a 256 en mode débogage et 16 en mode production. Plus ce nombre est élevé, plus le parallélisme est important et plus la compilation est rapide, car plusieurs cœurs du processeur peuvent exécuter simultanément la génération de code du moteur. En contrepartie, l’optimisation est moins efficace : chaque unité étant optimisée séparément, LLVM (ou Cranelift) dispose de moins de contexte, ce qui réduit les possibilités de mise en ligne et d’optimisation entre unités.'
