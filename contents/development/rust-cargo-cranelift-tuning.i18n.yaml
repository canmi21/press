    ja-JP:
      text: 通常の業務コードに、`panic` が存在してはなりません。通常の業務コードが実行時にエラーに遭遇した場合、耐障害性を考慮して設計された Err はすべて安全に返されるべきであり、乱暴にパニックさせるべきではありません。React ErrorBoundary と同様、通常のエラーとして処理する必要があります。パニックを発生させるべきなのは、コードがあり得ない状態に入り、しかも回復不能だと確信している場合だけです。私個人の哲学は、パニックを捨てることです。なぜなら、実際の業務コードのテストは三層に分けられるからです。第一層は正常系、第二層はエラー経路（無限にある可能性のうちの一つ）、そして第三層がファジングや衝突テストによる総当たりで見つかる境界事例です。工学的に言えば、正常系は 100% テストでき、エラー経路は一つの分類にある n 種類の変形から一つを選べます。衝突テストは純粋に時間の問題であり、ほとんどの場合は割に合いません。本当に利用者規模が大きくなれば、必要な時期は自分で分かるようになります。私は原則として一切行いません。
