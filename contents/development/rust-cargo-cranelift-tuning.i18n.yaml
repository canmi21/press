    ja-JP:
      text: Rust の設計では、LLVM は多少手抜きとも言えるが、選択としては非常に良い。Go のように機械語へ至る処理を自前で保守するのではなく、LLVM の巨大なエコシステムに成熟した最適化を任せるのは理にかなっている。Rust のコンパイルの流れを大まかに言えば、ソースコードは字句解析と構文解析を経て AST を生成し、続いてマクロ展開と HIR への降格・平坦化を行う。それから通常の型検査と、:tn[ほんの少しだけ]{is="原文は「少し」を意味する語を、同音で「億」という巨大な量を含む表記に置き換え、借用検査の作業量を皮肉っぽく誇張している。"}借用検査を行い、最終的に MIR を生成する。ここまでの作業はすべて Rust コンパイラ自身のフロントエンドが担う。MIR 以降は LLVM に委ねられ、たとえば MIR を LLVM IR へ翻訳し、LLVM が一連の最適化 pass（O0 から O3 まで）を実行し、対象プラットフォーム向けの機械語を生成して、最後にリンカが BIN 実行ファイルへまとめる。
