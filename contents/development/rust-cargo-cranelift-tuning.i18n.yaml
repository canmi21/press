    ja-JP:
      text: Rust の設計で LLVM を選んだのは少し手抜きとも言えますが、選択としては非常に良いものでした。Go のように機械語までの過程を自前で抱え込むのではなく、成熟した最適化を LLVM という巨大なエコシステムに任せる、これは実に良いやり方です。Rust のコンパイルの流れはおおよそこうです。ソースコードにまず字句解析と構文解析をかけて AST を作り、次にマクロ展開と HIR への降格で平坦化する！　それから通常の型検査、そして:tn[一億点ばかりの]{is="原文は「亿点点」。「ちょっとだけ」を意味する「一点点」の「一」を、一億を表す「亿」に入れ替えた言葉遊びです。とんでもなく大きな単位を持ち出す皮肉で、借用検査は「ちょっとだけ」の作業などでは到底ないと言っています。"}借用検査を経て、最終的に MIR が生成されます。ここまでは、すべて Rust コンパイラ自身のフロントエンドの仕事です。MIR より後は LLVM に引き渡され、MIR は LLVM IR に翻訳され、LLVM が例の最適化パス群を一通り走らせ（O0 から O3 までさまざま）、最後にターゲットプラットフォームの機械語を生成し、それをリンカが BIN 実行ファイルへとつなぎ合わせます。
      provider: anthropic
