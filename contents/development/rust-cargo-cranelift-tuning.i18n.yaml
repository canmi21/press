  bf8af9bda87a0ee239ae9723aa619fed:
    de-DE:
      text: 'Übrigens: Verwenden Sie unbedingt kein zig, denn das zbuild unter nightly Rust hat derzeit enorme Probleme. Wenn Sie Cross‑Compilation benötigen und der Host ein Linux x86 ist, empfiehlt sich [cross](https://github.com/cross-rs/cross) – das Kompilieren mit Docker funktioniert hervorragend und die Umgebung ist komplett eingerichtet. Wenn Sie glibc bevorzugen, funktioniert das ebenfalls gut, weil glibc nur rückwärtskompatibel ist. In der Regel sollte man gegen die glibc‑Version einer großen Debian‑Veröffentlichung (z. B. Debian -2) kompilieren; eine zu neue glibc lässt viele Maschinen versagen. Dabei geht es nicht um ein neues Feature, sondern nur darum, eine Versionszeichenfolge zu prüfen, um Sie zu ärgern. Ist der Host ein Mac, benutzen Sie bitte das native rustup `target + cargo build --release `'
      provider: openai
      model: gpt-oss-120b-medium
      at: 2026-08-03T01:39:05.317913Z
      seconds: 20.37611875
      tokens: 19377
      review: false
    en-US:
      text: By the way, never use zig; the zbuild on nightly Rust currently has big problems. When you need cross‑compilation and the host is Linux x86, use [cross](https://github.com/cross-rs/cross) – compiling with Docker works great and the environment is complete. If you like glibc, that also works well, because glibc only maintains backward compatibility. Typically you should compile against the glibc version of a major Debian release (e.g., Debian -2); otherwise a too‑new glibc will make many machines fail. This is not about using a new feature, just about checking a version string to annoy you. If the host is mac, use the native rustup `target + cargo build --release `
      provider: openai
      model: gpt-oss-120b-medium
