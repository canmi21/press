    fr-FR:
      text: 'Je suis moi-même un :tn[fanatique de MUSL]{is="L''original écrit « MUSL 厨 ». Le suffixe 厨, venu de la culture internet japonaise et passé dans le chinois en ligne, désigne l''amateur fanatique d''une chose ; l''auteur se l''applique ici à lui-même sur un ton d''autodérision."} et je déteste GNU glibc, mais pour le développement je vous recommande quand même `x86_64-unknown-linux-gnu`. Pourquoi ? Parce que c''est rapide. Le grand argument de vente de MUSL, c''est de pouvoir produire des binaires entièrement liés en statique — sans dépendre d''aucune bibliothèque dynamique du système : vous copiez le binaire compilé sur n''importe quelle machine Linux et il tourne, ce qui convient particulièrement aux conteneurs et à l''embarqué. Mais la lenteur vient elle aussi de cette liaison statique : l''éditeur de liens doit tout empaqueter, et la phase de liaison représente donc bien plus de travail qu''en liaison dynamique.'
