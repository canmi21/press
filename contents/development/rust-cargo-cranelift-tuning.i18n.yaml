    ja-JP:
      text: したがって、良いコードでは、正しいパスのテストを1種類、そして少なくとも1種類のエラーパスのテストを網羅すべきです。このエラーパスを1つカバーすれば、Err が返されるケースをテストでき、フォールバックロジックを書けますので、自然に `thiserror` 列挙または `anyhow` インターセプトしてログを平坦化できます。要するに、コードはこれらの状況を処理する仕組みを書かせることになります。この層を実装できていれば、`panic` はあなたにとって不要となり、「理論上不可能」と理解できますが、実際の世界には OS エラー、メモリエラー、宇宙線による単一電子ビット反転、奇妙なオーバーフローなどがあります… これらのケースをすべて網羅することは不可能です。ではなぜ panic しないのかというと、これらの状況は実際には大多数（90%）がコードの問題ではなく、`panic` の本質は発生時に Rust が呼び出しスタックを一つずつ遡り、各フレームのデストラクタ（drop）を呼び出してリソースを解放することです。このプロセスにはコンパイラが余分な `unwind` テーブルを生成する必要があり、ビジネスロジックのエラー箇所を特定するための情報です。しかしエラー自体がほとんどあなたのコードではない場合、その情報に価値はなく、生成物のサイズが増え、リンカの作業負荷も増します。無効化するのが正解です。コードのテストが十分で自信があるなら、`panic = abort` を設定すると良いでしょう。
