    fr-FR:
      text: 'Dans la logique métier normale, `panic` ne devrait pas exister. Lorsqu’à l’exécution le code métier rencontre une erreur, tout Err conçu avec tolérance aux pannes doit être retourné en toute sécurité plutôt que de déclencher brutalement un panic, à l’instar de React ErrorBoundary, et doit être traité comme une gestion d’erreur normale. Le panic ne doit être déclenché que lorsque le code est certain d’être dans un état impossible et irrécupérable. Ma philosophie personnelle est d’abandonner le panic. Pourquoi ? Parce qu’en pratique, le code métier peut être couvert par trois niveaux de tests : le premier est le happy path, le deuxième un chemin d’erreur (une des possibilités infinies), et le troisième le fuzz ou les tests de collision qui exhaustivent les edge cases. Du point de vue de l’ingénierie, le chemin correct peut être testé à 100 %, le chemin d’erreur peut prendre une variante parmi n, les tests de collision ne sont qu’une question de temps et ne valent souvent pas la peine. Lorsque votre base d’utilisateurs grandit réellement, vous verrez vous‑même quand les faire ; personnellement, je ne les fais généralement pas.'
