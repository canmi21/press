    zh-TW:
      text: 另外說說 `codegen-units`，這其實就是一個控制編譯器把 crate 拆成多少個最小單元給後端並行處理的參數，預設情況下，debug 模式是 256 個，release 模式是 16 個。數字越大，並行度越高，編譯越快——因為可以同時利用多個 CPU 核心來跑後端程式碼生成。但代價是優化效果變差，因為每個單元是獨立優化的，LLVM（or Cranelift）看到的上下文變小了，跨單元的內聯和優化機會就少了。
