    es-ES:
      text: Por lo tanto, para un código de calidad, deberías cubrir una prueba del camino feliz y al menos una prueba de un camino de error. Si cubres un solo camino de error, puedes probar el caso en que se devuelve un Err, escribir la lógica de reserva y, de forma natural, puedes `thiserror` enumerar o `anyhow` interceptar para aplanar los registros. En resumen, tu código te obligará a crear mecanismos para manejar estas situaciones; si alcanzas este nivel, `panic` ya no tiene utilidad para ti, puede entenderse como “teóricamente imposible”, pero incluso así, en el mundo real existen errores del SO, errores de memoria, inversiones de bits únicas provocadas por rayos cósmicos, desbordamientos extraños… nunca podrás cubrir completamente estos casos. Entonces, ¿por qué no usar panic? Porque estas situaciones en realidad son, en un 90 % de los casos, problemas que no son de tu código. La esencia de `panic` es que cuando ocurre, Rust recorre la pila de llamadas cuadro por cuadro, llamando al destructor (drop) de cada frame para limpiar los recursos. Este proceso requiere que el compilador genere tablas `unwind` adicionales, que sirven para localizar los errores en la lógica de negocio. Si los errores casi siempre no son tuyos, ¿qué valor tiene esa información? Solo aumenta el tamaño de los artefactos compilados y la carga del enlazador; desactivarlo es la solución correcta. Cuando tu código está bien probado y tienes suficiente confianza, puedes configurar `panic = abort`.
