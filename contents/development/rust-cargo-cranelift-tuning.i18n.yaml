    zh-CN:
      text: 在正常业务中，`panic` 本就不该存在。业务代码在运行时遇到错误时，凡是已经设计了容错机制的 Err，都应该安全返回，而不是粗暴地触发 panic。就像 React ErrorBoundary 一样，它们应当作为普通错误得到处理；只有当代码确信自己进入了理论上不可能出现且无法挽回的状态时，才应该触发 panic。我个人的理念是放弃 panic。为什么？因为业务代码实际上可以分三层测试：第一层是正常路径，第二层是错误路径（无限种可能中的某一种），第三层才是通过模糊测试或碰撞测试穷举出的边界情况。从工程角度看，正常路径可以做到 100% 覆盖；对于一类错误路径的 n 种变体，只需选取一种测试；碰撞测试则纯粹是时间问题，大多数时候并不值得做。等用户规模真正上来、确实需要做时，你自然会知道；通常我一概不做。
