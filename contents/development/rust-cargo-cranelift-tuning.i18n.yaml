    ja-JP:
      text: 私自身、MUSL の :tn[熱狂的な愛好家]{is="原文では、中国語圏で日本のネット文化から取り入れられた接尾辞 chú を使い、熱狂的なファンであることを少し自嘲気味に表している。"}で、GNU glibc が大嫌いなのですが、開発時にはそれでも `x86_64-unknown-linux-gnu` の使用を勧めます。なぜかというと、速いからです。MUSL 最大の売りは、完全に静的リンクされたバイナリを生成できることです。システム上の動的ライブラリに一切依存しないため、コンパイルしたものをどの Linux マシンにコピーしてもそのまま実行でき、特にコンテナや組み込みシステムに向いています。しかし、遅さの原因も静的リンクにあります。リンカーがあらゆるものをまとめて組み込む必要があるため、リンク工程の作業量は動的リンクよりかなり多くなります。
