  0ab50562ac7ea4bf26e4e95e0cb715c1:
    de-DE:
      text: 'Ich selbst bin ein :tn[MUSL-Fanatiker]{is="Das Originalwort „厨“ stammt aus dem japanischen Netzjargon und bezeichnet jemanden, der ungewöhnlich begeistert von etwas ist; es ist hier selbstironisch gemeint."} und kann GNU glibc überhaupt nicht leiden, aber für die Entwicklung empfehle ich dir trotzdem `x86_64-unknown-linux-gnu`. Warum? Weil es schnell ist. MUSLs größter Vorteil ist, dass es vollständig statisch gelinkte Binärdateien erzeugen kann—ohne Abhängigkeit von dynamischen Bibliotheken auf dem System—sodass man das Kompilat auf jede Linux-Maschine kopieren und dort ausführen kann. Das eignet sich besonders für Container und eingebettete Systeme, doch gerade das statische Linken macht es auch langsam: Der Linker muss alles einpacken, daher ist der Aufwand in der Link-Phase deutlich größer als beim dynamischen Linken.'
      provider: openai
      model: gpt-5-6-terra-high
      at: 2026-08-03T03:12:16.451229Z
      seconds: 121.625193625
      tokens: 19228
      review: false
    en-US:
      text: 'I’m personally a :tn[MUSL fanatic]{is="The original word “厨” is Japanese-internet slang for someone unusually devoted to something; it is self-mocking here."} and really dislike GNU glibc, but for development I still recommend `x86_64-unknown-linux-gnu`. Why? Because it is fast. MUSL’s biggest selling point is that it can produce fully statically linked binaries—without relying on any dynamic libraries installed on the system—so you can copy the compiled result to any Linux machine and run it. It is especially suitable for containers and embedded systems, but static linking is also what makes it slow: the linker has to package everything in, so the linking stage does considerably more work than dynamic linking.'
      provider: openai
      model: gpt-5-6-terra-high
      at: 2026-08-03T03:12:16.451229Z
      seconds: 121.625193625
      tokens: 19228
      review: false
    es-ES:
      text: 'Yo mismo soy un :tn[fanático de MUSL]{is="La palabra original « 厨 » procede de la jerga japonesa de internet y se refiere a un seguidor excepcionalmente entusiasta; aquí se usa con autodesprecio."} y detesto GNU glibc, pero para el desarrollo aun así te recomiendo `x86_64-unknown-linux-gnu`. ¿Por qué? Porque es rápido. El mayor atractivo de MUSL es que puede generar binarios completamente enlazados de forma estática—sin depender de ninguna biblioteca dinámica del sistema—de modo que puedes copiar lo compilado a cualquier máquina Linux y ejecutarlo. Es especialmente adecuado para contenedores y sistemas embebidos, pero el enlace estático también es lo que lo hace lento: el enlazador tiene que empaquetarlo todo, por lo que la fase de enlace requiere bastante más trabajo que el enlace dinámico.'
      provider: openai
      model: gpt-5-6-terra-high
      at: 2026-08-03T03:12:16.451229Z
      seconds: 121.625193625
      tokens: 19228
      review: false
    fr-FR:
      text: 'Je suis moi-même un :tn[fanatique de MUSL]{is="Le mot original « 厨 » vient du jargon internet japonais et désigne un partisan anormalement passionné ; il est employé ici avec autodérision."} et je déteste GNU glibc, mais pour le développement je te recommande tout de même `x86_64-unknown-linux-gnu`. Pourquoi ? Parce que c’est rapide. Le principal atout de MUSL est de pouvoir produire des binaires entièrement liés statiquement—sans dépendre d’aucune bibliothèque dynamique présente sur le système—afin que le résultat compilé puisse être copié et exécuté sur n’importe quelle machine Linux. C’est particulièrement adapté aux conteneurs et aux systèmes embarqués, mais c’est aussi le lien statique qui le ralentit : l’éditeur de liens doit tout empaqueter, ce qui rend l’étape de liaison nettement plus lourde que le lien dynamique.'
      provider: openai
      model: gpt-5-6-terra-high
      at: 2026-08-03T03:12:16.451229Z
