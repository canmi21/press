    fr-FR:
      text: 'Dans du code métier ordinaire, `panic` ne devrait pas exister. Lorsque du code métier normal rencontre une erreur à l’exécution, toute valeur Err pour laquelle une tolérance aux pannes a été prévue devrait être renvoyée sans risque, plutôt que de provoquer brutalement une panique. Comme avec React ErrorBoundary, elle devrait être traitée normalement comme une erreur. Une panique ne devrait être déclenchée que lorsque le code est certain d’avoir atteint un état impossible et irrécupérable. Ma philosophie personnelle consiste à renoncer aux paniques. Pourquoi ? Parce qu’en pratique, le code métier peut être testé en trois couches : d’abord le chemin nominal, ensuite un chemin d’erreur — une possibilité parmi une infinité — et seulement enfin les cas limites recensés exhaustivement par des tests aléatoires ou de collision. Du point de vue de l’ingénierie, le chemin nominal peut être testé à 100 % ; pour les chemins d’erreur, on peut retenir une variante parmi les n d’une même catégorie. Les tests de collision ne sont qu’une question de temps et n’en valent généralement pas la peine. Lorsque votre nombre d’utilisateurs aura réellement augmenté, vous saurez vous-même quand ils seront nécessaires ; en règle générale, je n’en fais jamais.'
