    ko-KR:
      text: 나는 :tn[MUSL 광팬]{is="원문의 “厨”는 일본 인터넷 은어에서 온 말로, 어떤 대상에 유난히 열성적인 팬을 뜻하며 여기서는 자조적으로 쓰였다."}이라서 GNU glibc를 매우 싫어하지만, 개발할 때는 그래도 `x86_64-unknown-linux-gnu` 사용을 권한다. 왜냐하면 빠르기 때문이다. MUSL의 가장 큰 장점은 완전히 정적으로 링크된 바이너리를 만들 수 있다는 것이다. 즉 시스템에 있는 어떤 동적 라이브러리에도 의존하지 않으므로, 컴파일한 결과물을 어느 Linux 머신에 복사해도 실행할 수 있다. 컨테이너와 임베디드 시스템에 특히 적합하지만, 느린 이유도 정적 링크에 있다. 링커가 모든 것을 묶어 넣어야 하므로 링크 단계의 작업량이 동적 링크보다 훨씬 많다.
