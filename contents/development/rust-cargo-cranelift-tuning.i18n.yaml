      text: LTO（Link‑Time Optimization）是另一项非常占用内存和编译性能的技术，而且在大多数项目的 Release 构建时都推荐开启。正常编译时，每个 crate 是独立优化的，编译后端看不到 crate 之间的调用关系，导致某些跨 crate 的内联和死代码消除无法完成，这种情况非常常见；LTO 通过在链接时获取所有 crate 的 IR，打破这一边界，进行全局优化。但是千万不要在 profile 上无脑挂 `lto = true`，这会让你的 Rust 编译慢到怀疑人生，只需在使用 release profile 时挂上即可。
