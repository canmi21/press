    de-DE:
      text: 'Wo genau soll Cranelift also schneller sein? Seine Stärken spielt es am besten während der Entwicklung aus. In dieser Phase braucht man vielleicht gar keinen nahezu perfekten Maschinencode, dessen Ausführungseffizienz bis ans Äußerste optimiert wurde, sondern lediglich schnelles Feedback. Es genügt, wenn dieser nicht ganz so gute Maschinencode semantisch äquivalent zu dem von LLVM sorgfältig erzeugten Maschinencode ist. Frühe Versionen von Cranelift konnten das wegen zahlreicher Randfälle noch nicht gewährleisten. Solche Fälle gibt es zwar weiterhin, doch die Lage hat sich erheblich verbessert: Dass Cranelift funktioniert, während LLVM scheitert, ist heute ungefähr so wahrscheinlich, wie beim Schreiben von Rust einen internen Compilerfehler in rustc auszulösen. Um extrem optimierten Maschinencode zu erzeugen, führt LLVM Dutzende Optimierungsdurchläufe aus, darunter Schleifenentrollung, Vektorisierung, Konstantenfortpflanzung und die Beseitigung toten Codes – und noch sehr viele weitere –, die den Code Schicht für Schicht verfeinern. Cranelift verfolgt hingegen eine völlig andere Designphilosophie: Es reduziert diese Optimierungsschritte drastisch, führt nur eine grundlegende Registerzuweisung und Befehlsauswahl durch und schließt die Codeerzeugung mit einem einzigen linearen Durchlauf ab, ohne wiederholte Iterationen. Auch seine Zwischendarstellung ist schlanker und eigens darauf ausgelegt, eine höherstufige Zwischendarstellung schnell in Maschinencode zu übersetzen, statt wie LLVM IR die Last jahrzehntelanger Verallgemeinerung zu tragen.'
