    ko-KR:
      text: 따라서 좋은 코드라면 한 종류의 정상 경로를 다루는 테스트와 적어도 하나의 오류 경로를 다루는 테스트가 있어야 합니다. 같은 종류의 오류 경로는 한 사례만 다뤄도 오류가 Err로 반환되는지 시험할 수 있으므로, 대체 논리를 작성하고 자연스럽게 `thiserror`로 열거하거나 `anyhow`로 가로채 평탄화하고 출력하고 기록할 수 있습니다. 요컨대 코드 자체가 이런 상황을 처리할 장치를 작성하도록 강제합니다. 이 단계까지 해냈다면 `panic`는 쓸모가 없으며, 이를 “이론상 불가능”이라고 이해할 수 있습니다. 하지만 어디까지나 이론상일 뿐입니다. 현실에는 운영체제 오류, 메모리 오류, 우주선의 단일 전자로 인한 비트 반전, 기묘한 오버플로 등이 있으며, 이런 상황을 전부 다루는 것은 영원히 불가능합니다. 그렇다면 왜 패닉을 일으키지 않아야 할까요? 이런 상황은 높은 확률로, 즉 90%의 확률로 코드 문제가 아니기 때문입니다. `panic`의 본질은 그것이 발생할 때 Rust가 호출 스택을 한 단계씩 거슬러 올라가면서 각 프레임의 소멸자(drop)를 차례로 호출해 자원을 정리한다는 데 있습니다. 이 과정에는 비즈니스 논리의 오류 지점을 찾기 위해 컴파일러가 생성하는 추가 `unwind` 테이블이 필요합니다. 오류 자체가 코드에서 비롯되지 않았을 가능성이 높다면 그 정보가 무슨 가치가 있겠는가? 이를 남겨 두면 컴파일 산출물의 크기도 커지고 링커의 작업량도 늘어나므로, 끄는 것이 정답입니다. 코드를 충분히 테스트했고 그만큼 자신이 있다면 `panic = abort` 설정을 권합니다.
