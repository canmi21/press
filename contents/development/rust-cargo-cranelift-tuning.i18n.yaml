    ja-JP:
      text: したがって、良いコードには、1種類の正常経路を網羅するテストと、少なくとも1つのエラー経路を網羅するテストが必要です。同じ種類のエラー経路は1例だけ網羅すれば、エラーが Err として返されることを検証でき、フォールバック処理を書いて、自然に `thiserror` で列挙するか、`anyhow` で捕捉して平坦化・出力・記録できます。要するに、コードそのものが、こうした状況を処理する仕組みを書くよう促すのです。この段階まで到達すれば、`panic` は不要になり、「理論上は起こり得ない」と考えられます。ただし、それはあくまで理論上の話です。現実には、オペレーティングシステムのエラー、メモリエラー、宇宙線の単一電子によるビット反転、奇妙なオーバーフローなどが存在し、こうした状況をすべて網羅することは永遠にできません。では、なぜパニックを起こさないのでしょうか。それは、こうした状況の90%は、おそらく自分のコードの問題ではないからです。`panic` の本質は、それが発生すると Rust がコールスタックを1段ずつ遡り、各フレームのデストラクター（drop）を順番に呼び出してリソースを解放することにあります。この処理のために、コンパイラーはビジネスロジックの誤りを特定する追加の `unwind` テーブルを生成する必要があります。エラー自体が自分のコードに起因しない可能性が高いなら、その情報にどんな価値があるでしょうか。残しておけばビルド成果物も大きくなり、リンカーの負担も増えるため、無効にするのが正解です。コードが十分にテストされ、自信があるなら、`panic = abort` の設定をお勧めします。
