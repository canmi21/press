  ff317262076663bb2d98caaad83893c9:
    de-DE:
      text: 'Dieses Problem ist jedoch durchaus lösbar: Das Backend lässt sich mit `cfg` auswählen, und im Cranelift-Modus genügt es, mit `ring` zu kompilieren. Nachdem die Entwicklungs- und Veröffentlichungsprofile wie oben beschrieben konfiguriert wurden, zeigt ein einfacher Vergleich der CLI-Kompilierung, dass Entwicklungs-Builds unter diesen Bedingungen mindestens dreimal so schnell wie Veröffentlichungs-Builds sind – selbst bei vollständigen Kompilierungen ohne inkrementelle Verarbeitung. Mit O0 und deaktivierter Linkzeitoptimierung sollte das Entwicklungsprofil bei späteren inkrementellen Aktualisierungen sogar um ein Vielfaches von zehn schneller als das Veröffentlichungsprofil sein. Techniken wie die Linkzeitoptimierung beruhen nämlich darauf, die Grenzen zwischen den einzelnen Paketen einzuebnen. Sobald alles zu einer Einheit verschmolzen ist, erzwingt jede Codeänderung eine erneute Kompilierung der gesamten Einheit, sodass korrekte inkrementelle Aktualisierungen nicht mehr möglich sind.'
