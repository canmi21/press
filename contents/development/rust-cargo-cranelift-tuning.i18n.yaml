      text: 在正常的業務中，`panic` 不應該存在。正常業務程式碼在執行階段遇到錯誤時，只要是設計了容錯機制的 Err，都應該被安全傳回，而不是粗暴地觸發恐慌；就像 React ErrorBoundary 一樣，它應該被正常地當作錯誤處理。只有當程式碼確信自己進入了不可能且無法挽回的狀態時，才應該觸發恐慌。我的個人哲學是放棄恐慌。為什麼？因為實際上可以把業務程式碼測試分成三層：第一層是正確路徑，第二層是錯誤路徑（無限種可能中的一種），第三層才是透過模糊測試或碰撞測試窮舉出來的邊界情況。從工程角度來說，正確路徑可以做到 100% 覆蓋；錯誤路徑可以從一類的 n 種變體中選取一種；碰撞測試則純粹是時間問題，大多數時候並不值得。等你的使用者規模真的上來了，需要做的時候你自然會知道；通常我一律不做。
