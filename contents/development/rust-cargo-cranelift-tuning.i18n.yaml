      text: Rust 的设计里选用 LLVM 其实有点偷懒，但也选得很好。它不像 Go 那样自己维护一整套到机器码的流程，而是把成熟的优化交给 LLVM 这个大生态来做，这其实很好。整个 Rust 的编译流程大致是这样：源码先跑一遍词法分析和语法分析生成 AST，再经过宏展开、降级到 HIR 拍平！然后进入常规的类型检查、:tn[亿点点]{is="原文写作“亿点点”，把“一点点”里的“一”换成了表示一亿的“亿”。用夸张的量词反讽：借用检查根本不是一点点的活儿。"}借用检查，最终生成 MIR。到这里为止，都是 Rust 编译器自己的前端在干活。而 MIR 之后的事情就交给了 LLVM：把 MIR 翻译成 LLVM IR，然后 LLVM 跑一遍它那套优化 pass（从 O0 到 O3 不等），最后生成目标平台的机器码，再交给链接器拼成 BIN 可执行文件。
