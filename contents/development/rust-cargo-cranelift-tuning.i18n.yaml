      text: では、Cranelift は一体どこで速くあるべきなのでしょうか？ 最高のフェーズはまさに開発時です。この段階では、実行効率が極限まで最適化された完璧に近いマシン語などおそらく必要なく、単に素早いフィードバックが得られれば十分かもしれません。このそこまで出来の良くないマシン語が、LLVM の正当な計算によるマシン語と意味的に等価でありさえすればいいのです。初期の Cranelift は多くの Edge Case が存在したため実際にはそれができませんでした。今でもまだ残ってはいるもののかなり改善されており、現在 Cranelift で動くのに LLVM で壊れる確率は、Rust を書いていて rustc ICE を引き起こす確率とほぼ同等です。LLVM は極限まで最適化されたマシン語を生成するために、ループ展開、ベクトル化、定数伝播、死にコード消去といった数十もの最適化 pass を走らせます…… かなり多くの処理を一層一層じっくり磨き上げるのです。一方で Cranelift の設計思想は全く異なり、これらの最適化ステップを大幅に削減して、最も基本的なレジスタ割り当てと命令選択だけを行い、反復することなく単一の線形スキャンでコード生成を完結させます。同時にその IR 設計もより軽量で、上位 IR からマシン語への高速な翻訳のために特別に設計されており、数十年分の汎用化という重荷を背負った LLVM IR とは異なります。
