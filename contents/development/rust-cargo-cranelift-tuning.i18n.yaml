      model: gpt-oss-120b-medium
      at: 2026-08-03T01:37:50.398714Z
      seconds: 27.185891083
      tokens: 19561
      review: false
    ko-KR:
      text: LTO (Link-Time Optimization)는 메모리와 컴파일 성능을 많이 소모하는 또 다른 기능이며, 대부분의 프로젝트에서는 Release 빌드 시 이를 활성화하는 것이 권장됩니다. 일반 컴파일에서는 각 crate가 독립적으로 최적화되고, 컴파일러 백엔드는 crate 간 호출 관계를 알 수 없어 일부 크로스‑crate 인라인 및 죽은 코드 제거를 수행할 수 없습니다. 이러한 경우가 매우 많이 발생합니다. LTO는 이 경계를 깨고, 링킹 단계에서 모든 crate의 IR을 획득하여 전체 최적화를 수행합니다. 하지만 프로파일에 `lto = true`을 무분별하게 켜지 마세요. 이렇게 하면 Rust 컴파일이 너무 느려져 삶에 회의감을 느낄 수 있습니다. Release 프로파일을 사용할 때만 켜면 됩니다.
