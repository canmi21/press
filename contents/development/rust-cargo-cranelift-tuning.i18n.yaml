  bf8af9bda87a0ee239ae9723aa619fed:
    de-DE:
      text: Übrigens, bitte verwenden Sie zig überhaupt nicht; das zbuild von nightly Rust hat derzeit erhebliche Probleme. Wenn Sie Kreuzkompilierung benötigen und der Host Linux x86 ist, empfehlen wir [cross](https://github.com/cross-rs/cross). Das Bauen in Docker funktioniert hervorragend und liefert eine vollständige Umgebung. Wenn Sie glibc bevorzugen, ist das ebenfalls gut, weil glibc nur rückwärtskompatibel ist. Üblicherweise kompiliert man gegen die glibc‑Version einer großen Debian‑Veröffentlichung (z. B. Debian‑2). Andernfalls führt eine zu neue glibc dazu, dass viele Maschinen nicht laufen; das liegt nicht an einem neuen Feature, sondern einfach daran, dass man anhand des Versionsstrings prüft und Sie damit ärgert. Ist der Host mac, nutzen Sie bitte das native rustup `target + cargo build --release `.
      provider: openai
      model: gpt-oss-120b-medium
      at: 2026-08-01T02:18:15.748408Z
      seconds: 17.491262208
      tokens: 19092
      review: false
    en-US:
      text: By the way, don't use zig at all; the nightly Rust's zbuild currently has big problems. When you need cross‑compilation and the host is Linux x86, we recommend [cross](https://github.com/cross-rs/cross). Using Docker to build works great and provides a full environment. If you prefer glibc, that also works fine, because glibc only maintains backward compatibility. Usually you compile against the glibc version of a major Debian release (e.g., Debian‑2). Otherwise a too‑new glibc will make many machines unable to run; this isn’t because a new feature was used, just because the version string is being checked to annoy you. If the host is mac, please use the native rustup `target + cargo build --release `.
      provider: openai
