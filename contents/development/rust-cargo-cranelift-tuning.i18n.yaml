    en-US:
      text: So much for the benefits—what about the cost? The first obvious drawback is that code generated by Cranelift runs roughly 10–30% slower than LLVM-generated code, depending on the workload. But think about it and you’ll realize that this simply doesn’t matter during development. Why do I need that much speed—am I benchmarking or making a CI release build? I just :tn[fucking]{is="The original used tm, an initialism for the Mandarin profanity tā mā, preserving the force of the swear while half-concealing it behind Latin letters."} want cargo build to finish faster so I can see whether the logic works. And I bet most programs you write cannot keep the compute resources busy more than 80% of the time; they must have some actual business traffic, and how much of that can there be while you’re developing? The CPU is probably :tn[slacking off the whole time]{is="The original used mō yú, literally catching fish, internet slang for loafing around; applying it to the CPU also playfully personifies the machine."}. What I need instead is to see the result and validate the logic. So if we are trading compilation time for runtime efficiency, shouldn’t we reverse that calculation inside the development loop?
