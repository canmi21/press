      text: 良いコードに対しては、1つの正常系テストと少なくとも1つのエラー系テストをカバーすべきです。そのエラー系テストは、Err が返されるケースをテストできれば十分で、フォールバックロジックを書き、自然に `thiserror` 列挙あるいは `anyhow` でインターセプトしてログを平坦化できます。要するに、コードはこれらの状況を処理する仕組みを書かせることになります。この層まで実装できていれば、`panic` はあなたにとって不要です—「理論上は不可能」と解釈できますが、それも理論上の話です。実際の世界では OS エラー、メモリエラー、宇宙線による単一ビット反転、奇妙なオーバーフローなどが存在します… すべてを網羅することは不可能です。ではなぜ panic を避けるのか？ それらの状況は大半がコードの問題ではなく、90% はあなたのコードが原因ではありません。`panic` の本質は、発生時に Rust が呼び出しスタックを遡り、各フレームのデストラクタ（drop）を順に呼び出してリソースを解放することです。このプロセスにはコンパイラが余分な `unwind` テーブルを生成する必要があり、ビジネスロジックのエラー箇所を特定する手助けになります。エラーがほとんど自分のものではないなら、その情報に価値はありませんし、バイナリサイズも増え、リンク作業も増えるのでオフにするのが正解です。コードのテストが十分で自信があるなら、`panic = abort` を設定すると良いでしょう。
