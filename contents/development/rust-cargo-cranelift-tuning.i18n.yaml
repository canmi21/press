  342f20e52b9ab4bb72d82c6f84108e5e:
    de-DE:
      text: 'In normalem Anwendungscode sollte `panic` nicht vorkommen. Wenn gewöhnlicher Anwendungscode zur Laufzeit auf einen Fehler stößt, sollte jeder Err-Wert, für den Fehlertoleranz vorgesehen ist, sicher zurückgegeben werden, statt einen brachialen Panikabbruch auszulösen. Wie bei React ErrorBoundary sollte er ganz normal als Fehler behandelt werden. Eine Panik sollte nur ausgelöst werden, wenn der Code sicher ist, einen unmöglichen und nicht wiederherstellbaren Zustand erreicht zu haben. Meine persönliche Philosophie lautet, auf Panikabbrüche zu verzichten. Warum? Weil sich Anwendungscode in der Praxis in drei Schichten testen lässt: zuerst der erfolgreiche Pfad, dann ein Fehlerpfad – eine von unendlich vielen Möglichkeiten – und erst danach die Grenzfälle, die durch Fuzz- oder Kollisionstests erschöpfend gefunden werden. Aus technischer Sicht kann der erfolgreiche Pfad zu 100 % getestet werden; bei Fehlerpfaden lässt sich aus den n Varianten einer Kategorie eine auswählen. Kollisionstests sind lediglich eine Frage der Zeit und lohnen sich meistens nicht. Sobald die Zahl der Nutzer wirklich groß genug ist, erkennt man selbst, wann sie nötig werden; grundsätzlich führe ich sie nie durch.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:34:48.781382Z
      seconds: 94.352922375
      tokens: 20696
      review: false
    en-US:
      text: 'In ordinary application code, `panic` should not exist. Whenever application code encounters an error at runtime, any Err covered by a fault-tolerance design should be returned safely instead of causing an abrupt panic. Like React ErrorBoundary, it should be handled normally as an error. A panic should be triggered only when the code is certain that it has entered an impossible, unrecoverable state. My personal philosophy is to abandon panics. Why? Because application code can effectively be tested in three layers: first the successful path, second an error path—one of infinitely many possibilities—and only then the edge cases exhaustively uncovered by fuzzing or collision testing. From an engineering perspective, the successful path can be tested with 100% coverage, while one of the n variants in each category of error paths can be selected. Collision testing is purely a matter of time and is usually not worthwhile. Once your user base truly grows large enough, you will know when you need it; as a rule, I never do it.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:34:48.781382Z
      seconds: 94.352922375
      tokens: 20696
      review: false
    es-ES:
      text: 'En el código de negocio normal, `panic` no debería existir. Cuando el código de negocio habitual encuentra un error durante la ejecución, cualquier Err para el que se haya diseñado tolerancia a fallos debería devolverse de forma segura, en lugar de provocar un pánico de manera abrupta. Al igual que React ErrorBoundary, debería tratarse normalmente como un error. Solo debería desencadenarse un pánico cuando el código esté convencido de haber entrado en un estado imposible e irrecuperable. Mi filosofía personal es renunciar a los pánicos. ¿Por qué? Porque, en la práctica, las pruebas del código de negocio pueden dividirse en tres capas: primero la ruta correcta, después una ruta de error —una entre infinitas posibilidades— y, solo en tercer lugar, los casos límite descubiertos exhaustivamente mediante pruebas con entradas aleatorias o de colisión. Desde el punto de vista de la ingeniería, la ruta correcta puede probarse al 100 %; para las rutas de error, puede elegirse una de las n variantes de cada categoría. Las pruebas de colisión son una mera cuestión de tiempo y casi nunca merecen la pena. Cuando el volumen de usuarios crezca de verdad, sabrás por ti mismo cuándo necesitas hacerlas; por lo general, yo nunca las hago.'
