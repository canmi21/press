      text: 'Ich selbst bin ein :tn[bekennender MUSL-Jünger]{is="Im Original steht „MUSL 厨“. Das Suffix 厨 stammt aus der japanischen Internetkultur und wurde ins Chinesische übernommen; es bezeichnet einen fanatischen Anhänger einer Sache. Der Autor verwendet es hier selbstironisch über sich selbst."} und kann GNU glibc überhaupt nicht ausstehen, für die Entwicklung empfehle ich dir trotzdem `x86_64-unknown-linux-gnu`. Warum? Weil es schnell ist. Das größte Verkaufsargument von MUSL ist, dass es vollständig statisch gelinkte Binaries erzeugen kann – ohne Abhängigkeit von irgendeiner dynamischen Bibliothek des Systems. Das Kompilat läuft auf jeder beliebigen Linux-Maschine, sobald man es dorthin kopiert, was sich besonders für Container und Embedded eignet. Langsam ist es aber genau wegen dieses statischen Linkens: Der Linker muss alles mit einpacken, und damit fällt in der Link-Phase deutlich mehr Arbeit an als beim dynamischen Linken.'
