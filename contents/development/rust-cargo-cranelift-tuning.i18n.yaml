      text: Damit wären die Vorteile geklärt – doch welchen Preis zahlen wir dafür? Der erste offensichtliche Nachteil ist, dass von Cranelift erzeugter Code zur Laufzeit je nach Anwendungsfall ungefähr 10–30 % langsamer ist als von LLVM erzeugter Code. Wenn man es sich aber klarmacht, merkt man, dass das während der Entwicklung überhaupt keine Rolle spielt. Wozu brauche ich diese Geschwindigkeit – lasse ich Benchmarks laufen oder erstelle ich einen CI-Release-Build? Ich will doch :tn[verdammt noch mal]{is="Im Original steht tm, das Kürzel für den mandarinchinesischen Fluch tā mā; die lateinischen Anfangsbuchstaben verschleiern den Kraftausdruck halb, ohne ihm seine Wucht zu nehmen."} nur, dass cargo build schneller fertig wird, damit ich sehen kann, ob die Logik funktioniert. Und ich wette, dass die meisten Programme, die du schreibst, die Rechenressourcen unmöglich mehr als 80 % der Zeit auslasten; dafür braucht es schließlich echte Geschäftslast, und wie viel davon gibt es schon während der Entwicklung? Die CPU :tn[dreht wahrscheinlich die ganze Zeit Däumchen]{is="Im Original steht mō yú, wörtlich Fische fangen, ein chinesischer Internetausdruck für das Faulenzen bei der Arbeit. Auf die CPU angewandt vermenschlicht er die Maschine auf scherzhafte Weise."}. Mir geht es vielmehr darum, das Ergebnis zu sehen und die Logik zu überprüfen. Wenn wir also Kompilierzeit gegen Laufzeiteffizienz tauschen, müssten wir diese Rechnung in der Entwicklungsschleife nicht genau andersherum aufmachen?
