    es-ES:
      text: Así que, tras hablar de las ventajas, ¿cuál es el precio? En primer lugar, lo más evidente es que el código generado por Cranelift tiene un rendimiento en tiempo de ejecución inferior al de LLVM, siendo aproximadamente entre un 10 % y un 30 % más lento según el escenario. Pero si lo piensas fríamente, te darás cuenta de que esto en la fase de desarrollo no importa en absoluto. ¿Para qué necesito ir tan rápido? ¿Estás haciendo un benchmark o un CI release? Yo lo único que quiero es que `cargo build` vaya más rápido para ver si sale la lógica. Además, apuesto a que la mayoría de los programas que escribes no ocupan más del 80 % de los recursos de cómputo la mayor parte del tiempo; seguro que dependerán del tráfico de negocio que reciban, ¿y qué tan grande puede ser ese tráfico durante el desarrollo? ¡La CPU seguro que se pasa todo el tiempo tocándose las narices! Lo que yo quiero es ver los resultados y validar la lógica. Por tanto, intercambiar tiempo de compilación por eficiencia en tiempo de ejecución, ¿no es una cuenta que en el bucle de desarrollo deberíamos hacer al revés?
