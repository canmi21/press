    ko-KR:
      text: 하지만 실제로는 UPX가 이 문제를 해결합니다. UPX의 원리는 당신의 BIN을 압축하고 해제 스텁을 붙이는 것입니다. 실행 시 먼저 메모리에서 압축을 풀고 실행하기 때문에 바이너리 크기를 원래의 약 30%~50% 수준으로 줄일 수 있어 크기상의 이점이 매우 뚜렷합니다. 그러나 바로 이 때문에 UPX와 GNU glibc 동적 링크에는 큰 문제가 발생합니다. glibc 동적 링크 바이너리에는 특수 섹션과 동적 로드 메커니즘이 존재하는데, UPX 압축 후 이러한 구조가 손상될 수 있어 실행 시 동적 라이브러리를 찾지 못하게 됩니다 `segment fault`. 반면에 musl은 UPX에 아주 적합합니다. musl은 완전 정적이고 내부가 안정적이며, UPX 압축 및 해제 과정이 깨끗합니다. 따라서 musl의 릴리스 CI에 UPX 단계를 추가하는 것은 매우 큰 장점이 됩니다.
