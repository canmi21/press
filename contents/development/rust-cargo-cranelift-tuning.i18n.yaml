    zh-CN:
      text: 这样就可以用 O3 编译第三方依赖。虽然这会延长首次冷编译的时间，但后续采用增量编译，而外部依赖通常也不会频繁更新。第三方依赖用 O3、业务代码用 O0，一般能在编译速度和产物体积之间取得良好平衡，带来不错的开发模式体验；不过在发布模式下，我仍然建议直接拉满到 O3 或 Z，没什么好说的。
