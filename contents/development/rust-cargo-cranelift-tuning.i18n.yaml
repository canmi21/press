      text: Unter Linux nutzt Rust standardmäßig GNU ld (bfd) – ja, genau den ältesten und langsamsten. Da es single-threaded ist und Symbolauflösung sowie Relokation seriell scannend verarbeitet, bremst es bei größeren Projekten spürbar aus. Unter Linux können Sie das von [@Rui Ueyama](https://github.com/rui314) geschriebene [mold](https://github.com/rui314/mold) ausprobieren; die Konfiguration ist sehr einfach und erfordert nur das Hinzufügen einer Zeile in `.cargo/config.toml`.
      provider: google
