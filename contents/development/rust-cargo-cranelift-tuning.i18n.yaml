    ja-JP:
      text: LTO（Link‑Time Optimization）は、メモリとコンパイル性能を大量に消費するもう一つの機能で、ほとんどのプロジェクトが Release ビルド時に有効にすることを推奨しています。通常のコンパイルでは、各 crate が独立して最適化され、コンパイラのバックエンドは crate 間の呼び出し関係を把握できないため、クロス crate のインライン化やデッドコード除去ができません。このようなケースは非常に多く、LTO はリンク時にすべての crate の IR を取得してこの境界を打ち破り、グローバルな最適化を行います。ただし、profile に無造作に `lto = true` を付けるのはやめてください。これをすると Rust のコンパイルが遅くなりすぎて人生に疑問を抱くほどです。release profile を使用する際にだけ付けるようにしましょう。
