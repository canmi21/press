    zh-CN:
      text: 因此，好的代码应该覆盖一类正确路径测试和至少一种错误路径测试。对于同一类错误路径，只需覆盖一个变体，就能验证错误能否正常返回，并据此编写兜底逻辑，自然也就可以用 `thiserror` 逐项处理，或用 `anyhow` 统一拦截、拍平、打印和记录。总之，代码会迫使你建立处理这些情况的机制。做到这一层后，`panic` 对你就没有用了：它可以被理解为“理论上不可能发生”，但也仅仅是理论上如此。现实世界中仍然存在操作系统错误、内存错误、宇宙射线导致的单比特翻转，以及各种稀奇古怪的溢出……你永远不可能覆盖所有这类情况。那么，为什么不使用恐慌机制呢？因为这些情况很可能——有 90% 的概率——并不是你的代码导致的。`panic` 的本质是：发生恐慌时，Rust 会沿调用栈逐层回退，依次调用每个栈帧中的析构函数，清理资源。为此，编译器需要生成额外的 `unwind` 表，以便定位业务逻辑中的错误。但如果错误本身很可能不在你的代码里，这些信息又有什么价值？保留它们不仅会增大编译产物，还会增加链接器的工作量，因此关闭才是正确选择。如果你的代码已经经过充分测试，也有足够的信心，我建议配置 `panic = abort`。
