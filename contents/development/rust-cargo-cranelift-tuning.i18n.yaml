    es-ES:
      text: Para un código de calidad, debes cubrir una prueba del camino feliz y al menos una prueba de camino de error. Con esa única ruta de error basta para probar el caso en que se devuelve un Err, escribir lógica de fallback y, de forma natural, `thiserror` enumerar o `anyhow` interceptar y aplanar los registros de impresión. En resumen, tu código te obliga a crear mecanismos para manejar esas situaciones; si has llegado a este nivel, `panic` ya no tiene utilidad – puede interpretarse como “teóricamente imposible”, aunque también es solo teoría. En el mundo real existen errores del SO, errores de memoria, inversiones de bits por rayos cósmicos, extraños desbordamientos… Nunca podrás cubrir todos esos casos. Entonces, ¿por qué evitar el panic? Porque esas situaciones en su mayoría no son culpa de tu código, alrededor del 90 % no provienen de ti. La esencia de `panic` es que, al ocurrir, Rust recorre la pila de llamadas, llamando a los destructores (drop) de cada marco para liberar recursos. Este proceso requiere que el compilador genere tablas adicionales `unwind`, lo que ayuda a localizar errores lógicos en tu lógica de negocio. Si los errores son mayormente externos, esa información tiene poco valor, además aumenta el tamaño del binario y la carga del enlazador – desactivarlo es la solución correcta. Cuando tu código está bien probado y tienes confianza, puedes configurar `panic = abort`.
