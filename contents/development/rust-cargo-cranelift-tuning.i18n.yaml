    es-ES:
      text: 'Entonces, ¿dónde se supone exactamente que debe ser más rápido Cranelift? Su mejor momento es la fase de desarrollo. En esa etapa quizá no necesites en absoluto un código máquina casi perfecto, optimizado al límite de la eficiencia de ejecución; tal vez solo necesitemos obtener una respuesta rápida. Basta con que ese código máquina no tan bueno sea semánticamente equivalente al código máquina generado correctamente por LLVM. Las primeras versiones de Cranelift no podían garantizarlo debido a numerosos casos límite. Aunque todavía existen, la situación ha mejorado mucho: hoy, la probabilidad de que Cranelift funcione mientras LLVM falla es aproximadamente la misma que la de provocar un error interno de rustc al escribir Rust. Para generar código máquina optimizado al extremo, LLVM ejecuta decenas de pasadas de optimización, como el desenrollado de bucles, la vectorización, la propagación de constantes y la eliminación de código muerto… además de muchas otras, puliendo el código capa por capa. Cranelift, en cambio, sigue una filosofía de diseño completamente distinta: reduce drásticamente esos pasos de optimización, realiza únicamente la asignación básica de registros y la selección de instrucciones, y completa la generación de código con un único barrido lineal, sin iteraciones repetidas. Su representación intermedia también es más ligera y está diseñada específicamente para traducir con rapidez una representación intermedia de alto nivel a código máquina, a diferencia de LLVM IR, que arrastra décadas de lastre derivado de su propósito general.'
