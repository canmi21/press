  f431cfd98af980adfd9c279f26cf0ff0:
    de-DE:
      text: Betrachten wir außerdem `codegen-units`. Dabei handelt es sich um einen Parameter, der steuert, in wie viele kleinste Einheiten der Compiler ein Crate für die parallele Verarbeitung im Backend aufteilt. Standardmäßig sind das im Debug‑Modus 256 Einheiten und im Release‑Modus 16 Einheiten. Je größer die Zahl, desto höher die Parallelität und desto schneller die Kompilierung – weil mehrere CPU‑Kerne gleichzeitig für die Code‑Generierung im Backend genutzt werden können. Der Nachteil ist jedoch eine schlechtere Optimierung, da jede Einheit unabhängig optimiert wird; LLVM (oder Cranelift) hat dadurch einen kleineren Kontext, und Möglichkeiten für Inline‑ und Optimierungen über Einheiten hinweg sinken.
      provider: openai
      model: gpt-oss-120b-medium
      at: 2026-08-01T02:18:36.014923Z
      seconds: 15.966015084
      tokens: 18533
      review: false
    en-US:
      text: Additionally, let’s discuss `codegen-units`. This is actually a parameter that controls how many smallest units the compiler splits a crate into for the backend to process in parallel. By default, debug mode uses 256 units and release mode uses 16 units. The larger the number, the higher the parallelism and the faster the compilation—because multiple CPU cores can be used simultaneously to run backend code generation. The trade‑off is poorer optimization, as each unit is optimized independently; LLVM (or Cranelift) sees a smaller context, so cross‑unit inlining and optimization opportunities are reduced.
      provider: openai
      model: gpt-oss-120b-medium
      at: 2026-08-01T02:18:36.014923Z
      seconds: 15.966015084
      tokens: 18533
