      text: 'Nachdem die Vorteile geklärt sind: Was ist mit den Kosten? Zunächst liegt auf der Hand, dass von Cranelift erzeugter Code zur Laufzeit schlechter abschneidet als LLVM und je nach Szenario wohl etwa 10–30 % langsamer ist. Wenn man es aber gelassen betrachtet, merkt man, dass das in der Entwicklungsphase überhaupt nicht wichtig ist. Wozu brauche ich das so schnell? Führst du Benchmarks aus oder machst du einen CI release? Ich will :tn[verdammt noch mal]{is="Im Original steht tm, die Initialen eines chinesischen Schimpfworts; das bewahrt den groben Ton und verschleiert ihn zugleich etwas."} nur, dass cargo build schneller läuft, damit ich sehen kann, ob die Logik funktioniert. Und ich wette, dass die meisten Programme, die du schreibst, unmöglich mehr als 80 % ihrer Zeit die Rechenressourcen auslasten können; erst einmal muss überhaupt Geschäft hereinkommen. Wie viel Geschäft kann es während der Entwicklung schon geben? Die CPU macht vermutlich die ganze Zeit blau. Ich hingegen will das Ergebnis sehen und die Logik prüfen. Sollte man den Tausch von Compile-Zeit gegen Laufzeiteffizienz im Entwicklungszyklus also nicht umgekehrt rechnen?'
