  3ecfd63d0174b61813402b5872679438:
    de-DE:
      text: Nachdem wir nun über die Vorteile gesprochen haben, was ist der Preis dafür? Erstens ist offensichtlich, dass der von Cranelift generierte Code bei der Laufzeit-Performance schlechter abschneidet als LLVM und je nach Szenario etwa 10 % bis 30 % langsamer ist. Aber wenn man mal ehrlich ist, erkennt man schnell, dass das in der Entwicklungsphase überhaupt keine Rolle spielt. Wozu brauche ich denn so viel Speed? Machen Sie Benchmarks oder einen CI release? Ich will doch nur verdammt nochmal, dass `cargo build` schneller läuft, um zu sehen, ob die Logik funktioniert. Außerdem wette ich, dass die meisten Programme, die Sie schreiben, kaum mehr als 80 % der Zeit die Rechenressourcen voll auslasten. Es kommt ja immer Geschäftslogik rein, aber wie groß kann diese Last in der Entwicklung schon sein? Die CPU ist doch wahrscheinlich die ganze Zeit nur am Däumchen drehen! Ich will stattdessen Ergebnisse sehen und die Logik überprüfen. Sollte man diese Rechnung – Kompilierzeit gegen Laufzeiteffizienz – im Entwicklungszyklus also nicht genau andersherum aufstellen?
      provider: google
