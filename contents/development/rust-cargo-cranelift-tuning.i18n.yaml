      text: 일반적인 비즈니스 코드에는 `panic` 이 존재해서는 안 됩니다. 정상적인 비즈니스 코드가 실행 중 오류를 만났을 때, 내결함성을 고려해 설계된 Err라면 모두 안전하게 반환되어야 하며 거칠게 패닉을 일으켜서는 안 됩니다. React ErrorBoundary처럼 정상적인 오류로 처리해야 합니다. 패닉은 코드가 불가능한 상태에 진입했으며 복구할 수도 없다고 확신할 때만 일으켜야 합니다. 제 개인적인 철학은 패닉을 포기하는 것입니다. 왜일까요? 실제로 비즈니스 코드의 테스트는 세 계층으로 나눌 수 있기 때문입니다. 첫 번째는 성공 경로, 두 번째는 오류 경로(무한히 많은 가능성 중 하나), 세 번째가 비로소 퍼징이나 충돌 테스트로 샅샅이 찾아낸 경계 사례입니다. 공학적으로 성공 경로는 100% 테스트할 수 있고, 오류 경로는 한 범주의 n가지 변형 중 하나를 선택할 수 있습니다. 충돌 테스트는 순전히 시간의 문제이며 대부분은 그만한 가치가 없습니다. 사용자 규모가 정말 커지면 언제 해야 하는지 스스로 알게 되므로, 저는 보통 아예 하지 않습니다.
