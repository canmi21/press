    fr-FR:
      text: "Alors, où Cranelift est-il censé être rapide ? La meilleure phase est pendant le développement. À ce stade, vous n'avez peut-être absolument pas besoin d'un code machine quasi parfait et extrêmement optimisé pour l'efficacité d'exécution ; peut-être avons-nous simplement besoin d'un retour rapide, tant que ce code machine pas si formidable est sémantiquement équivalent au code machine proprement généré par LLVM. À ses débuts, Cranelift n'y arrivait pas vraiment en raison de nombreux Edge Cases. Même s'il y en a encore aujourd'hui, la situation s'est nettement améliorée : la probabilité que Cranelift fonctionne alors qu'LLVM échoue est désormais à peu près la même que celle de déclencher un rustc ICE en écrivant du Rust. Pour générer un code machine extrêmement optimisé, LLVM exécute des dizaines de passes d'optimisation, comme le déroulage de boucles, la vectorisation, la propagation de constantes, l'élimination de code mort, et bien d'autres encore... énormément d'étapes polies couche après couche. La philosophie de conception de Cranelift est totalement différente : il réduit considérablement ces étapes d'optimisation pour ne conserver que l'allocation de registres et la sélection d'instructions les plus basiques, accomplissant la génération de code en un seul balayage linéaire, sans itérations répétées. De plus, sa conception IR est plus légère, spécifiquement pensée pour traduire rapidement l'IR de niveau supérieur en code machine, contrairement à LLVM IR qui traîne des décennies de fardeau de généralisation."
