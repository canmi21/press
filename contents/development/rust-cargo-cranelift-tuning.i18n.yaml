    fr-FR:
      text: Donc, pour un code de bonne qualité, il faut couvrir un test du chemin heureux et au moins un test d’un chemin d’erreur. Une fois qu’un chemin d’erreur est couvert, on peut tester le cas où une Err est renvoyée, écrire la logique de secours, et naturellement on peut `thiserror` énumérer ou `anyhow` intercepter pour aplatir les journaux. En résumé, votre code vous oblige à mettre en place des mécanismes pour gérer ces situations ; si vous avez atteint ce niveau, `panic` devient inutile pour vous, on peut le considérer comme « théoriquement impossible », mais en pratique le monde réel comporte des erreurs d’OS, des erreurs de mémoire, des inversions de bits uniques causées par les rayons cosmiques, des débordements étranges… vous ne pourrez jamais couvrir exhaustivement ces cas. Alors pourquoi ne pas déclencher de panic ? Parce que ces situations sont, en fait, à 90 % hors de la responsabilité de votre code. L’essence de `panic` est que lorsqu’elle se produit, Rust remonte la pile d’appels cadre par cadre, invoquant le destructeur (drop) de chaque cadre pour libérer les ressources. Ce processus oblige le compilateur à générer des tables `unwind` supplémentaires, destinées à vous aider à localiser les erreurs de logique métier. Si ces erreurs sont très probablement pas les vôtres, quelle valeur a cette information ? Elle ne fait qu’augmenter la taille des artefacts compilés et la charge du lien­ur ; la désactiver est la solution correcte. Une fois vos tests suffisants et votre confiance acquise, vous pouvez configurer `panic = abort`.
