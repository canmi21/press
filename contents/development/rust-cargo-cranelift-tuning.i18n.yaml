    ja-JP:
      text: しかし実際には UPX の存在がこの問題を解決します。UPX の原理は、あなたのバイナリを圧縮し、解凍スタブを付加することです。実行時にメモリ上で先に解凍してから実行するため、バイナリサイズを元の約30％～50％にまで縮小でき、サイズ上のメリットが非常に顕著になります。しかし、まさにこのために UPX と GNU glibc の動的リンクには大きな問題が生じます。glibc の動的リンクバイナリには特殊なセクションや動的ロード機構があり、UPX 圧縮後にそれらの構造が破壊され、実行時に動的ライブラリが見つからなくなることがあります `segment fault`。対照的に musl は UPX に非常に適しています。musl は完全に静的で内部が安定しており、UPX 後の解凍・圧縮もきれいに行われます。したがって、musl のリリース CI に UPX のステップをもう一つ加えることは大きなプラスになります。
