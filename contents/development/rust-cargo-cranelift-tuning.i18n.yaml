    fr-FR:
      text: "Dans la logique métier normale, `panic` ne devrait pas exister. Lorsque du code métier classique rencontre une erreur au runtime, tout Err conçu pour la tolérance aux pannes doit être retourné en toute sécurité plutôt que d'effectuer un panic brutal. Tout comme un ErrorBoundary React, cela doit être traité normalement comme une erreur ; un panic ne devrait se déclencher que si le code a la certitude d'être entré dans un état impossible et irrécupérable. Ma philosophie personnelle est d'abandonner le panic. Pourquoi ? Parce qu'en pratique, le code métier peut être divisé en 3 niveaux de tests : le premier niveau est le happy path, le deuxième niveau correspond aux chemins d'erreur (une possibilité parmi une infinité), et le troisième niveau seulement concerne les Edge Cases extraits de manière exhaustive par du fuzzing ou des tests de collision. D'un point de vue ingénierie, le chemin nominal peut être testé à 100 %, et pour les chemins d'erreur, on peut choisir 1 variante parmi n dans une catégorie donnée. Les tests de collision sont purement une question de temps et n'en valent la plupart du temps pas la peine ; lorsque votre volume d'utilisateurs augmentera vraiment, vous saurez vous-même quand il faudra le faire. En général, je ne le fais jamais."
