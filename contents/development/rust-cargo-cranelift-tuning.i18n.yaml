  ff317262076663bb2d98caaad83893c9:
    de-DE:
      text: Das ist jedoch nicht unlösbar; man kann tatsächlich mit `cfg` das Backend auswählen und im Cranelift‑Modus `ring` an den Compiler übergeben. Nachdem man die dev‑ und release‑Profile wie oben beschrieben konfiguriert hat, kann man einfach einen CLI‑Kompilierungsvergleich durchführen. In diesem Fall ist die Entwicklung mindestens dreimal so schnell wie das Release, selbst bei Kaltkompilierung ohne inkrementelle Builds; und bei Verwendung von O0 und deaktiviertem LTO sollte das dev‑Profil bei nachfolgenden inkrementellen Updates um ein Vielfaches schneller sein als das Release. Da LTO‑artige Magie tatsächlich durch das Flachlegen der Grenzen einzelner Crates entsteht, wird beim Zusammenführen alles zu einer Einheit, und eine Codeänderung zwingt die komplette Rekompilierung, wodurch korrekte inkrementelle Updates verhindert werden.
      provider: openai
      model: gpt-oss-120b-medium
      at: 2026-08-01T02:20:21.165883Z
      seconds: 16.634642666
      tokens: 18823
      review: false
    en-US:
      text: However, this is not unsolvable; you can actually select the backend with `cfg` and, in Cranelift mode, pass `ring` to the compiler. After configuring the dev and release profiles as described above, you can simply run a CLI compilation comparison. In this case, development is at least three times faster than release, even with cold compilation and no incremental builds; and using O0 and disabling LTO, the dev profile should be dozens of times faster than release in subsequent incremental updates. Because LTO‑type magic actually works by flattening the boundaries of each crate, once everything becomes a single unit, changing a piece of code forces the entire project to be recompiled, preventing proper incremental updates.
      provider: openai
      model: gpt-oss-120b-medium
      at: 2026-08-01T02:20:21.165883Z
      seconds: 16.634642666
      tokens: 18823
      review: false
    es-ES:
      text: Sin embargo, no es insoluble; en realidad puedes usar `cfg` para seleccionar el backend y, en modo Cranelift, pasar `ring` al compilador. Después de configurar los perfiles dev y release como se describió anteriormente, basta con ejecutar una comparación de compilación con la CLI. En este caso, el desarrollo es al menos tres veces más rápido que la publicación, incluso con compilación en frío y sin compilación incremental; y usando O0 y desactivando LTO, el perfil dev debería ser decenas de veces más rápido que release en actualizaciones incrementales posteriores. Porque la magia del tipo LTO en realidad se logra aplanando los límites de cada crate; una vez que todo se convierte en una única unidad, cambiar una línea de código obliga a recompilar todo, lo que impide una actualización incremental adecuada.
      provider: openai
      model: gpt-oss-120b-medium
      at: 2026-08-01T02:20:21.165883Z
      seconds: 16.634642666
      tokens: 18823
      review: false
    fr-FR:
      text: Cependant, ce n’est pas insoluble ; on peut effectivement sélectionner le backend avec `cfg` et, en mode Cranelift, passer `ring` au compilateur. Après avoir configuré les profils dev et release comme indiqué ci‑dessus, il suffit d’exécuter une comparaison de compilation via la CLI. Dans ce cas, le profil de développement est au moins trois fois plus rapide que le profil de publication, même en compilation à froid sans incrémentalité ; et en utilisant O0 et en désactivant LTO, le profil dev devrait être des dizaines de fois plus rapide que le release lors des mises à jour incrémentielles ultérieures. En effet, la « magie » du type LTO consiste essentiellement à aplatir les frontières entre les crates ; une fois que tout se fusionne en une seule unité, modifier une ligne de code oblige à recompiler tout le projet, empêchant ainsi une mise à jour incrémentielle correcte.
