    ko-KR:
      text: Rust 설계에서 LLVM을 고른 건 사실 좀 게으른 선택이지만, 동시에 아주 잘한 선택이기도 합니다. Go처럼 기계어까지 가는 과정을 직접 떠안지 않고, 성숙한 최적화를 LLVM이라는 거대한 생태계에 맡긴다는 건 정말 좋은 방식이죠. Rust의 전체 컴파일 흐름은 대략 이렇습니다. 소스 코드가 먼저 어휘 분석과 구문 분석을 거쳐 AST가 되고, 이어서 매크로 확장과 HIR로의 하향 변환을 거치며 평탄해집니다! 그다음 일반적인 타입 검사와 :tn[억 점만큼의]{is="원문은 “亿点点”으로, ‘아주 조금’을 뜻하는 “一点点”의 “一”(하나)을 “亿”(억)으로 바꿔 쓴 말장난입니다. 터무니없이 큰 단위를 붙여 빌림 검사가 결코 ‘조금’이 아니라는 걸 비꼽니다."} 빌림 검사를 지나 최종적으로 MIR이 만들어집니다. 여기까지는 전부 Rust 컴파일러 자신의 프런트엔드가 하는 일입니다. MIR 이후는 LLVM에게 넘어갑니다. MIR을 LLVM IR로 번역하고, LLVM이 그 최적화 pass들을 한 바퀴 돌린 다음(O0에서 O3까지 다양합니다), 마지막으로 대상 플랫폼의 기계어를 만들어 링커에게 넘겨 BIN 실행 파일로 이어 붙이는 거죠.
