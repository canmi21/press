      review: false
    ja-JP:
      text: とはいえ、この問題にも解決策はあります。`cfg` でバックエンドを選択し、Cranelift モードでは `ring` を指定してコンパイルすればよいのです。前述のとおり開発用とリリース用のプロファイルを設定してから CLI のコンパイル時間を簡単に比較すると、この条件では開発ビルドがリリースビルドより少なくとも3倍高速になります。しかも、これは増分コンパイルを使わないコールドビルドでの結果です。さらに、最適化レベルを O0 にしてリンク時最適化を無効にすれば、以後の増分更新では開発用プロファイルがリリース用プロファイルより数十倍以上高速になるはずです。リンク時最適化などの仕組みは、実質的に各パッケージ間の境界を平坦化することで成り立っているため、すべてが一体化すると、一か所のコードを変更しただけでも全体を再コンパイルする必要が生じ、増分更新が正しく機能しなくなります。
