    zh-TW:
      text: 那麼，好的程式碼就應該用測試涵蓋一類成功路徑和至少一種錯誤路徑。這一類錯誤路徑只要涵蓋一個案例，就足以測試錯誤是否會以 Err 回傳，進而編寫備援邏輯，並自然地透過 `thiserror` 列舉，或用 `anyhow` 攔截、扁平化、列印和記錄。總之，你的程式碼會迫使你建立處理這些情況的機制。做到這一層後，`panic` 對你就沒有用了，可以將其理解為「理論上不可能」，但也僅僅是理論上。現實世界中還有作業系統錯誤、記憶體錯誤、宇宙射線單電子造成的位元翻轉、各種奇怪的溢位……你永遠不可能涵蓋所有這類情況。那麼，為什麼不要觸發恐慌呢？因為這些情況很可能——有 90% 的機率——並不是你的程式碼造成的。`panic` 的本質在於，發生時 Rust 會沿著呼叫堆疊逐層返回，依次呼叫每個堆疊框架中的解構函式（drop）來清理資源。這個過程需要編譯器產生額外的 `unwind` 表格，用來找出商業邏輯中的錯誤。如果錯誤本身很可能並非源自你的程式碼，這些資訊又有什麼價值？保留它還會增加編譯產物的大小，並加重連結器的工作量，因此關掉才是正確選擇。如果程式碼測試充分，而且你有足夠的信心，建議設定 `panic = abort`。
