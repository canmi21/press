      text: 'En la lógica de negocio normal, `panic` no debería existir. Cuando el código de negocio normal encuentra un error en runtime, cualquier Err diseñado para la tolerancia a fallos debería devolverse de forma segura en lugar de hacer un panic de manera violenta. Al igual que un ErrorBoundary de React, debería tratarse normalmente como un error; un panic solo debería activarse cuando el código tenga la firme certeza de haber entrado en un estado imposible e irrecuperable. Mi filosofía personal es renunciar al panic, ¿por qué? Porque, en la práctica, el código de negocio se puede dividir en 3 capas de pruebas: la primera capa es el happy path, la segunda capa son las rutas de error (una entre infinitas posibilidades) y la tercera capa son los Edge Cases obtenidos exhaustivamente mediante fuzzing o pruebas de colisión. Desde el punto de vista de la ingeniería, la ruta correcta se puede probar al 100 %, y para las rutas de error basta con tomar 1 opción entre n variantes de una categoría. Las pruebas de colisión son puramente una cuestión de tiempo y la mayoría de las veces no valen la pena; cuando tu volumen de usuarios realmente crezca, sabrás por ti mismo cuándo es necesario hacerlo. Por lo general, yo nunca lo hago.'
