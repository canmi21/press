    ko-KR:
      text: LTO(Link‑Time Optimization)는 메모리와 컴파일 성능을 많이 잡아먹는 또 다른 요소이며, 대부분의 프로젝트에서 Release 빌드 시 활성화하는 것이 권장됩니다. 일반 컴파일에서는 각 crate가 독립적으로 최적화되고, 컴파일러 백엔드는 crate 간 호출 관계를 알 수 없으므로 일부 크로스‑crate 인라인 및 죽은 코드 제거가 불가능한데, 이런 경우가 매우 많습니다. LTO는 링크 단계에서 모든 crate의 IR을 받아 이 경계를 깨고 전역 최적화를 수행합니다. 하지만 프로파일에 무분별하게 `lto = true`을 붙이는 것은 절대 금물입니다. 그렇게 하면 Rust 컴파일 속도가 너무 느려져 인생을 회의하게 되니, Release 프로파일을 사용할 때만 붙이도록 하세요.
