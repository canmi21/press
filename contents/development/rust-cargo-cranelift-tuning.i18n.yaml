    de-DE:
      text: 'Im Gegensatz dazu ist das unten stehende CLI-Paket nicht besonders geeignet. Viele Abhängigkeiten sind zwar kein Problem – theoretisch spiegelt dies eine höhere Effizienz wider –, aber hier gibt es eine klassische Entweder-Oder-Entscheidung. Man kann oben links sehen, dass die Abhängigkeit `ring` als optional markiert ist; das liegt daran, dass das Projekt ursprünglich `aws-lc-rs` verwendet hat. Beide dieser Dinge sind Verschlüsselungsalgorithmus-Backends in Rust. Warum sollte es jedoch optional sein? Das liegt daran, dass `ring` in reinem Rust geschrieben ist, während das andere über Asm-Assembler-FFI eingebunden ist und speziell für die Assembler-Beschleunigung auf gängigen cpu-Architekturen wie x86 und arm64 entwickelt wurde. Doch genau hier liegt der Haken: Die Magie von Cranelift beschränkt sich rein auf reines Rust. Sobald man Unsafe Code oder FFI C, ASM und Ähnliches einführt, wird die Kompatibilität von Cranelift in der Praxis extrem schlecht.'
