    ja-JP:
      text: 通常のビジネスロジックにおいて、`panic` は存在するべきではありません。通常のビジネスコードが runtime でエラーに遭遇した際、耐障害性が設計された Err であれば安全に返されるべきであり、強引に panic させるべきではありません。React ErrorBoundary と同様に、通常の異常として処理されるべきです。panic は、コードが絶対にあり得ない状態に陥り、復旧不可能であると確信したときにのみトリガーされるべきです。私個人の哲学としては panic を放棄することですが、なぜでしょうか？実際にはビジネスコードは 3 層のテストとして捉えることができるからです。第 1 層は happy path、第 2 層はエラーパス（無限の可能性の中のどれか 1 つ）、第 3 層になって初めて fuzz や衝突テストによって網羅された Edge Case となります。工学的に言えば、正常パスは 100% のテストが可能であり、エラーパスは 1 つのカテゴリ内の n 種類のバリエーションから 1 つを選べば十分です。衝突テストは純粋に時間の問題であり、ほとんどの場合はかける価値がありません。ユーザー規模が実際に拡大したとき、実施すべきタイミングは自然とわかるはずです。通常、私は一切行いません。
