      text: Seit langem hielten wir das für einen Nachteil von Rust, doch in Wirklichkeit lassen sich die beiden erstgenannten Probleme durch das Training von Denken und Wahrnehmung lösen. Die langsame Kompilierungsgeschwindigkeit dagegen verlangsamt meinen Arbeitsablauf konstant. Vor ein paar Jahren schien das noch in Ordnung zu sein; bevor KI aufkam, hatte ich Geduld und konnte Algorithmen oder Features bis in die frühen Morgenstunden schreiben. Und jetzt? Ich kann kaum behaupten, dass ich mich nicht verändert habe – ich bin völlig ungeduldig geworden, will nicht darüber nachdenken, wie man Rust‑Code schreibt, und kann den langen Fortschrittsbalken von Cargo nicht abwarten, besonders weil im ld‑Schritt keinerlei Fortschritt angezeigt wird und alles stehen bleibt. Das ist wirklich ärgerlich.
