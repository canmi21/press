    zh-CN:
      text: 我本人是一个 :tn[MUSL 狂热爱好者]{is="原词“厨”来自日语网络用语，指对某对象异常热衷的拥趸；这里带有自嘲意味。"}，非常讨厌 GNU glibc，但开发时我还是推荐你使用 `x86_64-unknown-linux-gnu`。为什么呢？因为它快。MUSL 最大的卖点是能生成完全静态链接的二进制文件——不依赖系统上的任何动态库，编译出来的东西拷到任何 Linux 机器上都能运行，特别适合容器和嵌入式系统；但它慢也慢在静态链接，因为链接器需要把所有东西都打包进去，链接阶段的工作量比动态链接大不少。
