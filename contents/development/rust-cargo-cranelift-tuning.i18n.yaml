      text: Eine weitere häufig übersehene, aber anpassbare Einstellung ist `opt-level`. Standardmäßig sollte sie auf "3" stehen, bei Release-Builds wird sie jedoch üblicherweise auf "z" gesetzt. Dadurch lässt sich die Größe des Artefakts ohne jede Codeänderung kostenlos reduzieren – warum also nicht? Im Entwicklungsmodus sollte sie hingegen auf "0" stehen, da vollständig deaktivierte Optimierungen die schnellsten Builds ermöglichen.
