    en-US:
      text: 'I''m a :tn[card-carrying MUSL fanboy]{is="The original says “MUSL 厨”. The suffix 厨, borrowed from Japanese internet slang into Chinese, marks someone as an obsessive fan of a thing, and the author is using it on themselves with a wry, self-mocking edge."} who can''t stand GNU glibc, but for development I''d still recommend `x86_64-unknown-linux-gnu`. Why? Because it''s fast. MUSL''s biggest selling point is that it can produce fully statically linked binaries — nothing on the system''s dynamic libraries, so you copy the built artifact to any Linux machine and it just runs, which is perfect for containers and embedded work. But the slowness comes from that same static linking: the linker has to pack everything in, so the link stage is a lot more work than dynamic linking.'
      provider: anthropic
