    fr-FR:
      text: En réalité, la présence d’UPX résout ce problème. Le principe d’UPX consiste à compresser votre binaire et à y ajouter un stub de décompression ; au moment de l’exécution, il est d’abord décompressé en mémoire puis lancé, ce qui permet de réduire la taille du binaire à environ 30 %–50 % de l’original, rendant l’avantage de taille très manifeste. Mais c’est précisément à cause de cela que l’association UPX + GNU glibc en liaison dynamique pose de gros problèmes, car les binaires liés dynamiquement avec glibc contiennent des sections spéciales et un mécanisme de chargement dynamique. Après compression par UPX, ces structures peuvent être endommagées, entraînant l’impossibilité de trouver les bibliothèques dynamiques à l’exécution `segment fault`. En revanche, musl convient très bien à UPX ; il est totalement statique, stable en interne, et la décompression ainsi que la recompression après UPX sont propres. Ainsi ajouter une étape UPX supplémentaire dans le CI de release de musl est un véritable atout.
      provider: openai
