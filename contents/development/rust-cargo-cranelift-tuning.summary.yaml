    text: Ausgehend davon, dass Cargo-Kompilierung und ld-Linking den Rust-Entwicklungszyklus ausbremsen, wird gefragt, wie sich Rückmeldegeschwindigkeit im dev-Betrieb mit Performance und Größe im release-Betrieb vereinbaren lässt. Verglichen werden LLVM, Cranelift sowie die Konfiguration von codegen-units, opt-level, LTO, strip und panic; ebenso werden die Grenzen von GNU ld, zig und stumpfem UPX-Einsatz betrachtet. Die Messungen beziehen zudem FFI, glibc/musl, Cross-Compilation, Apple Silicon und CI-Kompatibilität ein.
