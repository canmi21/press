    text: 'SeamJS'' V1 behandelte den React-Compiler als Blackbox und erriet die Seitenstruktur durch wiederholtes render + diff; bei Prädikaten wie price > 10 blieb dem Nutzer nur, Mocks von Hand zu schreiben, womit auch die Aufzählung über das kartesische Produkt hinfällig wurde. Dieser Eintrag hält den Entscheidungsprozess fest, den UI stack auf Svelte umzustellen: Er wägt der Reihe nach die Ökosystem-Sackgassen von React mit TanStack Start, Vue 3 mit Nuxt und SolidJS ab, grenzt sich gegenüber Astro islands, Qwik resume und Marko 6 in der Frage ab, ob zur request-time noch ein Renderer läuft, erklärt die Abwägungen zwischen markup AST, runes, <style> und CSS-in-JS und nennt zum Schluss das Kriterium für die CTR-Grenze sowie die Roadmap.'
