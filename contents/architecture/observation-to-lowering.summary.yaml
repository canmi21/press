  fr-FR:
    text: 'La V1 de SeamJS traitait le compilateur React comme une boîte noire : elle enchaînait render + diff pour deviner la structure de la page, et dès qu''un prédicat du type price > 10 apparaissait, il ne restait qu''à faire écrire des mocks à la main par l''utilisateur, ce qui invalidait du même coup l''énumération par produit cartésien. Ce compte rendu retrace le cheminement de la décision de passer l''UI stack à Svelte : il soupèse une à une les impasses d''écosystème de React avec TanStack Start, de Vue 3 avec Nuxt et de SolidJS, délimite aussi le désaccord avec les islands d''Astro, la resume de Qwik et Marko 6 sur la question de savoir si un renderer tourne encore au request-time, puis explique les arbitrages entre AST du markup, runes, <style> et CSS-in-JS, et donne enfin les critères de décision de la frontière CTR ainsi que la roadmap.'
