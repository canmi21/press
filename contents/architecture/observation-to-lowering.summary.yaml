  es-ES:
    text: 'La V1 de SeamJS trataba el compilador de React como una caja negra y adivinaba la estructura de la página a base de render + diff repetidos; al toparse con predicados como price > 10 no quedaba más remedio que hacer que el usuario escribiera mocks a mano, y con ello el recorrido exhaustivo del producto cartesiano también dejaba de funcionar. Esta nota recoge el proceso de la decisión de cambiar el UI stack a Svelte: sopesa una a una las dificultades de ecosistema de React con TanStack Start, Vue 3 con Nuxt y SolidJS, delimita también las diferencias con Astro islands, Qwik resume y Marko 6 en cuanto a si en request-time se sigue ejecutando el renderer, y explica las disyuntivas entre markup AST, runes, <style> y CSS-in-JS, para terminar dando el criterio de decisión del límite de CTR y el roadmap.'
