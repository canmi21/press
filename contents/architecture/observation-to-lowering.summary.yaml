  de-DE:
    text: 'SeamJS'' V1 behandelte den React-Compiler als Blackbox und erriet die Seitenstruktur über wiederholtes render + diff; bei Prädikaten wie price > 10 blieb nur, den Nutzer den Mock von Hand schreiben zu lassen, womit auch die Enumeration über das kartesische Produkt hinfällig wurde. Diese Aufzeichnung hält den Entscheidungsweg fest, den UI stack auf Svelte umzustellen: Sie wägt die ökosystembedingten Sackgassen von React mit TanStack Start, Vue 3 mit Nuxt und SolidJS einzeln ab, zieht außerdem die Trennlinie zu Astro islands, Qwik resume und Marko 6 in der Frage, ob zur request-time noch ein renderer läuft, erklärt die Abwägungen zwischen markup AST, runes, <style> und CSS-in-JS und nennt zum Schluss die Kriterien für die CTR-Grenze sowie die roadmap.'
