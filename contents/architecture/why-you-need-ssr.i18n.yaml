  f3f1a5c7f238e27ffe47cb3cb275008a:
    de-DE:
      text: Ein Gerüstartikel, der noch nichts zu sagen hat. Er existiert, damit sich die Gestalt eines neuen Eintrags unter architecture schon gerendert betrachten lässt, bevor auch nur eines seiner Worte feststeht.
      provider: anthropic
      model: claude-haiku-4-5
      at: 2026-09-11T07:58:06.519879Z
      seconds: 11.225617542
      tokens: 34526
      review: false
    en-US:
      text: A scaffold article with nothing to say yet. It exists so that the shape of a new entry under architecture can be seen rendering before any of its words are decided.
      provider: anthropic
      model: claude-haiku-4-5
      at: 2026-09-11T07:58:06.519879Z
      seconds: 11.225617542
      tokens: 34526
      review: false
    es-ES:
      text: Un artículo de andamiaje que todavía no tiene nada que decir. Existe para que la forma de una nueva entrada en architecture pueda verse renderizada antes de que se decida ninguna de sus palabras.
      provider: anthropic
      model: claude-haiku-4-5
      at: 2026-09-11T07:58:06.519879Z
      seconds: 11.225617542
      tokens: 34526
      review: false
    fr-FR:
      text: Un article d'échafaudage qui n'a encore rien à dire. Il existe pour que la forme d'une nouvelle entrée sous architecture puisse être vue au rendu avant qu'aucun de ses mots ne soit arrêté.
      provider: anthropic
      model: claude-haiku-4-5
      at: 2026-09-11T07:58:06.519879Z
      seconds: 11.225617542
      tokens: 34526
      review: false
    ja-JP:
      text: まだ語ることのない足場だけの記事。architecture 配下に新しく置かれる項目の姿が、言葉が一つも決まらないうちにどう描画されるかを見るために存在している。
      provider: anthropic
      model: claude-haiku-4-5
      at: 2026-09-11T07:58:06.519879Z
      seconds: 11.225617542
      tokens: 34526
      review: false
    ko-KR:
      text: 아직 할 말이 없는 뼈대만의 글이다. architecture 아래 새로 들어설 항목의 모습이 어떻게 렌더링되는지, 문장이 하나도 정해지기 전에 미리 보기 위해 존재한다.
      provider: anthropic
      model: claude-haiku-4-5
      at: 2026-09-11T07:58:06.519879Z
      seconds: 11.225617542
      tokens: 34526
      review: false
    zh-CN:
