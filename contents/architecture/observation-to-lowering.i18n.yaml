      text: 'Was Vue angeht: Als ich selbst von Vue 2 auf Vue 3 umgestiegen bin, konnte ich mich mit der Syntax und diesen Mechanismen nicht mehr anfreunden; das Vue in meinem Kopf bleibt für immer Vue 2. Unbestreitbar hat Vue 3 viele großartige `feature`, aber verglichen mit Vue 2 fühlt sich sein Kern für mich verändert an – und zwar gewaltig. Und aus geschäftlicher Sicht: Wird `Vue` nicht immer vollständiger an die Meta-Ebene gekettet und vom Ökosystem kontrolliert? Die Lage wirkt der von `Svelte` sehr ähnlich, beide Open Source, aber es kann praktisch kaum ein Dritter auftreten und dir eine zweite Implementierung bauen. Genau deshalb hat das Durchmischen der Karten durch **TanStack Start** **Next.js** wirklich hart getroffen; ein Lob an [Tanner Linsley](https://x.com/tannerlinsley). Es gibt noch einen weiteren, nicht zu übersehenden Punkt bei `Vue`: Das frühe `Vue` war tatsächlich eine Erneuerung, aber jeder **UI Stack** bekommt Ökosystemprobleme, sobald das Ökosystem wächst – ~~also gewisse Kompromisse um der Kompatibilität willen?~~ Besonders bei `React` ist das wirklich sehr deutlich, und das heutige `Vue` bildet da keine Ausnahme. Wenn solche:fn[Inhalte]{is="lassen sich hier am Kompatibilitätslayer aus Options API + Component Instance Proxy zeigen, meiner Meinung nach eines der schönsten Designs des frühen Vue – zumindest 2016 ließ es das Framework nicht wie ein Framework aussehen. Im Zeitalter von TS + Composition API ist der Preis aber offensichtlich: Neue Projekte greifen nicht mehr darauf zurück, und trotzdem lässt es sich, weil es ein früher Erfolgsentwurf war, nicht wirklich vollständig abwerfen"} auftauchen, stufe ich das in der Regel als **Slop** ein, ~~schlecht nennen kann man es aber auch nicht~~, denn sobald Nuxt zum nächsten „Enterprise-Framework“ wird, zählt zuerst nicht mehr, ob etwas technisch richtig oder elegant ist, sondern eine gewisse Rückwärtskompatibilität plus Stabilität (x'
