      text: 'Hier ist die erste Zeile im Skeleton zum Beispiel unstrittig, aber erst die zweite Zeile zeigt, wo Svelte wirklich stark ist: `class:` / `style:` lassen den Namen `attr` im **AST** stehen, nur der Wert wird für sich genommen zu `slot`, und man muss nicht das ganze `element` als dynamisch abstempeln. Die dritte Zeile unterscheidet sich nicht grundsätzlich von `{...props}` in **React**, Seam behandelt sie einfach als ausdrückliches `hatch` und muss nicht länger so tun, als würde es sie analysieren; in **React** muss man das literale `className="card"` eigentlich auch nicht durchzählen. Durchzählen muss man nur: "ändert sich dieses attr, wenn ein anderer Satz Props kommt". :spoiler[Genau diese letzte Art von Raterei fällt bei Svelte weg – solange der Name im Baum steht, muss man nicht zweimal rendern, um es zu wissen 🫠]'
