    fr-FR:
      text: Bien sûr, `skeleton` doit lui-même être :fn[`parse-stable`]{is="c’est-à-dire d’analyse stable, ou encore reproductible à l’analyse"} ; fourrer n’importe comment des `comment` dans `table`, c’est une implémentation mal faite, et ça ne se met pas sur le dos de mon modèle. Au **build-time** on calcule la table d’hydratation (qui est statique, qui est `slot`, ce qui est lié), on ne fige pas les données à l’avance ; en revanche le type de données de ce `slot`, lui, est bel et bien figé. Les valeurs elles-mêmes restent librement interchangeables au **request-time** ; simplement, `HTML` et `payload` doivent être une seule et même chose.
      provider: anthropic
