  adf911802d2879568b442025919176e3:
    de-DE:
      text: 'Das Framework **SolidJS** ist gut, und sein Kern ist stabil genug, ~~aber niemand will ein Ökosystem dafür schreiben~~. `Solid` ist im Grunde das `Rust` von früher, nur hat `Rust` es durchgestanden; `Rust` steckt im Programmierbereich in derselben Lage, wo es kaum ein Ökosystem gibt und man jedes Rad selbst neu erfinden muss, aber die Toolchain von `Rust` lässt dich dieses Rad reibungslos bauen und die kleinste lauffähige Einheit zum Laufen bringen – so schwer ist der Radbau also gar nicht? Leider hat **SolidJS** diese Phase noch nicht überstanden und ist stattdessen in den **KI-Winter** geraten; ab 26 wird es besonders schwierig. Der Kern von Solid 2.0 ist bereits sehr gut und sehr stabil, aber drumherum kam nichts ins Rollen. Die Idee stimmt völlig, nur kam sie zur falschen Zeit. Und selbst die wenigen Dinge im Umfeld existieren nur in ein, zwei verstreuten Bereichen ~~(TanStack hat zum Beispiel einen experimentellen Solid-Router)~~ und ergeben zusammen kein vollständiges Ökosystem. Das bringt es jetzt wie künftig in eine unangenehme Lage: kein vollständiges Ökosystem, und das in einer Zeit, in der die Agents explodieren. Solange der Schneeball nicht rollt, greifen Agents nicht zuerst danach, und wenn nicht einmal die KI es bevorzugt, heißt das noch weniger Gelegenheiten, Beiträge zu bekommen – erst recht in einer Zeit, in der sogar [Linus Torvalds](https://github.com/torvalds) anfängt, :tn[nach Gefühl zu coden]{is="Im Original steht der englische Slangbegriff „Vibe“, also vibe coding: die KI den Code schreiben lassen und selbst nur die Richtung vorgeben. Auf Linus gemünzt klingt das spöttisch nach „wenn sogar der …“."}. Ich finde es jammerschade um Solid: die Idee gut, die Technik richtig, die Umsetzung elegant – und doch einfach zur falschen Zeit geboren …'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:55:19.161754Z
      seconds: 69.623675583
      tokens: 33513
      review: false
    en-US:
      text: '**SolidJS** is a fine framework, and its core is stable enough, ~~but nobody wants to build an ecosystem for it~~. `Solid` is really just the early-days `Rust`, except `Rust` has already made it through; `Rust` in the programming world is likewise in a spot where the ecosystem is thin and you have to build every wheel yourself, but the `Rust` toolchain lets you build that wheel smoothly and get a minimal working unit running, so building wheels is not actually all that hard, is it? Unfortunately, **SolidJS** has not made it through that stage yet, and then it ran straight into the **AI winter**; it will get especially hard after 2026. The Solid 2.0 core is already very good and very stable, but the periphery never snowballed. The idea is exactly right, it just arrived at the wrong time; and the few peripheral pieces that do exist live in one or two scattered corners ~~(TanStack, for instance, has an experimental Router for Solid)~~ and cannot be assembled into a complete ecosystem. That leaves it in an awkward position now and in the future: no complete ecosystem, in an era where Agents are exploding; if the snowball has not started rolling, Agents will not pick it first, and if AI does not prefer it, that means fewer chances of getting contributions, especially in an age when even [Linus Torvalds](https://github.com/torvalds) has started :tn[vibe coding]{is="The original just says ‘Vibe’, shorthand for ‘vibe coding’: handing the actual writing of code over to an AI and going by feel. The joke is that even Linus Torvalds, famous for his hands-on, exacting standards, has given in to it."}. Solid feels like a real shame: the idea is good, the technology is correct, the implementation is elegant, but it truly is a pity that it was born at the wrong time...'
