    fr-FR:
      text: 'Il faut aussi mentionner Marko 6, qui est déjà très proche de ce que j''ai en tête (**AST** de template, granularité fine à la compilation, **reprise** plutôt que **rejeu**) ; mais par rapport à `Marko`, les vraies lignes de démarcation techniques sont surtout au nombre de deux : d''abord, `request-time` exécute toujours un artefact compilé en JS, toute la chaîne reste arrimée au runtime JS ; ~~ensuite, l''auteur écrit en Marko et non en Svelte~~. Je suis convaincu qu''en 2026, quand on parlera de front-end, la plupart des gens ne retiendront comme **stack UI** un tant soit peu répandue que `React`, `Vue`, `Svelte`, `Solid` ; si je n''en parlais pas, beaucoup ne sauraient même pas ce qu''est `Marko`. Donc, bâtir sur `Svelte` ne revient pas vraiment pour moi à « *recopier un principe et y coller un backend* » ; je préfère l''expliquer comme le fait d''emprunter une couche UI que quelqu''un a écrite, que des gens utilisent, dont quelqu''un corrige les bugs et qu''il peaufine sans cesse -- rien que des choses familières à tout le monde.'
