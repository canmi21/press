  3cf702a03bc1d3723e62d6b780d2bcf8:
    de-DE:
      text: 'Vor der Hydration kann sowieso niemand etwas bewegen, und dass es vor dem Start des JS im :fn[ersten Frame]{is="also dem ersten brauchbaren Bildinhalt, den der Browser nach dem Öffnen der Seite auf den Bildschirm zeichnet"} keine Animation gibt, ist von vornherein niemandes Schuld; `Seam` garantiert auch nur, dass `injection` stimmt, `document` stimmt und der Einstiegspunkt `client` stimmt. Die eigentliche Einschränkung liegt hier nach der Hydration: `client`-Navigation schiebt die Daten in genau den Graphen, der noch lebt ~~(Layout bleibt bestehen)~~, statt noch einmal `injection` zu durchlaufen und `document` auszutauschen. Kurz gesagt: **was Seam nach der Hydration übernimmt, ist derselbe statische Komponentengraph**.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:50:06.14568Z
      seconds: 29.55146875
      tokens: 30933
      review: false
    en-US:
      text: 'Either way, nobody can move before hydration; having no animation before :fn[first frame]{is="the first usable frame the browser paints on screen after the user opens the page"} JS comes up was never anyone''s fault to begin with. `Seam` only guarantees that `injection` is right, `document` is right, and the `client` entry point is right; the real constraint here comes after hydration: `client` navigation is done by pushing data into that still-living graph ~~(layout persists)~~, rather than going through `injection` once more to swap `document`. In short, **what Seam takes over after hydration is the same static component graph**.'
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:34:36.080057Z
      seconds: 10.264861
      tokens: 29556
      review: false
    es-ES:
      text: 'De todos modos, antes de la hidratación nadie puede mover nada, y que no haya animación en el :fn[primer fotograma]{is="es decir, el primer contenido de pantalla utilizable que el navegador dibuja una vez abierta la página"} antes de que arranque el JS no es culpa de nadie; `Seam` tampoco garantiza más que esto: que `injection` sea correcto, que `document` sea correcto y que el punto de entrada `client` sea correcto. La restricción de verdad está aquí después de la hidratación: la navegación `client` consiste en meter los datos en ese grafo que sigue vivo ~~(el layout persiste)~~, y no en volver a pasar por `injection` para cambiar `document`. En resumen, **lo que Seam retoma tras la hidratación es el mismo grafo estático de componentes**.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:50:06.14568Z
      seconds: 29.55146875
      tokens: 30933
      review: false
    fr-FR:
      text: 'De toute façon, personne ne peut rien bouger avant l''hydratation, et l''absence d''animation avant le démarrage du JS sur la :fn[première image]{is="soit le premier contenu d''écran exploitable que le navigateur dessine une fois la page ouverte"} n''est la faute de personne ; `Seam` ne garantit lui non plus que ceci : `injection` correct, `document` correct, point d''entrée `client` correct. La vraie contrainte se situe ici après l''hydratation : la navigation `client` consiste à injecter les données dans ce graphe toujours vivant ~~(la mise en page persiste)~~, et non à repasser par `injection` pour remplacer `document`. Bref, **ce que Seam reprend après l''hydratation, c''est le même graphe de composants statique**.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:50:06.14568Z
      seconds: 29.55146875
      tokens: 30933
