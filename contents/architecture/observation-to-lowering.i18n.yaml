  03ce682fb563e51bec90f519984a914e:
    de-DE:
      text: 'Bei strukturellen Verzweigungen ist es noch schlimmer: Schon die Frage, ob dieses Stück DOM überhaupt da ist, lässt sich nur klären, indem man zweimal rendert und dann `diff` macht. Und `IfBlock` von `Svelte` verwandelt genau diese zweite Sache von **beobachtbar** in **erzeugbar** -- das ist der eigentliche Sprung.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-30T06:49:53.626791Z
      seconds: 13.461294042
      tokens: 29390
      review: false
    en-US:
      text: 'Structural branches fare even worse: even "is this piece of DOM here or not" has to be answered by rendering twice and then `diff`, whereas `Svelte`''s `IfBlock` turns that latter question from **observable** into **generatable**, and that is the real qualitative leap.'
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:33:12.628815Z
      seconds: 7.122888625
      tokens: 28347
      review: false
    es-ES:
      text: 'Con las ramas estructurales es aún peor: hasta para saber si ese trozo de DOM está ahí o no hay que renderizar dos veces y luego hacer `diff`, mientras que `IfBlock` de `Svelte` convierte esa segunda cosa de **observable** en **generable**, y ahí está el salto cualitativo.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-30T06:49:53.626791Z
      seconds: 13.461294042
      tokens: 29390
      review: false
    fr-FR:
      text: 'Les branchements structurels, c''est encore pire : même savoir si ce bout de DOM est là ou non oblige à rendre deux fois puis à faire `diff`, alors que `IfBlock` de `Svelte` fait passer cette seconde chose de l''**observable** au **générable**, et c''est là le vrai saut qualitatif.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-30T06:49:53.626791Z
      seconds: 13.461294042
      tokens: 29390
      review: false
    ja-JP:
      text: 構造分岐はさらに悲惨で、「ここにこの DOM があるかどうか」ですら二回レンダリングしてから `diff` に頼るしかない。一方 `Svelte` の `IfBlock` は後者を**観測できる**ものから**生成できる**ものへと変えた。これこそが質的な飛躍だ。
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:33:12.628815Z
      seconds: 7.122888625
      tokens: 28347
      review: false
