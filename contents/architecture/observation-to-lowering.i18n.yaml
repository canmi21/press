      text: 'Etwa seit der zweiten Jahreshälfte habe ich diese Seite vollständig von `TanStack Start` **React** auf `SvelteKit` **Svelte** `port`. Nach der kompletten Migration stellte ich fest: Es ist wirklich gut. Der Performance-Aufwand von `ssr` ist um ungefähr eine Größenordnung gesunken, die Hydration kostet fast nichts, es läuft angenehm, und die Kompilier-Philosophie des Frameworks ist ebenfalls großartig und sehr leichtgewichtig. Beim Teil `Kit` gibt es aber immer wieder Stellen, die mich unbefriedigt zurücklassen. Das meiste davon lässt sich über Plugins lösen ~~schließlich ist es aus Vite zusammengesetzt~~, doch einige Teile lassen sich einfach nicht anfassen; das liegt allerdings mit hoher Wahrscheinlichkeit an mir, denn was seam ändern will, kollidiert vermutlich grundsätzlich mit jedem existierenden `meta`-Framework ~~im Kern fordere ich ihr Ausführungsmodell heraus (pro Request eine render-Funktion), ihre Datengrenze (load und UI ineinander verklebt) und ihre Backend-Fähigkeiten (fest an die JS-Runtime gebunden)~~.'
