  19a9ed32e724e931295aac69101af38b:
    de-DE:
      text: Natürlich muss `skeleton` selbst :fn[`parse-stable`]{is="bedeutet „stabil parsend“ beziehungsweise reproduzierbar im Parsen"} sein; wer wahllos `comment` in `table` stopft, hat die Implementierung schlecht gemacht — das geht nicht auf mein Modell. Zur **Build-time** wird die Hydrations-Zuordnung berechnet (was statisch ist, was `slot` ist, was gebunden wird), nicht die Daten vorab festgerechnet; wohl aber wird der Datentyp dieses `slot` damit festgenagelt. Die Datenwerte selbst lassen sich zur **request-time** weiterhin beliebig austauschen; nur müssen `HTML` und `payload` ein und dasselbe sein.
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:48:16.565567Z
      seconds: 27.423567291
      tokens: 30329
      review: false
    en-US:
      text: Of course `skeleton` itself has to be :fn[`parse-stable`]{is="meaning parse-stable, or reproducibly parseable"}; stuffing `comment` into `table` at random counts as an implementation that did not handle things properly, and should not be pinned on my model. **Build-time** computes the hydration mapping (what is static, what is a `slot`, what gets bound), not a premature freezing of the data, yet it does fix the data type of this `slot` for good. The data values themselves can still be swapped freely at **request-time**; it is just that `HTML` and `payload` must be the same copy.
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:33:39.157829Z
      seconds: 11.781876667
