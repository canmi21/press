  100c69a8537539160b56389a8f90e608:
    en-US:
      text: '`Wrapper = cond ? A : B` does not vanish into thin air here; rather, it is narrowed from "any JS expression" down to these few nodes, which makes things very simple for Seam: just follow the default of going through **AST lowering**; a hole that is statically visible belongs to whoever is inside it; the most common case is `{@render}` as `compose` (`layout`, and `Card` wrapping `children`, are all of this type), while `<svelte:component>` / `<svelte:element>` / dynamic `{@render}` are the explicit `hatch` and go into `runtime` or `SSR fallback`; and for `{@html}`, the `raw HTML slot` I designed directly can simply be reused.'
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:33:28.839905Z
      seconds: 10.316934833
      tokens: 28933
      review: false
    ja-JP:
      text: '`Wrapper = cond ? A : B` はここで何もなく消えたわけではなく、「任意の JS 式」からこれら数個のノードに絞り込まれたのであり、Seam にとっては非常に単純になる。デフォルトで **AST lowering** を通すという原則に従えばよく、静的に見える hole は、その中にあるものの所有となる。最もよくあるのは `{@render}` を `compose` として扱うケースで（`layout`、`Card` が `children` を包むものはすべてこの型）、`<svelte:component>` / `<svelte:element>` / 動的な `{@render}` こそが明確な `hatch` であり、`runtime` か `SSR fallback` に入る。また `{@html}` については、私が直接設計した `raw HTML slot` をそのまま流用できる。'
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:33:28.839905Z
      seconds: 10.316934833
      tokens: 28933
      review: false
