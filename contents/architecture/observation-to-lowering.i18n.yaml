    zh-CN:
      text: '**SolidJS** 这个框架很好，核心也足够稳定，~~但没人愿意为它写生态~~。`Solid` 其实就是当年的 `Rust`，只是 `Rust` 已经熬过来了；`Rust` 在编程领域同样面临生态稀少、什么都得自己造轮子的处境，但 `Rust` 的工具链能让你顺滑地把轮子造出来、让最小可用单元跑起来，造轮子的难度其实并不算大？可惜 **SolidJS** 还没熬过这个阶段，就撞上了 **AI 寒冬**；尤其是进入 26 年之后会变得非常艰难。Solid 2.0 的核心已经很好也很稳定，可外围始终没滚起来；想法非常对，只是生不逢时。就算有少数几个外围项目，也只散落在一两个方面 ~~（比如 TanStack 有一个实验性的 Solid Router）~~，拼不出一套完整生态。这让它在当下和未来都处在一个尴尬的位置：没有完整生态，而如今又是 Agent 爆炸的时代；雪球还没滚起来，Agent 就不会优先选它，而如果连 AI 都不偏好它，就意味着它得到贡献的机会更少——尤其是在连 [Linus Torvalds](https://github.com/torvalds) 都开始 :tn[凭感觉写代码]{is="原文写的是英文俚语「Vibe」，即 vibe coding：把活儿交给 AI，自己只把握大方向。用在 Linus 身上带着一种「连他都这样了」的调侃。"} 的年代。感觉 Solid 很遗憾，想法很好、技术很正确、实现很优雅，但真的很可惜，它生不逢时……'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:55:19.161754Z
      seconds: 69.623675583
      tokens: 33513
