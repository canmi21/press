      text: 바로 이것이 `Seam` 이 가장 필요로 하고 또 가장 좋아하는 것이다. `React` 안에서 `attributes` 가 `static` 인지 알아내려면 사실상 무차별 전수 조사밖에 없다. 가능한 입력을 전부 한 번씩 돌려보고, `attribute` 가 그대로면 `static` 이고, 바뀌면 거기에 `slot` 를 붙여 준다.
      provider: anthropic
