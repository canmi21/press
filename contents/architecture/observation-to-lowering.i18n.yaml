      text: 'So along that road, the one that lands right on the perfect balance point is really only **Svelte**. It has a better ecosystem than **SolidJS** ~~(a better birth year)~~, its performance is not far behind, and sometimes, thanks to its **Compiler**, it is often even faster and leaner than **SolidJS**?!   Of course someone here will surely say that once the number of pages climbs to a certain scale, or the more a user browses, Svelte''s :fn[resource overhead]{is="means the comparison between the Svelte philosophy, which scatters the framework into components so framework resources cannot be reused across them, and the framework runtime under the philosophy of Solid and others, where once the runtime is loaded each component costs only a little"} compared with SolidJS will keep growing? Network requests will keep multiplying? Well, in theory that is true, ~~but I think it has to be looked at against real websites: on 99.9% of personal or content sites, visitors basically do not stay long, and lingering a long time can even be considered a very **rare** case~~. At least on my site, deep click-throughs are currently very few, so "flipping through many pages = Svelte loses more" is not a problem for me. But that is not the reason for choosing Svelte; the real core is still the **markup AST**.'
