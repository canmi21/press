    es-ES:
      text: '**SolidJS** es un buen framework y su núcleo es lo bastante estable, ~~pero nadie quiere escribirle un ecosistema~~. `Solid` es en el fondo el `Rust` de antaño, solo que `Rust` sí logró aguantar; `Rust` vive también, en el terreno de la programación, esa situación de ecosistema escaso en la que hay que reinventar la rueda para todo, pero la cadena de herramientas de `Rust` te deja fabricar esa rueda con soltura y poner en marcha la unidad mínima viable, así que fabricarla no resulta tan difícil, ¿no? Por desgracia **SolidJS** aún no ha superado esta etapa y se ha topado con el **invierno de la IA**; sobre todo a partir del 26 se le va a poner muy cuesta arriba. El núcleo de Solid 2.0 ya es muy bueno y muy estable, pero la periferia nunca echó a rodar. La idea es acertadísima, solo que llegó a destiempo. Y aunque exista alguna pieza periférica suelta, se limita a uno o dos frentes dispersos ~~(TanStack, por ejemplo, tiene un router experimental para Solid)~~ y no llega a componer un ecosistema completo. Eso lo deja, hoy y en el futuro, en una posición incómoda: sin un ecosistema completo, y en plena explosión de los Agents. Mientras la bola de nieve no ruede, los Agents no lo elegirán primero, y si ni siquiera la IA lo prefiere, eso significa menos oportunidades de recibir contribuciones, y más aún en una época en la que hasta [Linus Torvalds](https://github.com/torvalds) se ha puesto a :tn[programar a ojo]{is="El original usa el término inglés de argot «Vibe», por vibe coding: dejar que la IA escriba el código y limitarse a marcar el rumbo. Aplicado a Linus suena a burla, en plan «hasta él lo hace ya»."}. Me da mucha pena Solid: buena idea, técnica correcta, implementación elegante, y aun así nació a destiempo…'
