      text: 'For instance, there is no dispute that the first line here goes into the skeleton, but the second line is where Svelte really shines: `class:` / `style:` keep the `attr` name in the **AST** while only the value becomes `slot`, so the whole `element` need not be marked dynamic. The third line is not fundamentally different from **React**''s `{...props}`; Seam just treats it as an explicit `hatch` and stops pretending to analyse it. In **React**, a literal `className="card"` does not really need enumerating either; what has to be enumerated is "will this attr change after a different set of props". :spoiler[That last kind of guesswork is exactly what Svelte does away with -- as long as the name is still on the tree, you don''t have to render twice to find out 🫠]'
