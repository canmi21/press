    es-ES:
      text: Por supuesto, `skeleton` tiene que ser :fn[`parse-stable`]{is="es decir, de análisis estable, o dicho de otro modo, reproducible al analizar"} él mismo; meter `comment` a lo loco dentro de `table` es una implementación mal hecha, y eso no se le carga a mi modelo. En **build-time** se calcula el mapeo de hidratación (qué es estático, qué es `slot`, qué se enlaza), no se dejan los datos calculados de antemano; lo que sí queda fijado es el tipo de datos de ese `slot`. Los valores en sí se pueden cambiar libremente en **request-time**; solo que `HTML` y `payload` tienen que ser uno y el mismo.
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:48:16.565567Z
