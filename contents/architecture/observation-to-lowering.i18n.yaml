    ko-KR:
      text: '**SolidJS**라는 프레임워크는 좋고 코어도 충분히 안정적이다, ~~다만 아무도 그 생태계를 만들어 주려 하지 않는다~~. `Solid`은 사실 예전의 `Rust`과 같은 처지인데, `Rust`는 그 시기를 버텨냈다. `Rust` 역시 프로그래밍 영역에서 생태계가 빈약해 뭐든 직접 바퀴를 만들어야 하는 상황에 놓여 있지만, `Rust`의 툴체인은 그 바퀴를 매끄럽게 만들어 최소 동작 단위를 굴러가게 해 주니, 바퀴를 만드는 난이도가 사실 그리 높지는 않은 것 아닐까? 불행히도 **SolidJS**는 아직 이 단계를 버텨내지 못한 채 **AI 겨울**을 맞았다. 특히 26년 이후에는 매우 힘들어질 것이다. Solid 2.0의 코어는 이미 훌륭하고 안정적이지만 주변부가 끝내 굴러가지 않았다. 발상은 아주 옳았고, 다만 때를 잘못 만났을 뿐이다. 몇 안 되는 주변부가 있다 해도 한두 갈래에 흩어져 있을 뿐이라 ~~(예를 들어 TanStack에는 실험적인 Solid 라우터가 있다)~~ 온전한 생태계로는 이어지지 않는다. 그래서 지금도, 앞으로도 어정쩡한 위치에 놓인다. 완전한 생태계가 없는데, 지금은 Agent가 폭발하는 시대다. 눈덩이가 구르기 시작하지 않으면 Agent는 그것을 먼저 고르지 않고, AI조차 선호하지 않는다면 기여를 받을 기회는 그만큼 줄어든다. 심지어 [Linus Torvalds](https://github.com/torvalds)마저 :tn[감으로 코딩하기]{is="원문은 영어 속어 「Vibe」, 즉 vibe coding입니다. 코드는 AI에게 맡기고 사람은 방향만 잡는 방식으로, 리누스에게 붙이면 「저 사람마저」라는 농담조가 됩니다."} 시작한 시대에는 더욱 그렇다. Solid가 참 아쉽다. 발상도 좋고, 기술도 옳고, 구현도 우아한데, 정말이지 때를 잘못 타고난 것이 안타깝다…'
      provider: anthropic
