  090d668ffe73c3e2f350781f1ad21ef0:
    de-DE:
      text: 'Da wäre eigentlich noch Marko 6, das meiner Vorstellung schon sehr nahekommt (Template-**AST**, feingranular zur Compilezeit, **resume** statt **replay**); aber gegenüber `Marko` lassen sich technisch vor allem zwei Linien ziehen: zum einen läuft bei `request-time` nach wie vor ein JS-Kompilat, die ganze Kette hängt fest an der JS-Runtime; ~~zum anderen schreibt der Autor eben in Marko und nicht in Svelte~~. Ich glaube, die meisten Leute werden 2026 im Gespräch über Frontend ohnehin nur `React`, `Vue`, `Svelte`, `Solid` als einigermaßen verbreiteten **UI Stack** in Betracht ziehen; wenn ich es nicht sagen würde, wüssten viele vermutlich nicht einmal, was `Marko` überhaupt ist. Auf `Svelte` aufzubauen heißt für mich also nicht, „*das Prinzip zu kopieren und ein Backend dranzuhängen*“; ich erkläre es lieber so: Ich borge mir eine UI, die jemand geschrieben hat, die Leute benutzen, an der ständig Bugs behoben und Kanten geglättet werden -- alles Dinge, die allen vertraut sind.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-30T06:50:06.701869Z
      seconds: 37.839173708
      tokens: 31938
      review: false
    en-US:
      text: 'There is also Marko 6, which is already quite close to what I have in mind (template **AST**, compile-time fine-grained updates, **resume** rather than **replay**); but compared with `Marko`, the technical lines that can still be drawn between them come down to two: one is that `request-time` still runs JS compiler output, with the whole chain tied to the JS runtime; ~~the other is that the author''s language is Marko, not Svelte~~. I believe that when most people talk about the frontend in 2026, they will only count `React`, `Vue`, `Svelte` and `Solid` as the mainstream **UI Stack**; if I did not bring it up, many people might not even know what `Marko` is. So building on `Svelte`, I am not really "*copying the principles and bolting on a backend*"; I prefer to describe it as borrowing a UI that someone writes, someone uses, and someone keeps fixing bugs in and polishing, all of it material everyone already knows.'
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:33:19.75261Z
      seconds: 15.001302625
      tokens: 29460
      review: false
    es-ES:
      text: 'También está Marko 6, que ya se acerca bastante a lo que tengo en la cabeza (**AST** de plantilla, granularidad fina en tiempo de compilación, **resume** en vez de **replay**); pero frente a `Marko` las líneas que aún se pueden trazar técnicamente son básicamente dos: una, que `request-time` sigue ejecutando un artefacto compilado a JS y toda la cadena queda atada al runtime de JS; ~~y otra, que el autor escribe en Marko y no en Svelte~~. Estoy convencido de que, en 2026, la mayoría de la gente que habla de frontend solo considerará `React`, `Vue`, `Svelte`, `Solid` como **UI Stack** medianamente mayoritaria; si yo no lo mencionara, muchos ni siquiera sabrían qué es `Marko`. Así que construir sobre `Svelte` no es exactamente «*copiar el principio y añadirle un backend*»: prefiero explicarlo como tomar prestada una UI que alguien ha escrito, que la gente usa y a la que otros le corrigen bugs y le sacan brillo sin parar; todo cosas que ya nos resultan familiares.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-30T06:50:06.701869Z
      seconds: 37.839173708
      tokens: 31938
      review: false
    fr-FR:
      text: 'Il y a aussi Marko 6, qui se rapproche déjà beaucoup de ce que j''ai en tête (**AST** de template, granularité fine à la compilation, **resume** plutôt que **replay**) ; mais face à `Marko`, on peut encore tracer deux lignes techniques : d''une part `request-time` exécute toujours un produit de compilation JS, toute la chaîne reste soudée au runtime JS ; ~~d''autre part l''auteur écrit en Marko, pas en Svelte~~. Je suis convaincu qu''en 2026 la plupart des gens, quand ils parlent de front-end, ne retiendront comme **UI Stack** un tant soit peu répandue que `React`, `Vue`, `Svelte`, `Solid` ; si je n''en parlais pas, beaucoup ne sauraient sans doute même pas ce qu''est `Marko`. Bâtir sur `Svelte`, ce n''est donc pas vraiment « *recopier un principe et y coller un backend* » : je préfère l''expliquer comme emprunter une UI que quelqu''un a écrite, que des gens utilisent, dont on corrige sans cesse les bugs et qu''on polit sans cesse -- rien que des choses familières à tout le monde.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-30T06:50:06.701869Z
      seconds: 37.839173708
      tokens: 31938
      review: false
    ja-JP:
      text: 実はここには Marko 6 もあって、すでに私の考えにかなり近い (テンプレート **AST**、コンパイル時の細粒度更新、**replay** ではなく **resume**)。しかし `Marko` と比べて技術的にまだ線を引ける点は主に二つで、一つは `request-time` がまだ JS のコンパイル成果物を動かしていて、チェーン全体が JS runtime に縛られていること。~~もう一つは作者の使う言語が Svelte ではなく Marko であること~~。26年にフロントエンドを語るとき、ほとんどの人が主流の **UI Stack** として考えるのはきっと `React`, `Vue`, `Svelte`, `Solid` だけだろうし、私が言わなければ `Marko` が何かすら知らない人も多いかもしれない。だから `Svelte` の上に築くというのは、「*原理を一式コピーして backend を足す*」というより、誰かが書き、誰かが使い、誰かが絶えず bug を直し磨き続けている UI を借りて使う、と私は説明したい。どれも皆がよく知っている内容だ。
      provider: anthropic
