  71dcc04d2acea4e8fdd9a1b1f822a9a7:
    en-US:
      text: 'Also, the `if` / `each` / `match` from the old protocol are still valid, but the Cartesian product from the earlier [older post](https://canmi.net/architecture/compile-time-rendering#maybe-ctr) needs a qualification, I think: the condition under which it holds is actually the branch space, not the value space. For finite decisions like `nullable` / `enum` / `bool` the combinations are finite, and paying `compile-time` to exhaust them is mathematically sound; but `JTD`''s `string` / `number` / `timestamp` are inherently non-enumerable, and the branches carved out by predicates like `price > 10`, `inventory < 5`, `items.length === 0` cannot be discovered by a Cartesian product over typed values alone; `sentinel` with any one number filled in will always go down the same side.'
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:35:59.586224Z
      seconds: 10.296913542
      tokens: 29260
      review: false
    ja-JP:
      text: それから、旧プロトコルの `if` / `each` / `match` は今も有効だが、以前の[旧記事](https://canmi.net/architecture/compile-time-rendering#maybe-ctr)にあったデカルト積の話は限定しておくべきだと思う。成り立つ条件は実は分岐空間であって、値空間ではない。`nullable` / `enum` / `bool` のような有限の決定なら組み合わせは有限で、`compile-time` を払って全列挙するのは数学的に成立する。しかし `JTD` の `string` / `number` / `timestamp` はそもそも列挙不可能で、`price > 10`、`inventory < 5`、`items.length === 0` のような述語が切り出す分岐は、型の値のデカルト積だけでは発見できない。`sentinel` にどんな数を入れても、永遠に同じ側を通る。
