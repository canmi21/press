    zh-CN:
      text: 另外，Dashboard 这类会让人不断点开页面的东西，这条统计数据帮不上忙，但说到底，Dashboard 的用户比起真正的内容读者还是少得多，不是吗。所以「浏览极多页面导致开销变大」，我认为本质上是个**伪命题**；至少现在是，~~也许以后我会有不一样的看法~~，但在如今这个快节奏的信息时代，我很难不承认这类用户极少；即便有人因为感兴趣而深度探索、并转化为长期读者，这种探索大概率也只发生在第一次访问，之后他们也只是来看看新发的文章而已。可以说从统计学的回报来看，这种极端情况并不成正比。因此我更愿意相信：**大部分场景下 Svelte 能带来更好的综合性能**。
