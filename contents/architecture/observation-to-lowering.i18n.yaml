      text: もちろん `skeleton` 自身は :fn[`parse-stable`]{is="つまり「パースが安定している」あるいは「再現可能にパースできる」ということ"} でなければならない。`table` に `comment` を無秩序に詰め込むようなものは実装の処理不足であって、僕のモデルのせいにしないでほしい。**Build-time** が計算するのはハイドレーションの対応関係（どれが静的で、どれが `slot` で、何を束縛するか）であり、データを前もって固めてしまうことではない。ただし、この `slot` のデータ型は固定してしまう。データの値そのものは **request-time** に自由に差し替えられる。ただ `HTML` と `payload` が同一のものでなければならない、というだけだ。
      provider: anthropic
