ter einen ganzen eigenen Artikel zum Auslassen schreiben~~. Aber :fn[**TanStack**]{is="meint hier ausdrücklich das heutige TanStack Start und nicht die übrigen Bibliotheken, die noch im RC- oder Beta-Stadium stecken -- der frühe Router war ja nicht einmal stabil, von Produktivbetrieb ganz zu schweigen"} halte ich wirklich für reif genug für den kommerziellen Einsatz; zumindest habe ich es für die Verkaufsseite eines Projekts eingesetzt. Aber das ist eben nur eine von genau zwei Optionen (x)'
