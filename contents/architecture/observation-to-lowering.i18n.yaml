    en-US:
      text: 'SeamJS moves its component language from React to Svelte: instead of guessing at page structure through execution and diffing, it reads the public template AST directly, lowering static markup, dynamic values and control flow into skeletons, slots and protocol nodes, while keeping an SSR fallback for explicit escape hatches.'
