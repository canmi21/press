  d3fb4cf158ccfef7fa076127326eaaf3:
    de-DE:
      text: 'So bleibt die statische Referenz erst `compose`; `hatch` läuft weiterhin über den unteren Weg, und daraus ergibt sich, dass die Einheit von CTR der statische Komponentengraph ist und nicht die einzelne Datei. Das meiste ist standardmäßig `structure known`, ein kleiner Teil ausdrücklich `escape hatch`, und `SSR fallback` begegnet einem im Alltag praktisch nie. Alles Übrige, was nicht in der Tabelle steht, wird ausnahmslos als `opaque` behandelt -- so muss man gar nicht erst raten. `CTR` ist nur das `execution model` auf dieser Teilmenge, und selbst wenn ich zu Svelte wechsle, will ich keine Garantie für :fn[den gesamten Umfang von Svelte]{is="übernehmen, denn das kann niemand: in jeder Sprache gibt es schräge, aber legitime Schreibweisen, ich kann nur eine gute Lösung für vernünftige Anwendungsfälle liefern"} geben (x)'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-30T06:56:15.271529Z
      seconds: 15.599978375
      tokens: 29668
      review: false
    en-US:
      text: Only then is the static reference `compose`; things still go through the `hatch` below, from which you can conclude that the unit of CTR is the static component graph, not the individual file. Most cases are `structure known` by default, a few are explicitly `escape hatch`, and you almost never run into `SSR fallback` day to day. Anything else not on the table is treated as `opaque` across the board -- settle it and there is no guessing left at all. `CTR` is only the `execution model` over this subset, and even if I switch to Svelte I do not intend to guarantee :fn[the whole of Svelte's range]{is="which nobody can -- every language has writings that are bizarre yet perfectly legal, and all I can offer is a good solution under reasonable business needs"} (x)
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-30T00:40:38.108648Z
      seconds: 21.364160583
      tokens: 29630
