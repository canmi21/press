  71dcc04d2acea4e8fdd9a1b1f822a9a7:
    de-DE:
      text: 'Außerdem gelten `if` / `each` / `match` aus dem alten Protokoll weiterhin, aber das kartesische Produkt aus meinem [früheren Text](https://canmi.net/architecture/compile-time-rendering#maybe-ctr) muss ich einschränken: Es trägt nur über dem Verzweigungsraum, nicht über dem Werteraum. Bei endlichen Entscheidungen wie `nullable` / `enum` / `bool` ist die Zahl der Kombinationen endlich, und `compile-time` per Bezahl-Enumeration abzuklappern ist mathematisch haltbar; die `string` / `number` / `timestamp` von `JTD` sind dagegen selbst nicht aufzählbar, und die Zweige, die Prädikate wie `price > 10`, `inventory < 5`, `items.length === 0` herausschneiden, findet ein kartesisches Produkt über Typwerten schlicht nicht; setzt man in `sentinel` irgendeine Zahl ein, läuft es immer in denselben Zweig.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:52:05.826531Z
      seconds: 30.863560875
      tokens: 30915
      review: false
    en-US:
      text: 'Also, the `if` / `each` / `match` from the old protocol are still valid, but the Cartesian product from the earlier [older post](https://canmi.net/architecture/compile-time-rendering#maybe-ctr) needs a qualification, I think: the condition under which it holds is actually the branch space, not the value space. For finite decisions like `nullable` / `enum` / `bool` the combinations are finite, and paying `compile-time` to exhaust them is mathematically sound; but `JTD`''s `string` / `number` / `timestamp` are inherently non-enumerable, and the branches carved out by predicates like `price > 10`, `inventory < 5`, `items.length === 0` cannot be discovered by a Cartesian product over typed values alone; `sentinel` with any one number filled in will always go down the same side.'
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:35:59.586224Z
      seconds: 10.296913542
      tokens: 29260
      review: false
    es-ES:
      text: 'Además, `if` / `each` / `match` del protocolo antiguo siguen siendo válidos, pero al producto cartesiano de mi [artículo anterior](https://canmi.net/architecture/compile-time-rendering#maybe-ctr) creo que hay que ponerle un límite: la condición para que se sostenga es el espacio de ramas, no el espacio de valores. En decisiones finitas como `nullable` / `enum` / `bool` las combinaciones son finitas, y enumerar `compile-time` pagando por ello se sostiene matemáticamente; pero los `string` / `number` / `timestamp` de `JTD` no son enumerables de por sí, y las ramas que recortan predicados como `price > 10`, `inventory < 5`, `items.length === 0` no las descubre un producto cartesiano sobre valores de tipos; en `sentinel`, metas el número que metas, siempre se va por el mismo lado.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:52:05.826531Z
      seconds: 30.863560875
      tokens: 30915
      review: false
    fr-FR:
      text: 'Par ailleurs, `if` / `each` / `match` de l''ancien protocole restent valables, mais le produit cartésien de mon [ancien article](https://canmi.net/architecture/compile-time-rendering#maybe-ctr), je crois qu''il faut le borner : sa condition de validité, c''est l''espace des branches, pas l''espace des valeurs. Pour des décisions finies comme `nullable` / `enum` / `bool`, les combinaisons sont en nombre fini, et énumérer `compile-time` à coups d''argent tient mathématiquement ; en revanche les `string` / `number` / `timestamp` de `JTD` ne sont pas énumérables en soi, et les branches découpées par des prédicats comme `price > 10`, `inventory < 5`, `items.length === 0`, un produit cartésien sur les valeurs de types ne les trouvera jamais ; dans `sentinel`, quel que soit le nombre qu''on y mette, on passe toujours du même côté.'
      provider: anthropic
