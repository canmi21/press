  03ce682fb563e51bec90f519984a914e:
    de-DE:
      text: 'Bei strukturellen Verzweigungen ist es noch schlimmer: Selbst die Frage, ob dieses Stück DOM überhaupt existiert, lässt sich nur klären, indem man zweimal rendert und dann `diff`. Und `IfBlock` von `Svelte` macht aus dem Zweiten etwas **Beobachtbares** zu etwas **Erzeugbarem** -- das ist der eigentliche qualitative Sprung.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:47:17.891499Z
      seconds: 14.494504333
      tokens: 28806
      review: false
    en-US:
      text: 'Structural branches fare even worse: even "is this piece of DOM here or not" has to be answered by rendering twice and then `diff`, whereas `Svelte`''s `IfBlock` turns that latter question from **observable** into **generatable**, and that is the real qualitative leap.'
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:33:12.628815Z
      seconds: 7.122888625
      tokens: 28347
      review: false
    es-ES:
      text: 'Con las ramas estructurales es aún peor: hasta saber si ese trozo de DOM está ahí o no exige renderizar dos veces y luego `diff`. Y el `IfBlock` de `Svelte` convierte esto último de algo **observable** en algo **generable**, y ahí está el verdadero salto cualitativo.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:47:17.891499Z
      seconds: 14.494504333
      tokens: 28806
      review: false
    fr-FR:
      text: 'Les branchements structurels, c''est encore pire : même savoir si ce bout de DOM est là ou non exige de rendre deux fois puis de `diff`. Or le `IfBlock` de `Svelte` fait passer cette seconde chose de l''**observable** au **générable**, et c''est là le vrai saut qualitatif.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:47:17.891499Z
      seconds: 14.494504333
      tokens: 28806
      review: false
