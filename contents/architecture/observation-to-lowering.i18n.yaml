      at: 2026-08-30T06:49:53.626791Z
      seconds: 13.461294042
      tokens: 29390
      review: false
    zh-CN:
      text: 结构分支更惨，连「这里到底有没有这块 DOM」都得靠渲染两遍再 `diff`，而 `Svelte` 的 `IfBlock` 把后面这件事从**可观测**变成了**可生成**，这才是质变。
