      text: 'But in the Svelte era these nodes can be generated straight from the AST, and the reason for doing so is not to shave off those few ms by switching stacks; it is far more about turning the control flow from :fn[observation]{is="a black-box problem that exists only in the React version: there is no way to truly cut into a particular step of the compiler, so the only option is to observe it as a black box"} into `lowering` -- structure discovery is handed to the **AST**, finite decisions use protocol nodes, and there is no longer any need to multiply out `N` copies of `HTML`; types constrain `payload` rather than discovering the tree. So in the end, in **Svelte**, values **on this** **Layer** look like the following ↓'
      provider: anthropic
