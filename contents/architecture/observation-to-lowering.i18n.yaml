      at: 2026-08-30T06:52:46.886043Z
      seconds: 30.776170042
      tokens: 31351
      review: false
    zh-CN:
      text: 另外，旧协议里的 `if` / `each` / `match` 仍然有效。但之前[旧文](https://canmi.net/architecture/compile-time-rendering#maybe-ctr)里那套笛卡尔积，我觉得得加个限定：它成立的前提其实是分支空间，而不是值空间。`nullable` / `enum` / `bool` 这类有限决策，组合数是有限的，`compile-time` 花钱穷举在数学上站得住；但 `JTD` 的 `string` / `number` / `timestamp` 本身不可枚举，`price > 10`、`inventory < 5`、`items.length === 0` 这类谓词切出来的分支，光靠类型值的笛卡尔积根本发现不了；`sentinel` 里随便填一个数进去，永远只会走同一侧。
