      at: 2026-08-29T22:33:19.75261Z
      seconds: 15.001302625
      tokens: 29460
      review: false
    es-ES:
      text: 'Aquí también hay que mencionar Marko 6, que ya está muy cerca de lo que tengo en mente (**AST** de plantilla, granularidad fina en tiempo de compilación, **reanudar** en lugar de **repetir**); pero frente a `Marko` las líneas que técnicamente aún se pueden trazar son sobre todo dos: una, que `request-time` sigue ejecutando un artefacto compilado a JS, con toda la cadena atada al runtime de JS; ~~y otra, que el autor escribe en Marko y no en Svelte~~. Estoy convencido de que en 2026, cuando la gente hable de front-end, solo considerará **stack de UI** medianamente mayoritario a `React`, `Vue`, `Svelte`, `Solid`; si yo no lo dijera, mucha gente ni siquiera sabría qué es `Marko`. Así que construir sobre `Svelte` no es realmente «*copiar un principio y añadirle un backend*»; prefiero explicarlo como tomar prestada una capa de UI que alguien ha escrito, que alguien usa y a la que alguien le corrige errores y pule sin descanso: todo cosas que a todos nos resultan familiares.'
      provider: anthropic
