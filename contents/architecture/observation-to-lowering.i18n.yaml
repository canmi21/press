  100c69a8537539160b56389a8f90e608:
    de-DE:
      text: '`Wrapper = cond ? A : B` verschwindet hier nicht einfach im Nichts, sondern schrumpft von „einem beliebigen JS-Ausdruck" auf genau diese paar Knoten zusammen. Für Seam wird das damit ganz einfach: standardmäßig geht es über **AST lowering**; was statisch als Loch sichtbar ist, gehört genau dem, dem es dort gehört. Am häufigsten ist `{@render}` als `compose` (`layout` und `Card`, die `children` umschließen, sind alle von dieser Art), während `<svelte:component>` / `<svelte:element>` / dynamisches `{@render}` die eindeutigen `hatch` sind und in `runtime` oder `SSR fallback` landen; und für `{@html}` lässt sich einfach das `raw HTML slot` weiterverwenden, das ich bereits entworfen habe.'
      provider: anthropic
