      text: SeamJS wechselt die Komponentensprache von React zu Svelte und errät die Seitenstruktur nicht mehr über Ausführung und Diffing, sondern liest direkt den öffentlichen Template-AST, senkt statisches Markup, dynamische Werte und Kontrollfluss zu Skeletten, Slots und Protokollknoten ab und behält zugleich einen SSR-Fallback für ausdrückliche Notausstiege bei.
      provider: anthropic
