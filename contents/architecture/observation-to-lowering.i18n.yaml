  3287947f6cfdca7e990d8767d7ec168d:
    de-DE:
      text: 'Aber ob „radikal" hier das richtige Wort ist, weiß ich nicht. Dafür spricht: gegenüber den klassischen Frameworks werfe ich die ganze schwere JS-Runtime auf der Serverseite (Node oder Bun) weg. Dagegen spricht: CSS-in-JS etwa könnte man auch komplett fallen lassen, ohne dass wirklich etwas fehlt -- ~~ich sehe darin inzwischen lieber :tn[die Tränen einer vergangenen Epoche]{is="Im Original steht 时代的眼泪, ein geflügeltes Netzwort für etwas, das einmal geliebt wurde und heute überholt ist; es klingt spöttisch-wehmütig, und eine nüchterne Übersetzung verliert genau diesen Ton."}~~. Die einst bekanntesten CSS-in-JS-Bibliotheken: [Stitches](https://github.com/stitchesjs/stitches/discussions/1149) erklärte im Juni 2023 offiziell, nicht mehr aktiv gepflegt zu werden, [styled-components](https://styled-components.com/blog/celebrating-a-decade-of-styled-components) ging im März 2025 in den Ruhezustand über, und [Emotion](https://github.com/emotion-js/emotion/discussions/2827) steht im Grunde genauso da.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:49:04.401713Z
      seconds: 38.4183965
      tokens: 31494
      review: false
    en-US:
      text: 'But I am not sure whether "radical" is the right word here. Where it might fit is that, compared with traditional frameworks, I am willing to throw away that heavy server-side JS runtime (Node or Bun); where it might not is that, say, dropping CSS-in-JS entirely would actually cause no real problem, ~~I would rather think of it as :tn[a relic of a bygone era]{is="The original uses the Chinese meme phrase 时代的眼泪 (tears of an era), a wistful label for something once beloved and now obsolete; the nostalgic, slightly mournful tone is softened here."}~~. The once best-known CSS-in-JS libraries: [Stitches](https://github.com/stitchesjs/stitches/discussions/1149) was officially declared no longer actively maintained in June 2023, [styled-components](https://styled-components.com/blog/celebrating-a-decade-of-styled-components) went into dormancy in March 2025, and [Emotion](https://github.com/emotion-js/emotion/discussions/2827) is more or less in the same state.'
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:34:12.901772Z
      seconds: 14.822178584
      tokens: 29807
      review: false
    es-ES:
      text: 'Aunque no sé si «radical» es la palabra adecuada aquí. A favor: frente a los frameworks tradicionales, tiro por la borda todo ese pesado runtime de JS del lado del servidor (Node o Bun). En contra: CSS-in-JS, por ejemplo, se podría abandonar del todo sin que pasara realmente nada; ~~prefiero verlo ya como :tn[las lágrimas de una época que se fue]{is="El original dice 时代的眼泪, una expresión hecha meme para algo que se adoró en su día y hoy está superado; suena entre burlona y nostálgica, y una traducción llana pierde ese matiz."}~~. Las bibliotecas de CSS-in-JS que más sonaron en su momento: [Stitches](https://github.com/stitchesjs/stitches/discussions/1149) anunció oficialmente en junio de 2023 que ya no se mantiene de forma activa, [styled-components](https://styled-components.com/blog/celebrating-a-decade-of-styled-components) entró en estado latente en marzo de 2025, y [Emotion](https://github.com/emotion-js/emotion/discussions/2827) está básicamente igual.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:49:04.401713Z
      seconds: 38.4183965
      tokens: 31494
      review: false
    fr-FR:
      text: 'Cela dit, je ne sais pas si « radical » est le mot juste ici. Ce qui plaide pour : par rapport aux frameworks classiques, je jette tout le lourd runtime JS côté serveur (Node ou Bun). Ce qui plaide contre : le CSS-in-JS, par exemple, on pourrait l''abandonner complètement sans que cela pose vraiment problème -- ~~je préfère désormais y voir :tn[les larmes d''une époque révolue]{is="L''original dit 时代的眼泪, une expression devenue mème qui désigne ce qu''on a adoré autrefois et qui est aujourd''hui dépassé ; le ton mêle moquerie et nostalgie, et une traduction plate le perd."}~~. Les bibliothèques CSS-in-JS jadis les plus connues : [Stitches](https://github.com/stitchesjs/stitches/discussions/1149) a officiellement annoncé en juin 2023 qu''elle n''était plus activement maintenue, [styled-components](https://styled-components.com/blog/celebrating-a-decade-of-styled-components) est passée en sommeil en mars 2025, et [Emotion](https://github.com/emotion-js/emotion/discussions/2827) en est grosso modo au même point.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:49:04.401713Z
      seconds: 38.4183965
      tokens: 31494
      review: false
    ja-JP:
      text: ただ、ここで「過激」という言葉が正しいのかは分からない。正しいと言える面は、従来のフレームワークと比べて、サーバーサイドの重い JS ランタイム (Node か Bun) を思い切って捨てているところだろう。正しくないかもしれない面は、たとえば CSS-in-JS を完全に捨てたとしても、実のところ何の問題もないという点だ。~~むしろそれを :tn[時代に置き去りにされたもの]{is="原文は中国語のミーム表現「时代的眼泪」(時代の涙) で、かつて愛されたが今は廃れたものを指す。懐かしさと哀愁を含んだ言い回しで、その語感は訳文では薄れている。"}と考えたい~~。かつて最も有名だった CSS-in-JS ライブラリたち、[Stitches](https://github.com/stitchesjs/stitches/discussions/1149) は 2023 年 6 月に公式に no longer actively maintained と宣言し、[styled-components](https://styled-components.com/blog/celebrating-a-decade-of-styled-components) も 2025 年 3 月に休眠状態に入り、[Emotion](https://github.com/emotion-js/emotion/discussions/2827) もほぼ同じような状況だ。
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:34:12.901772Z
      seconds: 14.822178584
      tokens: 29807
      review: false
    ko-KR:
      text: 그런데 여기서 「급진적」이라는 말이 맞는지는 나도 잘 모르겠다. 맞다고 할 수 있는 쪽은, 전통적인 프레임워크에 비하면 서버 사이드의 그 무거운 JS 런타임(Node 혹은 Bun)을 통째로 버렸다는 점이다. 아니라고 할 수 있는 쪽은, 예컨대 CSS-in-JS 같은 건 완전히 버려도 사실 별문제가 없다는 점이다. ~~나로서는 그것을 :tn[한 시대가 남긴 눈물]{is="원문은 时代的眼泪, 한때 사랑받았지만 지금은 한물간 것을 가리키는 중국어 인터넷 유행어다. 농담 섞인 아련한 정서가 담겨 있는데, 밋밋하게 옮기면 그 맛이 사라진다."}로 보는 편이 낫다~~. 한때 가장 유명했던 CSS-in-JS 라이브러리들을 보면, [Stitches](https://github.com/stitchesjs/stitches/discussions/1149)는 2023년 6월에 더 이상 적극적으로 유지보수하지 않는다고 공식 발표했고, [styled-components](https://styled-components.com/blog/celebrating-a-decade-of-styled-components)도 2025년 3월에 휴면 상태로 들어갔으며, [Emotion](https://github.com/emotion-js/emotion/discussions/2827) 역시 사정은 대체로 똑같다.
