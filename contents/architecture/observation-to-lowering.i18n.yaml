  974b152ac5390e180a495287ac94e51f:
    en-US:
      text: 'So, put simply, :fn[Seam]{is="is a rendering protocol, and SeamJS is the meta-framework built on it"} is first and foremost a protocol, not yet another SSR runtime. That means build time emits an **HTML skeleton** carrying `slot`, and runtime / request time only stuffs values into those `slot`; `if` / `each` / `match` are likewise protocol nodes baked into the skeleton. So by the time a request arrives, not a single UI component has been executed, and the only thing the server has to do is :tn[fill in the blanks]{is="The original says 看图填空, ‘look at the picture and fill in the blanks’, a Chinese primary-school exercise. It casts the server’s job as trivial homework: the picture (the skeleton) is already drawn, it just writes in the missing words."} -- which means it naturally does not have to be Node or Bun anymore. A **Rust** / **Go** backend can fill in a page of HTML just as well, how hard could that possibly be?! ~~Though honestly the JS runtime was never completely killed off later either; what I mean is you can drop it, provided you accept some limitations~~ Either way, the overall performance gain is absolutely exponential, because achieving most **SSR** effects no longer requires running the **UI render** at **runtime / request time**...'
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:36:09.885518Z
      seconds: 18.714335
      tokens: 30197
      review: false
    ja-JP:
