  9e0ca2dd516a17f1fbc2fa75e95a28e9:
    de-DE:
      text: 'Wenn man den React-Compiler nicht anfasst, bleibt man in derselben Lage wie bei V1: Man behandelt den Compiler als Blackbox und rät blind, was er ausspuckt. Das ist ausgesprochen fragil und unelegant, und Randfälle fliegen einem dabei nur so um die Ohren.'
