  090d668ffe73c3e2f350781f1ad21ef0:
    de-DE:
      text: 'Hier muss ich eigentlich noch Marko 6 erwähnen, das meiner Vorstellung schon sehr nahe kommt (Template-**AST**, feingranular zur Compile-Zeit, **Resume** statt **Replay**); verglichen mit `Marko` lassen sich technisch aber vor allem zwei Grenzlinien ziehen: Zum einen führt `request-time` weiterhin ein JS-Compile-Artefakt aus, die ganze Kette hängt fest an der JS-Runtime; ~~zum anderen schreibt der Autor in Marko und nicht in Svelte~~. Ich bin überzeugt, dass die meisten Leute 2026, wenn sie über Frontend reden, nur `React`, `Vue`, `Svelte`, `Solid` als einigermaßen verbreiteten **UI-Stack** gelten lassen; würde ich es nicht sagen, wüssten viele nicht einmal, was `Marko` überhaupt ist. Auf `Svelte` aufzubauen heißt für mich deshalb nicht, «*das Prinzip zu kopieren und ein Backend dranzuhängen*»; ich erkläre es lieber so, dass ich mir eine UI-Schicht ausleihe, die jemand geschrieben hat, die jemand benutzt und an der jemand ständig Bugs behebt und feilt -- lauter Dinge, die allen vertraut sind.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:47:36.290665Z
      seconds: 40.270638083
      tokens: 31465
      review: false
    en-US:
      text: 'There is also Marko 6, which is already quite close to what I have in mind (template **AST**, compile-time fine-grained updates, **resume** rather than **replay**); but compared with `Marko`, the technical lines that can still be drawn between them come down to two: one is that `request-time` still runs JS compiler output, with the whole chain tied to the JS runtime; ~~the other is that the author''s language is Marko, not Svelte~~. I believe that when most people talk about the frontend in 2026, they will only count `React`, `Vue`, `Svelte` and `Solid` as the mainstream **UI Stack**; if I did not bring it up, many people might not even know what `Marko` is. So building on `Svelte`, I am not really "*copying the principles and bolting on a backend*"; I prefer to describe it as borrowing a UI that someone writes, someone uses, and someone keeps fixing bugs in and polishing, all of it material everyone already knows.'
      provider: anthropic
