      text: 'Doch im Zeitalter von Svelte lassen sich diese Knoten direkt aus dem AST erzeugen, und der Grund dafür ist nicht, beim Wechsel des Stacks ein paar ms zu sparen, sondern vielmehr, den Kontrollfluss von der :fn[Beobachtung]{is="ein Blackbox-Problem, das nur die React-Fassung betrifft: da sich kein einzelner Schritt im Compiler wirklich anzapfen lässt, bleibt nur, das Ganze als „Blackbox“ zu beobachten"} zu `lowering` zu machen -- das Auffinden der Struktur übernimmt der **AST**, begrenzte Entscheidungen laufen über Protokollknoten, und `N` Ausfertigungen von `HTML` müssen nicht mehr auskombiniert werden; Typen sollen `payload` einschränken, nicht den Baum entdecken. Am Ende sehen die values in **Svelte** auf **diesem** **Layer** also so aus wie unten ↓'
