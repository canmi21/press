    fr-FR:
      text: '**SolidJS** est un bon framework, et son cœur est assez stable, ~~mais personne ne veut lui écrire un écosystème~~. `Solid` n''est au fond que le `Rust` d''autrefois, sauf que `Rust`, lui, a tenu le coup ; `Rust` connaît aussi, dans le domaine de la programmation, cette situation où l''écosystème est maigre et où il faut réinventer la roue pour tout, mais la chaîne d''outils de `Rust` te permet de fabriquer cette roue sans friction et de faire tourner l''unité minimale viable : au fond, fabriquer la roue n''est pas si difficile, non ? Malheureusement, **SolidJS** n''a pas encore franchi cette étape et s''est heurté à l''**hiver de l''IA** ; ce sera surtout très dur à partir de 26. Le cœur de Solid 2.0 est déjà excellent et très stable, mais la périphérie n''a jamais démarré. L''idée est parfaitement juste, elle est simplement née au mauvais moment. Et même le peu de périphérie qui existe ne couvre qu''un ou deux domaines épars ~~(TanStack a par exemple un routeur Solid expérimental)~~, sans jamais former un écosystème complet. Cela le place, aujourd''hui comme demain, dans une position inconfortable : pas d''écosystème complet, à une époque d''explosion des Agents. Tant que la boule de neige ne roule pas, les Agents ne le choisiront pas en priorité, et si même l''IA ne le privilégie pas, cela signifie encore moins d''occasions de recevoir des contributions — surtout à une époque où même [Linus Torvalds](https://github.com/torvalds) se met à :tn[coder au feeling]{is="L''original emploie l''argot anglais « Vibe », pour vibe coding : laisser l''IA écrire le code et se contenter d''indiquer la direction. Appliqué à Linus, cela prend un ton moqueur, du genre « même lui s''y met »."}. Je trouve ça vraiment dommage pour Solid : bonne idée, technique juste, implémentation élégante, et pourtant né au mauvais moment…'
