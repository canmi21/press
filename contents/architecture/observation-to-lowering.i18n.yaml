  02838a6b1d344559afe6c736b44cbfc5:
    de-DE:
      text: 'Wie schon im letzten Beitrag geschrieben: `Seam` ist zuallererst ein Protokoll, nicht noch eine weitere **SSR-Runtime**. Zur **Build-Zeit** entsteht ein `HTML skeleton` mit `slot`, zur **Request-Zeit** wird nur noch `injection` gemacht; `if` / `each` / `match` sind ebenfalls:fn[Protokollknoten]{is="„Knoten“ meint hier die Struktureinheiten, mit denen das Protokoll Seitenaufbau und Steuerbeziehungen beschreibt, und hat mit Netzwerkknoten oder VPNs nicht das Geringste zu tun"}'
