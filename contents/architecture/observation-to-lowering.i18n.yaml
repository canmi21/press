      text: 'CSS-in-JS nehme ich ebenfalls nicht an. Nicht etwa, weil React mich zwingen würde, eine Schreibweise wie die folgende zu unterstützen — jene Struktur ließ sich schon in V1 mit Tailwind umgehen. Der eigentliche Grund ist: Sobald man es anschließt, wird CSS wieder zum Ergebnis einer JS-Ausführung, und dann müssen Style-Runtime, Registry, SSR-Collection, Hashing, Hydration-Konsistenz, Theme-Kontext, Insertion, Ordering und Dedup allesamt wieder eingeladen werden. Ein gewöhnliches Framework verkraftet das; :spoiler[aber Seam, sie ist eben anders!] Genau diese Art von Server- / Runtime-Arbeit will ich beseitigen, und es kann doch wohl kaum nötig sein, aus Höflichkeit gegenüber dem Ökosystem das gerade Hinausgeworfene wieder hereinzubitten (~~ergibt überhaupt keinen Sinn~~'
