      text: 'Man muss gar nicht lange überlegen: Bestimmt fragt jemand, ob das nicht einfach `Astro` / `Qwik` / `Marko` ist. :tn[Stimmt schon]{is="Im Original steht hier 雀食, eine absichtliche gleichklingende Falschschreibung von 确实 („in der Tat“), die im chinesischen Netzjargon scherzhaft verwendet wird. Übersetzt bleibt nur die Zustimmung übrig, der spielerische Ton geht verloren."} — seam liegt in der Form der Sprache `Marko` am nächsten, darin, standardmäßig wenig JS auszuliefern, `Astro` am nächsten, und darin, nicht `replay hydrate` zu tun, `Qwik` am nächsten. Nur läuft bei ihnen `request-time` eben doch weiter ein UI-Programm: die jeweiligen `render` von `island`, das eine `SSR` von `Qwik`, die von `Marko` kompilierten JS-Templatefunktionen — sie alle führen pro Request weiterhin ein Stück `renderer` aus.'
