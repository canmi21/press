  1098bd2291ca906aaa78f72587a9e05a:
    de-DE:
      text: Doch im Zeitalter von Svelte lassen sich diese Knoten direkt aus dem AST erzeugen, und der Grund dafür ist nicht, beim Stackwechsel die paar Millisekunden zu sparen, sondern vor allem, den Kontrollfluss von der :fn[Beobachtung]{is="ist nur ein Blackbox-Problem der React-Fassung, denn man kann sich nicht wirklich in einen bestimmten Schritt des Compilers einklinken und muss ihn deshalb als ‚Blackbox‘ beobachten"} zu `lowering` zu machen — die Strukturerkennung übernimmt der **AST**, begrenzte Entscheidungen übernehmen Protokollknoten, und man muss nicht mehr `N` Kopien von `HTML` ausmultiplizieren; Typen beschränken `payload`, statt den Baum zu entdecken. Am Ende sehen die values in **Svelte** **auf dieser** **Layer** also so aus ↓
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:47:55.758871Z
      seconds: 27.870072708
      tokens: 30282
      review: false
    en-US:
      text: 'But in the Svelte era these nodes can be generated straight from the AST, and the reason for doing so is not to shave off those few ms by switching stacks; it is far more about turning the control flow from :fn[observation]{is="a black-box problem that exists only in the React version: there is no way to truly cut into a particular step of the compiler, so the only option is to observe it as a black box"} into `lowering` -- structure discovery is handed to the **AST**, finite decisions use protocol nodes, and there is no longer any need to multiply out `N` copies of `HTML`; types constrain `payload` rather than discovering the tree. So in the end, in **Svelte**, values **on this** **Layer** look like the following ↓'
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:33:32.891319Z
      seconds: 10.939169459
      tokens: 28935
      review: false
    es-ES:
      text: 'Pero en la era de Svelte estos nodos se pueden generar directamente desde el AST, y la razón no es ahorrarse esos pocos milisegundos al cambiar de stack, sino sobre todo convertir el flujo de control de :fn[observación]{is="es solo un problema de caja negra propio de la versión con React: no se puede entrar de verdad en un paso concreto del compilador, así que no queda más remedio que observarlo como una «caja negra»"} en `lowering`: el descubrimiento de la estructura queda para el **AST**, las decisiones limitadas para los nodos de protocolo, y ya no hace falta multiplicar `N` copias de `HTML`; los tipos restringen `payload`, no descubren el árbol. Así que al final, en **Svelte**, los values **en esta** **Layer** se ven tal como sigue ↓'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:47:55.758871Z
      seconds: 27.870072708
      tokens: 30282
      review: false
    fr-FR:
      text: 'Mais à l''époque de Svelte, ces nœuds peuvent être générés directement depuis l''AST, et la raison n''est pas de gagner quelques millisecondes en changeant de stack, mais surtout de faire passer le flot de contrôle de l'':fn[observation]{is="n''est qu''un problème de boîte noire propre à la version React : impossible de s''insérer réellement dans une étape précise du compilateur, il ne reste donc qu''à observer la chose comme une « boîte noire »"} à `lowering` — la découverte de la structure revient à l''**AST**, les décisions limitées aux nœuds de protocole, et il n''y a plus besoin de démultiplier `N` copies de `HTML` ; les types contraignent `payload`, ils ne découvrent pas l''arbre. Au final, dans **Svelte**, les values **à ce niveau de** **Layer** ressemblent donc à ceci ↓'
      provider: anthropic
