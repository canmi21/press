  71dcc04d2acea4e8fdd9a1b1f822a9a7:
    de-DE:
      text: 'Außerdem gelten `if` / `each` / `match` aus dem alten Protokoll weiterhin. Das kartesische Produkt aus dem [früheren Text](https://canmi.net/architecture/compile-time-rendering#maybe-ctr) möchte ich aber einschränken: Es gilt nur für den Verzweigungsraum, nicht für den Werteraum. Bei endlichen Entscheidungen wie `nullable` / `enum` / `bool` ist die Zahl der Kombinationen endlich, und die bezahlte Aufzählung von `compile-time` ist mathematisch tragfähig; `string` / `number` / `timestamp` von `JTD` sind dagegen selbst nicht aufzählbar, und Zweige, die Prädikate wie `price > 10`, `inventory < 5`, `items.length === 0` herausschneiden, findet man über ein kartesisches Produkt der Typwerte allein nie; setzt man in `sentinel` irgendeine Zahl ein, geht es immer auf dieselbe Seite.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-30T06:52:46.886043Z
      seconds: 30.776170042
      tokens: 31351
      review: false
    en-US:
      text: 'Also, the `if` / `each` / `match` from the old protocol are still valid, but the Cartesian product from the earlier [older post](https://canmi.net/architecture/compile-time-rendering#maybe-ctr) needs a qualification, I think: the condition under which it holds is actually the branch space, not the value space. For finite decisions like `nullable` / `enum` / `bool` the combinations are finite, and paying `compile-time` to exhaust them is mathematically sound; but `JTD`''s `string` / `number` / `timestamp` are inherently non-enumerable, and the branches carved out by predicates like `price > 10`, `inventory < 5`, `items.length === 0` cannot be discovered by a Cartesian product over typed values alone; `sentinel` with any one number filled in will always go down the same side.'
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:35:59.586224Z
      seconds: 10.296913542
      tokens: 29260
      review: false
    es-ES:
      text: 'Por otro lado, los `if` / `each` / `match` del protocolo antiguo siguen siendo válidos. Pero el producto cartesiano de aquel [texto anterior](https://canmi.net/architecture/compile-time-rendering#maybe-ctr) creo que hay que acotarlo: la condición para que se sostenga es el espacio de ramas, no el espacio de valores. Con decisiones finitas como `nullable` / `enum` / `bool` las combinaciones son finitas, y enumerarlas pagando con `compile-time` se sostiene matemáticamente; en cambio, los `string` / `number` / `timestamp` de `JTD` no son enumerables de por sí, y las ramas que recortan predicados como `price > 10`, `inventory < 5`, `items.length === 0` no se descubren sólo con el producto cartesiano de los valores de tipo; en `sentinel`, metas el número que metas, siempre se va por el mismo lado.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-30T06:52:46.886043Z
      seconds: 30.776170042
      tokens: 31351
      review: false
    fr-FR:
      text: 'Par ailleurs, les `if` / `each` / `match` de l''ancien protocole restent valables. Mais le produit cartésien décrit dans l''[ancien billet](https://canmi.net/architecture/compile-time-rendering#maybe-ctr), je crois qu''il faut le restreindre : sa condition de validité, c''est en réalité l''espace des branches, pas l''espace des valeurs. Pour des décisions finies comme `nullable` / `enum` / `bool`, les combinaisons sont en nombre fini, et l''énumération payante de `compile-time` tient mathématiquement ; en revanche, les `string` / `number` / `timestamp` de `JTD` ne sont pas énumérables en eux-mêmes, et les branches découpées par des prédicats comme `price > 10`, `inventory < 5`, `items.length === 0` restent introuvables par le seul produit cartésien des valeurs de types ; dans `sentinel`, quel que soit le nombre qu''on y mette, on part toujours du même côté.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-30T06:52:46.886043Z
      seconds: 30.776170042
      tokens: 31351
      review: false
    ja-JP:
      text: それから、旧プロトコルの `if` / `each` / `match` は今も有効だが、以前の[旧記事](https://canmi.net/architecture/compile-time-rendering#maybe-ctr)にあったデカルト積の話は限定しておくべきだと思う。成り立つ条件は実は分岐空間であって、値空間ではない。`nullable` / `enum` / `bool` のような有限の決定なら組み合わせは有限で、`compile-time` を払って全列挙するのは数学的に成立する。しかし `JTD` の `string` / `number` / `timestamp` はそもそも列挙不可能で、`price > 10`、`inventory < 5`、`items.length === 0` のような述語が切り出す分岐は、型の値のデカルト積だけでは発見できない。`sentinel` にどんな数を入れても、永遠に同じ側を通る。
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:35:59.586224Z
      seconds: 10.296913542
      tokens: 29260
      review: false
    ko-KR:
      text: 그리고 예전 프로토콜의 `if` / `each` / `match` 는 여전히 유효하다. 다만 예전 [글](https://canmi.net/architecture/compile-time-rendering#maybe-ctr)에서 말한 데카르트 곱은 한정을 좀 붙여야 할 것 같다. 성립 조건은 사실 값 공간이 아니라 분기 공간이다. `nullable` / `enum` / `bool` 같은 유한 결정은 조합이 유한하니 `compile-time` 로 돈을 들여 전부 열거하는 게 수학적으로 성립한다. 하지만 `JTD` 의 `string` / `number` / `timestamp` 은 그 자체가 열거 불가능하고, `price > 10`, `inventory < 5`, `items.length === 0` 같은 술어가 잘라내는 분기는 타입 값의 데카르트 곱만으로는 결코 찾아낼 수 없다. `sentinel` 에 아무 숫자나 넣어봐야 언제나 같은 쪽으로만 간다.
      provider: anthropic
