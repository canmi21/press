  f839eb4997c6a62a7b36adf432f746a8:
    de-DE:
      text: 'Damit wird der Abhängigkeitsgraph der Komponenten wieder implizit. Für klassisches SSR ist das kein großes Problem, im schlimmsten Fall heißt es eben „den ganzen React-Baum einmal durchlaufen“. Aber worauf Seam am Ende hinauswill, ist: Kann ProductCard eigenständig [CTR](https://canmi.net/architecture/compile-time-rendering#maybe-ctr) machen? Und genau da wird es wirklich mühsam. Man könnte sogar sagen: Dafür müsste man das Verhalten des gesamten React-Compilers ändern, dazu die DX und die Gewohnheiten der Nutzer -- wozu also das Ganze ...'
