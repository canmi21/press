      text: 'Fangen wir mit `React` an: Lassen wir die kommerzielle Bindung an **Vercel** `Next.js` und die Tatsache, dass es sein eigenes `roadmap` hat, einmal beiseite -- zuallererst fliegen einem hier die **CVE** nur so um die Ohren, ~~allein das verdammt dich dazu, ständig die **Social Media** im Blick zu behalten, ob gerade eine neue Lücke **reported & released** wurde~~. Die **Router** der anderen sind im Grunde :fn[unbrauchbar, besonders **Remix**]{is="-- persönliche, subjektive Einschätzung, das sieht jeder anders; offiziell und in der Community gelten sie durchaus als brauchbar, ich stimme dem aber nicht zu"}, doch 2026 gibt es eine ganz besondere Option, nämlich **TanStack** **Start**. Ich nutze **TanStack Router** schon sehr lange und kann dazu sagen: ~~abgesehen davon, dass :fn[Namensstil und Datenstrukturen nicht besonders hübsch geraten sind]{is="-- reine persönliche Vorliebe, kein Designfehler des Frameworks"}~~, ist das funktional die einzige Option, die ich gelten lasse. Etwas jung ist sie schon, aber sie löst das Problem der ersten Aufrufgeschwindigkeit beim Kaltstart einer Seite, das der `next-server`-Prozess von **Next.js 16** bis heute nicht gelöst hat. **Next.js** hat diese Ruckelei eigentlich schon immer auf unerklärliche Weise; es liegt nicht an zu schwacher Serverleistung, ich führe es vielmehr darauf zurück, dass entweder das **Load** beim Start noch nicht fertig ist oder `runtime` noch irgendetwas kompiliert. ~~Und diese Struktur passt naturgemäß schlecht zu dem Prinzip von **Cloudflare Worker**, Instanzen an vielen Orten möglichst nah beim Nutzer zu starten~~; nur :fn[ein **langlebiger Node-Prozess** klassischer Art wie bei **Vercel**]{is="-- wobei Vercel kein klassischer Prozess ist, sondern schläft und erst beim tatsächlichen Aufruf geweckt wird; der Gedanke des langlebigen Prozesses trägt aber trotzdem"} bekommt dieses Problem nicht ab(?) ~~Das führt jetzt etwas weit; über Next.js könnte ich später einen ganzen eigenen Artikel zum Ablästern schreiben~~, aber :fn[**TanStack**]{is="-- gemeint ist hier ausdrücklich das heutige TanStack Start und nicht die übrigen Libraries, die noch im RC oder Beta stecken; der frühe Router war ja nicht einmal stabil, von Produktion ganz zu schweigen"} halte ich wirklich für reif genug für den kommerziellen Einsatz, zumindest habe ich es für die Sales-Site eines Projekts eingesetzt. Aber das ist nur eine der einzigen zwei Optionen(x)'
