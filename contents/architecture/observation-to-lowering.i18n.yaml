      text: 구조 분기는 더 심각하다. 「여기에 이 DOM 조각이 있는가」조차 두 번 렌더링한 뒤 `diff` 해야 알 수 있다. 그런데 `Svelte`의 `IfBlock`는 바로 그 뒷일을 **관측 가능한 것**에서 **생성 가능한 것**으로 바꿔놓았고, 이것이야말로 질적인 변화다.
      provider: anthropic
