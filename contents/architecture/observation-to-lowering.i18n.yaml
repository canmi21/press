      text: 'Seam hydriert, aber weder auf die klassische Art noch auf die von Qwik. Klassische Hydration heißt: der Client `render` noch einmal und gleicht das Ergebnis mit dem Server ab `DOM`; Qwik `SSR` `HTML` plus Komponentenzustand aus, der Client `resume` und `replay` nicht. Bei Seam dagegen muss zur **request-time** nicht einmal der **UI renderer** laufen: Hydrationsgerüst, erster Bildschirm und die Daten für `hydrate` stammen alle aus demselben `injection`. Der Client bekommt ein bereits stimmiges `DOM` plus dieselben Daten und hängt Events und **client state** gemäß der zur Compile-Zeit erzeugten `IR` an `adopt` — kein `replay` und damit natürlich auch kein `resume` eines Komponentenbaums.'
