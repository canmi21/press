  63e99a85af1b6fc388ae662f7dfe89c8:
    de-DE:
      text: 'Hier ist zum Beispiel unstrittig, dass die erste Zeile ins Skeleton wandert, aber die zweite Zeile ist genau das, was Svelte so angenehm macht: `class:` / `style:` belassen den Namen `attr` im **AST**, nur der Wert wird für sich zu `slot`, ohne dass man das ganze `element` als dynamisch abstempeln müsste. Die dritte Zeile unterscheidet sich nicht grundsätzlich von `{...props}` in **React**, Seam behandelt sie einfach als explizites `hatch` und muss nicht länger so tun, als würde sie analysiert; in **React** muss man das Literal `className="card"` eigentlich auch nicht durchzählen — durchzählen muss man nur: „ändert sich dieses Attribut, wenn andere Props kommen?" :spoiler[Genau diese letzte Ratearbeit fällt bei Svelte weg — solange der Name im Baum steht, muss man nicht zweimal rendern, um es zu wissen 🫠]'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:51:08.364177Z
      seconds: 30.359196708
      tokens: 30519
      review: false
    en-US:
      text: 'For instance, there is no dispute that the first line here goes into the skeleton, but the second line is where Svelte really shines: `class:` / `style:` keep the `attr` name in the **AST** while only the value becomes `slot`, so the whole `element` need not be marked dynamic. The third line is not fundamentally different from **React**''s `{...props}`; Seam just treats it as an explicit `hatch` and stops pretending to analyse it. In **React**, a literal `className="card"` does not really need enumerating either; what has to be enumerated is "will this attr change after a different set of props". :spoiler[That last kind of guesswork is exactly what Svelte does away with -- as long as the name is still on the tree, you don''t have to render twice to find out 🫠]'
      provider: anthropic
      model: claude-fable-5
      at: 2026-08-29T22:35:10.030367Z
      seconds: 11.210121625
      tokens: 28932
