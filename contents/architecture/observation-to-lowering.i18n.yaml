      text: 'Starting around the second half of this year, I moved this site entirely off `TanStack Start` **React** and fully `port` over to `SvelteKit` **Svelte**. Once the migration was done, I found it genuinely good: the performance overhead of `ssr` dropped by roughly an order of magnitude, hydration cost is tiny, it runs comfortably, and the framework''s compile-first philosophy is excellent and very lightweight. But the `Kit` side always had a few things that left me unsatisfied. Most of them can be solved with plugins ~~it is glued together out of Vite, after all~~, yet there are always some parts that cannot be touched; that is most likely my own problem, though, because the places seam wants to change probably conflict fundamentally with every existing `meta` framework, ~~in essence I am challenging their execution model (running the render function on every request), their data boundary (load and UI mashed together), and their backend capability (welded to a JS runtime)~~.'
