  648829f27f27ca013ea5ee55b54ac91a:
    de-DE:
      text: 'Doch gegenüber anderen Frameworks stand ich vor einer zusätzlichen Herausforderung: Da das Backend nun nicht mehr an die **JavaScript**-Laufzeit gebunden war, musste es keine Einheit mehr mit dem Frontend bilden; man kann es ohne Weiteres in **Rust** oder **Go** schreiben. In einem **TypeScript**-Full-Stack-Framework lässt sich die Konsistenz zwischen Frontend und Backend unmittelbar durch Typen gewährleisten – aber wie funktioniert das mit anderen Sprachen? Tatsächlich setze ich hier auf **Codegenerierung**: Unabhängig von der Sprache des Backends dient es als Referenz, und die für das Frontend verfügbaren Variablen und Typen werden direkt als **TypeScript** **generiert**, damit das Frontend sie importieren kann. Dadurch ist die Grenze zwischen Frontend und Backend zwar klar gezogen, beide können aber wie in einem **TypeScript**-Full-Stack-Framework im selben Ordner leben, den Gepflogenheiten eines **einzigen Repositorys** folgen und sich direkt gegenseitig aufrufen, ohne Programmierschnittstellen oder Dinge wie `gen` **OpenAPI** von Hand schreiben zu müssen. Tatsächlich verwende ich den privaten Pfad `/_seam/` als Standard-Endpunkt des Frameworks, der wie bei Nuxt konfigurierbar ist; durch Ausführen von `JTD Typed-RPC` lassen sich dann die Probleme der Datenübertragung und der Ressourcenfreigabe zwischen Ursprüngen lösen.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:28:38.215868Z
      seconds: 173.828777792
      tokens: 25110
      review: false
    en-US:
      text: 'But I faced an additional challenge compared with other frameworks: once the backend was freed from the **JavaScript** runtime, it no longer had to be tied to the frontend, so you could write it entirely in **Rust** or **Go**. In a full-stack **TypeScript** framework, types can directly guarantee consistency between the frontend and backend—but what about other languages? I actually used **code generation** here: regardless of the language used for the backend, it serves as the source of truth, and the variables and types available to the frontend are directly **generated** as **TypeScript** for it to import. This draws a clear boundary between the frontend and backend, yet they can still live in the same folder just as they would in a full-stack **TypeScript** framework, following **single-repository** conventions and calling each other directly without handwritten APIs or anything like `gen` **OpenAPI**. I use the private path `/_seam/` as the framework’s default endpoint, which is configurable just as it is in Nuxt; running `JTD Typed-RPC` then takes care of data transport and CORS.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:28:38.215868Z
      seconds: 173.828777792
      tokens: 25110
      review: false
    es-ES:
      text: 'Pero yo tenía un reto adicional frente a otros marcos de trabajo: al liberar el lado servidor del entorno de ejecución de **JavaScript**, este ya no tenía que formar un todo con el lado cliente; puedes escribirlo perfectamente en **Rust** o **Go**. En un marco de pila completa basado en **TypeScript**, la coherencia entre cliente y servidor puede garantizarse directamente mediante los tipos; ¿pero qué ocurre con otros lenguajes? En realidad, aquí usé **generación de código**: sin importar el lenguaje en que esté escrito el servidor, este actúa como referencia, y las variables y los tipos disponibles para el cliente se **generan** directamente como **TypeScript** para que pueda importarlos. Así, aunque la frontera entre cliente y servidor queda claramente delimitada, ambos pueden vivir en la misma carpeta como en un marco de pila completa basado en **TypeScript**, de acuerdo con las prácticas de un **repositorio único**, y llamarse directamente entre sí sin escribir a mano interfaces de programación ni elementos como `gen` **OpenAPI**. En realidad, uso la ruta privada `/_seam/` como punto de conexión predeterminado del marco, configurable igual que en Nuxt; ejecutar `JTD Typed-RPC` basta para resolver los problemas de transmisión de datos y de intercambio de recursos entre orígenes.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:28:38.215868Z
      seconds: 173.828777792
      tokens: 25110
      review: false
    fr-FR:
      text: 'Mais je devais relever un défi supplémentaire par rapport aux autres cadres logiciels : puisque la partie serveur était libérée de l’environnement d’exécution **JavaScript**, elle n’avait plus à faire corps avec la partie cliente, et rien n’empêche de l’écrire en **Rust** ou en **Go**. Dans un cadre logiciel **TypeScript** couvrant toute la pile, la cohérence entre les parties cliente et serveur peut être garantie directement par les types ; mais qu’en est-il des autres langages ? En pratique, j’ai utilisé ici la **génération de code** : quel que soit le langage du serveur, celui-ci sert de référence, et les variables et types accessibles à la partie cliente sont directement **générés** en **TypeScript** pour qu’elle puisse les importer. Ainsi, même si la frontière entre les deux parties est clairement tracée, elles peuvent vivre dans le même dossier comme dans un cadre logiciel **TypeScript** couvrant toute la pile, conformément aux usages d’un **dépôt unique**, et s’appeler directement sans écrire manuellement d’interfaces de programmation ni quoi que ce soit comme `gen` **OpenAPI**. J’ai en fait choisi le chemin privé `/_seam/` comme point de terminaison par défaut du cadre logiciel, configurable comme dans Nuxt ; il suffit alors d’exécuter `JTD Typed-RPC` pour régler les problèmes de transfert de données et de partage de ressources entre origines.'
