    zh-TW:
      text: 到這一步你可能已經看出來了這些 `slot` 就是 **「有類型標記的插槽」**。這個時候伺服端執行時要做的事情變得極其簡單，那就拿到真實資料，往這些孔裡填值，純粹的字串替換。完全不需要 `renderToString()`，不需要 JavaScript 執行時，不需要 `vDOM`。任何能解析 **HTML** 註解、能做**字串替換**的語言都能當後端，Rust、Go、TypeScript 都行，這就是為什麼它是一個協定而不是一個框架。
