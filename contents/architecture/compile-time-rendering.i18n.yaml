    ko-KR:
      text: 이것이 제가 말하는 **CTR (Compile-Time Rendering)**입니다. 제한 사항에 대해 말하자면, 사실 SSR의 제한 사항과 완전히 동일합니다. 예를 들어 `<!--seam:path-->`으로 텍스트를 삽입할 때 자동으로 HTML 이스케이프가 수행되고(`&`, `<`, `>` 등), 원본 HTML을 삽입해야 하는 경우 `<!--seam:path:html-->`를 명시적으로 사용해야 합니다. 누락된 데이터 경로는 텍스트 `slot`에서는 빈 문자열이 되고, 속성 `slot`에서는 주입이 건너뛰어집니다. `each` 블록이 배열이 아닌 것을 전달받으면 그대로 건너뜁니다. 이러한 동작은 SSR 프레임워크에서 발생하는 엣지 케이스와 본질적으로 차이가 없으며, 저는 단지 SSR의 렌더링 단계를 컴파일 타임으로 가져와 실행했을 뿐입니다. 그리고 **CTR**은 **build-time**에 모든 조건 변수의 타입 값에 대해 데카르트 곱 순회를 수행하며, 타입에 부합하는 임의의 Mock 값 또는 사용자가 Override한 특수 Mock 값(일반적으로 HTML 변형을 생성하는 데 필요한 Mock 값을 수동으로 작성할 필요는 없지만 수동으로 제공할 수 있으며, 그렇지 않으면 해당 타입에 맞는 값이 자동으로 들어옵니다)을 사용합니다. 이렇게 각 조합을 한 번씩 렌더링하여 모든 조건 블록과 루프 블록의 경계를 diff하고, 최종적으로 완벽하게 펼쳐진 HTML 스켈레톤을 얻게 됩니다. 수학적으로 말해, runtime에 전달되는 데이터가 이러한 타입 정의에 부합하기만 하면 이 스켈레톤에 반드시 올바르게 주입되며, 가능한 모든 분기 경로는 컴파일 타임에 이미 열거되었습니다.
