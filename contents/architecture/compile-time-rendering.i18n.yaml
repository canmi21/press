      text: 'So why did SeamJS ultimately add a JS runtime anyway? Because while implementing this approach, I ran into a problem: CTR’s ideal imposes extremely strict constraints on initial-render data. The data must be a deterministic structure that can be fully derived; it cannot even contain any computational logic, only conditions. This is extremely demanding. From a framework developer-experience perspective, traditional React developers naturally expect to perform calculations inside components and use the resulting values directly. Strictly following CTR’s constraints to achieve a `ready-to-display` state would make the process extremely cumbersome and could even require writing the same component twice.'
      provider: openai
      model: gpt-5-6-sol-xhigh
