    fr-FR:
      text: 'C’est ce que j’appelle le **CTR (rendu à la compilation)**. Ses limites sont exactement les mêmes que celles du SSR : par exemple, `<!--seam:path-->` applique automatiquement un échappement HTML lors de l’insertion de texte (`&`, `<`, `>`, etc.) ; pour insérer du HTML brut, il faut employer explicitement `<!--seam:path:html-->`. Un chemin de données manquant devient une chaîne vide dans le texte `slot`, tandis que l’injection est omise dans l’attribut `slot`. Enfin, un bloc `each` est tout simplement ignoré s’il reçoit autre chose qu’un tableau. Ces comportements ne diffèrent pas fondamentalement des cas limites rencontrés avec un framework SSR : j’ai simplement déplacé l’étape de rendu du SSR vers la compilation, rien de plus. Lors de la **construction**, le **CTR** parcourt le produit cartésien de toutes les valeurs typées possibles des variables conditionnelles, en utilisant soit des valeurs fictives arbitraires générées automatiquement et conformes aux types, soit des valeurs fictives particulières définies par l’utilisateur (il n’est généralement pas nécessaire de fournir manuellement les valeurs requises pour générer toutes les variantes HTML, mais cela reste possible ; sinon, une valeur conforme à chaque type est choisie automatiquement). Chaque combinaison est rendue une fois, puis les résultats sont comparés afin de repérer les limites de tous les blocs conditionnels et de toutes les boucles, ce qui produit finalement un squelette HTML entièrement déployé. Mathématiquement, tant que les données fournies à l’exécution respectent ces définitions de types, elles peuvent toujours être injectées correctement dans ce squelette, puisque tous les chemins de branchement possibles ont déjà été énumérés exhaustivement lors de la compilation.'
