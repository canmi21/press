      review: false
    ja-JP:
      text: '**JTD（JSON 型定義）**は [RFC 8927](https://www.rfc-editor.org/rfc/rfc8927.html) で定義されており、空、参照、型（ブール値、文字列、タイムスタンプ、および各種精度の数値型）、列挙、要素、プロパティ、値、判別子という8つの**スキーマ形式**があります。さらに、どのスキーマにも `nullable` を指定できます。JTD の利点は言語をまたいで利用できることで、**JavaScript**、**Rust**、**Go** をはじめ、ほぼすべての言語に対応する型マッピングがあります。そのため、JTD は自然とフロントエンドとバックエンドをつなぐ橋渡しとなり、しかも媒体である **JSON** はもともと**フロントエンドとバックエンドの最小公分母**です。現実のウェブサイトにあるアプリケーションの **95%** は、文字列や数値フィールドを表示するか、ブール値で判定する程度にすぎず、そのすべてがこの範囲に収まります。この点が明確になれば、実際に扱える余地はかなり広がります。もちろん JTD も完璧ではなく、**Markdown** のような例外もありますが、それについては後で詳しく説明します。実のところ、ここにこそ私が `SSR` の意義を本当に認める理由があります。'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:31:23.187195Z
      seconds: 69.134337584
      tokens: 19307
      review: false
    ko-KR:
      text: '**JTD(JSON 타입 정의)**는 [RFC 8927](https://www.rfc-editor.org/rfc/rfc8927.html)에 정의되어 있으며, 빈 형식, 참조, 타입(불리언, 문자열, 타임스탬프 및 다양한 정밀도의 숫자 타입), 열거형, 요소, 속성, 값, 판별자라는 여덟 가지 **스키마 형식**이 있습니다. 여기에 모든 스키마를 `nullable`로 표시할 수도 있습니다. JTD의 장점은 언어를 가리지 않는다는 데 있습니다. **JavaScript**, **Rust**, **Go**를 비롯한 거의 모든 언어에서 대응하는 타입 매핑을 찾을 수 있습니다. 덕분에 JTD는 자연스럽게 프런트엔드와 백엔드를 잇는 다리가 되며, 그 매개체인 **JSON** 자체가 원래 **프런트엔드와 백엔드의 최소 공통분모**이기도 합니다. 현실 세계의 웹 애플리케이션 중 **95%**는 문자열이나 숫자 필드를 표시하거나 불리언 값으로 판단하는 정도에 불과하며, 이 모든 것이 해당 범위에 들어갑니다. 이 점이 명확해지면 실제로 활용할 수 있는 여지는 매우 커집니다. 물론 JTD도 완벽하지 않아 **Markdown** 같은 예외가 있지만, 이에 대해서는 뒤에서 자세히 이야기하겠습니다. 사실 바로 이 지점에서 저는 `SSR`의 진정한 의미를 인정합니다.'
      provider: openai
