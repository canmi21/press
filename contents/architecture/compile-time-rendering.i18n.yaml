      text: 'Il existe cependant une solution : en raison du fonctionnement du Web, le front-end ne peut exécuter que du JavaScript, et les composants ne peuvent donc naturellement fonctionner qu’en JS. Pour résoudre ce problème, le back-end doit par conséquent pouvoir exécuter du JS ; un projet TypeScript complet peut simplement utiliser son environnement d’exécution existant. Avec Rust, il suffit d’intégrer un minuscule environnement d’exécution JS tel que QuickJS. Précisons qu’ici, l’environnement d’exécution JavaScript n’implémente qu’un sous-ensemble standard de JS et n’a rien à voir avec ceux de Bun ou de Node, qui fournissent des API complètes de système d’exploitation. Il ne sert réellement qu’à déduire et à dériver des données.'
