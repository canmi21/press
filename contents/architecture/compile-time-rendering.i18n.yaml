    zh-CN:
      text: 这就是我所说的 **CTR（编译时渲染）**。它的限制其实与 SSR 完全相同：例如，`<!--seam:path-->` 插入文本时会自动进行 HTML 转义（包括 `&`、`<`、`>` 等字符）；如果需要插入原始 HTML，就必须显式使用 `<!--seam:path:html-->`。数据路径缺失时，文本 `slot` 会被替换为空字符串，属性 `slot` 则不会注入；如果 `each` 块收到的不是数组，也会直接跳过。这些行为与 SSR 框架中的边界情况本质上没有区别，我只是把 SSR 的渲染步骤提前到编译期执行，仅此而已。**CTR** 会在**构建期**对所有条件变量的类型取值进行笛卡尔积遍历，既可以自动生成任意符合类型的模拟值，也允许用户提供特殊的模拟值来覆盖默认值。一般无须手动编写生成各种 HTML 变体所需的模拟值，系统会自动传入符合相应类型的值，但你也可以自行指定。随后，每一种组合都会渲染一次，系统通过比较差异确定所有条件块与循环块的边界，最终得到一个完全展开的 HTML 骨架。从数学上讲，只要运行时传入的数据符合这些类型定义，就一定能够正确注入这个骨架，因为所有可能的分支路径都已经在编译期穷举完毕。
      provider: openai
      model: gpt-5-6-sol-xhigh
