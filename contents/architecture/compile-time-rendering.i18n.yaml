    en-US:
      text: 'This is what I mean by **CTR (Compile-Time Rendering)**. Its limitations are exactly the same as those of SSR: for example, `<!--seam:path-->` automatically performs HTML escaping when inserting text (`&`, `<`, `>`, and so on), while inserting raw HTML requires the explicit use of `<!--seam:path:html-->`; a missing data path becomes an empty string in text `slot`, while injection is skipped in attribute `slot`; and a `each` block is simply skipped if it receives anything other than an array. These behaviors are fundamentally no different from the edge cases encountered in SSR frameworks—I have merely moved SSR’s rendering step to compile time. That is all. During **build time**, **CTR** traverses the Cartesian product of every possible typed value for all conditional variables, using either arbitrary generated mock values that satisfy those types or special mock values supplied through user overrides (you normally do not need to provide the mock values required to generate every HTML variant manually, though you can; otherwise, a suitable value for each type is selected automatically). It renders every combination once, compares the results to identify the boundaries of all conditional and loop blocks, and ultimately produces a fully expanded HTML skeleton. Mathematically, as long as the data supplied at runtime conforms to these type definitions, it can always be injected into the skeleton correctly, because every possible branch path has already been exhaustively enumerated at compile time.'
