  648829f27f27ca013ea5ee55b54ac91a:
    de-DE:
      text: 'Ich stand jedoch vor einer weiteren Herausforderung als andere Frameworks: Da das Backend von der **JavaScript**-Laufzeitumgebung befreit ist, muss es nicht mehr eins mit dem Frontend sein – man kann das Backend problemlos in **Rust** oder **Go** schreiben. In einem **TypeScript**-Fullstack-Framework kann die Konsistenz zwischen Frontend und Backend direkt über Typen gewährleistet werden; aber wie sieht es bei anderen Sprachen aus? Tatsächlich habe ich hier **codegen** eingesetzt: Unabhängig davon, in welcher Sprache das Backend geschrieben ist, dient das Backend als Referenz, und die vom Frontend verwendbaren Variablen und Typen werden direkt in **TypeScript** **codegen**iert, damit das Frontend sie importieren kann. Obwohl die Grenze zwischen Frontend und Backend dadurch klar gezogen ist, können sie wie bei einem **TypeScript**-Fullstack-Framework tatsächlich in einem einzigen Ordner leben, was den **Monorepo**-Gepflogenheiten entspricht. Sie können sich direkt gegenseitig aufrufen, ohne dass man APIs oder Dinge wie `gen` **OpenAPI** manuell schreiben muss. Tatsächlich habe ich hier einen privaten Pfad `/_seam/` als Standard-Endpunkt des Frameworks verwendet (der wie bei Nuxt konfigurierbar ist). Durch das Ausführen von `JTD Typed-RPC` werden somit die Probleme von Datenübertragung und CORS gelöst.'
      provider: google
      model: gemini-3-6-flash-high
      at: 2026-08-01T01:45:46.187933Z
      seconds: 13.430000416
      tokens: 19331
      review: false
    en-US:
      text: "However, I face one more challenge than other frameworks: since the backend is liberated from the **JavaScript** runtime, it no longer needs to be tied to the frontend—you can completely use **Rust** or **Go** to write the backend. In a **TypeScript** full-stack framework, frontend-backend consistency can be guaranteed directly through types; but what about other languages? In fact, I used **codegen** here: regardless of what language the backend is written in, the backend serves as the source of truth, and the variables and types usable by the frontend are directly **codegen**ned into **TypeScript** for the frontend to import. This way, although the boundary between frontend and backend is clearly drawn, they can actually live in a single folder just like a **TypeScript** full-stack framework, fitting **Monorepo** conventions and allowing direct mutual invocation without manually writing APIs or things like `gen` **OpenAPI**. In fact, I used a private path `/_seam/` as the framework's default endpoint (which is configurable, just like Nuxt), so running `JTD Typed-RPC` resolves the issues of data transmission and CORS."
      provider: google
      model: gemini-3-6-flash-high
      at: 2026-08-01T01:45:46.187933Z
      seconds: 13.430000416
      tokens: 19331
      review: false
    es-ES:
