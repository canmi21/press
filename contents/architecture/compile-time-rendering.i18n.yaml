  6c50245db5ab6c44c41bcec16801afba:
    de-DE:
      text: 'Schließlich ist da der Vergleich mit traditionellem SSG: Ich habe das Gleiche erreicht wie SSG – im Grunde alles vorab zu rendern, was sich zur Kompilierzeit bestimmen lässt. Aber wir sind noch **dynamischer**, da jene Werte von einfachen `slot`-Typen zur Laufzeit vollständig ersetzt werden können. **Man kann es so verstehen, dass wir SSG zu einer Art Einstiegspunkt für eine MPA rendern: Vor der Hydratisierung ist es eine MPA, nach der Hydratisierung wird es zu einer SPA, während die „dynamische“ Fähigkeit erhalten bleibt.**'
      provider: google
      model: gemini-3-6-flash-high
      at: 2026-08-01T01:45:48.040065Z
      seconds: 9.838592292
      tokens: 16486
      review: false
    en-US:
      text: 'Finally, there is the comparison with traditional SSG. I''ve achieved the same thing as SSG—essentially rendering everything that can be determined at compile time; but we are more **dynamic**, because those simple-type `slot` values can be completely replaced at runtime. **You can think of it as rendering SSG into a kind of entry point for an MPA: before hydration it''s an MPA, after hydration it becomes an SPA, while retaining "dynamic" capabilities.**'
      provider: google
      model: gemini-3-6-flash-high
      at: 2026-08-01T01:45:48.040065Z
      seconds: 9.838592292
      tokens: 16486
      review: false
    es-ES:
      text: 'Por último, está la comparación con el SSG tradicional. He logrado lo mismo que el SSG: esencialmente renderizar todo lo que se puede determinar en tiempo de compilación; pero somos más **dinámicos**, porque esos valores de `slot` de tipos simples se pueden reemplazar por completo en tiempo de ejecución. **Puedes entenderlo como si renderizáramos el SSG en una especie de punto de entrada para una MPA: antes de la hidratación es una MPA, después de la hidratación se convierte en una SPA, manteniendo al mismo tiempo la capacidad "dinámica".**'
      provider: google
