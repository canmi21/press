    de-DE:
      text: 'Das ist, was ich mit **CTR (Rendering zur Kompilierzeit)** meine. Die Einschränkungen sind genau dieselben wie bei SSR: So nimmt `<!--seam:path-->` beim Einfügen von Text automatisch eine HTML-Escapierung vor (`&`, `<`, `>` und so weiter); zum Einfügen von unverarbeitetem HTML muss dagegen ausdrücklich `<!--seam:path:html-->` verwendet werden. Ein fehlender Datenpfad wird in Text `slot` zu einer leeren Zeichenfolge, während die Einfügung in Attribut `slot` übersprungen wird. Ein `each`-Block wird ebenfalls einfach übersprungen, wenn er kein Array erhält. Diese Verhaltensweisen unterscheiden sich grundsätzlich nicht von den Grenzfällen eines SSR-Frameworks – ich habe lediglich den Render-Schritt von SSR in die Kompilierzeit verlegt. Mehr ist es nicht. Zur **Build-Zeit** durchläuft **CTR** das kartesische Produkt aller möglichen typisierten Werte sämtlicher Bedingungsvariablen und verwendet dabei entweder beliebige automatisch erzeugte typkonforme Testwerte oder besondere, vom Benutzer überschriebene Testwerte (normalerweise müssen die zur Erzeugung aller HTML-Varianten benötigten Werte nicht manuell angegeben werden, es ist aber möglich; andernfalls wird automatisch ein zum jeweiligen Typ passender Wert gewählt). Jede Kombination wird einmal gerendert; anschließend werden die Ergebnisse verglichen, um die Grenzen aller Bedingungs- und Schleifenblöcke zu bestimmen und schließlich ein vollständig entfaltetes HTML-Gerüst zu erhalten. Mathematisch betrachtet lassen sich die zur Laufzeit übergebenen Daten immer korrekt in dieses Gerüst einfügen, solange sie den Typdefinitionen entsprechen, denn sämtliche möglichen Verzweigungspfade wurden bereits zur Kompilierzeit vollständig durchlaufen.'
