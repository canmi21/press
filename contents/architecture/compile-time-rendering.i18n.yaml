    ja-JP:
      text: もちろん **Serverless** の可能性も欠かせません。ここ数年、 **Serverless** の体験は非常に素晴らしいと言え、私としては「費用がかかること以外に欠点はない」と評価しています。しかし、CTR は本質的にこのシナリオに非常に適しています。私たちのランタイムで行う処理は非常に軽量で小さいため、Serverless 上で動かすと非常に高速になり、レスポンス時間とオーバーヘッドの両方が大幅に改善されます。改善できない残りの部分は Markdown のレンダリングのようなシナリオですが、それはビジネスロジックで最適化すべきことです。例えば、Markdown を事前にレンダリングして保存しておき、リクエストごとに再レンダリングしないようにすることです。これはまさに私のこのウェブサイトで行っている通りです。これはビジネス層の問題であり、フレームワークが解決できるものではありませんが、フレームワークはそれ以外のシンプルなロジックのオーバーヘッドをほぼゼロに抑える手助けができます。従来の SSR と比較すると、オーバーヘッドの桁が全く違います。どれくらい小さいかというと、およそ数百 us 〜 1ms 程度の話であり、これは従来の SSR では考えられないことです。
