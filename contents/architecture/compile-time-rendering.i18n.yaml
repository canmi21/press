      seconds: 105.432709084
      tokens: 20795
      review: false
    en-US:
      text: 'Returning to `raw HTML slot`, this solution is mainly intended for scenarios such as `Markdown` and `Rich Text`. The rendered **HTML** is injected through `dangerouslySetInnerHTML`; after :tn[hydration]{is="The original used 水, literally water and also internet slang for low-effort filler, joking that migration and benchmarking could pad out another article."}, this region does not participate in interactions and is **“dead”**. This content should be minimized: if you want to add borders or styling to an article, those should be written as React components rather than mixed into this HTML. The drawback is that it cannot change after hydration, but under this assumption it does reduce the cost of “SSR” to an extremely low level, approaching zero cost. In scenarios that genuinely require SSR, roughly 60% involve this kind of static HTML injection; only the remaining 40% need RSC’s ability to execute arbitrary components on the server.'
