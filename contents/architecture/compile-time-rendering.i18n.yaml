      text: 그렇다면 **Seam**과 **SeamJS**의 관계 때문에 벌써 머리가 복잡해졌을지도 모르겠다. 사실 둘의 관계는 아주 간단하다. Seam은 프로토콜로, `Sentinel`을 사용해 동적 위치를 표시하는 방법, 이를 `slot` 표식으로 변환하는 방법, `diff`으로 조건 블록과 반복 블록을 감지하는 방법, 그리고 실행 중 **추상 구문 트리**를 바탕으로 데이터를 주입하는 방법을 정의한다. 프로토콜 자체는 언어에 독립적이므로 **HTML** 주석을 분석하고 문자열을 치환할 수 있는 백엔드라면 어디서든 구현할 수 있다. **SeamJS**는 이 프로토콜을 구체적으로 구현한 프레임워크다. **Vite**, **TanStack Router**, **TanStack Query** 같은 기존 도구를 :tn[한데 꿰매고]{is="중국어 원문의 동사 féng은 기존 도구를 바느질하듯 이어 붙인다는 뜻으로, Seam이라는 이름의 본래 의미인 이음새와도 맞닿아 있다."}, 이들이 다루지 못하는 부분을 내 **골격** 추출 기능과 주입 엔진, **명령줄 인터페이스** 등으로 보완한다.
      provider: openai
