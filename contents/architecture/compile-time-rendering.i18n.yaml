  0e1434b80402c02fdc8b7a74be1e70ae:
    de-DE:
      text: 'An diesem Punkt ist Ihnen vielleicht schon aufgefallen, dass diese `slot` **„Slots mit Typmarkierungen“** sind. Die Aufgabe der serverseitigen Laufzeitumgebung wird nun denkbar einfach: Sie nimmt die echten Daten entgegen und füllt damit diese Lücken – nichts weiter als reine Textersetzung. `renderToString()`, eine JavaScript-Laufzeitumgebung oder `vDOM` werden überhaupt nicht benötigt. Jede Sprache, die **HTML**-Kommentare auswerten und **Text ersetzen** kann, eignet sich als Backend – Rust, Go und TypeScript funktionieren alle. Deshalb handelt es sich um ein Protokoll und nicht um ein Framework.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:16:05.711148Z
      seconds: 45.608231583
      tokens: 18475
      review: false
    en-US:
      text: 'By this point, you may already have realized that these `slot` are **“slots with type markers.”** What the server-side runtime has to do now is extremely simple: obtain the real data and fill these holes with values—just plain string replacement. There is absolutely no need for `renderToString()`, a JavaScript runtime, or `vDOM`. Any language that can parse **HTML** comments and perform **string replacement** can serve as the backend—Rust, Go, and TypeScript all work. That is why this is a protocol rather than a framework.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:16:05.711148Z
      seconds: 45.608231583
      tokens: 18475
      review: false
    es-ES:
      text: 'A estas alturas, quizá ya hayas visto que estos `slot` son **«espacios con marcadores de tipo»**. En este punto, la tarea del entorno de ejecución del servidor se vuelve extremadamente sencilla: obtener los datos reales y rellenar estos huecos con sus valores mediante una mera sustitución de cadenas. No hace falta en absoluto `renderToString()`, ni un entorno de ejecución de JavaScript, ni `vDOM`. Cualquier lenguaje capaz de analizar comentarios **HTML** y realizar una **sustitución de cadenas** puede usarse en el servidor; Rust, Go y TypeScript sirven por igual. Por eso es un protocolo y no un marco de trabajo.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:16:05.711148Z
      seconds: 45.608231583
      tokens: 18475
      review: false
    fr-FR:
      text: 'À ce stade, vous avez peut-être déjà compris que ces `slot` sont des **« emplacements munis d’un marqueur de type »**. Le rôle de l’environnement d’exécution côté serveur devient alors extrêmement simple : récupérer les données réelles et insérer les valeurs dans ces trous, par un simple remplacement de chaînes de caractères. Nul besoin de `renderToString()`, d’un environnement d’exécution JavaScript ou de `vDOM`. Tout langage capable d’analyser des commentaires **HTML** et d’effectuer un **remplacement de chaînes de caractères** peut servir de moteur côté serveur : Rust, Go et TypeScript conviennent tous. Voilà pourquoi il s’agit d’un protocole et non d’un cadre logiciel.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:16:05.711148Z
      seconds: 45.608231583
      tokens: 18475
      review: false
