    fr-FR:
      text: C'est ce que j'appelle le **CTR (Compile-Time Rendering)**. Quant aux limitations, elles sont en fait exactement identiques à celles du SSR. Par exemple, lorsque `<!--seam:path-->` effectue une insertion de texte, il réalise automatiquement un échappement HTML (`&`, `<`, `>`, etc.) ; si vous devez insérer du HTML brut, vous devez utiliser explicitement `<!--seam:path:html-->` ; les chemins de données manquants deviennent des chaînes vides dans le texte `slot` et sautent l'injection dans l'attribut `slot` ; et si le bloc `each` ne reçoit pas un tableau, il est directement ignoré. Ces comportements ne diffèrent pas fondamentalement des cas limites que vous rencontrez dans les frameworks SSR—j'ai simplement déplacé l'étape de rendu du SSR pour l'exécuter au moment de la compilation, c'est tout. De son côté, le **CTR** effectue au moment du **build-time** une traversée en produit cartésien sur toutes les valeurs de types des variables conditionnelles, en utilisant soit une valeur Mock quelconque correspondant au type, soit une valeur Mock spéciale surchargée (Override) par l'utilisateur (généralement, il n'est pas nécessaire d'écrire manuellement les valeurs Mock requises pour générer les variantes HTML, mais vous pouvez les fournir manuellement ; sinon, une valeur correspondant à votre type est automatiquement injectée). De cette façon, chaque combinaison est rendue une fois pour différencier (diff) les limites de tous les blocs conditionnels et blocs de boucle, ce qui permet d'obtenir au final un squelette HTML entièrement déployé. D'un point de vue mathématique, tant que les données transmises au runtime se conforment à ces définitions de types, elles seront obligatoirement injectées correctement dans ce squelette, car tous les chemins de branches possibles ont déjà été exhaustativement parcourus lors de la compilation.
