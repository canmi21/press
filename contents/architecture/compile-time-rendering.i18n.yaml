      text: 'Abschließend noch der Vergleich mit traditionellem SSG: Ich habe dasselbe erreicht wie SSG – im Wesentlichen wird alles, was zur Kompilierzeit feststeht, vollständig gerendert. Wir sind jedoch **dynamischer**, denn `slot`-Werte einfacher Typen lassen sich zur Laufzeit vollständig ersetzen. **Man kann es sich so vorstellen: Wir haben SSG als eine Art Einstiegspunkt für eine MPA gerendert. Vor der Hydration ist es eine MPA, danach wird es zu einer SPA, wobei die „dynamischen“ Fähigkeiten erhalten bleiben.**'
