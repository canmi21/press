    de-DE:
      text: Diese `%%SEAM:...%%` sind **Wächterwerte**, die die Position jedes dynamischen Werts besetzen. Nachdem React mit diesen **Wächterdaten** `renderToString()` ausgeführt hat, sind diese Positionen im erzeugten **HTML** markiert. Anschließend wandelt die Erstellungspipeline die Wächterwerte in Platzmarkierungen in Form von HTML-Kommentaren um.
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:17:25.267162Z
      seconds: 57.2430855
      tokens: 19166
      review: false
    en-US:
      text: These `%%SEAM:...%%` are **sentinels**, holding the position of every dynamic value. After React runs `renderToString()` with this **sentinel** data, those positions are marked in the resulting **HTML**. The build pipeline then converts the sentinels into slot markers formatted as HTML comments.
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-10T05:17:25.267162Z
      seconds: 57.2430855
      tokens: 19166
      review: false
