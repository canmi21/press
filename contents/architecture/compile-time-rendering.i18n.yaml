    fr-FR:
      text: "Dans **JTD (JSON Type Definition)** [RFC 8927](https://www.rfc-editor.org/rfc/rfc8927.html), huit **Schema Form** sont définies : Empty, Ref, Type (boolean, string, timestamp ainsi que divers types numériques de différentes précisions), Enum, Elements, Properties, Values, Discriminator, et tout schema peut également être marqué comme `nullable`. L'avantage de JTD est qu'il est agnostique du langage : **JavaScript**, **Rust**, **Go**—presque tous les langages possèdent un mappage de types correspondant, ce qui en fait naturellement un pont entre le frontend et le backend. De plus, son support est le **JSON**, qui est à la base le **plus petit dénominateur commun entre frontend et backend**. Dans le monde réel, **95 %** des applications web ne font rien d'autre qu'afficher des chaînes de caractères, des champs numériques ou faire des évaluations avec des booléens, ce qui entre entièrement dans ce cadre. Une fois cela clarifié, la marge de manœuvre dont nous disposons devient très vaste. Bien sûr, JTD n'est pas parfait et il existe des exceptions comme **Markdown**, mais nous y reviendrons en détail plus tard ; c'est d'ailleurs ici que je reconnais vraiment toute la valeur de `SSR`."
