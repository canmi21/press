    es-ES:
      text: 'Puede que a estas alturas te hayas hecho un lío con la relación entre **Seam** y **SeamJS**. En realidad es muy sencillo: Seam es el protocolo. Define cómo marcar las posiciones dinámicas con `Sentinel`, cómo eso se convierte en marcadores `slot`, cómo se hace la detección `diff` de los bloques condicionales y de bucle, y cómo el runtime inyecta los datos a partir del **AST**. El protocolo en sí es independiente del lenguaje: cualquier backend capaz de analizar comentarios **HTML** y hacer sustitución de cadenas puede implementarlo. **SeamJS** es el framework, una implementación concreta construida sobre ese protocolo. :tn[Cose]{is="El original usa 缝, «coser», que es justamente el significado chino del nombre del framework, Seam («costura»). Así la frase explica de pasada de dónde viene el nombre."} entre sí ruedas ya existentes como **Vite**, **TanStack Router** y **TanStack Query**, y luego cubre lo que ellas no alcanzan: mi extracción de **skeleton**, el motor de inyección, la **CLI** y demás.'
