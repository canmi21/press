    en-US:
      text: But in fact, I came up with what could be considered a clever `Pipeline` to achieve this, which is also why I need to call it a kind of `Protocol`. Besides, I've always felt that full-stack frameworks blurring the boundary between frontend and backend is a pretty foolish thing (though I have to admit Next.js has done a great job with DX in this regard in recent years, making many beginners feel that writing a full-stack application is a very simple matter, when in reality many security risks stem from this—anyway, getting off topic).
