    ko-KR:
      text: '**JTD (JSON Type Definition)** [RFC 8927](https://www.rfc-editor.org/rfc/rfc8927.html) 정의에는 8가지 **Schema Form**이 존재합니다: Empty, Ref, Type(boolean, string, timestamp 및 다양한 정밀도의 숫자 유형), Enum, Elements, Properties, Values, Discriminator이며, 여기에 추가로 임의의 schema를 `nullable`로 표시할 수 있습니다. JTD의 장점은 언어에 종속되지 않는다는 점으로, **JavaScript**, **Rust**, **Go** 등 거의 모든 언어에서 대응하는 타입 매핑을 찾을 수 있습니다. 이로 인해 자연스럽게 프론트엔드와 백엔드 사이의 교량 역할을 하게 되며, 매개체가 **JSON**이라는 점도 본래 **프론트엔드와 백엔드 간의 최소 공통 분모**입니다. 현실 세계의 웹사이트 응용 프로그램 중 **95%**는 문자열이나 숫자 필드를 표시하거나 불리언 값으로 판단을 내리는 것에 불과하며, 이들은 모두 이 범위 내에 들어옵니다. 이 점을 명확히 하고 나면 실제로 우리가 활용할 수 있는 공간이 매우 넓어집니다. 물론 JTD가 완벽한 것은 아니며 **Markdown** 같은 예외도 존재하지만, 이에 대해서는 뒤에서 자세히 다루겠습니다. 사실 바로 이 지점이 제가 `SSR`의 진정한 의미를 인정하는 부분입니다.'
