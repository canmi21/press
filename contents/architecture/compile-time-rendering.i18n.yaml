    ja-JP:
      text: しかし、実は解決策があります。Web の性質上、フロントエンドでは JavaScript しか実行できず、当然コンポーネントも JS でしか動かせません。そのため、この問題を解決するにはバックエンドにも JS の実行能力が必要です。TypeScript のフルスタックプロジェクトなら既存のランタイムをそのまま利用でき、Rust なら QuickJS のようなごく小さな JS ランタイムを組み込むだけで済みます。ここでいう JavaScript ランタイムは標準 JS の一部だけを実装したもので、完全な OS API を備える Bun や Node のようなランタイムとはまったく異なります。本当にデータの導出だけに使われます。
