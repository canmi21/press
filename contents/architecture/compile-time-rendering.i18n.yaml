    fr-FR:
      text: "Bien sûr, la possibilité du **Serverless** ne doit pas non plus être oubliée. Ces dernières années, l'expérience du **Serverless** s'est avérée excellente, et je l'évaluerais comme « n'ayant aucun inconvénient à part être coûteux ». Cependant, CTR est naturellement très adapté à ce scénario : ce que notre runtime fait est très léger et réduit, donc s'exécuter sur Serverless sera extrêmement rapide, et le temps de réponse tout comme le surcoût seront nettement améliorés. La seule partie restante qui ne peut pas être améliorée concerne les scénarios comme le rendu de Markdown, mais cela devrait être entièrement optimisé dans la logique métier, par exemple en pré-rendant le Markdown pour le stocker afin de ne pas avoir à le rendre à nouveau à chaque requête, tout comme le fait mon site web actuel. C'est un problème de niveau métier et non quelque chose qu'un framework peut résoudre, mais le framework peut vous aider à réduire le surcoût de ces logiques simples en dehors de cela à presque zéro. Comparé au SSR traditionnel, il ne s'agit plus du même ordre de grandeur de surcoût ; à quel point est-ce petit ? Il s'agit d'environ quelques centaines de us ~ 1 ms, ce à quoi le SSR traditionnel n'oserait même pas rêver."
      provider: google
