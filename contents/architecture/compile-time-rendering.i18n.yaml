    zh-CN:
      text: 再来说说 **RSC（React 服务端组件）**。之前提到过，**RSC** 可能是一个错误，~~因为它模糊了太多前后端边界~~，~~带来了**不少安全隐患**~~，~~还引发了众多 CVE~~。但这些问题其实更多要归咎于 **Next.js** 和其他服务端渲染流程：**用户根本没有不用它的余地**，仿佛只要需要动态内容，就必须采用 **SSR**。但实际上，像我们这样替换字符串也完全行得通。另外不得不承认，**RSC** 赋予了服务端一项非常重要的能力：渲染任意 React 组件，也就是执行任意代码。
