    de-DE:
      text: Die gute Nachricht ist also, dass `raw HTML slot` tatsächlich die Koexistenz von `CTR` und `SSR` ermöglicht. Das bedeutet, dass der Großteil der UI Ihrer Seite mit `CTR` erstellt wird, mit nahezu keinen Laufzeitkosten; und für den zentralen **Markdown**-Artikel verwenden Sie `SSR` zum Rendern. Da das Backend befreit wurde, können Sie TypeScript verwenden, um Ihre ursprüngliche `SSR`-Render-Methode zu importieren, oder Sie können den Horizont erweitern! Wenn das Backend Rust verwendet, nutzen Sie natürlich den Markdown-Compiler von Rust zum Rendern. Solange am Ende ein HTML-String bereitgestellt und in dieses `raw slot` eingefügt wird, kann er angezeigt werden. Die Verwendung von `CTR` bedeutet nicht, dass Sie `SSR` nicht verwenden können – beide können vollkommen koexistieren.
