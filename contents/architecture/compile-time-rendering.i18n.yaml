  e5f922120429435a0094d32102727c01:
    de-DE:
      text: 'Das ist das, was ich als **CTR (Compile-Time Rendering)** bezeichne. Was die Einschränkungen betrifft, so entsprechen sie genau denen von SSR: Zum Beispiel wird beim Einfügen von Text über `<!--seam:path-->` automatisch eine HTML-Maskierung durchgeführt (`&`, `<`, `>` usw.); wenn Sie rohes HTML einfügen müssen, müssen Sie explizit `<!--seam:path:html-->` verwenden; fehlende Datenpfade werden im Text `slot` zu leeren Zeichenketten und überspringen die Injektion im Attribut `slot`; wenn ein `each`-Block kein Array erhält, wird er direkt übersprungen. Diese Verhaltensweisen unterscheiden sich im Wesentlichen nicht von den Grenzfällen, auf die Sie in SSR-Frameworks stoßen—ich habe lediglich den Rendering-Schritt von SSR in die Kompilierungsphase verlagert, mehr nicht. **CTR** führt zur **build-time** eine Kartesisches-Produkt-Traversierung über die Typwerte aller Bedingungsvariablen durch und verwendet entweder einen gemockten beliebigen Wert, der dem Typ entspricht, oder einen vom Benutzer überschriebenen (Override) speziellen Mock-Wert (normalerweise müssen Sie die für die Generierung von HTML-Varianten erforderlichen Mock-Werte nicht manuell schreiben, können sie aber manuell angeben; ansonsten wird automatisch ein für Ihren Typ passender Wert eingesetzt). Auf diese Weise wird jede Kombination einmal gerendert, um die Grenzen aller Bedingungs- und Schleifenblöcke zu diffen, was schließlich zu einem vollständig entfalteten HTML-Skelett führt. Mathematisch gesehen kann das Datenmaterial, solange es zur Runtime den Typdefinitionen entspricht, garantiert korrekt in dieses Skelett injiziert werden, da alle möglichen Zweigpfade bereits zur Kompilierungszeit durchprobiert wurden.'
      provider: google
      model: gemini-3-6-flash-high
      at: 2026-08-01T01:47:22.895431Z
      seconds: 15.052362125
      tokens: 20832
      review: false
    en-US:
      text: This is what I call **CTR (Compile-Time Rendering)**. As for its limitations, they are identical to those of SSR. For example, when `<!--seam:path-->` performs text insertion, it automatically performs HTML escaping (`&`, `<`, `>`, etc.); if you need to insert raw HTML, you must explicitly use `<!--seam:path:html-->`; missing data paths become empty strings in text `slot` and skip injection in attribute `slot`; and if a `each` block receives anything other than an array, it skips it directly. These behaviors are essentially no different from the edge cases you encounter in SSR frameworks—I have simply moved the rendering step of SSR to be executed at compile time, nothing more. Meanwhile, **CTR** performs a Cartesian product traversal of the type values of all conditional variables at **build-time**, using either an arbitrarily mocked value that matches the type or a custom mock value overridden by the user (normally, you don't need to manually write the mock values required to generate HTML variants, but you can provide them manually—otherwise it just automatically supplies a value matching your type). In this way, each combination is rendered once to diff the boundaries of all conditional blocks and loop blocks, ultimately producing a fully expanded HTML skeleton. Mathematically speaking, as long as the data passed in at runtime conforms to these type definitions, it is guaranteed to be correctly injected into this skeleton, as all possible branch paths have already been exhausted at compile time.
      provider: google
      model: gemini-3-6-flash-high
      at: 2026-08-01T01:47:22.895431Z
      seconds: 15.052362125
      tokens: 20832
      review: false
    es-ES:
      text: 'Esto es lo que llamo **CTR (Compile-Time Rendering)**. En cuanto a las limitaciones, son exactamente las mismas que las del SSR. Por ejemplo, cuando `<!--seam:path-->` realiza una inserción de texto, realiza automáticamente el escape de HTML (`&`, `<`, `>`, etc.); si necesitas insertar HTML sin procesar, debes usar explícitamente `<!--seam:path:html-->`; las rutas de datos que faltan se convierten en cadenas vacías en el texto `slot` y omiten la inyección en el atributo `slot`; y si un bloque `each` recibe algo que no es un arreglo, simplemente se omite. Estos comportamientos no son esencialmente diferentes de los casos límite que encuentras en los frameworks SSR: simplemente he trasladado el paso de renderizado del SSR para ejecutarlo en tiempo de compilación, nada más. Por su parte, **CTR** realiza en el **build-time** un recorrido de producto cartesiano sobre los valores de tipo de todas las variables condicionales, utilizando un valor Mock arbitrario que coincida con el tipo o un valor Mock especial sobrescrito (Override) por el usuario (por lo general, no es necesario escribir manualmente los valores Mock requeridos para generar las variantes de HTML, pero se pueden proporcionar manualmente; de lo contrario, se ingresa automáticamente un valor que coincida con tu tipo). De esta manera, cada combinación se renderiza una vez para calcular las diferencias (diff) de los límites de todos los bloques condicionales y bloques de bucle, obteniendo finalmente un esqueleto HTML completamente desplegado. Desde el punto de vista matemático, siempre que los datos pasados en el runtime cumplan con estas definiciones de tipo, se garantiza que se inyectarán correctamente en este esqueleto, ya que todas las posibles rutas de ramificación ya se han exhaustado en tiempo de compilación.'
