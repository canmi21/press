    zh-TW:
      text: 把渲染放到編譯期聽起來是一件很荒謬的事情，因為 SSR 存在的核心理由就是有些值、有些條件，不到執行期那個點上你根本解不出來，你不知道它是什麼，做不了判斷。所以我想大多數人第一時間否決我的想法也不是沒有道理，可以理解。
