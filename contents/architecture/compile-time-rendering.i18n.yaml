  3b94504af8ec2a3de06ab1561f14f389:
    de-DE:
      text: 'Zurück zu `raw HTML slot`: Gelöst werden damit vor allem Fälle wie `Markdown` und `Rich Text` — das gerenderte **HTML** wird über `dangerouslySetInnerHTML` eingefügt, und nach der Hydration nimmt dieser Bereich an keiner Interaktion mehr teil, er ist **"tot"**. Dieser Anteil sollte so klein wie möglich bleiben: Wenn du dem Artikel Rahmen oder Styling geben willst, gehört das in React-Komponenten und nicht in dieses Stück HTML hinein. Der Nachteil ist, dass sich daran nach der Hydration nichts mehr ändern lässt, aber es drückt die Kosten für "SSR" unter diesen Voraussetzungen tatsächlich auf ein sehr niedriges Niveau, nahe an Zero Cost. Von den Fällen, die wirklich SSR brauchen, sind etwa 60% genau dieses Einfügen von statischem HTML; erst die restlichen 40% brauchen das, was RSC bietet: das Ausführen beliebiger Komponenten auf dem Server.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:30:55.208746Z
      seconds: 35.653578459
      tokens: 31665
      review: false
    en-US:
      text: 'Coming back to `raw HTML slot`: what it really solves are scenarios like `Markdown` and `Rich Text` — the rendered **HTML** is injected through `dangerouslySetInnerHTML`, and after hydration that region takes no part in interaction; it is **"dead"**. This part should be kept to a minimum: if you want to give an article borders or styling, that belongs in React components, not mixed into this stretch of HTML. The drawback is that it cannot change after hydration, but it does push the cost of "SSR" under these conditions down to almost nothing, close to zero cost. Of the cases that genuinely need SSR, roughly 60% are this kind of static HTML injection; only the remaining 40% need what RSC offers — executing arbitrary components on the server.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:30:55.208746Z
