      text: "So, are you already confused by the relationship between **Seam** and **SeamJS**? In fact, these two are very simple: Seam is a protocol. It defines how to use `Sentinel` to mark dynamic positions, how to convert them into `slot` markers, how to perform `diff` detection for conditional and loop blocks, and how to perform data injection based on the **AST** at runtime. The protocol itself is language-agnostic; any backend that can parse **HTML** comments and perform string replacement can implement it. **SeamJS** is a framework, a concrete implementation built on top of this protocol. It stitches together existing wheels like **Vite**, **TanStack Router**, and **TanStack Query**, and then fills in the gaps they don't cover, such as my **skeleton** extraction, injection engine, **CLI**, and the like."
