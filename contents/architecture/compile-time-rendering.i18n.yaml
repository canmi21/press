    en-US:
      text: 'So maybe you''re already tangled up in how **Seam** and **SeamJS** relate to each other. It''s actually simple: Seam is the protocol. It defines how you mark dynamic positions with `Sentinel`, how those turn into `slot` markers, how `diff` detection works for conditional and loop blocks, and how the runtime injects data based on the **AST**. The protocol itself is language-agnostic; any backend that can parse **HTML** comments and do string replacement can implement it. **SeamJS** is the framework, one concrete implementation built on that protocol. It :tn[stitches together]{is="The original says 缝, ‘to sew/stitch’ — the same character that gives Seam its name in Chinese, so the sentence quietly explains the framework''s name while describing what it does."} existing wheels like **Vite**, **TanStack Router** and **TanStack Query**, then fills in what they don''t cover: my **skeleton** extraction, the injection engine, the **CLI**, and so on.'
