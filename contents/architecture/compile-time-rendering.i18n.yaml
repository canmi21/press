    es-ES:
      text: 'Ese es el arte de los comentarios: aquí se eligieron comentarios simplemente porque resultan ser caracteres HTML válidos, nada más. Entonces, ¿cómo se determinan y generan estos bloques condicionales y de bucle en **build-time**? En realidad es un método bastante ingenioso: aunque no tenemos vDOM, podemos renderizar el HTML dos veces para hacer un Diff. Tomando la renderización condicional como ejemplo, la primera vez se renderiza con los datos Sentinel completos, y la segunda vez se establece un determinado campo `nullable` como `null` y se vuelve a renderizar. Al comparar ambas salidas, el bloque de HTML que desaparece es el bloque condicional controlado por ese campo, por lo que basta con envolverlo con `<!--seam:if:...-->`. Lo mismo se aplica a los arrays.'
      provider: google
      model: gemini-3-6-flash-high
      at: 2026-08-01T01:45:27.557677Z
      seconds: 9.315271334
      tokens: 16193
      review: false
    fr-FR:
      text: "C'est là tout l'art des commentaires : les commentaires ont été choisis ici simplement parce qu'ils s'avèrent être des caractères HTML valides, rien de plus. Alors, comment ces blocs conditionnels et ces boucles sont-ils déterminés et générés au **build-time** ? C'est en fait une méthode assez astucieuse : bien que nous n'ayons pas de vDOM, nous pouvons rendre l'HTML deux fois pour effectuer un Diff. Prenons l'exemple du rendu conditionnel : la première fois, on effectue le rendu avec la donnée Sentinel complète, et la deuxième fois, on définit un certain champ `nullable` à `null` avant de refaire le rendu. En comparant les deux sorties, le bloc HTML qui a disparu correspond au bloc conditionnel contrôlé par ce champ, qu'il suffit alors d'entourer avec `<!--seam:if:...-->`. La même logique s'applique aux tableaux."
      provider: google
      model: gemini-3-6-flash-high
      at: 2026-08-01T01:45:27.557677Z
      seconds: 9.315271334
      tokens: 16193
      review: false
    ja-JP:
      text: これがコメントの芸術であり、ここでコメントが選ばれたのは単にそれが合法的な HTML 文字だったからに過ぎません。では、これらの条件ブロックやループブロックは、どのようにして **build-time** に決定され、生成されるのでしょうか？ 実はこれも非常に巧みな方法で、vDOM がなくても HTML を2回レンダリングして Diff を取ることができます。条件付きレンダリングを例にとると、1回目は完全な Sentinel データでレンダリングし、2回目は特定の `nullable` フィールドを `null` に設定して再度レンダリングします。2つの出力を比較すると、消えた HTML の部分がそのフィールドによって制御されている条件ブロックだとわかるので、直接 `<!--seam:if:...-->` で囲むだけで済みます。配列も同様の仕組みです。
      provider: google
