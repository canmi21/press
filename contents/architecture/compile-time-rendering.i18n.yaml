    ko-KR:
      text: 제가 **웹** 프런트엔드 개발에 막 입문했을 때 처음 접한 풀스택 프레임워크는 아마 **Next.js**였을 것입니다. 매우 훌륭한 프레임워크라는 점은 인정합니다. 성능 문제가 다소 있지만, 그것은 확실한 **개발자 경험**을 얻는 대가이며 충분히 납득할 수 있습니다. 하지만 프런트엔드의 여러 개념과 지식을 점차 깊이 이해하면서, 이 프레임워크가 갈수록 저와 맞지 않을지도 모른다고 느꼈습니다. 저는 Rust로 코드를 작성하는 것을 무척 좋아하고 저수준 기술을 연구하는 것도 즐기며 임베디드 시스템도 다뤄 봤기 때문에 성능에 유난한 집착이 있기 때문입니다. 그렇다고 모든 것을 극한까지 끌어올려야 한다는 뜻은 아닙니다. 이미 성능이 눈에 띄게 더 좋으면서도 어쩌면 아주 적은 노력만으로 구현할 수 있는 방법이 있는데, 왜 모두가 그렇게 하지 않는지 의문이라는 뜻입니다. 그래서 Next를 사용할 때마다 이런 생각이 듭니다. 아주 단순한 페이지이고 대부분은 고정되어 있으며 단 한 곳만 바뀌면 되는데도 왜 페이지 전체를 다시 렌더링해야 할까요? 왜일까요? 제 생각에는 백엔드가 Rust로 작성되지 않았더라도, 극한의 성능을 추구하지 않더라도, 심지어 JavaScript 해석기 위에서 실행되더라도 실제로 바뀌는 그 적은 양의 데이터에는 비교적 작은 비용만 들어야 합니다. 페이지 전체를 다시 렌더링하는 대신 아주 낮은 비용으로 “렌더링”을 구현할 수 있어야 합니다.
