    de-DE:
      text: 'Zurück zu `raw HTML slot`: Diese Lösung ist vor allem für Szenarien wie `Markdown` und `Rich Text` gedacht. Das gerenderte **HTML** wird über `dangerouslySetInnerHTML` eingefügt; nach der :tn[Hydratisierung]{is="Im Original bedeutet 水 wörtlich Wasser, ist im Netzjargon aber auch eine Bezeichnung für anspruchsloses Füllmaterial; damit wird gescherzt, aus Migration und Leistungsvergleichen ließe sich noch ein weiterer Artikel strecken."} nimmt dieser Bereich nicht an Interaktionen teil und ist **„tot“**. Dieser Inhalt sollte auf ein Minimum beschränkt werden: Rahmen und Stile für einen Artikel sollten als React-Komponenten umgesetzt und nicht in dieses HTML gemischt werden. Der Nachteil ist, dass sich der Bereich nach der Hydratisierung nicht mehr ändern kann; unter dieser Voraussetzung sinken die Kosten des „serverseitigen Renderns“ jedoch tatsächlich auf ein extrem niedriges, nahezu kostenfreies Niveau. In Fällen, die wirklich serverseitiges Rendern erfordern, entfallen etwa 60 % auf solche statischen HTML-Einfügungen; nur die übrigen 40 % benötigen die Fähigkeit von RSC, beliebige Komponenten auf dem Server auszuführen.'
      provider: openai
