    zh-TW:
      text: 所以，你是不是已經被 **Seam** 和 **SeamJS** 的關係繞暈了？其實兩者的關係很簡單：Seam 是一套協定，定義了如何用 `Sentinel` 標記動態位置、如何將其轉換成 `slot` 標記、如何用 `diff` 偵測條件區塊與迴圈區塊，以及執行期間如何根據**抽象語法樹**注入資料。協定本身與語言無關，任何能夠解析 **HTML** 註解並取代字串的後端都能實作它。**SeamJS** 則是以這套協定為基礎打造的具體框架；它把 **Vite**、**TanStack Router**、**TanStack Query** 等現成元件:tn[縫在一起]{is="原文動詞「縫」既形容把現成工具拼接起來，也呼應了 Seam 一詞本身所指的接縫。"}，再補足它們無法涵蓋的部分，例如我的**骨架**擷取系統、注入引擎、**命令列介面**等。
