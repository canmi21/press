    fr-FR:
      text: 'Tu es peut-être déjà perdu dans la relation entre **Seam** et **SeamJS**. C''est en fait très simple : Seam est le protocole. Il définit comment marquer les positions dynamiques avec `Sentinel`, comment cela se transforme en marqueurs `slot`, comment se fait la détection `diff` pour les blocs conditionnels et les boucles, et comment le runtime injecte les données à partir de l''**AST**. Le protocole lui-même est indépendant du langage : n''importe quel backend capable d''analyser des commentaires **HTML** et de faire du remplacement de chaînes peut l''implémenter. **SeamJS** est le framework, une implémentation concrète bâtie sur ce protocole. Il :tn[coud]{is="L''original emploie 缝, « coudre » — le mot même qui donne son nom au framework en chinois (Seam, la couture). La phrase explique donc au passage d''où vient le nom."} ensemble des roues déjà existantes comme **Vite**, **TanStack Router** et **TanStack Query**, puis comble ce qu''elles ne couvrent pas : mon extraction de **skeleton**, le moteur d''injection, le **CLI**, et ainsi de suite.'
