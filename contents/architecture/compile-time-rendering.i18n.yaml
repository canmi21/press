    de-DE:
      text: 'Sprechen wir nun über **RSC (React-Serverkomponenten)**. Zuvor hatte ich gesagt, **RSC** könnte ein Fehler sein, ~~weil es zu viele Grenzen zwischen Frontend und Backend verwischt~~, ~~**etliche Sicherheitsrisiken** mit sich bringt~~ ~~und zu zahlreichen CVEs führt~~. Tatsächlich liegt das jedoch eher an **Next.js** und anderen SSR-Ansätzen: **Die Nutzer haben schlicht keine Möglichkeit, darauf zu verzichten**. Wer dynamische Inhalte will, muss **SSR** verwenden, obwohl auch eine String-Ersetzung wie bei uns vollkommen funktioniert. Zugleich muss man anerkennen, dass **RSC** dem Server eine sehr wichtige Fähigkeit verleiht: beliebige React-Komponenten zu rendern, also beliebigen Code auszuführen.'
