  c1902d0bdcbabcc9f04b1821c234aa66:
    de-DE:
      text: 'In **JTD (JSON Type Definition)** [RFC 8927](https://www.rfc-editor.org/rfc/rfc8927.html) werden acht **Schema Form**-Typen definiert: Empty, Ref, Type (boolean, string, timestamp sowie numerische Typen verschiedener Präzision), Enum, Elements, Properties, Values und Discriminator; zudem kann jedes Schema als `nullable` markiert werden. Der Vorteil von JTD liegt in seiner Sprachunabhängigkeit: In fast allen Sprachen wie **JavaScript**, **Rust** und **Go** lassen sich entsprechende Typ-Mappings finden, was es von Natur aus zu einer Brücke zwischen Frontend und Backend macht. Zudem ist **JSON** das Trägermedium, das ohnehin den **kleinsten gemeinsamen Nenner zwischen Frontend und Backend** darstellt. In der realen Welt bestehen **95%** aller Website-Anwendungen aus nichts anderem als dem Anzeigen von Zeichenketten, numerischen Feldern oder der Auswertung von Booleschen Werten – all das fällt genau in diesen Bereich. Wenn man sich das klar macht, eröffnet sich ein enormer Handlungsspielraum. Natürlich ist JTD nicht perfekt und es gibt Ausnahmen wie etwa **Markdown**, aber darauf gehen wir später noch im Detail ein; genau hier sehe ich nämlich den wahren Wert von `SSR`.'
      provider: google
      model: gemini-3-6-flash-high
      at: 2026-08-01T01:46:50.053329Z
      seconds: 13.838560125
      tokens: 21451
      review: false
    en-US:
      text: 'In **JTD (JSON Type Definition)** [RFC 8927](https://www.rfc-editor.org/rfc/rfc8927.html), eight **Schema Forms** are defined: Empty, Ref, Type (boolean, string, timestamp, and numeric types of various precisions), Enum, Elements, Properties, Values, and Discriminator, plus any schema can be marked as `nullable`. The advantage of JTD lies in its cross-language nature: almost all languages like **JavaScript**, **Rust**, and **Go** have corresponding type mappings, making it a natural bridge between the frontend and backend, with **JSON** as its carrier—which is inherently the **lowest common denominator between frontend and backend**. In the real world, **95%** of web applications do nothing more than display string and numeric fields or make decisions using boolean values, all of which fall within this scope. With this established, we actually have a lot of room to maneuver. Of course, JTD is not perfect, and there are exceptions like **Markdown**, but we will discuss that in detail later; this is actually where I truly recognize the value of `SSR`.'
      provider: google
      model: gemini-3-6-flash-high
      at: 2026-08-01T01:46:50.053329Z
      seconds: 13.838560125
      tokens: 21451
      review: false
    es-ES:
      text: 'En **JTD (JSON Type Definition)** [RFC 8927](https://www.rfc-editor.org/rfc/rfc8927.html), se definen ocho **Schema Form**: Empty, Ref, Type (boolean, string, timestamp y diversos tipos numéricos de diferente precisión), Enum, Elements, Properties, Values y Discriminator, además de que cualquier schema se puede marcar como `nullable`. La ventaja de JTD radica en que es independiente del lenguaje: casi todos los lenguajes, como **JavaScript**, **Rust** y **Go**, cuentan con sus correspondientes mapeos de tipos, lo que lo convierte de forma natural en un puente entre el frontend y el backend. Además, su portador es **JSON**, que de por sí es el **mínimo común denominador entre frontend y backend**. En el mundo real, el **95 %** de las aplicaciones de los sitios web no hacen más que mostrar cadenas de texto, campos numéricos o tomar decisiones con valores booleanos, todo lo cual entra dentro de este alcance. Una vez aclarado este punto, el margen de maniobra que tenemos es realmente amplio. Por supuesto, JTD tampoco es perfecto y existen excepciones como **Markdown**, pero ya hablaremos de eso en detalle más adelante; de hecho, es aquí donde realmente reconozco el valor de `SSR`.'
      provider: google
