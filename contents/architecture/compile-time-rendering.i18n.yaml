    zh-CN:
      text: '[RFC 8927](https://www.rfc-editor.org/rfc/rfc8927.html) 定义的 **JTD（JSON 类型定义）**包含八种**模式形式**：空、引用、类型（布尔值、字符串、时间戳及各种精度的数值类型）、枚举、元素、属性、值和判别器；此外，任何模式都可以标记为 `nullable`。JTD 的优势在于它可以跨语言使用：几乎在所有语言中，包括 **JavaScript**、**Rust** 和 **Go**，都能找到对应的类型映射。这使它天然成为连接前后端的桥梁，而其载体 **JSON** 本就是**前后端之间的最小公约**。现实世界中，网站里 **95%** 的应用无非是在显示字符串或数字字段，或根据布尔值作出判断，而这些需求全都涵盖在 JTD 的能力范围内。明确这一点后，我们实际上就有了很大的操作空间。当然，JTD 并不完美，也会遇到意料之外的情况，例如 **Markdown** 这类内容；不过我们稍后会详细讨论。事实上，正是在这里，我才真正认可 `SSR` 的意义。'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-26T06:45:23.846357Z
      seconds: 21.659864667
      tokens: 19638
      review: false
    zh-TW:
      text: '**JTD（JSON 型別定義）**由 [RFC 8927](https://www.rfc-editor.org/rfc/rfc8927.html) 定義，共有八種**綱要形式**：空、參照、型別（布林值、字串、時間戳記及各種精度的數值型別）、列舉、元素、屬性、值和判別器；此外，任何綱要都可以標記為 `nullable`。JTD 的優點在於它能跨語言使用，**JavaScript**、**Rust**、**Go** 以及幾乎所有其他語言都能找到對應的型別映射。這讓它自然成為前端與後端之間的橋梁，而它採用的載體 **JSON** 原本就是**前端與後端的最小公約數**。現實世界中，**95%** 的網站應用程式無非就是顯示字串、數值欄位，或用布林值進行判斷，而這些全都涵蓋在這個範圍內。釐清這一點後，我們實際上就有了很大的操作空間。當然，JTD 並不完美，也存在 **Markdown** 這類例外，不過我們稍後會詳細討論；而這其實才是我真正認可 `SSR` 價值的地方。'
