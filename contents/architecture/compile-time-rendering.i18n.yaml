    zh-TW:
      text: 這就是我所說的 **CTR（編譯時彩現）**。至於限制，它其實和 SSR 的限制完全一樣：例如，`<!--seam:path-->` 插入文字時會自動進行 HTML 跳脫（`&`、`<`、`>` 等），如果需要插入原始 HTML，就必須明確使用 `<!--seam:path:html-->`；缺少的資料路徑在文字 `slot` 中會變成空字串，在屬性 `slot` 中則會略過注入；`each` 區塊拿到的如果不是陣列，也會直接略過。這些行為與 SSR 框架中的邊界情況並沒有本質區別，我只是把 SSR 的彩現步驟移到編譯期執行，僅此而已。**CTR** 會在**建置時**遍歷所有條件變數型別取值的笛卡兒積，使用任意自動產生且符合型別的模擬值，或由使用者指定的特殊模擬值（一般不需要手動提供產生所有 HTML 變體所需的模擬值，不過也可以提供；否則系統會自動選取符合相應型別的值）。每種組合都會彩現一次，再透過比較結果找出所有條件區塊和迴圈區塊的邊界，最終得到一個完整展開的 HTML 骨架。從數學上說，只要執行時傳入的資料符合這些型別定義，就一定能被正確注入這個骨架，因為所有可能的分支路徑都已經在編譯期被窮舉過了。
