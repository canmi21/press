  48f04710e94fe79ceb06ce672885792c:
    de-DE:
      text: 'Das ist die Kunst der Kommentare: Kommentare wurden hier gewählt, schlicht weil sie zufällig gültige HTML-Zeichen sind, mehr nicht. Wie werden diese bedingten Blöcke und Schleifenblöcke also zur **build-time** bestimmt und generiert? Es ist tatsächlich ein ziemlich cleverer Ansatz: Obwohl wir keinen vDOM haben, können wir das HTML zweimal rendern, um ein Diff durchzuführen. Nehmen wir das bedingte Rendern als Beispiel: Beim ersten Durchlauf wird mit den vollständigen Sentinel-Daten gerendert, beim zweiten Durchlauf wird ein bestimmtes `nullable`-Feld auf `null` gesetzt und erneut gerendert. Vergleicht man die beiden Ausgaben, ist der HTML-Block, der verschwunden ist, der von diesem Feld gesteuerte bedingte Block, den man einfach mit `<!--seam:if:...-->` umschließen kann. Das Gleiche gilt für Arrays.'
      provider: google
      model: gemini-3-6-flash-high
      at: 2026-08-01T01:45:27.557677Z
      seconds: 9.315271334
      tokens: 16193
      review: false
    en-US:
      text: "This is the art of comments—comments were chosen here simply because they happen to be valid HTML characters, and nothing more. So how are these conditional and loop blocks determined and generated at **build-time**? It is actually quite a clever approach: although we don't have a vDOM, we can render the HTML twice and diff them. Take conditional rendering for instance: the first pass renders with full Sentinel data, while the second pass sets a certain `nullable` field to `null` and renders again. By comparing the two outputs, the piece of HTML that disappears is the conditional block controlled by that field, so we can simply wrap it with `<!--seam:if:...-->`. The same principle applies to arrays."
      provider: google
      model: gemini-3-6-flash-high
      at: 2026-08-01T01:45:27.557677Z
      seconds: 9.315271334
      tokens: 16193
