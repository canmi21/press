      text: Meiner Ansicht nach missbrauchen `RSC` und eine ganze Reihe von `SSR`-Frameworks in Wirklichkeit `render`. `SSG` hat zwar den Stil erreicht, den ich mir wünschte – Seiten werden bereits beim Build generiert und müssen bei Anfragen nicht neu gerendert werden –, aber es verfügt über keine echten dynamischen Fähigkeiten(x). Was ISR betrifft, scheint es zwar einen Kompromiss zwischen SSG und SSR gefunden zu haben und eine gewisse Flexibilität zu bieten, aber im Grunde erfüllt es meine Erwartungen nicht. Ich denke, dass ISR überhaupt nur entstanden ist, um die schlechte Performance von SSR auszugleichen; einschließlich all der nachfolgenden CDN-Caching-Strategien und ähnlicher Maßnahmen handelt es sich dabei im Grunde nur um eine Art **workaround** und keineswegs um eine wirklich elegante Lösung.
