  e607f79910ca2344315b82a7fe7f1e29:
    de-DE:
      text: 'Sind Sie also schon verwirrt über die Beziehung zwischen **Seam** und **SeamJS**? Eigentlich sind die beiden sehr einfach: Seam ist ein Protokoll. Es definiert, wie man dynamische Positionen mit `Sentinel` markiert, wie man sie in `slot`-Marker umwandelt, wie man die `diff`-Erkennung für Bedingungs- und Schleifenblöcke durchführt und wie die Dateninjektion zur Laufzeit auf Basis des **AST** erfolgt. Das Protokoll selbst ist sprachunabhängig; jedes Backend, das **HTML**-Kommentare parsen und String-Ersetzungen vornehmen kann, kann es implementieren. **SeamJS** ist ein Framework, eine konkrete Implementierung auf Basis dieses Protokolls. Es näht bereits vorhandene Räder wie **Vite**, **TanStack Router** und **TanStack Query** zusammen und deckt die Bereiche ab, die diese nicht abdecken, wie z. B. meine **skeleton**-Extraktion, die Injektions-Engine, die **CLI** und Ähnliches.'
