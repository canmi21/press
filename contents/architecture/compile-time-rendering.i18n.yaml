  93d4e759eab62ad27c417e8ae87b7635:
    de-DE:
      text: 'Was aber, wenn das Backend in einer anderen Sprache geschrieben ist? Nehmen wir Cloudflare Workers als Beispiel: Tatsächlich unterstützen viele Serverless-Plattformen WASM, sodass andere Sprachen, nachdem sie zu einer WASM BIN kompiliert wurden, ebenso als Backend verwendet werden können. Im Grunde kompiliere ich das Frontend in reine statische Ressourcen, ähnlich wie bei CSR. Aber in Kombination mit einer privaten Brücke `/_seam/` können diese statischen Ressourcen dieselben dynamischen Funktionen bieten wie echte Full-Stack-Frameworks und sind somit natürlich auch vollkommen Serverless-kompatibel.'
      provider: google
