    ja-JP:
      text: これが私の言う **CTR（コンパイル時レンダリング）** です。制約は SSR とまったく同じです。たとえば、`<!--seam:path-->` でテキストを挿入すると HTML エスケープ（`&`、`<`、`>` など）が自動的に行われ、生の HTML を挿入するには `<!--seam:path:html-->` を明示的に使う必要があります。存在しないデータパスは、テキスト `slot` では空文字列になり、属性 `slot` では挿入自体が省略されます。また、`each` ブロックに配列以外が渡された場合、そのブロックはそのままスキップされます。これらの挙動は SSR フレームワークで遭遇する境界事例と本質的に変わりません。SSR のレンダリング処理をコンパイル時に移しただけです。**CTR** は**ビルド時**に、すべての条件変数について型が取りうる値の直積を走査し、型を満たす任意の自動生成モック値、またはユーザーが上書き指定した特殊なモック値を使います（通常、すべての HTML バリエーションの生成に必要なモック値を手動で用意する必要はありませんが、指定することもできます。指定しなければ、各型に適合する値が自動的に選ばれます）。各組み合わせを一度ずつレンダリングし、結果の差分からすべての条件ブロックとループブロックの境界を割り出して、最終的に完全に展開された HTML の骨格を得ます。数学的には、実行時に渡されるデータがこれらの型定義に適合している限り、必ずこの骨格へ正しく挿入できます。考えられるすべての分岐経路が、コンパイル時にすでに網羅されているからです。
