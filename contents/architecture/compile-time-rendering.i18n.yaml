    zh-TW:
      text: '**JTD（JSON 型別定義）**由 [RFC 8927](https://www.rfc-editor.org/rfc/rfc8927.html) 定義，共有八種**綱要形式**：空、參照、型別（布林值、字串、時間戳記及各種精度的數值型別）、列舉、元素、屬性、值和判別器；此外，任何綱要都可以標記為 `nullable`。JTD 的優點在於它能跨語言使用，**JavaScript**、**Rust**、**Go** 以及幾乎所有其他語言都能找到對應的型別映射。這讓它自然成為前端與後端之間的橋梁，而它採用的載體 **JSON** 原本就是**前端與後端的最小公約數**。現實世界中，**95%** 的網站應用程式無非就是顯示字串、數值欄位，或用布林值進行判斷，而這些全都涵蓋在這個範圍內。釐清這一點後，我們實際上就有了很大的操作空間。當然，JTD 並不完美，也存在 **Markdown** 這類例外，不過我們稍後會詳細討論；而這其實才是我真正認可 `SSR` 價值的地方。'
