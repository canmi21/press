    ja-JP:
      text: これが私の言う **CTR (Compile-Time Rendering)** です。制限に関して言えば、SSR の制限とまったく同じです。たとえば、`<!--seam:path-->` でテキストを挿入する際には自動的に HTML エスケープが行われ（`&`、`<`、`>` など）、生の HTML を挿入したい場合は明示的に `<!--seam:path:html-->` を使用する必要があります。データパスが欠損している場合、テキスト `slot` では空文字列になり、属性 `slot` では注入がスキップされます。`each` ブロックに配列以外のものが渡された場合はそのままスキップされます。これらの動作は、SSR フレームワークで遭遇するエッジケースと本質的に違いはありません。私は単に SSR におけるレンダリングステップをコンパイル時に移動して実行しただけに過ぎません。そして **CTR** は、**build-time** においてすべての条件変数の型値に対してデカルト積のトラバースを行い、型に適合する任意の Mock 値、またはユーザーが Override した特殊な Mock 値（通常、HTML のバリエーション生成に必要な Mock 値を手動で記述する必要はありませんが、手動で与えることも可能です。基本的には型に合った値が自動的に渡されます）を使用します。このようにして各組み合わせを 1 回ずつレンダリングし、すべての条件ブロックとループブロックの境界を diff して、最終的に完全に展開された HTML スケルトンを取得します。数学的に言えば、runtime に渡されるデータがこれらの型定義に適合している限り、このスケルトンに確実に正しく注入されます。あらゆる可能性のある分岐パスは、コンパイル時にすでに網羅されているからです。
