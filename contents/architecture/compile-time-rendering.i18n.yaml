    ko-KR:
      text: 이것이 제가 말한 **CTR(컴파일 타임 렌더링)** 입니다. 제약은 사실 SSR의 제약과 완전히 같습니다. 예를 들어 `<!--seam:path-->`로 텍스트를 삽입하면 HTML 이스케이프(`&`, `<`, `>` 등)가 자동으로 적용되며, 원본 HTML을 삽입하려면 `<!--seam:path:html-->`를 명시적으로 사용해야 합니다. 존재하지 않는 데이터 경로는 텍스트 `slot`에서는 빈 문자열이 되고, 속성 `slot`에서는 삽입이 생략됩니다. 또한 `each` 블록에 배열이 아닌 값이 들어오면 해당 블록을 그대로 건너뜁니다. 이런 동작은 SSR 프레임워크에서 마주치는 경계 사례와 본질적으로 다르지 않습니다. 저는 그저 SSR의 렌더링 단계를 컴파일 시점으로 옮겼을 뿐입니다. **CTR**은 **빌드 시점**에 모든 조건 변수 타입이 가질 수 있는 값의 데카르트 곱을 순회하면서, 타입에 맞게 자동 생성된 임의의 모의 값이나 사용자가 별도로 덮어쓴 특수 모의 값을 사용합니다(일반적으로 모든 HTML 변형을 생성하는 데 필요한 모의 값을 직접 작성할 필요는 없지만, 원한다면 지정할 수 있습니다. 지정하지 않으면 각 타입에 맞는 값이 자동으로 선택됩니다). 각 조합을 한 번씩 렌더링하고 결과를 비교해 모든 조건 블록과 반복 블록의 경계를 찾아낸 뒤, 최종적으로 완전히 펼쳐진 HTML 골격을 얻습니다. 수학적으로 런타임에 전달되는 데이터가 이러한 타입 정의를 따르기만 하면 반드시 이 골격에 올바르게 삽입될 수 있습니다. 가능한 모든 분기 경로가 이미 컴파일 시점에 빠짐없이 열거되었기 때문입니다.
