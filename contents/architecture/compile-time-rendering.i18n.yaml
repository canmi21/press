      text: Schließlich gibt es noch das von mir so gehasste **hydration mismatch**, und ich wette, du magst es auch nicht; im Grunde läuft es jedoch nur auf einen uneinheitlichen `DOM`-Zustand hinaus. Traditionelle Frameworks wie der **App Router** von **Next.js** versuchen, die gesamte Anwendung mit React zu umhüllen – sobald auf Benutzerseite durch den Browser irgendwelche Tags injiziert werden, besteht die Wahrscheinlichkeit eines Hydrationsfehlers. Unsere Einschränkungen sind eigentlich dieselben wie bei traditionellem SSR, aber wenn du TS nutzt, habe ich zusätzlich ein Hydrations-`div` namens `__root` gewrappt, sodass der Hydrationsbereich den **metadata**-Bereich nicht mehr abdeckt, was für eine wesentlich robustere Hydration sorgt. Zudem bietet React 19 eine integrierte Unterstützung für Dokument-Metadaten-Tags wie `<title>`, `<meta>` und `<link>`. Selbst wenn du nur ein bestimmtes `<div>` auf der Seite hydratisierst (statt des gesamten `<html>`), wird React `<title>My Page</title>` beim direkten Rendern in einer Komponente automatisch nach `<head>` **hoist**en.
