      text: 마지막으로 전통적인 SSG와의 비교입니다. 저는 SSG와 동일한 것을 구현했습니다. 본질적으로 컴파일 타임에 확정할 수 있는 모든 것을 전부 렌더링해 두는 것이죠. 하지만 우리는 더욱 **동적**입니다. 단순한 타입의 `slot` 값은 런타임에 완전히 교체될 수 있기 때문입니다. **SSG를 일종의 MPA 진입점으로 렌더링하여, 하이드레이션 전에는 MPA, 하이드레이션 후에는 SPA로 변환되면서도 "동적" 능력을 유지하는 것으로 이해하시면 됩니다.**
