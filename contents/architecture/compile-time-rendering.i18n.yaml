    zh-CN:
      text: '**JTD (JSON Type Definition)** [RFC 8927](https://www.rfc-editor.org/rfc/rfc8927.html) 定义的中它有八种 **Schema Form**: Empty、Ref、Type（ boolean、string、timestamp 以及各种精度的数字类型）、Enum、Elements、Properties、Values、Discriminator，再加上任意 schema 都可以标记为 `nullable`。JTD 的好处在于它是跨语言的，**JavaScript**、**Rust**、**Go** 几乎所有语言都能找到对应的类型映射，这就让它天然地成为了前后端之间的桥梁，并且载体是 **JSON**，本来就是**前后端最小公约**。真实世界中那些网站 **95%** 的应用，无非就是显示字符串、数字字段、或者用布尔值做判断，它们全都落在这个范围内。明确了这一点后，实际上我们可以操作的空间就很大了，当然 JTD 也不是完美的，其实也有意外，比如 **Markdown** 这类东西，但这个我们后面再详细说，这里其实才是我真正认可 `SSR` 有意义的地方。'
