  3b94504af8ec2a3de06ab1561f14f389:
    de-DE:
      text: 'Um auf `raw HTML slot` zurückzukommen: Diese Lösung zielt hauptsächlich auf Szenarien wie `Markdown` und `Rich Text` ab. Das gerenderte **HTML** wird über `dangerouslySetInnerHTML` injiziert, und nach der Hydratisierung nimmt dieser Bereich nicht an der Interaktion teil – er ist **"tot"**; dieser Teil des Inhalts sollte minimiert werden. Wenn Sie dem Artikel Rahmen oder Stile hinzufügen möchten, sollten diese mit React-Komponenten geschrieben werden, anstatt sie in dieses HTML zu mischen. Der Nachteil dieses Ansatzes ist, dass er sich nach der Hydratisierung nicht mehr ändern kann, aber unter dieser Voraussetzung drückt er die Kosten für "SSR" tatsächlich auf ein sehr niedriges Niveau, das nahe an Zero Cost liegt. In Szenarien, in denen wirklich SSR benötigt wird, machen solche statischen HTML-Injizierungen etwa 60 % aus; erst die restlichen 40 % erfordern die Fähigkeit von RSC, beliebige Komponenten auf dem Server auszuführen.'
      provider: google
      model: gemini-3-6-flash-high
      at: 2026-08-01T01:45:17.842843Z
      seconds: 9.709893709
      tokens: 16779
      review: false
    en-US:
      text: Getting back to `raw HTML slot`, this solution mainly targets scenarios like `Markdown` and `Rich Text`, where the rendered **HTML** is injected via `dangerouslySetInnerHTML`, and after hydration, this area does not participate in interaction—it is **"dead"**; this portion of content should be minimized. If you want to add borders or styling to an article, those should be written using React components rather than mixed into this HTML. The downside of this approach is that it cannot change after hydration, but under this premise, it does drive the cost of "SSR" down to an extremely low level, close to Zero Cost. In scenarios that genuinely require SSR, roughly 60% consist of this kind of static HTML injection; only the remaining 40% need RSC's capability to execute arbitrary components on the server.
      provider: google
