      text: ここまで来れば、これらの `slot` が**「型マーカー付きスロット」**だと、もうお気づきかもしれません。この時点でサーバー側の実行環境が行うことは極めて単純です。実データを取得してこれらの穴に値を埋める、つまり純粋な文字列置換だけです。`renderToString()` も JavaScript の実行環境も `vDOM` もまったく必要ありません。**HTML** コメントを解析して**文字列置換**を行える言語なら、どれでもバックエンドとして使えます。Rust、Go、TypeScript のどれでも構いません。これがフレームワークではなくプロトコルである理由です。
