    en-US:
      text: Finally, there is **hydration mismatch**, which I really hate, and I believe you don't like it either; but at the end of the day, it is actually just an inconsistency in `DOM` state. Traditional frameworks like **Next.js**'s **App Router** try to wrap the entire application with React, so once the browser on the user side injects any tags, there is a probability of a hydration error. Our limitations are actually the same as traditional SSR, but when you use TS, I also wrapped a hydration `div` called `__root` so that the hydration area no longer covers the **metadata** area, yielding more durable hydration. In addition, React 19 has built-in support for document metadata tags such as `<title>`, `<meta>`, and `<link>`. Even if you only hydrate a specific `<div>` on the page (rather than the entire `<html>`), rendering `<title>My Page</title>` directly inside a component will cause React to automatically **hoist** it into `<head>`.
