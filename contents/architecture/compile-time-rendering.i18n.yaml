      text: 'Das Schreiben von Datenabfragen innerhalb von Komponenten ist genau dasselbe – ich bevorzuge einen Ansatz mit klaren Grenzen: Komponenten sind reine Komponenten, und das Laden von Daten sollte vollständig herausgelöst werden. Sobald man diese Voraussetzung akzeptiert und reine Komponenten von Daten trennt, wird die Sache interessant: Man stellt fest, dass Daten an sich tatsächlich kategorisiert werden können.'
