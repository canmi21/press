      review: false
    ko-KR:
      text: 이제 **RSC(React 서버 컴포넌트)**에 관해 이야기해 보자. 앞서 **RSC**가 잘못된 선택일 수 있다고 말했는데, ~~프런트엔드와 백엔드 사이의 경계를 지나치게 흐리고~~, ~~**적지 않은 보안 위험**을 초래하며~~ ~~수많은 CVE까지 낳았기 때문이다~~. 하지만 사실 이는 **Next.js**와 다른 SSR 방식의 잘못이 더 크다. **사용자에게는 아예 사용하지 않을 선택권이 없고**, 동적인 콘텐츠를 원하면 반드시 **SSR**을 써야 하는 상황이 되었기 때문이다. 그러나 실제로는 우리가 하는 것과 같은 문자열 치환도 충분히 잘 작동한다. 또한 **RSC**가 서버에 매우 중요한 능력, 즉 임의의 React 컴포넌트를 렌더링하는 능력, 다시 말해 임의의 코드를 실행하는 능력을 부여했다는 점은 인정할 수밖에 없다.
