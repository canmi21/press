    de-DE:
      text: 'Vielleicht bist du inzwischen also verwirrt, wie **Seam** und **SeamJS** zusammenhängen. Eigentlich ist es ganz einfach: Seam ist das Protokoll. Es legt fest, wie man dynamische Stellen mit `Sentinel` markiert, wie daraus `slot`-Marker werden, wie die `diff`-Erkennung für Bedingungs- und Schleifenblöcke funktioniert und wie die Laufzeit auf Basis des **AST** Daten einspeist. Das Protokoll selbst ist sprachunabhängig; jedes Backend, das **HTML**-Kommentare parsen und Zeichenketten ersetzen kann, kann es umsetzen. **SeamJS** ist das Framework, eine konkrete Umsetzung dieses Protokolls. Es :tn[näht]{is="Im Original steht 缝 ‚nähen‘ – genau das Wort, das dem Framework auf Chinesisch seinen Namen gibt (Seam = Naht). Der Satz beschreibt also nebenbei, woher der Name kommt."} fertige Räder wie **Vite**, **TanStack Router** und **TanStack Query** zusammen und ergänzt dann das, was diese nicht abdecken: meine **skeleton**-Extraktion, die Injection-Engine, das **CLI** und so weiter.'
