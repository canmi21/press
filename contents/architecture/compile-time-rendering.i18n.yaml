      text: 'Und dann ist da noch `raw HTML slot`; das führt im Grunde wieder zu diesen **5%** **Edge Case** zurück. Bei Dingen wie `Markdown` oder `Rich Text` ist es zur Kompilierzeit schlicht unmöglich, ihren Wert zu kennen, und **sie über Typen einzuschränken, ist extrem aufwendig**. Natürlich könnte man sagen, man erweitert das Protokoll, listet sämtliche Syntaxes von Markdown auf und parst sie zur Laufzeit – aber dieser Arbeitsaufwand käme im Grunde dem Neuschreiben eines Markdown-Renderers gleich? Doch nur diese wenigen minimalen Typen einzuschränken, ist ein völlig anderer Aufwand als das Neuschreiben der gesamten Rendering-Engine. Das bringt uns auch wieder zu der Philosophie zurück, die ich zu Beginn erwähnt habe: **Probleme mit geringerem Aufwand und auf elegantere Weise zu lösen**.'
