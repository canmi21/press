    es-ES:
      text: 'Esto es lo que llamo **CTR (renderizado en tiempo de compilación)**. Sus limitaciones son exactamente las mismas que las del SSR: por ejemplo, `<!--seam:path-->` aplica automáticamente el escape de HTML al insertar texto (`&`, `<`, `>`, etc.); para insertar HTML sin procesar es necesario usar `<!--seam:path:html-->` de forma explícita. Una ruta de datos inexistente se convierte en una cadena vacía en el texto `slot`, mientras que en el atributo `slot` se omite la inserción. Asimismo, un bloque `each` se omite directamente si recibe algo que no sea un arreglo. Estos comportamientos no difieren en esencia de los casos límite que aparecen en los frameworks de SSR; lo único que he hecho es trasladar a la fase de compilación el paso de renderizado del SSR. Durante **la construcción**, **CTR** recorre el producto cartesiano de todos los valores tipados posibles de las variables condicionales, utilizando valores simulados arbitrarios generados automáticamente que cumplan los tipos o valores simulados especiales definidos por el usuario (por lo general, no hace falta proporcionar manualmente los valores necesarios para generar todas las variantes de HTML, aunque es posible hacerlo; de lo contrario, se elige automáticamente un valor compatible con cada tipo). Cada combinación se renderiza una vez y los resultados se comparan para detectar los límites de todos los bloques condicionales y repetitivos, con lo que finalmente se obtiene un esqueleto de HTML completamente desplegado. Matemáticamente, siempre que los datos proporcionados en tiempo de ejecución cumplan estas definiciones de tipos, podrán insertarse correctamente en el esqueleto, pues todas las rutas de bifurcación posibles ya se habrán enumerado exhaustivamente durante la compilación.'
