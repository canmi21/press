    zh-CN:
      text: 这就是我说的 **CTR (Compile-Time Rendering)** 至于限制，其实和 SSR 的限制是一模一样的，比如 `<!--seam:path-->` 做文本插入时会自动做 HTML 转义（`&`、`<`、`>` 等），如果你需要插入原始 HTML 就得显式用 `<!--seam:path:html-->`；缺失的数据路径在文本 `slot` 中会变成空字符串，在属性 `slot` 中会跳过注入；`each` 块如果拿到的不是数组就直接跳过。这些行为和你在 SSR 框架中遇到的边界情况本质上没有区别，我只是把 SSR 中的渲染这一步拎到了编译期去执行，仅此而已。而 **CTR** 在 **build-time** 对所有条件变量的类型值做笛卡尔积遍历，使用 Mock 出来的任意符合类型的值一种 or 用户 Override 特殊 Mock 值（一般是不需要手动写生成 HTML 变体所需要的 Mock 值的，但是可以手动给，不然就是自动给一个符合你这个类型的值进来），这样每种组合渲染一次，diff 出所有条件块和循环块的边界，最终得到一个完整展开的 HTML 骨架。从数学上说，只要 runtime 传入的数据符合这些类型定义，它就一定能被正确注入到这个骨架里，所有可能的分支路径在编译期已经被穷举过了。
