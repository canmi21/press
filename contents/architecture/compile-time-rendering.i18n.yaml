    ja-JP:
      text: 最後に、従来の SSG との比較です。私は SSG と同じことを実現しました。本質的にはコンパイル時に確定できるものをすべてレンダリングしておくということです。しかし、私たちはより**動的**です。なぜなら、単純な型の `slot` 値は実行時に完全に置き換えることができるからです。**SSG を一種の MPA のエントリーポイントとしてレンダリングし、ハイドレーション前は MPA、ハイドレーション後は SPA に変化しつつ、"動的" な能力も保持していると理解してください。**
