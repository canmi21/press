    ja-JP:
      text: '**JTD (JSON Type Definition)** [RFC 8927](https://www.rfc-editor.org/rfc/rfc8927.html) の定義では、8 つの **Schema Form** が存在します：Empty、Ref、Type（boolean、string、timestamp、およびさまざまな精度の数値型）、Enum、Elements、Properties、Values、Discriminator です。さらに、任意の schema は `nullable` としてマークできます。JTD の利点は言語を横断できる点にあり、**JavaScript**、**Rust**、**Go** など、ほぼすべての言語で対応する型マッピングが見つかります。これにより、フロントエンドとバックエンドの架け橋として自然に機能し、その担い手である **JSON** はもともと**フロントエンドとバックエンドの最小公約数**です。現実世界のウェブサイトの **95%** のアプリケーションは、文字列や数値フィールドを表示するか、ブール値で条件判断を行うかに過ぎず、それらはすべてこの範囲に収まります。この点を明確にすれば、実際に操作できる空間は非常に広がります。もちろん、JTD も完璧ではなく、**Markdown** のような例外も存在しますが、それについては後ほど詳しく説明します。こここそが、私が `SSR` の真の意義を認めている部分です。'
