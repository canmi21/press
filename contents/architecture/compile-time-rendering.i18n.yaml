  0e1434b80402c02fdc8b7a74be1e70ae:
    de-DE:
      text: 'An diesem Punkt haben Sie vielleicht schon erkannt, dass diese `slot` **"typisierte Slots"** sind. Was die serverseitige Laufzeitumgebung jetzt tun muss, wird extrem einfach: die echten Daten holen und in diese Lücken einsetzen, reine Zeichenkettenersetzung. Es braucht überhaupt kein `renderToString()`, keine JavaScript-Laufzeitumgebung, kein `vDOM`. Jede Sprache, die **HTML**-Kommentare parsen und **Zeichenkettenersetzung** durchführen kann, kann als Backend dienen -- Rust, Go, TypeScript, alle funktionieren. Deshalb ist es ein Protokoll und kein Framework.'
      provider: anthropic
      model: claude-sonnet-5
      at: 2026-08-01T01:29:57.186884Z
      seconds: 37.790576166
      tokens: 37447
      review: false
    en-US:
      text: 'By this point you may have already realized that these `slot` are **"typed slots"**. At this stage, what the server-side runtime needs to do becomes extremely simple: take the real data and fill it into these holes, pure string replacement. No `renderToString()` is needed at all, no JavaScript runtime, no `vDOM`. Any language capable of parsing **HTML** comments and doing **string replacement** can serve as the backend -- Rust, Go, TypeScript, all work. That''s why this is a protocol rather than a framework.'
      provider: anthropic
      model: claude-sonnet-5
      at: 2026-08-01T01:29:57.186884Z
      seconds: 37.790576166
      tokens: 37447
      review: false
    es-ES:
      text: 'Llegados a este punto, quizás ya te hayas dado cuenta de que estos `slot` son **"espacios con tipo"**. En este momento, lo que el runtime del servidor tiene que hacer se vuelve extremadamente simple: tomar los datos reales y rellenar esos huecos, una pura sustitución de cadenas. No se necesita `renderToString()` en absoluto, no se necesita un runtime de JavaScript, no se necesita `vDOM`. Cualquier lenguaje capaz de analizar comentarios **HTML** y hacer **sustitución de cadenas** puede servir de backend -- Rust, Go, TypeScript, todos funcionan. Por eso es un protocolo y no un framework.'
      provider: anthropic
      model: claude-sonnet-5
      at: 2026-08-01T01:29:57.186884Z
      seconds: 37.790576166
      tokens: 37447
      review: false
    fr-FR:
      text: "À ce stade, vous avez peut-être déjà compris que ces `slot` sont des **« emplacements typés »**. À partir de là, ce que le runtime côté serveur doit faire devient extrêmement simple : récupérer les données réelles et les insérer dans ces trous, une pure substitution de chaînes. Aucun besoin de `renderToString()`, aucun besoin de runtime JavaScript, aucun besoin de `vDOM`. N'importe quel langage capable d'analyser des commentaires **HTML** et de faire de la **substitution de chaînes** peut servir de backend -- Rust, Go, TypeScript, tous conviennent. C'est pour cela que c'est un protocole et non un framework."
      provider: anthropic
      model: claude-sonnet-5
      at: 2026-08-01T01:29:57.186884Z
      seconds: 37.790576166
      tokens: 37447
      review: false
    ja-JP:
      text: ここまで来ると、これらの `slot` が **「型付きスロット」** であることに気づいたかもしれません。この時点で、サーバーサイドランタイムがすべきことは極めてシンプルになります。実データを取得して、これらの穴に値を埋め込む、純粋な文字列置換です。`renderToString()` はまったく不要で、JavaScript ランタイムも不要、`vDOM` も不要です。**HTML** コメントを解析でき、**文字列置換**ができる言語なら何でもバックエンドになれます。Rust、Go、TypeScript、どれでも構いません。だからこそこれはフレームワークではなくプロトコルなのです。
      provider: anthropic
      model: claude-sonnet-5
      at: 2026-08-01T01:29:57.186884Z
      seconds: 37.790576166
      tokens: 37447
      review: false
    ko-KR:
      text: 여기까지 오면 이 `slot` 들이 **"타입이 표시된 슬롯"** 이라는 것을 눈치채셨을 겁니다. 이제 서버 런타임이 해야 할 일은 극도로 단순해집니다. 실제 데이터를 가져와서 이 구멍들에 값을 채워 넣는, 순수한 문자열 치환입니다. `renderToString()` 이 전혀 필요 없고, JavaScript 런타임도 필요 없고, `vDOM` 도 필요 없습니다. **HTML** 주석을 파싱하고 **문자열 치환**을 할 수 있는 언어라면 무엇이든 백엔드가 될 수 있습니다. Rust, Go, TypeScript 모두 가능합니다. 이것이 바로 이것이 프레임워크가 아니라 프로토콜인 이유입니다.
      provider: anthropic
      model: claude-sonnet-5
      at: 2026-08-01T01:29:57.186884Z
      seconds: 37.790576166
      tokens: 37447
      review: false
    zh-CN:
      text: 到这一步你可能已经看出来了这些 `slot` 就是 **"有类型标记的插槽"**。这个时候服务端运行时要做的事情变得极其简单，那就拿到真实数据，往这些孔里填值，纯粹的字符串替换。完全不需要 `renderToString()`，不需要 JavaScript 运行时，不需要 `vDOM`。任何能解析 **HTML** 注释、能做**字符串替换**的语言都能当后端，Rust、Go、TypeScript 都行，这就是为什么它是一个协议而不是一个框架。
      provider: anthropic
