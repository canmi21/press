    fr-FR:
      text: "Enfin, il y a la comparaison avec le SSG traditionnel. J'ai accompli la même chose que le SSG : essentiellement pré-rendre tout ce qui peut l'être au moment de la compilation. Mais nous sommes plus **dynamiques**, car les valeurs de `slot` de types simples peuvent être entièrement remplacées au moment de l'exécution. **Vous pouvez voir cela comme le fait de rendre le SSG sous la forme d'un point d'entrée pour une MPA : avant l'hydratation c'est une MPA, après l'hydratation cela devient une SPA, tout en conservant la capacité « dynamique ».**"
      provider: google
