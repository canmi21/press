  ko-KR:
    text: ‘친구는 모두 단계적이다’라고 완전히 인정하고 싶지는 않으면서도, 평생 가는 우정을 하나둘은 붙잡고 싶다. 대조되는 것은 출국 전 QQ 그룹 채팅 속의 동료, 동창, 사건에 촉발되고, 추가한 뒤 방치되는 전통적인 연락처와, Twitter에서 맞팔하지 않아도 상호작용과 답장만으로 얼굴이 익는 트친이다. Timeline을 넘기다 예전의 사람들이 아침 인사와 밤 인사를 하는 것을 보면서, 정작 자신은 국외자가 되어 있다. 체면 때문에 언팔하지는 않으면서도, 일방적인 mute와 block, 그리고 공개 트윗이 close friend를 남의 mutual friend로 바꾸는 일을 마주해야 하고, 개인 채팅에서는 보이지 않으며 오프라인에서도 막을 수 없다.
