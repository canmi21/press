  es-ES:
    text: No querer admitir del todo que «los amigos son siempre de una etapa», queriendo aún aferrarse a una o dos amistades para toda la vida. El contraste está entre los contactos tradicionales de los grupos de QQ de antes de irse al extranjero —compañeros de trabajo, de clase, gente añadida por un evento puntual y luego abandonada— y los tuiteros de Twitter, a quienes basta con interactuar y responder para que te suenen, sin necesidad de seguirse mutuamente. Recorrer el Timeline y ver a los de antes dando los buenos días y las buenas noches, mientras uno se ha convertido en el que mira desde fuera; no dejar de seguir por no quedar mal, pero tener que enfrentarse al mute y al block unilaterales, y a que los tuits públicos conviertan al close friend en el mutual friend de otro, algo que no se ve en los mensajes privados y que tampoco se puede frenar fuera de línea.
