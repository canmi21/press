  es-ES:
    text: No querer admitir del todo que «los amigos son todos por etapas», y aun así querer aferrarse a una o dos amistades de por vida. Lo que se contrapone son los contactos tradicionales de los chats grupales de QQ de antes de irse al extranjero —compañeros de trabajo, compañeros de clase, desencadenados por un acontecimiento, agregados y luego abandonados— y los amiguis de Twitter que no necesitan seguirse mutuamente y se vuelven caras conocidas a fuerza de interacciones y respuestas. Recorrer el Timeline y ver a gente de antes dar los buenos días y las buenas noches, mientras uno mismo ha quedado al margen; no dejar de seguir por las formas, y sin embargo tener que afrontar el mute y el block unilaterales, y los tuits públicos que convierten a un close friend en el mutual friend de otra persona, invisibles en el chat privado, imposibles de detener fuera de línea.
