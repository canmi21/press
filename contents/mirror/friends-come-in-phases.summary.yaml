  ko-KR:
    text: 「친구는 다 한 시기뿐」이라는 걸 완전히 인정하고 싶지는 않아서, 여전히 평생 갈 우정 한두 개는 붙잡고 싶다. 대조되는 것은 출국 전 QQ 단체 채팅방에 있던 동료, 동창, 사건으로 엮인 사람, 추가만 해놓고 방치한 전통적 연락처와, 맞팔하지 않아도 상호작용과 답글만으로 얼굴이 익는 트위터의 트잉여들. Timeline을 넘기다 한때의 사람들이 잘 자요 안녕을 주고받는 걸 보지만 정작 자신은 국외자가 되어 있다. 체면 때문에 언팔은 못 하면서도 일방적인 mute와 block을 마주해야 하고, 공개 트윗이 close friend를 남의 mutual friend로 만들어 버리는 것도, DM 안에서는 보이지 않고 오프라인에서도 막을 수 없다.
