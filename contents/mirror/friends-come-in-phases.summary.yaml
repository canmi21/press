  fr-FR:
    text: Ne pas vouloir admettre pleinement que « les amis sont tous liés à des phases », tout en voulant encore s’accrocher à une ou deux amitiés pour la vie. Le contraste oppose les contacts traditionnels des discussions de groupe QQ d’avant le départ à l’étranger — collègues, camarades de classe, déclenchés par un événement, ajoutés puis laissés en plan — et les potes de Twitter qui n’ont pas besoin de se suivre mutuellement, et deviennent familiers à force d’interactions et de réponses. Faire défiler la Timeline et voir les gens d’autrefois se souhaiter bonjour et bonne nuit, alors que l’on s’est soi-même retrouvé à l’écart ; ne pas se désabonner par égard aux convenances, et pourtant devoir affronter le mute et le block à sens unique, ainsi que les tweets publics qui transforment un close friend en mutual friend de quelqu’un d’autre, invisibles en conversation privée, impossibles à arrêter hors ligne.
