  de-DE:
    text: Nicht vollständig anerkennen wollen, dass „Freunde alle phasenhaft sind“, trotzdem ein oder zwei Freundschaften fürs Leben festhalten wollen. Gegenübergestellt werden die traditionellen Kontakte aus QQ-Gruppenchats vor dem Auslandsaufenthalt — Kollegen, Mitschüler, ereignisausgelöst, hinzugefügt und dann hängen gelassen — und Twitter-Freunde, die kein gegenseitiges Folgen brauchen und schon durch Interaktion und Antworten bekannt vorkommen. Die Timeline durchscrollen und sehen, wie einstige Leute Guten Morgen und Gute Nacht sagen, während man selbst zum Außenstehenden geworden ist; um des Gesichts willen nicht entfolgen, und doch einseitigem Mute und Block gegenüberstehen müssen, und öffentlichen Tweets, die aus einem close friend den mutual friend eines anderen machen, im Privatchat unsichtbar, auch offline nicht aufzuhalten.
    provider: xai
    model: grok-4-6
