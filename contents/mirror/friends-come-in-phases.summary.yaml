  en-US:
    text: Unwilling to fully admit that “friends all come in phases,” still wanting to hold onto one or two friendships that last a lifetime. The contrast is the traditional contacts from QQ group chats before going abroad — colleagues, classmates, event-triggered, added and then left hanging — and Twitter friends who need not follow each other, growing familiar through interaction and replies. Scrolling the Timeline, seeing people who once were say good morning and good night, while one has become an outsider; not unfollowing for the sake of face, yet having to confront one-way mute and block, and public tweets that turn a close friend into someone else’s mutual friend, invisible in private chat and unstoppable offline.
    provider: xai
