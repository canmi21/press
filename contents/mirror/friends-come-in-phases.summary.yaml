  fr-FR:
    text: Ne pas vouloir admettre tout à fait que « les amis sont toujours liés à une période », vouloir encore retenir une ou deux amitiés qui dureraient toute une vie. La comparaison se fait entre, d'un côté, les contacts traditionnels des groupes QQ d'avant le départ à l'étranger — collègues, camarades de classe, connaissances nées d'un événement, ajoutées puis laissées en friche — et, de l'autre, les habitués de Twitter, dont on finit par reconnaître le visage à force d'interactions et de réponses, sans même avoir à se suivre mutuellement. Faire défiler la Timeline et voir des gens d'autrefois se souhaiter bonjour et bonne nuit, alors qu'on est soi-même devenu un étranger à la scène ; ne pas se résoudre à les unfollow par égard, mais devoir affronter le mute et le block unilatéraux, ainsi que les tweets publics qui transforment un close friend en mutual friend de quelqu'un d'autre, invisible dans les messages privés et impossible à arrêter hors ligne non plus.
