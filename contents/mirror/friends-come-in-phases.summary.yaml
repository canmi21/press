  de-DE:
    text: 'Nicht ganz bereit, sich einzugestehen, dass «Freundschaften immer nur Phasen sind» — und trotzdem der Wunsch, ein, zwei davon ein Leben lang festzuhalten. Dagegengehalten werden die traditionellen Kontakte aus den QQ-Gruppenchats vor der Ausreise: Kolleginnen und Kollegen, Mitschüler, durch ein Ereignis ausgelöst, hinzugefügt und dann liegengelassen — und die Twitter-Leute, bei denen man einander nicht folgen muss und allein durch Interaktionen und Replies vertraut wird. Beim Scrollen durch die Timeline sieht man das Guten-Morgen und Gute-Nacht von Menschen, die einmal dazugehörten, und ist selbst zum Außenstehenden geworden; aus Rücksicht entfolgt man nicht, muss aber mit einseitigem Mute und Block leben und damit, dass ein öffentlicher Tweet den close friend zum mutual friend anderer macht — im Privatchat unsichtbar, und offline auch nicht aufzuhalten.'
    provider: anthropic
    model: claude-opus-5
    at: 2026-08-29T23:44:24.715896Z
