    tokens: 27754
    review: false
  en-US:
    text: 'Unwilling to fully admit that "friends are all just phases," still wanting to hold on to one or two friendships that last a lifetime. Set against that: the traditional contacts in the QQ group chats from before going abroad — coworkers, classmates, people added because some event triggered it, added and then left to sit — and the Twitter regulars, who need no mutual follow, familiar just from interactions and replies. Scrolling the Timeline and seeing people from back then say good morning and good night, while you have become the outsider; too awkward to unfollow, yet left facing one-way mutes and blocks, and public tweets that turn a close friend into someone else''s mutual friend, invisible in DMs and unstoppable offline.'
