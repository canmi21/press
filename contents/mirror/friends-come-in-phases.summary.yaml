    text: 「友達はどれも一時期のもの」と全面的には認めたくなくて、それでも一生ものの友情を一つ二つは掴んでいたいと思う。対照にあるのは、出国前の QQ グループチャットにいた同僚や同級生、出来事きっかけで繋がり、追加したきり放置された旧来の連絡先と、Twitter で相互フォローでなくても、やり取りやリプライだけで顔なじみになれる推油たち。タイムラインを眺めればかつての人たちがおはようおやすみと言い合っていて、自分のほうが部外者になっている。義理があってフォローは外せず、それでいて一方通行のミュートやブロックに向き合い、公開ツイートが close friend を他人の mutual friend に変えてしまうのに、DM では見えず、オフラインでも止められない。
