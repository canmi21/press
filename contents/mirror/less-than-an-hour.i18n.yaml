  b5b4c92dd5874dc2b7cc34cc65ebfca3:
    de-DE:
      text: 'Ich ging über die Straße. Im Grünstreifen gegenüber lag eine kleine, mit Steinplatten belegte Fläche, genau an der Ecke zwischen Straße und Platz. Von weitem sah sie nach einem ganz brauchbaren Rastplatz aus, nur war schon von weitem zu sehen, dass das Dach irgendwann abgerissen worden war, und aus der Nähe stimmte noch weniger: Das hier war längst nicht mehr das, was es einmal gewesen war. Ich war als Kind hier gewesen, aber jetzt ist das Dach des Unterstands verschwunden, nur ein paar Betonstützen stehen noch, die Wände sind aufgerissen. Neben den Platten stehen tatsächlich ein paar Bäume, doch darunter hat sich längst ein Ring aus Laub gesammelt, niemand kehrt, niemand kommt. Sitzen könnte man schon noch, nur liegt auf dem Stein eine Staubschicht, die man nicht anfassen mag. Ich habe trotzdem irgendetwas zum Unterlegen gesucht, mir die sauberste Platte ausgesucht, mich hingesetzt und den Rechner wieder aufgeklappt -- schreiben wollte ich immer noch. Vielleicht ist auch das ein Vorteil des KI-Zeitalters: Beim Vibe Coding muss man sich gar nicht mehr richtig hinsetzen und schreiben, eine Spracheingabe wie Typeless oder Wispr Flow reicht, ein Agent in der CLI schreibt es für dich, fertig. Ich bin so faul geworden, dass ich kein einziges Zeichen mehr tippen will, und die Grenze des Konservativen habe ich längst aufgegeben -- «bypass permissions», und gut ist. Selbst beim Programmieren bin ich inzwischen :tn[mit drei Herzen bei zwei Dingen]{is="Im Original steht 三心二用, eine Wortschöpfung aus den Redewendungen 三心二意 (unentschlossen, nicht bei der Sache) und 一心二用 (zwei Dinge gleichzeitig tun). Der Reiz liegt im Verschmelzen der beiden Wendungen, den keine geläufige Formulierung wiedergibt."}.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:20:45.403533Z
      seconds: 87.555575833
      tokens: 34379
      review: false
    en-US:
      text: 'I crossed the road. In the greenery on the other side there was a small patch paved with stone bricks, right at the corner where the street meets the square. From a distance it looked like a decent place to rest, except that even from far off I could see the roof was gone, taken down at some point, and up close it was worse -- it had stopped being that place a long time ago. I came here as a kid, but now the shelter''s roof has been torn off, only a few concrete pillars still standing, the walls cracked open. There are a few trees beside the flagstones on the ground, but a ring of fallen leaves had long since gathered underneath, nobody sweeping, nobody coming. There were still places to sit, just with a film of dust over the stone that made you not want to touch it. I found something to put down anyway, picked the cleanest-looking slab, sat down, and opened the laptop again -- I still wanted to write. Maybe that is one of the good things about the AI era: when you are vibe coding you do not really need to sit down properly and write any more, a voice input method like Typeless or Wispr Flow will do, with an Agent in a CLI writing it for you and that is that. I have got lazy enough that I do not want to type a single character, and I lost the conservative''s bottom line a long time ago -- «bypass permissions» and be done with it. Even writing code has turned into :tn[two minds and a half]{is="The original says 三心二用, a coinage that splices together the idiom 三心二意 (half-hearted, unable to commit) with 一心二用 (doing two things at once). Plain wording can carry the distraction, not the collision of two set phrases."}.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:20:45.403533Z
      seconds: 87.555575833
      tokens: 34379
      review: false
    es-ES:
      text: 'Crucé la calle. En la zona verde de enfrente había un pequeño trozo enlosado, justo en la esquina entre la calle y la plaza. De lejos parecía un sitio de descanso bastante decente, salvo que ya desde lejos se veía que el techo había desaparecido, lo habían desmontado en algún momento, y de cerca todavía era peor: hacía mucho que este sitio había dejado de ser aquello. Estuve aquí de niño, pero ahora el techo del cobertizo ya no está, solo quedan unas cuantas columnas de hormigón en pie y las paredes agrietadas. Junto a las losas del suelo sí que hay algún árbol, pero debajo se ha acumulado desde hace tiempo un cerco de hojas caídas, nadie barre y nadie viene. Sitio para sentarse todavía queda, solo que la piedra está cubierta por una capa de polvo que quita las ganas de tocarla. Aun así busqué algo para poner debajo, elegí la losa que parecía más limpia, me senté y volví a abrir el ordenador: seguía queriendo escribir. Puede que esta también sea una de las ventajas de la era de la IA: cuando haces vibe coding en realidad ya no hace falta sentarse a escribir de verdad, basta con un dictado por voz como Typeless o Wispr Flow, con un Agent dentro del CLI que lo escribe por ti y listo. Me he vuelto tan vago que no quiero teclear ni un carácter, y hace tiempo que perdí la línea roja del conservador: «bypass permissions» y ya está. Hasta escribiendo código ando ya :tn[con tres corazones en dos cosas]{is="El original dice 三心二用, un invento que funde dos locuciones fijas chinas: 三心二意 (estar disperso, no acabar de comprometerse) y 一心二用 (hacer dos cosas a la vez). La gracia está en el choque entre ambas, y ninguna expresión corriente la conserva."}.'
      provider: anthropic
      model: claude-opus-5
