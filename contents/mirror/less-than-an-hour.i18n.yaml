    ja-JP:
      text: 道を渡ると、向かいの植え込みの中に石畳を敷いた小さな一角があった。通りと広場の角のところだ。遠目には悪くない休憩所に見えたが、遠くからでも屋根がいつの間にか取り払われているのが分かった。近づくとさらにおかしい。とっくにそういう場所ではなくなっていた。ここは子どもの頃に来たことがある。けれど今は東屋の屋根は跡形もなく、コンクリートの柱が数本立っているだけで、壁にはひびが入っている。石畳のそばには木が何本かあるのだが、その下にはとうに落ち葉が輪になって溜まっていて、掃く人もいなければ来る人もいない。座れる場所は一応あるものの、石の上には埃が一枚かぶっていて、触る気にはなれない。それでも適当に何か敷くものを見つけ、いちばん綺麗そうな一枚を選んで腰を下ろし、またパソコンを開いた。やはり書きたかったのだ。これも AI 時代の恩恵かもしれない。vibe coding のときは、本当に腰を据えて書く必要などもうない。Typeless や Wispr Flow のような音声入力があれば十分で、CLI の中の Agent が書いてくれればそれで終わりだ。もう一文字も打ちたくないほど怠けているし、保守派としての一線もとうに手放した。「bypass permissions」で済ませればいい。コードを書くのまで:tn[三つの心で二つを兼ねる]{is="原文は「三心二用」。中国語の成語「三心二意」（気が散って腰が据わらない）と「一心二用」（同時に二つのことをする）を混ぜて作った造語で、そのねじれた語呂の面白さは普通の訳語では消えてしまう。"}ようになってきた。
