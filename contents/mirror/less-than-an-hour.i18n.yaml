    de-DE:
      text: 'Als ich das Tor der Wohnanlage verließ und die Straße bis zur Kreuzung mit der Hauptstraße entlangging, strömte plötzlich der Wind zwischen den beiden Gebäuden herein. Ich blieb dort stehen und war einen Moment lang fassungslos: „Wind“!? Wie lange habe ich so etwas nicht mehr gespürt; es war nicht die Klimaanlagenluft, nicht der Ventilatorwind, sondern jener unregelmäßige, warme und leicht sanfte Wind, der aus weiter Ferne weht, ein Wind mit Geräuschen; begleitet vom lärmigen Wind der städtischen Straße. In diesem Moment trug ich AirPods und hörte Musik; das Outdoor‑Gefühl ließ mich unbewusst die Geräuschunterdrückung ausschalten. Ich hielt mit der linken Hand eine Flasche Wasser, mit der rechten das Notebook, und ging die Hauptstraße entlang zum Flussufer. Dieses Mal starrte ich nicht auf den Handy‑Bildschirm, und ich weiß nicht warum – ich wollte einfach zuerst zum Flussufer gehen.'
      provider: openai
      model: gpt-oss-120b-medium
