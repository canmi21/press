    zh-CN:
      text: 走过马路，对面的绿化带里有一小片铺着石砖的地方，就在街道和广场的拐角上。远看像个还不错的休息区，只是远远地就能看见，顶不知什么时候已经被拆没了；走近才发现更不对劲，这地方早就不是那么回事了。我小时候来过这里，可现在棚子的顶已经拆干净，只剩几根混凝土柱子立着，墙也裂开了。地上的石板旁其实是有几棵树的，但树下早就围了一圈落叶，没人扫，也没人来。能坐的地方倒还有，只是石板上蒙了一层灰，看着就不太想碰。我还是随手找了点东西垫上，挑了块看起来最干净的坐下，又打开电脑，还是想写点什么。也许这也算 AI 时代的好处吧：vibe coding 的时候，其实并不需要真的坐下来好好写了，用 Typeless、Wispr Flow 这类语音输入法就行，CLI 里有个 Agent 帮你写完就是了。我已经懒到一个字都不想打，保守派的底线也早丢了，「bypass permissions」一按就完事。连写代码都开始:tn[三心二用]{is="原文写的就是「三心二用」，把成语「三心二意」和「一心二用」捏在一起自造出来的说法。它同时含着心思不定和一人分饰两职两层意思，改成任何一个规规矩矩的词，都会丢掉这层错位的谐趣。"}了。
