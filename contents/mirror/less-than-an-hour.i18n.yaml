    en-US:
      text: 'Going further ahead, we stepped into a construction site. Though it’s called a site, there are actually no workers there. This area is starkly polarized: half of the buildings are already complete, even beginning to attract tenants, while the other half is just a skeletal frame, its fence half taken down, the remaining part still fenced off, and it looks like no one intends to resume work. In recent years, China’s real estate market has been weak, with house prices continually falling; by the time this development would have been finished, prices had already dropped faster than the construction progress. The developers either fled or simply stalled. Ironically, because of this, the unfinished section is blocked by the fence, so few people normally venture in, leaving a large swath of grass. It was the first time today I’d seen such an extensive grassy area since I left home. From a distance it gave me a slight feeling of optimism, as if it were the scene that should belong in my memory, but up close it felt off. The grass was no longer green, mixed with many withered yellow leaves, and I couldn’t tell where the wind had come from, since there were no trees nearby. The grass itself grew crookedly, feeling hard and dry to the touch; yet eventually I still lay down.'
