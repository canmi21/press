    fr-FR:
      text: 'En traversant la rue, de l’autre côté, la bande végétale comporte un petit espace pavé de dalles de pierre, juste à l’angle de la rue et de la place ; de loin, cela ressemble à un agréable coin de repos, mais on voit déjà de loin que le toit a été démoli à un moment donné. En s’approchant, c’est encore plus étrange, ce n’est plus du tout ce que c’était. J’y suis allé enfant, mais aujourd’hui le toit du kiosque a disparu, il ne reste que quelques piliers en béton, les murs sont fissurés, à côté du dallage il y a un peu d’arbre, mais le bas est déjà entouré d’un cercle de feuilles mortes, personne ne balaie ni ne vient. Il reste un endroit où s’asseoir, mais la dalle est recouverte d’une fine couche de poussière, ce qui décourage le toucher. J’ai simplement trouvé quelque chose pour faire un coussin, choisi la dalle la plus propre, me suis assis, ouvert mon ordinateur et j’ai encore envie d’écrire. Peut‑être que c’est aussi l’avantage de l’ère de l’IA : en Vibe coding, il n’est plus vraiment nécessaire de s’asseoir pour écrire correctement, les méthodes de saisie vocale comme Typeless, Wispr Flow suffisent, il y a un Agent dans le CLI qui écrit pour vous, je suis devenu tellement paresseux que je ne veux plus taper un caractère, j’ai déjà abandonné les principes conservateurs, il suffit de « bypass permissions », et maintenant, quand j’écris du code, je suis un peu désengagé.'
