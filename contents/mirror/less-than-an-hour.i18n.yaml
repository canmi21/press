    en-US:
      text: 'The moment I opened the screen I knew it was over. :tn[Appley]{is="The original calls the MacBook 果果, a cutesy reduplication of 苹果 (Apple). It''s an affectionate pet name for the laptop — using the brand name outright loses the tenderness."}''s brightness is simply not enough outdoors. I tried a few angles — backlit, front-lit, even lining myself up with the sun — and no matter what I did I couldn''t read a thing. Pretty pathetic, honestly. Indoors I feel like a programmer; outdoors I discover I can''t even get my screen to light up. Fine, the code can go unwritten. But I still wasn''t ready to give up, so I closed the laptop and decided to try my luck in the shade of the trees across the road. Before leaving the railing, I looked out at the river one more time. From a distance it was fine, really — under that cloudy-with-sun light the water still looked the way it does in my memory. But tilt your head down a little, drop your gaze toward the bank, and you find a layer of stuff floating on the surface: algae, leaves, scattered bits of debris. Not much, but the river is no longer clear. The water is stiller than I remember, yet clearly nobody has tended the bank in a long time. "Back during the pandemic years I actually came out to look, and it had already been like this since then." ~~Still, walking past it always stirs something in me.~~'
      provider: anthropic
