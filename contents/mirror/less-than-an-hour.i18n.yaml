      text: 길을 건너니 맞은편 녹지 안에 돌벽돌을 깐 작은 자리가 있었다. 거리와 광장이 만나는 모퉁이였다. 멀리서는 꽤 괜찮은 쉼터처럼 보였는데, 멀리서도 지붕이 언제부턴가 뜯겨 없어진 게 보였고, 가까이 가 보니 더 이상했다. 진작에 그런 곳이 아니게 되어 있었다. 어릴 때 여기 와 본 적이 있다. 그런데 지금은 정자의 지붕이 흔적도 없이 사라지고 콘크리트 기둥 몇 개만 서 있고, 벽은 갈라져 있다. 바닥 돌판 옆에 나무가 몇 그루 있기는 한데, 그 아래엔 이미 낙엽이 빙 둘러 쌓여 있다. 쓰는 사람도 없고 오는 사람도 없다. 앉을 자리는 그래도 남아 있지만, 돌판 위에 먼지가 한 겹 덮여 있어 손대고 싶지가 않았다. 그래도 아무거나 깔 것을 찾아, 제일 깨끗해 보이는 판을 골라 앉고 다시 노트북을 열었다. 그래도 쓰고 싶었으니까. 어쩌면 이것도 AI 시대의 좋은 점일 것이다. 바이브 코딩을 할 때는 사실 제대로 앉아서 쓸 필요가 없다. Typeless나 Wispr Flow 같은 음성 입력이면 충분하고, CLI 안의 Agent가 대신 써 주면 그만이다. 나는 한 글자도 치기 싫을 만큼 게을러졌고, 보수파로서의 마지노선도 진작에 버렸다. 「bypass permissions」면 끝이다. 코드 쓰는 것마저 :tn[세 마음으로 두 가지를]{is="원문은 三心二用. 중국어 성어 三心二意(마음이 갈려 한곳에 붙어 있지 못함)와 一心二用(한 사람이 두 가지를 동시에 함)을 섞어 만든 말장난으로, 두 성어가 겹쳐지는 재미는 평범한 표현으로는 살릴 수 없다."} 하게 되었다.
