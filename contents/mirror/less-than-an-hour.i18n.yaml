      review: false
    ja-JP:
      text: 私はかなりのインドア派で、いつからか「出かける」という言葉が自分にとってとてもよそよそしいものになっていた。必要なときしか外に出ず、一か月に一度しか出ないことも多い。出かけたとしても、 :tn[家と決まった一か所を往復するだけの生活]{is="中国語の liang dian yi xian は字面では二点を結ぶ一本の線で、家ともう一つの決まった場所だけを往復する単調な暮らしを指す。"} で、しかもよく車に乗る。よく考えると、私はもう長いこと本当に屋内を離れていない。AI 時代のバブルと不安を経験したあと、私は悪い習慣を身につけた——深夜によくコードを書くようになり、暮らしている世界と同じ「タイムゾーン」にいないような気がする。今朝も十二時過ぎまで起きられなかった。一日二食だけで、目が覚めると書斎に座り、パソコンを開いて書き始める。コードを書くこと自体はとても楽しいが、AI 時代のコーディングはもうそうではない。午後まで画面を見つめても何も書けず、デザインのひらめきもなく、すべてが不完全に思えた。
