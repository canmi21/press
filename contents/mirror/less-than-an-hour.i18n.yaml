    zh-CN:
      text: 我是一个很宅的人，也不知道从什么时候起，“出门”对我来说已经是一个很陌生的词汇了。我常常一个月只在必要的时候才出门，即使出门也是 :tn[两点一线]{is="“两点一线”字面是两点之间的一条线，形容每天只在住处和另一个固定地点之间往返的单调生活。"} 的生活，还常常坐车。仔细想想，我已经很久没有真正离开过室内了。在经历了 AI 时代的泡沫和焦虑后，我染上了一个坏习惯——常常凌晨写代码，似乎已经和生活的世界不在一个“时区”了。今天早上也是挨到了十二点多才起床，一天只吃两餐，醒来就坐到书房，打开电脑开始写。写代码本身是一件很好玩的事情，但 AI 时代的写代码已经不是了。盯着屏幕盯到下午，什么都写不出来，没有设计灵感，觉得一切都不完美。
