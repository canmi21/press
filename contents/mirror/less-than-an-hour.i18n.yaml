  86c5fbdb33d50086883e7552c0b7c428:
    de-DE:
      text: 'Ich bin ein ausgesprochener Stubenhocker, und ich weiß nicht, seit wann „hinausgehen“ für mich zu einem so fremden Wort geworden ist. Oft verlasse ich einen ganzen Monat lang nur dann das Haus, wenn es nötig ist; selbst dann besteht mein Leben aus einer :tn[Routine zwischen Zuhause und einem einzigen festen Ort]{is="Der chinesische Ausdruck liang dian yi xian bedeutet wörtlich eine Linie zwischen zwei Punkten und beschreibt ein eintöniges Leben, das nur zwischen Zuhause und einem festen Ziel pendelt."}, und ich nehme häufig das Auto. Wenn ich darüber nachdenke, habe ich die Innenräume schon sehr lange nicht mehr wirklich verlassen. Nach der Blase und den Ängsten des KI-Zeitalters habe ich mir eine schlechte Gewohnheit angewöhnt: Ich programmiere oft bis tief in die Nacht und scheine nicht mehr in derselben „Zeitzone“ zu leben wie die Welt um mich herum. Auch heute Morgen bin ich erst nach zwölf Uhr aufgestanden. Ich esse nur zwei Mahlzeiten am Tag; sobald ich wach bin, setze ich mich ins Arbeitszimmer, öffne den Computer und fange an zu schreiben. Programmieren an sich macht viel Spaß, aber Programmieren im KI-Zeitalter tut das nicht mehr. Bis zum Nachmittag starrte ich auf den Bildschirm und brachte nichts zustande: keine Designidee, und alles schien unvollkommen.'
      provider: openai
      model: gpt-5-6-terra-medium
      at: 2026-08-03T03:16:07.928586Z
      seconds: 51.9711005
      tokens: 19394
      review: false
    en-US:
      text: 'I’m a real homebody, and I don’t know when “going out” became such an unfamiliar phrase to me. I often leave home only when necessary, sometimes only once a month; even then, it is a :tn[home-to-one-place routine]{is="The Chinese expression liang dian yi xian literally means a line between two points, describing a monotonous life spent commuting only between home and one fixed destination."}, and I usually take a car. Come to think of it, it has been a long time since I truly left the indoors. After the bubble and anxiety of the AI era, I picked up a bad habit—often coding late at night, as if I were no longer in the same “time zone” as the world I live in. This morning, too, I did not get up until after noon. I eat only two meals a day; once awake, I sit down in my study, open my computer, and start writing. Coding itself is great fun, but coding in the AI era no longer is. I stared at the screen until the afternoon and wrote nothing at all: no design inspiration, and everything felt imperfect.'
      provider: openai
      model: gpt-5-6-terra-medium
      at: 2026-08-03T03:16:07.928586Z
      seconds: 51.9711005
      tokens: 19394
      review: false
    es-ES:
      text: 'Soy muy casero, y no sé desde cuándo «salir» se convirtió para mí en una palabra tan ajena. A menudo paso un mes entero sin salir salvo cuando es necesario; incluso cuando salgo, llevo una :tn[rutina de ir solo de casa a un lugar fijo]{is="La expresión china liang dian yi xian significa literalmente una línea entre dos puntos y describe una vida monótona de desplazarse únicamente entre casa y un destino fijo."}, y además suelo ir en coche. Pensándolo bien, hace mucho que no salgo realmente de interiores. Tras vivir la burbuja y la ansiedad de la era de la IA, adquirí un mal hábito: a menudo programo de madrugada, como si ya no estuviera en la misma «zona horaria» que el mundo en el que vivo. Esta mañana también me levanté pasada las doce. Solo hago dos comidas al día; al despertarme, me siento en el estudio, abro el ordenador y empiezo a escribir. Programar en sí es muy divertido, pero programar en la era de la IA ya no lo es. Me quedé mirando la pantalla hasta la tarde sin escribir nada, sin inspiración para el diseño y sintiendo que nada era perfecto.'
      provider: openai
      model: gpt-5-6-terra-medium
      at: 2026-08-03T03:16:07.928586Z
      seconds: 51.9711005
      tokens: 19394
      review: false
    fr-FR:
      text: 'Je suis très casanier, et je ne sais pas depuis quand « sortir » est devenu pour moi une expression si étrangère. Il m’arrive souvent de ne sortir qu’en cas de nécessité pendant tout un mois ; même quand je sors, ma vie se résume à une :tn[routine entre chez moi et un seul lieu fixe]{is="L’expression chinoise liang dian yi xian signifie littéralement une ligne entre deux points et décrit une vie monotone faite d’allers-retours entre son logement et une destination fixe."}, et je prends souvent la voiture. À bien y réfléchir, cela fait longtemps que je n’ai pas vraiment quitté l’intérieur. Après avoir traversé la bulle et l’anxiété de l’ère de l’IA, j’ai pris une mauvaise habitude : je code souvent au milieu de la nuit, comme si je ne vivais plus dans le même « fuseau horaire » que le monde où je vis. Ce matin encore, je ne me suis levé qu’après midi. Je ne mange que deux repas par jour ; dès mon réveil, je m’assois dans mon bureau, j’ouvre mon ordinateur et je commence à écrire. Coder est en soi très amusant, mais coder à l’ère de l’IA ne l’est plus. J’ai fixé l’écran jusqu’à l’après-midi sans rien parvenir à écrire, sans inspiration de design, avec l’impression que tout était imparfait.'
      provider: openai
      model: gpt-5-6-terra-medium
      at: 2026-08-03T03:16:07.928586Z
