      text: Leaving the narrow alley, I have already moved away from the riverside street area and continue forward along a construction site. I have grown tired of the city’s buildings long ago, especially the densely packed apartment blocks of second‑ and third‑tier cities, which lack the feel of skyscrapers and have no aesthetic appeal. So I deliberately avoid photographing them; I want to capture the sky, but I find this harder than I imagined. Standing on the sidewalk, holding my phone high, avoiding the street and streetlights, the frame still catches a bit of tree shade and the opposite residential buildings. They are built so densely that it is difficult to find a clean patch of sky in this city. Today’s weather is actually quite comfortable. There is sunshine, but not strong—more like it is cloudy. Looking up, the clouds are not dense, scattered sparsely, giving a misty feeling, yet leaving large expanses of clear space. The clouds are beautiful. It’s the kind of beauty you would never notice while being “indoors”, but it’s not the kind of sky loved in anime—“that kind of thing probably doesn’t exist in real‑world Japan either.”
