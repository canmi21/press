    fr-FR:
      text: 'À l''instant où j''ai ouvert l''écran, j''ai su que c''était fichu. La luminosité de :tn[Pomme-Pomme]{is="Dans l''original, le MacBook est appelé 果果, un redoublement affectueux de 苹果 (pomme) — un petit nom tendre pour son propre ordinateur. Le nom de la marque tel quel perdrait cette tendresse."} ne suffit tout simplement pas dehors. J''ai essayé plusieurs angles, à contre-jour, dans le sens de la lumière, jusqu''à m''aligner avec le soleil — rien à faire, impossible de lire quoi que ce soit. Assez pitoyable, honnêtement. À l''intérieur je me prends pour un programmeur, dehors je découvre que je n''arrive même pas à allumer mon écran. Tant pis, ce code, je peux très bien ne pas l''écrire. Mais je n''ai quand même pas voulu abandonner : j''ai refermé le portable et décidé de tenter ma chance à l''ombre des arbres de l''autre côté de la route. Avant de quitter la balustrade, j''ai regardé le fleuve encore une fois. De loin, ça allait, en fait : sous ce ciel mêlé de nuages et de soleil, la surface avait encore l''air de celle de mes souvenirs. Mais qu''on baisse un peu la tête, qu''on laisse glisser le regard vers la berge, et on aperçoit une couche de choses qui flottent — des algues, des feuilles, des débris épars. Pas beaucoup, mais l''eau n''est plus claire. La surface est plus immobile que dans mon souvenir, alors que la berge, à l''évidence, n''est plus entretenue depuis longtemps. « Il y a quelques années, pendant la pandémie, j''étais déjà venu voir, et c''était déjà comme ça depuis ce moment-là. » ~~Malgré tout, chaque fois que je passe, quelque chose me serre un peu.~~'
