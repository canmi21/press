  ece3bf55829edba4e5b445a3313f4642:
    de-DE:
      text: Als ich den Bildschirm öffnete, wusste ich, dass es vorbei war. Guoguos Bildschirmhelligkeit reicht im Freien einfach nicht aus. Ich probierte verschiedene Blickwinkel – Gegenlicht, Vorlicht, sogar mich exakt mit der Sonne auszurichten – doch egal, wie ich einstellte, ich konnte nichts erkennen. Ehrlich gesagt war das ziemlich traurig. Drinnen fühlte ich mich noch als Programmierer, doch draußen stellte ich fest, dass der Bildschirm nicht einmal leuchtete. Also ließ ich den Code ruhen, gab aber nicht auf, schloss das Notebook und beschloss, im Schatten eines Baumes gegenüber der Straße mein Glück zu versuchen. Bevor ich das Geländer verließ, warf ich noch einen Blick auf den Fluss. Aus der Ferne sah er noch ganz in Ordnung aus; das Wasser unter bewölktem, sonnigem Himmel sah immer noch nach meiner Erinnerung aus. Doch als ich den Kopf leicht senkte und zum Ufer schaute, bemerkte ich eine Schicht von Algen, Blättern und kleinen Treibern auf der Wasseroberfläche. Nicht viel, aber das Wasser war bereits trüb; die Oberfläche war ruhiger als in meiner Erinnerung, doch das Ufer war eindeutig vernachlässigt. „Vor ein paar Jahren, während der Pandemie, habe ich es tatsächlich besucht, und seitdem ist es so“ ~~aber jedes Mal, wenn ich vorbeigehe, bleibt ein leichter Anflug von Wehmut~~.
