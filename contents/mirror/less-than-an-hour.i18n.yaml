    en-US:
      text: Walking back along the road beside the river, I turned into a narrow lane that runs close to the residential buildings. Though it's called a forest path, it hardly qualifies as one; the trees are scattered sparsely, and a wall of the building stands right beside it. The lane is paved with asphalt; at a fork there is a short wooden boardwalk with a pavilion stitched together. The asphalt section has already cracked, and grass has sprouted in the fissures; twigs and fallen leaves litter the surface. On the same stretch you can see two different colors. Half of it has clearly been refurbished, but that “new” look seems to be at least three to five years old, and at the joints, a few blades of grass still stubbornly push up—maybe not even “grass” anymore, just a few rows of weeds.
