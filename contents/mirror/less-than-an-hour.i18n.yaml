    es-ES:
      text: 'Al cruzar la calle, del otro lado la zona verde tiene una pequeña área con adoquines de piedra, justo en la esquina de la calle y la plaza; de lejos parece un buen lugar para descansar, pero ya se ve a distancia que el techo se ha derribado en algún momento. Al acercarse, la cosa se ve aún más extraña, ya no es lo mismo. Cuando era niño solía ir allí, pero ahora el techo del cobertizo ha desaparecido, sólo quedan unas cuantas columnas de hormigón, las paredes están agrietadas, junto a la losa de piedra hay un poco de árbol, pero el bajo está ya rodeado por un círculo de hojas caídas, nadie las barre ni viene. Todavía queda un sitio para sentarse, pero la losa está cubierta de una capa de polvo, lo que hace que no quieras tocarla. Simplemente encontré algo para improvisar, elegí la losa que parecía más limpia, me senté, abrí el ordenador y seguí con ganas de escribir. Tal vez ese sea también el beneficio de la era de la IA: cuando haces Vibe coding ya no es necesario sentarse a escribir de verdad, basta con los métodos de entrada de voz como Typeless, Wispr Flow, hay un agente en la CLI que escribe por ti, yo ya estoy tan perezoso que no quiero teclear ni una letra, ya he dejado atrás los principios conservadores, basta con “bypass permissions”, y ahora al escribir código lo hago con medio corazón.'
      provider: openai
      model: gpt-oss-120b-medium
