  ece3bf55829edba4e5b445a3313f4642:
    de-DE:
      text: 'In dem Moment, in dem ich den Bildschirm aufklappte, wusste ich, dass es vorbei war. Die Helligkeit von :tn[Äpfelchen]{is="Im Original heißt das MacBook 果果, eine verniedlichende Verdopplung von 苹果 (Apfel) — ein zärtlicher Kosename für den eigenen Rechner. Der bloße Markenname würde diese Wärme verlieren."} reicht draußen einfach nicht. Ich probierte verschiedene Winkel aus, Gegenlicht, Sonne im Rücken, stellte mich am Ende sogar in eine Linie mit der Sonne — egal wie, ich konnte nichts erkennen. Ziemlich erbärmlich, ehrlich gesagt. Drinnen halte ich mich für einen Programmierer, draußen merke ich, dass ich nicht mal den Bildschirm zum Leuchten bringe. Egal, dann wird dieser Code eben nicht geschrieben. Aber ganz aufgeben wollte ich doch nicht: Ich klappte das Notebook zu und beschloss, es im Schatten der Bäume auf der anderen Straßenseite zu versuchen. Bevor ich das Geländer verließ, sah ich noch einmal auf den Fluss. Von Weitem war es eigentlich in Ordnung, bei diesem Wetter aus Wolken und Sonne sah die Wasserfläche noch so aus wie in meiner Erinnerung. Doch sobald man den Kopf ein wenig senkt und den Blick zum Ufer hinunterzieht, sieht man eine Schicht auf dem Wasser treiben — Algen, Blätter, verstreute Kleinteile. Nicht viel, aber klar ist der Fluss nicht mehr. Die Oberfläche liegt stiller da als in meiner Erinnerung, doch um das Ufer kümmert sich offensichtlich schon lange niemand mehr. „Vor ein paar Jahren, während der Pandemie, war ich eigentlich schon mal hier und habe es mir angesehen — seitdem ist es schon so." ~~Trotzdem berührt es mich jedes Mal ein wenig, wenn ich vorbeigehe.~~'
      provider: anthropic
      model: claude-opus-5
