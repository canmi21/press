    fr-FR:
      text: 'J''ai traversé la rue. Dans les espaces verts d''en face il y avait un petit carré pavé de dalles, juste à l''angle entre la rue et la place. De loin ça ressemblait à un coin de repos plutôt correct, sauf que de loin déjà on voyait que le toit avait disparu, démonté je ne sais quand, et de près c''était pire encore : cet endroit avait cessé d''être celui-là depuis longtemps. J''étais venu ici enfant, mais le toit de l''abri est parti, il ne reste que quelques piliers de béton dressés, et les murs sont fendus. À côté des dalles il y a bien quelques arbres, seulement un anneau de feuilles mortes s''est accumulé dessous depuis longtemps, personne ne balaie, personne ne vient. Il reste de quoi s''asseoir, sauf qu''une couche de poussière recouvre la pierre et donne envie de ne rien toucher. J''ai quand même trouvé de quoi mettre dessous, choisi la dalle qui paraissait la plus propre, je me suis assis et j''ai rouvert l''ordinateur : j''avais toujours envie d''écrire. C''est peut-être ça aussi, l''avantage de l''ère de l''IA : quand on fait du vibe coding, on n''a plus vraiment besoin de s''asseoir pour écrire pour de bon, une dictée vocale comme Typeless ou Wispr Flow suffit, un Agent dans le CLI écrit à ta place et voilà. Je suis devenu paresseux au point de ne plus vouloir taper un seul caractère, et j''ai perdu depuis longtemps la ligne rouge du conservateur : «bypass permissions» et c''est réglé. Même pour coder, me voilà :tn[à trois cœurs pour deux choses]{is="L''original dit 三心二用, un mot forgé en soudant deux locutions figées : 三心二意 (avoir l''esprit ailleurs, ne pas s''engager) et 一心二用 (faire deux choses à la fois). C''est la collision des deux formules qui amuse, et aucune tournure courante ne la restitue."}.'
