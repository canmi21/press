      text: 'In dem Moment, als ich den Bildschirm einschaltete, wusste ich: Das war’s. Die Helligkeit von :tn[Apfelchen]{is="Im Original erhält das Apple-Gerät einen niedlichen, verdoppelten Kosenamen, der von Apfel abgeleitet ist und wie ein vertrauter Personenname klingt."} reicht draußen einfach überhaupt nicht aus. Ich probierte ein paar Winkel aus: Gegenlicht, Licht von vorn, sogar mich selbst genau auf eine Linie mit der Sonne zu bringen — doch wie ich es auch drehte, ich konnte nichts erkennen. Ehrlich gesagt ziemlich erbärmlich. Drinnen fühlte ich mich noch wie ein Programmierer, draußen stellte sich heraus, dass ich nicht einmal einen Bildschirm zum Leuchten bringen konnte. Na gut, dann muss dieser Code eben nicht geschrieben werden. Aber ich wollte noch nicht aufgeben, klappte den Laptop zu und beschloss, mein Glück im Schatten der Bäume auf der anderen Straßenseite zu versuchen. Bevor ich das Geländer verließ, warf ich noch einen Blick auf den Fluss. Von weitem sah er eigentlich ganz ordentlich aus; bei wolkigem Wetter mit Sonne wirkte die Wasseroberfläche noch wie in meiner Erinnerung. Senkte man den Blick aber ein wenig zum Ufer hin, sah man eine Schicht auf dem Wasser treiben — Algen, Blätter, allerlei kleine Schwimmreste. Nicht viel, doch das Flusswasser war nicht mehr klar. Die Oberfläche war ruhiger als in meiner Erinnerung, aber um das Ufer kümmerte sich offensichtlich niemand mehr. „Schon während der Pandemie vor ein paar Jahren bin ich eigentlich hergekommen, um nachzusehen; seit damals ist es so.“ ~~Und doch überkommt mich jedes Mal ein kleiner Anflug von Wehmut, wenn ich vorbeikomme.~~'
