  c2a61f5ffa1950a0b3e22070052a76bd:
    de-DE:
      text: Ich nehme den Aufzug, gehe nach oben, öffne die Tür und komme nach Hause. Die Vorhänge sind tagsüber bereits zugezogen ~~weil ich mich schon lange daran gewöhnt habe, an einem Ort zu leben, der in einer anderen Zeitzone liegt~~, das Licht im Raum ist kein Sonnenlicht, sondern das helle Weiß der Leuchtstoffröhren – gleichmäßig, stabil und ohne Wärme. Das Ausgehen dauert weniger als eine Stunde. Doch wenn ich draußen gehe, habe ich das Gefühl, dass sehr lange Zeit vergangen ist, wie ein langer „Traum“, in dem alles verändert wurde und doch nichts klar erklärt werden kann. Dann wache ich auf. Nachdem ich den Aufzug aus der Tiefgarage verlassen habe, bin ich wieder an diesem Schreibtisch, vor diesem Bildschirm. Die Wärme der Sonne kann tatsächlich drückend wirken, aber wenn sie fehlt, vermisse ich dieses Gefühl. Obwohl Temperatur und Luftfeuchtigkeit im Raum genau richtig sind, führt langes Sitzen zu einer unerklärlichen Müdigkeit.
