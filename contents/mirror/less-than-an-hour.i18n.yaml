    fr-FR:
      text: 'En remontant le chemin le long du fleuve, je me suis engagé dans une petite allée proche des immeubles résidentiels. On l’appelle « sentier forestier », mais ce n’est guère le cas : les arbres sont rares, et juste à côté se dresse le mur d’un bâtiment. L’allée est en bitume ; à une bifurcation, une courte passerelle en bois surmontée d’un pavillon a été assemblée. La partie bitumée s’est déjà fissurée, de l’herbe a germé dans les craquelures, et le sol est jonché de brindilles et de feuilles mortes. Sur le même tronçon, on distingue deux teintes. La moitié a clairement été rénovée, mais ce « neuf » semble dater d’il y a au moins trois à cinq ans, et aux joints, quelques brins d’herbe tenaces percent encore — ce ne sont plus vraiment des « herbes », plutôt quelques rangées de mauvaises herbes.'
