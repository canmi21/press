    es-ES:
      text: 'En el momento en que me recosté, supe que no iba a funcionar. El suelo era tan duro como cemento, solo cubierto por una capa de hierba, sin ningún tipo de amortiguación. Normalmente, al acostarse en el césped no se quiere que esté demasiado húmedo, pero tampoco debería estar tan seco y duro. La tierra ya está completamente compactada; a pocos metros se ve igual que un césped normal, pero el cuerpo no te engaña. Ni siquiera hay mosquitos ~~probablemente incluso los insectos no quieren venir a este tipo de lugar~~. Acostado ahí, con los ojos cerrados, no se escucha ningún sonido natural. Todo es el ruido de la ciudad: el ruido de los motores de combustión – aunque en los últimos años han aumentado los coches eléctricos, siguen siendo inevitables en las calles; el sonido lejano de los pasos de los peatones; y en esta pequeña ciudad los coches parecen no respetar mucho las normas, de vez en cuando suena una bocina, abrupta y estridente.'
