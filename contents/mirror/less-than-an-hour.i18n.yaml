    es-ES:
      text: 'En el instante en que abrí la pantalla supe que estaba perdido. El brillo de :tn[Manzanita]{is="En el original el MacBook se llama 果果, una reduplicación cariñosa de 苹果 (manzana), un apodo tierno para el propio ordenador. El nombre de la marca tal cual perdería esa ternura."} sencillamente no da para el exterior. Probé varios ángulos, a contraluz, con la luz de frente, incluso me coloqué en línea con el sol: no había manera de ver nada. Bastante lamentable, la verdad. Dentro de casa me creo programador, y al salir descubro que ni siquiera consigo encender la pantalla. Da igual, este código bien puede quedarse sin escribir. Pero aun así no me resigné: cerré el portátil y decidí probar suerte a la sombra de los árboles, al otro lado de la carretera. Antes de dejar la barandilla, miré una vez más el río. De lejos no estaba mal: con ese cielo entre nubes y sol, el agua seguía teniendo el aspecto de mis recuerdos. Pero basta con bajar un poco la cabeza y llevar la mirada hacia la orilla para ver una capa de cosas flotando en la superficie: algas, hojas, restos sueltos. No mucho, pero el agua ya no está limpia. La superficie está más quieta que en mi recuerdo, y sin embargo la orilla lleva claramente mucho tiempo sin que nadie la atienda. «Hace unos años, durante la pandemia, ya había salido a verlo, y desde entonces ya estaba así». ~~Aun así, cada vez que paso por aquí algo se me remueve.~~'
