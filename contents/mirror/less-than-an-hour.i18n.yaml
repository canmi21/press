    ko-KR:
      text: 돌아갈 때 전혀 다른 길을 걸어, 단지 뒤문으로 들어가 지하 주차장을 통과했다. 어릴 때 자주 주차장에서 놀았는데, 나중에 한 번 이사했지만, 왜인지 다시 돌아왔다. 주차장은 내 성장 기억 속에서 거의 가지 않던 유일한 장소이며, 모양이 변했는지 여부는 알 수 없지만 그 냄새는 기억한다. 어릴 때 주차장에는 아주 상쾌한 기운이 있었는데, 약간 민트 같고, 진하지만 향기는 없으며, '청'이라는 글자로만 표현할 수 있었고, 지하실 특유의 서늘함도 약간 섞여 있었다. 나는 사실 그 냄새를 꽤 좋아했다. 하지만 이제 들어가 보면 그 상쾌한 기운은 사라졌다. 남는 것은 차가운 습기뿐이며, 공기 속에 무겁게 붙어 있다. 차가 지나갈 때 약간의 바람이 들어오는데, 아마 입구에서 들어오는 것 같은데, 그 바람도 맞지 않고, 모든 것이 맞지 않는다. 이제 그 모습을 떠올릴 수 없지만, 그곳에 있으면 확실히 느낄 수 있는 차이이다.
