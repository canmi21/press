    fr-FR:
      text: Je suis quelqu’un très casanier et je ne sais même pas depuis quand, mais le mot « sortir » est déjà devenu un terme très étranger pour moi. Je ne sors généralement qu’une fois par mois, uniquement quand c’est vraiment nécessaire ; même alors ma vie se résume à un trajet aller‑retour, souvent en voiture ou en transport en commun. En y réfléchissant bien, cela fait longtemps que je n’ai pas réellement quitté une pièce. Après avoir traversé les bulles et les angoisses de l’ère de l’IA, j’ai développé une mauvaise habitude — coder en pleine nuit, comme si je n’étais plus dans le même « fuseau horaire » que le reste de la vie. Ce matin, je ne me suis levé qu’après midi, je ne prends que deux repas par jour, et dès que je me réveille, je m’installe immédiatement dans mon bureau, j’allume mon ordinateur et commence à écrire. Programmer reste très amusant, mais le codage à l’ère de l’IA ne l’est plus vraiment. Je passe l’après‑midi à fixer l’écran, je ne parviens à rien écrire, je manque d’inspiration pour le design et je sens que tout est imparfait.
