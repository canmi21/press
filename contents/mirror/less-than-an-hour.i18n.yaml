  8dba1a489980be0aaaa3aa12aa8f1872:
    de-DE:
      text: 'Für den Rückweg wechselte ich auf die andere Seite der Straße am Fluss und bog in einen Weg nahe den Wohnhäusern ein. Als Waldweg konnte man ihn kaum bezeichnen: Die Bäume standen weit verstreut, und gleich hinter der Mauer daneben erhoben sich die Häuser. Der Weg war asphaltiert; an der Abzweigung schloss sich ein kurzes Stück Holzsteg mit einem Pavillon an. Der Asphalt war bereits rissig, aus den Spalten wuchs Gras, und kleine Zweige sowie Laub lagen über den Belag verstreut. Auf demselben Wegstück waren zwei Farben zu erkennen: Eine Hälfte war offensichtlich erneuert worden, doch dieses :tn[neu]{is="Das Original setzt dieses Wort in Anführungszeichen und bezweifelt damit ironisch, dass es wirklich neu ist."} wirkte ebenfalls mindestens drei bis fünf Jahre alt. Auch aus der Naht hatten sich hartnäckig ein paar Grashalme hervorgezwängt? Als :tn[einzelne Pflänzchen]{is="Der chinesische Zählausdruck 棵 für Bäume oder einzelne Pflanzen wird scherzhaft zurückgenommen: Das Unkraut ist inzwischen zu mehreren Reihen zusammengewachsen."} gingen sie wohl nicht mehr durch; es waren mehrere Reihen Unkraut.'
      provider: openai
      model: gpt-5-6-terra-medium
      at: 2026-08-03T03:16:07.928614Z
      seconds: 102.061600209
      tokens: 19323
      review: false
    en-US:
      text: 'I crossed to the other side of the riverside road for the walk back and turned onto a path near some apartment buildings. Calling it a woodland path would be a stretch: the trees were planted sparsely, and the buildings stood just beyond the wall beside it. The path was asphalt, with a short section of wooden boardwalk and a pavilion at the fork. The asphalt had already cracked, grass had grown through the fissures, and small branches and fallen leaves lay scattered over the surface. Along this same stretch, two colors of pavement were visible: one half had clearly been resurfaced, though that :tn[new]{is="The original puts this word in quotation marks to cast doubt on how new it really is."} looked to be at least three to five years old. A few blades of grass had stubbornly pushed up through the seam as well? They probably no longer counted as :tn[individual plants]{is="The Chinese tree classifier 棵 is humorously withdrawn: the weeds have spread into rows rather than remaining separate plants."}; they were several rows of weeds.'
      provider: openai
      model: gpt-5-6-terra-medium
      at: 2026-08-03T03:16:07.928614Z
      seconds: 102.061600209
      tokens: 19323
      review: false
    es-ES:
      text: 'Para volver, crucé al otro lado de la carretera junto al río y me desvié por un sendero cerca de unos bloques de viviendas. Llamarlo sendero boscoso sería exagerar: los árboles estaban plantados muy separados y, tras el muro de al lado, estaban los edificios. El sendero era de asfalto; en el cruce había un breve tramo de pasarela de madera con un pabellón. La parte asfaltada ya se había agrietado, por las grietas crecía hierba y sobre el pavimento había ramitas y hojas caídas. En el mismo tramo se distinguían dos colores: una mitad se había renovado claramente, aunque aquella :tn[novedad]{is="El original encierra esta palabra entre comillas para dudar con ironía de que realmente sea nueva."} también parecía ser de hacía al menos tres o cinco años. Por la junta también habían brotado obstinadamente unas briznas de hierba, pero ya no contarían como :tn[plantas individuales]{is="El clasificador chino 棵, usado para árboles o plantas separadas, se retira humorísticamente: las malas hierbas ya forman varias filas."}; eran varias filas de malas hierbas.'
      provider: openai
      model: gpt-5-6-terra-medium
      at: 2026-08-03T03:16:07.928614Z
      seconds: 102.061600209
      tokens: 19323
