  8dba1a489980be0aaaa3aa12aa8f1872:
    de-DE:
      text: 'Entlang der Straße am Fluss entlang ging ich zurück und bog in einen schmalen Weg, der dicht an den Wohnhäusern lag. Man nennt ihn zwar Waldweg, aber er kann kaum als solcher durchgehen; die Bäume stehen dünn gesät, und direkt daneben ragt die Mauer eines Gebäudes hervor. Der Weg ist asphaltiert; an einer Gabelung ist ein kurzer hölzerner Steg mit einem Pavillon zusammengefügt. Der Asphaltabschnitt ist bereits rissig, in den Rissen sprießt Gras, und der Untergrund ist mit kleinen Ästen und abgefallenen Blättern übersät. Auf demselben Abschnitt lassen sich zwei Farben erkennen: die eine Hälfte wurde deutlich renoviert, doch dieses „Neu“ wirkt mindestens drei bis fünf Jahre alt, und an den Fugen sprießen immer noch hartnäckig ein paar kleine Gräser – eher ein paar Reihen Unkraut als echte Gräser.'
