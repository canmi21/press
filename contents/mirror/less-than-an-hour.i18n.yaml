    de-DE:
      text: 'Als ich die Straße überquerte, gab es auf der gegenüberliegenden Grünfläche einen kleinen mit Kopfsteinpflaster ausgelegten Bereich, direkt an der Ecke von Straße und Platz; aus der Ferne wirkte er wie ein ganz passender Ruheplatz, doch bereits aus der Entfernung sah man, dass das Dach irgendwann abgerissen worden war. Beim näheren Hinweg wurde es noch merkwürdiger – es war längst nicht mehr das Gleiche. Ich war als Kind dort gewesen, doch heute fehlt das Dach des Pavillons, es stehen nur noch ein paar Betonpfeiler, die Wände sind rissig, neben dem Steinplattenboden gibt es ein wenig Baum, aber der niedrige Bereich ist bereits von einer Schicht abgefallener Blätter umgeben, niemand kehrt sie weg, niemand kommt. Es gibt noch Sitzmöglichkeiten, aber die Steinplatte ist mit einer Staubschicht bedeckt, sodass man sie kaum berühren möchte. Ich habe einfach irgendetwas als Unterlage genommen, die sauberste Platte ausgewählt und mich hingesetzt, meinen Computer geöffnet und wollte weiter schreiben. Vielleicht ist das ein Vorteil des KI‑Zeitalters: Beim Vibe‑Coding muss man nicht mehr wirklich hinsetzen und konzentriert schreiben, Sprach‑Eingabemethoden wie Typeless, Wispr Flow reichen aus, ein Agent im CLI schreibt für dich, ich bin so faul, dass ich kein einziges Zeichen tippen will, ich habe meine konservative Grundhaltung längst aufgegeben, ein „bypass permissions“ genügt, und beim Codieren bin ich jetzt halbherzig.'
