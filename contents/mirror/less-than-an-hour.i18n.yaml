      text: 저는 꽤 집돌이(집에만 있는 사람)이고, 언제부터인지 모르겠지만 ‘외출’이라는 것이 저에게는 이미 낯선 단어가 되었습니다. 저는 보통 한 달에 한 번, 꼭 필요할 때만 외출합니다. 외출해도 두 점 일선(집↔외출) 생활이고, 차를 자주 탑니다. 생각해 보면, 실제로 방을 떠난 지 오래되었습니다. AI 시대의 거품과 불안을 겪은 뒤, 저는 나쁜 습관을 갖게 되었는데—깊은 밤에 코드를 짜는 것입니다. 마치 생활 세계와 같은 ‘시간대’에 있지 않은 듯합니다. 오늘 아침에도 열두 시가 넘어서야 일어났고, 하루에 두 끼만 먹으며, 깨어나자마자 서재에 앉아 컴퓨터를 켜고 코딩을 시작합니다. 코딩 자체는 여전히 재미있는 일인데, AI 시대의 코딩은 더 이상 그렇지 않다고 느껴집니다. 화면을 오후까지 뚫어지게 바라보며 아무것도 써내려가지 못하고, 디자인 영감도 없으며, 모든 것이 완벽하지 않다고 생각합니다.
