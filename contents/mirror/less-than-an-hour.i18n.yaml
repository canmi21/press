      text: 'Im Moment, in dem ich mich hinlegte, wusste ich, dass es nicht funktionieren würde. Der Boden war so hart wie Zement, nur eine Schicht Gras lag darauf, völlig ohne Polsterung. Wenn man normalerweise auf einer Wiese liegt, will man sie nicht zu nass, aber sie darf auch nicht so trocken und hart sein. Der Boden ist bereits vollständig verdichtet; aus ein paar Metern Entfernung sieht er nicht anders aus als ein normaler Rasen, aber der Körper wird nicht täuschen. Nicht einmal Moskitos sind zu finden ~~wahrscheinlich wollen sogar Insekten an einem Ort wie diesem nicht hin~~. Liegt man dort und schließt die Augen, hört man keine natürlichen Geräusche. Es ist nur der Lärm der Stadt: der Motorenlärm von Verbrennern – obwohl in den letzten Jahren viele Elektroautos unterwegs sind, lässt man sie auf den Straßen nicht entkommen; das entfernte Schritte von Fußgängern; und in dieser kleinen Stadt scheinen die Autos die Regeln nicht zu befolgen, gelegentlich ertönt ein hupendes Geräusch, das plötzlich und schrill ist.'
