    ko-KR:
      text: 나는 아주 집에만 있는 사람인데, 언제부터인가 “외출”이라는 말이 내게 몹시 낯선 단어가 되었다. 한 달 동안 꼭 필요한 때에만 밖에 나가는 경우도 많고, 나가더라도 :tn[집과 한 곳만 오가는 생활]{is="중국어 표현 liang dian yi xian은 글자 그대로 두 점을 잇는 선이며, 집과 하나의 고정된 장소만 오가는 단조로운 생활을 뜻한다."}일 뿐이며, 차를 타는 일도 많다. 곰곰이 생각해 보면, 나는 정말로 실내를 벗어난 지가 이미 오래되었다. AI 시대의 거품과 불안을 겪은 뒤 나는 나쁜 습관이 생겼다. 새벽까지 코드를 쓰는 일이 잦아졌고, 내가 사는 세계와 더는 같은 “시간대”에 있지 않은 듯하다. 오늘 아침에도 열두 시가 넘어서야 일어났다. 하루에 두 끼만 먹고, 일어나면 서재에 앉아 컴퓨터를 켜고 글을 쓰기 시작한다. 코드를 쓰는 일 자체는 아주 재미있지만, AI 시대의 코딩은 더는 그렇지 않다. 오후까지 화면을 들여다봤지만 아무것도 쓰지 못했고, 디자인 영감도 없었으며, 모든 것이 완벽하지 않게 느껴졌다.
