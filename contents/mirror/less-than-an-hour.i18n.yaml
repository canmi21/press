  92a8081dc9e7181860a418067fa8d1bf:
    de-DE:
      text: 'Geht man weiter voraus, gelangt man zu einer Baustelle. Zwar nennt man sie Baustelle, aber tatsächlich gibt es dort keine Arbeiter mehr. Das Gebiet ist stark polarisiert: Die eine Hälfte der Gebäude ist bereits fertiggestellt, es werden sogar Mieter akquiriert, während die andere Hälfte nur noch aus dem Gerüst besteht, der Zaun zur Hälfte abgerissen wurde und der verbleibende Teil weiterhin umzäunt ist – es scheint, als wolle niemand die Bauarbeiten weiterführen. In den letzten Jahren war der chinesische Immobilienmarkt schwach, die Immobilienpreise sind kontinuierlich gefallen; vermutlich war der Preis bereits gesunken, bevor das Projekt fertiggestellt war, und zwar schneller als der Baufortschritt. Die Bauträger sind entweder abgehauen oder haben das Projekt einfach liegen lassen. Genau deshalb ist der noch nicht befestigte Abschnitt vom Zaun abgesperrt, sodass gewöhnlich kaum jemand hineintritt und sich ein großes Stück Grasfläche gebildet hat. Das war das erste Mal heute, dass ich eine so ausgedehnte Wiese seit meinem Ausgang aus dem Haus gesehen habe. Aus der Ferne fühlte ich ein wenig Freude – das wäre das Bild, das man aus der Erinnerung erwartet, doch aus der Nähe wirkte es anders. Das Gras war nicht mehr grün, sondern durchsetzt mit vielen welkgelben Blättern, und ich wusste nicht, woher der Wind kam, weil in der Nähe keine Bäume standen. Das Gras selbst wuchs krumm, war hart und trocken anzufassen; dennoch legte ich mich schließlich hin.'
