    es-ES:
      text: 'Soy una persona muy casera y ni siquiera sé desde cuándo, pero la palabra « salir » ya se ha convertido en un término muy desconocido para mí. Normalmente solo salgo una vez al mes, y solo cuando es realmente necesario; incluso entonces mi vida es un simple ida‑y‑vuelta, y a menudo viajo en coche o en transporte público. Pensándolo bien, hace mucho que no he salido realmente de una habitación. Después de pasar por las burbujas y la ansiedad de la era de la IA, adquirí un mal hábito: programar a medianoche, como si ya no estuviera en el mismo « huso horario » que el resto de la vida. Esta mañana no me levanté hasta pasada la una, solo como dos comidas al día, y al despertarme me dirijo directamente a mi estudio, enciendo el ordenador y empiezo a escribir. Programar en sí sigue siendo muy divertido, pero escribir código en la era de la IA ya no lo es. Paso la tarde mirando la pantalla, no logro escribir nada, me falta inspiración de diseño y siento que todo está imperfecto.'
