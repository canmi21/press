      review: false
    fr-FR:
      text: En rentrant, j’ai emprunté un chemin complètement différent, passant par la porte arrière du quartier et traversant le garage souterrain. Quand j’étais petit, je jouais souvent dans le garage, même si j’ai déménagé une fois plus tard, je suis revenu pour une raison inconnue. Le garage est le seul endroit de mes souvenirs d’enfance que je fréquentais rarement ; je ne sais pas s’il a changé d’aspect, mais je me souviens de son odeur. Quand j’étais enfant, le garage dégageait une odeur très fraîche, un peu mentholée, forte mais sans parfum, on ne pouvait le qualifier que de « clair », avec une touche de fraîcheur typique des sous-sols. J’aimais vraiment cette odeur. Mais maintenant, en y entrant, cette fraîcheur a disparu. Il ne reste que l’humidité froide qui colle lourdement à l’air. Quand une voiture passe, un petit souffle de vent se lève, probablement provenant de l’entrée, mais ce vent est également étrange, tout est étrange, je ne parviens plus à imaginer cette atmosphère, mais c’est certainement une différence que l’on ressent quand on est là.
