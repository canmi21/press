    zh-TW:
      text: 回去的時候走了一條完全不同的路，從社區後門繞進去，經過地下車庫。小時候常常在車庫裡玩，雖然後來搬過一次家，不知怎麼又搬回來了。車庫是我成長記憶裡唯一不常去的地方，樣子變沒變我看不出來，但我記得它的味道。小時候車庫裡有一種很清新的氣息，有點像薄荷，濃濃的但沒有香氣，只剩下一個「清」字可以形容，再夾著一點地下室特有的陰涼。我其實還挺喜歡那個味道的。但是現在走進去，那股清氣沒了。只剩下陰冷的濕氣，悶悶地貼在空氣裡。車開過來的時候帶起一點風，大概是從入口灌進來的，但那個風也不對，什麼都不對，哪裡都不對了，我已經想像不出那個樣子了，但是絕對就是你在那裡就能感受到的不同。
      provider: openai
