      text: 私はしゃがみ込み、欠けた板の隙間から生えてきた草の束に手を触れた。見た目は普通の草と変わらないが、触ると乾いていて、土もあまり良さそうではない。それでも板の裂け目から伸びてきたのだ。ここには普段ほとんど人が来ないだろう… 実際にこの場所を歩くと、頭はすでに空っぽになっていて、具体的な考えはなく、ただとても長い時間が過ぎたと感じるだけだ。普段は思い出せないようなものや細部が、その場所に足を踏み入れると自然に浮かび上がり、驚くほど鮮明になる。そして、ここは変わった、あそこも変わったと感慨にふける。記憶の中のあの場所はすでに存在せず、時間がすべてを奪っていった。
