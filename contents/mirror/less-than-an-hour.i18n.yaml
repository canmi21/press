    ko-KR:
      text: 나는 쭈그리고 앉아, 없어져버린 나무판자 사이에 자라난 풀 덤불을 살짝 만졌다. 보기에 평범한 풀과 다를 바 없지만, 손으로 만져보니 건조했고, 토양도 별로 좋지 않아 보였다. 그래도 그 풀은 판자 틈새에서 자라났다. 여기엔 평소에 사람도 거의 오지 않을 것 같다… 사실 이런 곳을 걸을 때면 이미 머릿속이 텅 비어 구체적인 생각은 없고, 오래오래 시간이 흘렀다는 느낌만 든다. 평소엔 떠올리기 힘든 것들과 세부 사항들이 그곳에 도착하자마자 스스로 떠오르는 듯하고, 굉장히 선명해진다. 그러고는 여기도 변했고, 저기도 변했구나 싶는다. 기억 속 그 장소는 이미 존재하지 않고, 시간은 모든 것을 가져가 버렸다.
