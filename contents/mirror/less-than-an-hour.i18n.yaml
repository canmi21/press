    en-US:
      text: I’m a very homebound person, and I don’t even know when it started, but “going out” has become a completely unfamiliar term to me. I usually only go out once a month when it’s truly necessary; even then my outings are just a simple two‑point‑one‑line routine, and I often take a car or public transport. Thinking carefully, I realize I haven’t genuinely left a room in a long time. After experiencing the bubbles and anxieties of the AI era, I picked up a bad habit—writing code in the middle of the night, as if I’m no longer in the same “time zone” as the rest of life. This morning I didn’t get up until after noon, I only have two meals a day, and as soon as I wake I sit in my study, turn on the computer and start writing. Writing code itself is still a lot of fun, but coding in the AI era is no longer that. Staring at the screen until the afternoon, I can’t produce anything, lack design inspiration, and feel everything is imperfect.
      provider: openai
