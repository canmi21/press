      text: 我蹲下來，摸了摸從缺失木板間長出的那叢草。它看起來和普通的草沒什麼兩樣，但摸上去很乾，土質似乎也不太好，可它還是從木板的縫隙裡長了出來。這裡平時大概也不會有人來吧……其實走在這些地方時，大腦早就放空了，沒有什麼具體的念頭，只是覺得過了很久很久，那些平時怎麼也想不起來的事物和細節，那些模糊的記憶，彷彿一走到那個地方就會自行浮現，變得無比清晰。然後你就會感慨，這裡變了，那裡也變了。記憶中的那個地方早已不復存在，時間帶走了這一切。
