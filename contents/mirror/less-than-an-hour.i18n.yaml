    de-DE:
      text: Als ich den schmalen Weg verließ, war ich bereits aus dem Gebiet der Flussuferstraße heraus und ging weiter entlang einer Baustelle. Die Hochhäuser der Stadt habe ich schon lange satt, besonders die dicht gedrängten Wohnblöcke in zweit‑ und drittgrößeren Städten, die nicht das Gefühl von Wolkenkratzern vermitteln und keinerlei ästhetischen Reiz haben. Deshalb vermeide ich es bewusst, sie zu fotografieren; ich wollte den Himmel einfangen, stellte jedoch fest, dass das schwieriger ist als gedacht. Auf dem Bürgersteig stehend, das Handy hoch emporhaltend und die Straße sowie die Laternen vermeidend, dringen dennoch ein wenig Baumschatten und die gegenüberliegenden Wohngebäude ins Bild. Sie sind so eng gebaut, dass es in dieser Stadt kaum möglich ist, ein sauberes Stück Himmel zu finden. Das heutige Wetter ist tatsächlich recht angenehm. Es scheint die Sonne, aber nicht stark – eher bewölkt. Blickt man nach oben, sind die Wolken nicht dicht, sondern verstreut, was ein leicht nebliges Gefühl erzeugt, zugleich bleibt aber viel klarer Himmel. Die Wolken sind wunderschön. Es ist die Art von Schönheit, die man drinnen kaum bemerken würde, aber nicht die Art von Himmel, die in Anime geliebt wird – „so etwas existiert wohl auch im realen Japan kaum.“
