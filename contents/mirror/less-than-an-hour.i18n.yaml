    zh-TW:
      text: 走進木棧的亭子前面停了下來。亭子的地板是木頭鋪的，有幾塊已經缺了，踩上去的木板會翹，發出那種讓人不太放心的聲響；釘子大概早就斷在裡面了。木道的頂是透明的，可能是玻璃也可能是亞克力？但上面大半已經積滿了東西，透光度不太好。周圍本來是草坪，或說是大約一米的灌木叢，但現在已經長到快兩米高，站在裡面真的有種身處叢林的錯覺——如果視線還能瞥見樓房的話。靠近主路那一側的植被仍能看出曾經被修剪成方形的痕跡，但邊緣已經變圓，時間讓它慢慢回到植物本該長成的樣子。
