      text: 하지만 사실 나도 마찬가지다. 누군가가 나에게 이렇게 했다는 걸 처음 알아차린 뒤, 나 역시 다른 사람에게 비슷하게 행동한 적이 없는지 돌아봤다. 지금 생각해 보면 그런 적이 있었다. 이렇게 생각하는 게 조금 잔인할지도 모르지만, 흔히 “시간이 지나야 사람의 진심을 안다”고 하지 않는가. 우연히 만난 모든 사람과 말이 통하는 것은 아니고, 모든 사람의 행동이 나를 편안하게 하는 것도 아니다. 처음에는 제대로 알아보지 못한 사람이라도 예의상 곧바로 팔로우를 끊지는 않지만, 정말 선을 넘는다면 망설이지 않고 차단한다. 어쩌면 어떤 때는 단방향이고, 표시되는 알림도 없으며, `@mention`을 통해 당신에게 온 메시지를 걸러 내지도 않는 `mute`이 최선의 선택일 수 있다. 내가 다른 사람을 불편하게 해도 정작 스스로는 모를 때가 많다. 혹은 그게 가장 솔직한 당신의 모습일 수도 있다. 당신은 자신의 행동에 문제가 없다고 생각하지만, 다른 사람은 못마땅하게 여길 수 있다. 어쩌면 다른 사람이 불편함을 느끼는 순간이 바로 내가 음소거되는 순간일까? (하지만 대부분의 사람이 당신을 음소거하지 않는다면, 아마 그 사람이 지나치게 :tn[예민하고 상처받기 쉬운]{is="원문의 玻璃心은 마음을 깨지기 쉬운 유리에 빗댄 중국 인터넷 표현으로, 예민하고 나약하다고 비웃는 뉘앙스를 흔히 담는다."} 것일 테고, 아니면 그 반대일 수도 있다.)
