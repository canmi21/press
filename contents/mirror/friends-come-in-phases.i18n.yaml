  764ab5e3a41884365925b92929d8c193:
    de-DE:
      text: 'Wie genau zeigt sich diese Kälte also? Eigentlich geschieht das nicht in einem einzigen Augenblick. Wahrscheinlicher ist, dass sich einer deiner Kontakte langsam von dir entfernt: Die Nachrichten werden immer seltener und haben keinen wirklichen Inhalt mehr, bis daraus bloß noch ein :tn[Aufrechterhalten der Serie]{is="Der ursprüngliche Ausdruck xù huǒhuā bedeutet wörtlich, einen Funken am Leben zu halten. Gemeint ist fortlaufendes Chatten, damit das Streak-Abzeichen einer Plattform bestehen bleibt."} wird? Schließlich verfällt das Ganze zu völliger Gleichgültigkeit. Wie ein Frosch, der langsam in warmem Wasser gekocht wird, werden sie nach und nach kälter und verschwinden dann aus deinem Leben. Vielleicht wirst du nicht aus den Kontakten gelöscht, doch eigentlich ist das kaum anders, als wären sie aus deiner Welt verschwunden. Falls sie sich danach noch wegen irgendetwas an dich wenden, werden sie auch :tn[völlig anders als früher `act`]{is="Im Original ist das englische Verb act als Code formatiert und unbeholfen mit der chinesischen Strukturpartikel de verbunden. Dieser absichtliche Sprachmix lässt den Haltungswechsel kalkuliert wirken."}; es ist dann keine Gefälligkeit mehr, wie sie früher unter Bekannten üblich war, sondern als läge eine unsichtbare Distanz zwischen euch...'
      provider: openai
      model: gpt-5-6-sol-high
      at: 2026-08-20T05:22:46.599747Z
      seconds: 140.533926709
      tokens: 25406
      review: false
    en-US:
      text: 'So how exactly does this coldness set in? It usually is not a single moment. More likely, one of your contacts slowly drifts away from you: the messages grow fewer and contain nothing substantial, dwindling into nothing more than :tn[keeping a streak alive]{is="The original phrase literally means keeping a spark going, a platform expression for chatting continuously to preserve a streak badge."}? Eventually, it deteriorates into being ignored altogether. Like a frog slowly boiled in warm water, they gradually turn cold and then disappear from your life. They may not delete you as a contact, but in truth, that is no different from disappearing from your world. If they come to you for something afterward, they will :tn[`act` completely differently from before]{is="The original code-formats the English verb act and bolts it onto the Chinese particle de. The deliberately clunky code-switching makes the change in attitude feel calculated."}; it will no longer be the kind of favor exchanged between people who know each other, but as though an invisible distance separates you...'
      provider: openai
      model: gpt-5-6-sol-high
      at: 2026-08-20T05:22:46.599747Z
      seconds: 140.533926709
      tokens: 25406
      review: false
    es-ES:
      text: 'Entonces, ¿cómo se instala exactamente esa frialdad? En realidad, no ocurre de golpe. Lo más probable es que uno de tus contactos se vaya distanciando poco a poco de ti: los mensajes son cada vez menos frecuentes, dejan de tener contenido sustancial y terminan reducidos a una conducta para :tn[mantener una racha]{is="La expresión original xù huǒhuā significa literalmente mantener viva una chispa. Se refiere a conversar de forma continuada para conservar el distintivo de racha de una plataforma."}, quizá. Al final, todo degenera hasta convertirse en indiferencia absoluta. Como una rana cocida lentamente en agua tibia, esa persona se va enfriando poco a poco y después desaparece de tu vida. Puede que no te elimine de sus contactos, pero en realidad no hay mucha diferencia entre eso y desaparecer de tu mundo. Si después vuelve a buscarte por algún motivo, también :tn[`act` de una manera completamente distinta]{is="En el original, el verbo inglés act aparece con formato de código y se acopla torpemente a la partícula china de. La mezcla deliberadamente rígida hace que el cambio de actitud parezca calculado."}; ya no será la clase de favor que antes se hacían dos conocidos, sino como si entre ambos hubiera una distancia invisible...'
      provider: openai
      model: gpt-5-6-sol-high
      at: 2026-08-20T05:22:46.599747Z
      seconds: 140.533926709
      tokens: 25406
      review: false
    fr-FR:
      text: 'Alors, comment cette froideur s’installe-t-elle exactement ? En réalité, cela ne se produit pas en un instant. Il est plus probable que l’un de tes contacts s’éloigne peu à peu de toi : les messages deviennent de plus en plus rares, ne contiennent plus rien de substantiel et finissent par n’être qu’une façon d’‌:tn[entretenir une série]{is="L’expression originale xù huǒhuā signifie littéralement maintenir une étincelle en vie. Elle désigne le fait d’échanger continuellement des messages pour conserver l’indicateur de série d’une plateforme."} ? À la fin, cela dégénère jusqu’à l’indifférence la plus totale. Comme une grenouille que l’on fait cuire lentement dans de l’eau tiède, la personne devient progressivement plus froide, puis disparaît de ta vie. Elle ne te supprimera peut-être pas de ses contacts, mais au fond, cela ne diffère guère d’une disparition de ton monde. Si elle revient ensuite te demander quelque chose, elle :tn[`act` d’une manière totalement différente]{is="Dans l’original, le verbe anglais act est mis en forme comme du code puis greffé maladroitement à la particule chinoise de. Ce mélange volontairement raide donne l’impression d’un changement d’attitude calculé."}; ce ne sera plus un service rendu comme autrefois entre connaissances, mais comme si une distance invisible vous séparait...'
      provider: openai
      model: gpt-5-6-sol-high
      at: 2026-08-20T05:22:46.599747Z
      seconds: 140.533926709
      tokens: 25406
      review: false
    ja-JP:
      text: では、いったいどのように冷えていくのか。実際、それは一瞬で起こるものではなく、たいていは連絡先の誰かが徐々にあなたから離れていく形で現れる。メッセージはどんどん減り、中身もなくなり、ただ :tn[連続記録を保つだけ]{is="原語は xù huǒhuā で、字面では火花を絶やさないという意味。連続してやり取りし、SNS上のストリーク表示を保つ行為を指す。"} のやり取りになるのだろうか？そして最後には、完全に無視されるところまで落ちていく。まるでぬるま湯でカエルを煮るように、少しずつ冷たくなり、やがてあなたの生活から消えていく。連絡先から削除されることはないかもしれないが、実際にはあなたの世界から消えたも同然だ。そのあと何か用があってあなたを訪ねてきても、以前とはまったく違うふうに :tn[`act` する]{is="原文では英語の動詞 act をコード書式にし、中国語で様態を導く de へそのままつないでいる。不自然な中英混用が、相手がわざと態度を変えた感じを強める。"}。かつてのような知り合い同士の助けではなく、まるで目に見えない距離が横たわっているかのように……
      provider: openai
      model: gpt-5-6-sol-high
      at: 2026-08-20T05:22:46.599747Z
      seconds: 140.533926709
      tokens: 25406
      review: false
    ko-KR:
      text: 그렇다면 대체 어떻게 차가워지는 걸까? 사실 한순간에 일어나는 일은 아니다. 누군가가 서서히 당신에게서 멀어지는 모습으로 나타날 가능성이 더 크다. 메시지는 갈수록 줄고 내용도 실속이 없어지며, 그저 :tn[연속 기록만 이어 가기 위한 행동]{is="원문의 xù huǒhuā는 글자 그대로 불꽃을 계속 살린다는 뜻이다. 계속 대화해 플랫폼의 스트리크 표시를 유지하는 행위를 가리킨다."}으로 변하는 걸까? 마지막에는 완전히 무시하는 상태로까지 퇴보한다. 마치 미지근한 물에 개구리를 삶듯 서서히 냉담해지다가 당신의 삶에서 사라진다. 연락처에서 삭제하지는 않을 수도 있지만, 사실상 당신의 세계에서 사라진 것과 다를 바 없다. 그 뒤에 무슨 일로 당신을 찾아오더라도 예전과는 완전히 다르게 :tn[`act` 할 것이다]{is="원문은 영어 동사 act를 코드 서식으로 감싼 뒤 중국어 양태 표지 de에 어색하게 붙였다. 의도적인 중영 혼용이 상대가 일부러 태도를 바꿨다는 느낌을 강조한다."}. 예전처럼 아는 사람끼리 돕는 모습이 아니라, 마치 보이지 않는 거리를 사이에 둔 것 같을 것이다...
      provider: openai
      model: gpt-5-6-sol-high
      at: 2026-08-20T05:22:46.599747Z
      seconds: 140.533926709
      tokens: 25406
      review: false
    zh-CN:
      text: 这种冷漠到底是什么样的？它通常不会在一瞬间发生，更可能是某个联系人一点点疏远你：消息越来越少，也不再有实质内容，逐渐变成单纯为了 :tn[维持连续聊天记录]{is="原文用“续火花”来指为了保住社交平台上的连续聊天标识而持续发消息，也暗示交流已经退化成维护产品机制。"} 而勉强互动？最后甚至彻底不再理你。就像温水煮青蛙一样，对方慢慢冷淡下来，最终从你的生活中消失。也许对方不会删除你的联系方式，但其实已经与从你的世界里消失没什么区别。此后即使还有事情来找你，也会 :tn[完全 `act` 得跟从前不一样]{is="原文把英语动词 act 嵌进中文的“得”字结构里，刻意生硬的中英混用突出了对方像换了一副态度。"}：不再是熟人之间那种自然的帮忙，而像是彼此隔着一道无形的距离……
