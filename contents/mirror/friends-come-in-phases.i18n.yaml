    ko-KR:
      text: 내가 사람을 알게 되는 경로는 사실 굉장히 한정적이다. 기본적으로 단체 채팅방에서 갑자기 튀어나온 어떤 일이나, 어떤 종류의 ‘관계’가 계기가 된다. 관계라고 하면 오래 이어질 것처럼 들리지만, 솔직히 말해 그중 많은 것은 내가 통제할 수 없는 어떤 사건이 촉발한 것이다. 직장 동료나 동창, 심지어는 단지 어떤 일에 관심이 있거나 마침 같은 종류의 일을 하고 있는 사람들 말이다. 처음에는 어쩔 수 없이 서로를 추가하는 경우가 많고, 추가한 뒤에는 그대로 방치한다. 상대가 계속 먼저 연락하지 않는다면 아마 평생 다시 메시지를 보낼 일도 없을 것이다. 하지만 어느 날 갑자기 어떤 일을 계기로 나를 찾아온다면, 높은 확률로 이 단계에 들어가게 된다.
