      text: 'But over the past year or two I''d already half-sensed this drift, and I kept dodging the subject. Then one night a while back, scrolling through Twitter until I was :tn[down in the dumps]{is="The original used the Latin-script English word “emo” directly as a Chinese verb — “我 emo 了” — a piece of internet slang that names a low, deflated mood with a half-self-mocking lightness."}, I saw people I once knew, :tn[Twitter buddies]{is="The original wrote 推油, a pun on 推友 (“Twitter friend”) that swaps in a homophone; it carries the warmth of a Chinese internet nickname for people met on the platform."} :tn[snuggling up]{is="The original wrote 贴贴, a reduplicated internet word that mimics a coy, babyish voice for pressing close to someone; a plain “hug” loses that childlike softness."} and hugging, saying good morning and good night, even replying to each other — and only then did I realise: maybe I''m the one who''s surplus... That whole circle is still there. It''s only my own circle of friends that stopped being the one it used to be, and I think maybe I''m the「outsider」.'
