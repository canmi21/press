      text: この「段階」は、恋愛にたとえられるのかもしれない。新鮮に感じる時期があり、熱が高まる時期もある。友人同士のやり取りや会話も同じだ。知り合って最初の数日間はとても積極的に話し、あなたの**:tn[封印したい恥ずかしい過去]{is="原文の「黑历史」は日本のサブカルチャーに由来する中国語のネットスラングで、本人が振り返りたくない、あるいは他人に掘り返されたくない気まずい過去を、からかいを込めて指す。単なる暗い歴史という意味ではない。"}**まで掘り返すこともある。その後は、長く続く何かに支えられた、安定した交流の段階に入る。それは一緒に働くことかもしれないし、学校で同じクラスにいることかもしれない。ネットで知り合った者同士の共通の趣味かもしれないし、短期間では解決できない問題を抱えた誰かが、あなたを頼ってきたことがきっかけかもしれない。まるで本来交わることのなかった二本の線が突然ねじれ合うように、彼らは不意にあなたの人生へ現れる。
