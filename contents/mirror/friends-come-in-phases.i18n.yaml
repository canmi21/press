      tokens: 31581
      review: false
    ja-JP:
      text: 「段階」はおそらく恋愛にたとえられる。新鮮な時期があり、熱を帯びた時期がある。友人どうしのやりとりも同じだ。知り合って最初の数日はやたら熱心に話し、こちらの:tn[黒歴史]{is="原文の中国語も「黑历史」で、日本のサブカル用語が中国のネットに輸入されたもの。掘り返されたくない気まずい過去を指す語で、字義どおりの暗い歴史ではない。"}まで掘り返してくる。それからは、何か長く続く事柄をめぐる安定した交流の段階に入る。一緒に仕事をしているのかもしれないし、学校で同じクラスの同級生なのかもしれないし、ネットで知り合った者どうしの共通の趣味かもしれないし、ある問題を抱えて相談に来て、その問題が短期間では解決しないというだけかもしれない。もともと交わるはずのなかった二本の線が突然もつれ合ったように、その人たちもそうやって突然こちらの生活に現れる。
