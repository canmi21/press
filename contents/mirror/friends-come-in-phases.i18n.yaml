    es-ES:
      text: 'Pero, en realidad, desde hacía uno o dos años ya intuía que las cosas iban por ese camino, aunque no había dejado de evitar el tema. Hasta que una noche, hace algún tiempo, me puse a recorrer Twitter y acabé :tn[en modo emo]{is="En el original, la palabra inglesa emo se usa directamente como predicado chino, lo que da al bajón un tono de Internet y medio burlón consigo mismo."}. Al ver a :tn[amiguis de Twitter]{is="En el original se usa tuiyou, un apodo cariñoso de Internet para las amistades hechas en Twitter y, a la vez, un juego homófono escrito de forma deliberadamente juguetona."} que antes se conocían entre sí :tn[haciendo mimitos]{is="En el original aparece una expresión de Internet reduplicada que imita un tono infantil y mimoso para expresar cercanía, arrumacos o afecto mostrado en público."}, abrazándose, dándose los buenos días y las buenas noches e incluso respondiéndose mutuamente, me di cuenta: quizá quien sobraba era yo... Toda aquella gente seguía allí; era solo que mi círculo de amistades hacía ya mucho que había dejado de ser el de entonces. Tal vez era yo la «forastera».'
