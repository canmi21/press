      text: 特にTwitterでは、ときどき、自分の友達が誰か別の人の友達になったのだと感慨にふけることがある。でも、よく考えてみれば、これはごく当たり前のことだ。そもそもこの世界に同じタイムラインは存在せず、僕と君のタイムラインが幸運にも出会えたこと自体、すでに一つの幸運なのだ。あるコミュニティに入り、そこで人と知り合ったなら、そのコミュニティの人たちも互いに知り合えるようなものだ。従来のグループチャットという仕組みでは、それが個別のやり取りなので、君が知ることはない。ところがTwitterは、残念ながらこの制限を打ち破ってしまった。誰もが公開しているツイートの中では、たいていこの行動をいとも簡単に観察できる。他人と君を結びつける関係が周期的に動き始めると、この現象は君にも容易に見えるようになる。
