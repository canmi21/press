  8e01bc84022d819699f363bd4473aebf:
    de-DE:
      text: '„Phasen“ lassen sich ungefähr mit einer Liebesbeziehung vergleichen: Es gibt eine Zeit, in der alles neu ist, und eine leidenschaftliche Phase. Auch der Austausch und die Gespräche unter Freunden verlaufen so. In den ersten Tagen nach dem Kennenlernen kommuniziert man sehr rege und gräbt mitunter sogar in der **:tn[peinlichen Vergangenheit]{is="Im chinesischen Original steht der Netzbegriff „黑历史“, der aus der japanischen Subkultur stammt. Er bezeichnet speziell beschämende Episoden, an die man selbst nicht erinnert werden und die man nicht von anderen ausgegraben sehen möchte."}** des anderen; danach beginnt eine stabile Phase des Austauschs innerhalb einer länger andauernden Verbindung. Vielleicht arbeitet man zusammen, ist an der Schule in derselben Klasse, teilt als Onlinebekanntschaft ein Interesse oder wendet sich wegen eines Problems an jemanden, das sich nicht kurzfristig lösen lässt. Es ist, als hätten sich zwei Linien, die einander ursprünglich nie kreuzten, plötzlich ineinander verwunden – und so tauchen diese Menschen unvermittelt im eigenen Leben auf.'
      provider: openai
      model: gpt-5-6-sol-high
      at: 2026-08-20T05:22:55.733498Z
      seconds: 57.514599334
      tokens: 21882
      review: false
    en-US:
      text: '“Phases” can roughly be compared to a romantic relationship: there is the novelty phase, and then the passionate phase. Interacting and chatting with friends works the same way. During the first few days after meeting, you communicate very actively and may even dig up their **:tn[cringeworthy past]{is="The original Chinese internet slang was “黑历史,” borrowed from Japanese subculture and referring specifically to embarrassing episodes someone would rather not revisit or have exposed."}**; after that, you enter a stable phase of ongoing communication within a long-term situation. You might be working together or attending the same class at school; it might be a shared interest between people who met online, or someone might have approached you about a problem that cannot be solved quickly. It is as if two lines that never intersected suddenly became entangled, and that is how these people abruptly appeared in your life.'
      provider: openai
      model: gpt-5-6-sol-high
      at: 2026-08-20T05:22:55.733498Z
      seconds: 57.514599334
      tokens: 21882
      review: false
    es-ES:
      text: 'Las «etapas» pueden compararse, más o menos, con una relación amorosa: hay una etapa de novedad y otra de pasión. Con la interacción y las conversaciones entre amigos ocurre lo mismo. Durante los primeros días tras conocerse, la comunicación es muy activa e incluso se desentierra el **:tn[pasado vergonzoso]{is="El original usa el término de internet chino «黑历史», procedente de la subcultura japonesa. Alude específicamente a episodios embarazosos que alguien no quiere recordar ni que otros saquen a la luz."}** de la otra persona; después se entra en una fase estable de comunicación dentro de una situación prolongada. Puede tratarse de trabajar juntos, de ser compañeros de la misma clase, de compartir un interés con alguien conocido por internet o de que una persona acuda a ti con un problema que no puede resolverse en poco tiempo. Es como si dos líneas que originalmente no se cruzaban se enredaran de repente: así es como esas personas aparecen súbitamente en tu vida.'
      provider: openai
      model: gpt-5-6-sol-high
      at: 2026-08-20T05:22:55.733498Z
      seconds: 57.514599334
      tokens: 21882
      review: false
    fr-FR:
      text: 'On peut plus ou moins comparer les « phases » à celles d’une relation amoureuse : il y a la période de la nouveauté, puis celle de la passion. Les échanges et les conversations entre amis suivent le même schéma. Durant les premiers jours après une rencontre, on communique très activement, au point d’aller parfois fouiller dans le **:tn[passé embarrassant]{is="L’original emploie le terme d’argot internet chinois « 黑历史 », issu de la sous-culture japonaise. Il désigne précisément les épisodes gênants que quelqu’un préférerait oublier ou ne pas voir déterrés par autrui."}** de l’autre ; vient ensuite une phase d’échanges stables au sein d’une situation appelée à durer. Il peut s’agir de travailler ensemble, d’être camarades dans la même classe, de partager un centre d’intérêt avec quelqu’un rencontré en ligne, ou encore d’être contacté à propos d’un problème impossible à résoudre rapidement. C’est comme si deux lignes qui ne se croisaient pas s’étaient soudain entortillées : ces personnes surgissent ainsi brusquement dans votre vie.'
      provider: openai
      model: gpt-5-6-sol-high
      at: 2026-08-20T05:22:55.733498Z
      seconds: 57.514599334
      tokens: 21882
      review: false
    ja-JP:
      text: 「段階」は、恋愛にたとえるとわかりやすいかもしれない。新鮮に感じる時期もあれば、熱が高まる時期もある。友達同士の交流や会話も同じだ。知り合って最初の数日間は積極的にやり取りし、相手の**:tn[黒歴史]{is="原文は中国語のネット用語「黑历史」。日本のサブカルチャーに由来し、本人が思い出したくない、あるいは他人に掘り返されたくない恥ずかしい過去を指すくだけた表現である。"}**まで掘り返すこともある。それから、長く続く関わりの中で安定して交流する段階に入る。一緒に仕事をしている場合もあれば、学校で同じクラスの同級生である場合、ネットで知り合った者同士に共通の趣味がある場合、あるいは短期間では解決できない問題を抱えた誰かが相談に来た場合もある。まるで、それまで交わることのなかった二本の線が突然絡み合うように、その人たちは不意にあなたの生活へ現れるのだ。
