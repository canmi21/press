    de-DE:
      text: 'Eigentlich hatte ich schon seit ein oder zwei Jahren vage gespürt, dass es in diese Richtung ging, doch ich wich dem Thema immer wieder aus. Bis ich vor einiger Zeit eines Abends beim Scrollen durch Twitter :tn[in ein Tief geriet]{is="Im Original wird das englische Wort emo in lateinischen Buchstaben direkt als chinesisches Prädikat verwendet; dadurch wirkt die Niedergeschlagenheit internettypisch und halb selbstironisch."}. Als ich sah, wie einst miteinander bekannte :tn[Twitter-Freunde]{is="Im Original steht 推油, eine scherzhafte lautgleiche Schreibweise von 推友 für auf Twitter kennengelernte Freunde, die wie ein liebevoller chinesischer Internetspitzname klingt."} :tn[sich ganz innig aneinanderkuschelten]{is="Das Original verwendet den verdoppelnden Internetausdruck 贴贴, der Nähe, Anschmiegen oder öffentlich gezeigte Zuneigung in einem niedlich-kindlichen Ton ausdrückt."}, sich umarmten, einander guten Morgen und gute Nacht wünschten und sich sogar gegenseitig antworteten, wurde mir klar: Vielleicht war ich derjenige, der überflüssig war ... Alle aus diesem Kreis waren noch da; nur mein Freundeskreis war längst nicht mehr derselbe wie damals. Vielleicht war ja ich der „Außenseiter“.'
