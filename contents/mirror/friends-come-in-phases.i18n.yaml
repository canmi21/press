  8e01bc84022d819699f363bd4473aebf:
    de-DE:
      text: '„Phasen" lassen sich wohl am ehesten mit einer Liebesbeziehung vergleichen: Es gibt die Zeit des Neuen und es gibt die Zeit der Leidenschaft. Zwischen Freunden läuft es genauso. In den ersten Tagen nach dem Kennenlernen schreibt man sich eifrig, gräbt sogar deine :tn[peinliche Vergangenheit]{is="Im Original steht 黑历史, ein aus der japanischen Subkultur ins chinesische Netz übernommener Ausdruck. Gemeint ist ausdrücklich das eigene Fremdschäm-Kapitel, das niemand hervorholen soll, nicht eine dunkle Vergangenheit im schweren Sinn."} aus; dann geht es über in eine stabile Phase des Austauschs rund um eine langfristige Sache. Das kann gemeinsame Arbeit sein, Mitschüler in derselben Klasse, ein geteiltes Interesse zwischen Leuten, die sich online kennengelernt haben, oder jemand, der wegen eines bestimmten Problems zu dir kommt, das sich so schnell nicht lösen lässt. Als hätten sich zwei Linien, die einander nie geschnitten hätten, plötzlich ineinander verdreht -- und so tauchen diese Menschen eben plötzlich in deinem Leben auf.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:18:31.544784Z
      seconds: 49.972728209
      tokens: 31581
      review: false
    en-US:
      text: '"Phases" are probably best compared to a romance: there is a novelty period, and there is a passionate period. It works the same way between friends. In the first few days after meeting, you talk eagerly, even digging up your :tn[embarrassing past]{is="The original says 黑历史, an internet term borrowed from Japanese fan culture. It means specifically the cringeworthy past you would rather nobody unearthed, not a dark history in the grave sense."}; then it settles into a stable phase of exchange around some long-running thing. It could be working together, being classmates in the same class at school, a shared interest between people who met online, or someone coming to you about a particular problem that cannot be solved quickly. It is as if two lines that were never going to meet suddenly twisted together, and just like that, those people appeared in your life.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:18:31.544784Z
      seconds: 49.972728209
      tokens: 31581
      review: false
    es-ES:
      text: 'Las «fases» se pueden comparar, más o menos, con una relación amorosa: hay un periodo de novedad y hay un periodo de ardor. Entre amigos pasa lo mismo. Los primeros días después de conocerse se habla con mucho entusiasmo, incluso se desentierra tu :tn[pasado vergonzoso]{is="El original usa 黑历史, una expresión de internet llegada al chino desde la subcultura japonesa. Designa en concreto los episodios bochornosos del propio pasado que uno preferiría que nadie sacara a la luz, no una historia oscura en sentido grave."}; después se entra en una fase estable de trato en torno a algo de largo recorrido. Puede ser un trabajo compartido, ser compañeros de la misma clase en la escuela, un interés común entre personas que se conocieron en internet, o alguien que acude a ti por un problema concreto que no se resuelve en poco tiempo. Como si dos líneas que nunca iban a cruzarse se hubieran enredado de repente, esa gente aparece así, de golpe, en tu vida.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:18:31.544784Z
      seconds: 49.972728209
      tokens: 31581
      review: false
    fr-FR:
      text: 'Les « phases », on peut sans doute les comparer à une histoire d''amour : il y a la période de nouveauté, et il y a la période de ferveur. Entre amis, c''est pareil. Les premiers jours après la rencontre, on échange avec beaucoup d''entrain, on va même déterrer ton :tn[passé embarrassant]{is="L''original emploie 黑历史, un terme d''internet passé de la sous-culture japonaise au chinois. Il désigne précisément les épisodes gênants de son propre passé qu''on préférerait voir rester enfouis, et non une histoire sombre au sens grave."} ; puis vient une phase stable d''échanges autour de quelque chose qui dure. Ce peut être un travail commun, des camarades dans la même classe à l''école, un intérêt partagé entre gens rencontrés en ligne, ou encore quelqu''un qui vient te voir pour un problème précis, un problème qui ne se règle pas en peu de temps. Comme si deux lignes qui n''auraient jamais dû se croiser s''étaient soudain enroulées l''une autour de l''autre, ces gens-là apparaissent ainsi d''un coup dans ta vie.'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:18:31.544784Z
