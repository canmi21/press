    ja-JP:
      text: 私が人と知り合うきっかけは、実はかなり限られている。基本的には、グループチャットで突然持ち上がった何か、あるいは何らかの「関係」からだ。関係というと長く続きそうに聞こえるけれど、ぶっちゃけ、その多くは自分ではコントロールできない何らかの出来事をきっかけに生まれたものだ。同僚や同級生、さらには単にあることに興味を持っている人や、たまたま同じようなことをしている人だったりする。最初は半ば強制的に連絡先を追加させられることが多く、追加したあとはそのまま放置する。相手からずっと連絡してこなければ、たぶん一生こちらからメッセージを送ることもない。でも、ある日何かの出来事をきっかけに突然連絡してきたなら、おそらくこの段階に入る。
