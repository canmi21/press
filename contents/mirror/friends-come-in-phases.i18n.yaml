  764ab5e3a41884365925b92929d8c193:
    de-DE:
      text: 'Wie sieht diese Kälte also konkret aus? Sie entsteht nicht in einem einzigen Augenblick. Wahrscheinlicher ist, dass sich jemand aus deinen Kontakten allmählich von dir entfernt: Die Nachrichten werden seltener und inhaltsloser, bis sie vielleicht nur noch dazu dienen, :tn[einen Streak am Leben zu halten]{is="Im Original steht 续火花. Gemeint ist, auf einer sozialen Plattform weiter Nachrichten auszutauschen, nur damit das Streak- oder Flammensymbol bestehen bleibt."}? Am Ende geht das in völliges Ignorieren über. Wie beim Frosch im langsam erwärmten Wasser wird die Person nach und nach kälter und verschwindet schließlich aus deinem Leben. Vielleicht löscht sie dich nicht aus ihren Kontakten, doch praktisch ist das nicht anders, als wäre sie aus deiner Welt verschwunden. Wenn sie sich danach noch wegen irgendetwas bei dir meldet, wird sie sich :tn[völlig anders verhalten als früher]{is="Im Original wird das englische Verb `act` als Code formatiert und unmittelbar mit der chinesischen Ergänzungspartikel 得 verbunden. Diese bewusst holprige Sprachmischung lässt das veränderte Verhalten wie eine aufgesetzte Rolle wirken."}. Es ist dann keine Hilfe unter alten Bekannten mehr, sondern als läge eine unsichtbare Distanz zwischen euch …'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-26T06:50:41.299424Z
      seconds: 210.115590208
      tokens: 27646
      review: false
    en-US:
      text: 'So what does this coldness actually look like? It rarely happens all at once. More likely, a contact gradually pulls away from you: messages become fewer and increasingly devoid of substance, perhaps dwindling into nothing more than :tn[keeping a streak alive]{is="The original says 续火花, a social-media expression for exchanging messages solely to preserve a platform’s streak or flame badge."}? Eventually, it deteriorates into them ignoring you completely. Like a frog in slowly heated water, they grow colder little by little and then disappear from your life. They may never delete you from their contacts, but in practice that is no different from vanishing from your world. If they later come to you because they need something, they will :tn[`act` completely unlike they did before]{is="The original word is the English verb act, formatted as code and attached to the Chinese complement marker 得. This deliberately awkward code-switching makes their changed attitude feel consciously performed."}. It will no longer be the kind of favor exchanged between people who know each other, but will feel as though an invisible distance lies between you…'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-26T06:50:41.299424Z
      seconds: 210.115590208
      tokens: 27646
      review: false
    es-ES:
      text: 'Entonces, ¿cómo se manifiesta exactamente esa frialdad? En realidad, no ocurre de golpe. Lo más probable es que uno de tus contactos se vaya alejando poco a poco: los mensajes son cada vez menos frecuentes y pierden todo contenido sustancial, ¿hasta convertirse quizá en una simple forma de :tn[mantener viva la racha]{is="La expresión original 续火花 se refiere a seguir intercambiando mensajes en una plataforma social únicamente para conservar una racha o el icono de una llama."}? Al final, la situación degenera hasta que esa persona pasa a ignorarte por completo. Como la rana en agua que se calienta lentamente, se muestra cada vez más fría y termina desapareciendo de tu vida. Puede que no te elimine de sus contactos, pero, en la práctica, es como si ya hubiera desaparecido de tu mundo. Si después vuelve a buscarte porque necesita algo, :tn[se comportará de una manera totalmente distinta a la de antes]{is="En el original, el verbo inglés `act` aparece con formato de código y unido directamente a la partícula complementaria china 得. Esta mezcla deliberadamente forzada hace que el cambio de actitud parezca una actuación consciente."}. Ya no será la ayuda que se prestan dos conocidos, como antes, sino que parecerá haber una distancia invisible entre ambos…'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-26T06:50:41.299424Z
      seconds: 210.115590208
      tokens: 27646
      review: false
    fr-FR:
      text: 'Mais à quoi ressemble exactement cette froideur ? Elle ne s’installe pas en un instant. Le plus souvent, l’un de tes contacts s’éloigne peu à peu de toi : les messages se raréfient et se vident de toute substance, jusqu’à n’être peut-être plus qu’une façon de :tn[maintenir la série en vie]{is="L’expression originale 续火花 désigne le fait de continuer à échanger des messages sur un réseau social uniquement pour conserver une série ou une icône en forme de flamme."} ? À la fin, cela dégénère jusqu’à ce que cette personne t’ignore complètement. Comme la grenouille plongée dans une eau que l’on chauffe lentement, elle devient peu à peu distante, puis disparaît de ta vie. Elle ne te supprimera peut-être pas de ses contacts, mais, en réalité, cela ne diffère guère d’une disparition de ton monde. Si elle revient ensuite te demander quelque chose, elle :tn[se comportera d’une manière totalement différente d’avant]{is="Dans l’original, le verbe anglais `act` est mis en forme comme du code puis directement rattaché à la particule chinoise 得. Ce mélange volontairement raide donne l’impression que la personne joue délibérément un autre rôle."}. Ce ne sera plus un service rendu entre connaissances comme autrefois, mais comme si une distance invisible vous séparait…'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-26T06:50:41.299424Z
      seconds: 210.115590208
      tokens: 27646
      review: false
    ja-JP:
      text: では、その冷たさは実際どのように表れるのだろう。ある瞬間に突然そうなるのではなく、たいていは、連絡先にいる誰かが少しずつあなたから離れていく。メッセージは減り、中身もなくなり、やがては:tn[ストリークを途切れさせないためだけのやり取り]{is="原文の「续火花」は、SNSでメッセージの往復を続け、ストリークや炎の印を維持する行為を指す。単に関係をつなぎ止めるという意味ではない。"}になってしまうのだろうか。そして最後には、完全に無視されるところまで行き着く。まるでぬるま湯からゆっくり煮られるカエルのように、相手はじわじわと冷たくなり、やがてあなたの生活から消えていく。連絡先から削除されることはないかもしれないが、実際にはあなたの世界から消えたのと変わらない。その後、何か用があって連絡してきても、:tn[振る舞いは以前とはまるで違う]{is="原文では、英語の動詞 `act` をコード書式のまま中国語の補語表現「得」につないでいる。わざとぎこちなく言語を混ぜることで、相手が意識的に別の態度を演じている感じを出している。"}。もはや昔のような知り合い同士の助け合いではなく、間に見えない距離があるかのようだ……
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-26T06:50:41.299424Z
      seconds: 210.115590208
      tokens: 27646
      review: false
    ko-KR:
      text: 그렇다면 그 차가움은 구체적으로 어떤 모습일까? 어느 한순간 갑자기 벌어지는 일은 아니다. 대개는 연락처에 있는 누군가가 서서히 당신에게서 멀어지는 식으로 나타난다. 메시지는 갈수록 뜸해지고 내용도 없어지다가, 어쩌면 그저 :tn[스트릭 불씨를 이어 가기 위한 연락]{is="원문의 ‘续火花’는 소셜 플랫폼에서 메시지를 계속 주고받아 스트릭이나 불꽃 표시가 사라지지 않게 하는 행동을 뜻한다."}으로 변하는 걸까? 그러다 끝내는 아예 무시하는 상태로 퇴보한다. 미지근한 물 속의 개구리를 서서히 삶듯, 상대는 조금씩 차가워지다가 당신의 삶에서 사라진다. 연락처에서는 지우지 않을지도 모르지만, 실은 당신의 세계에서 사라진 것이나 다름없다. 그 뒤 무슨 일이 있어 다시 찾아오더라도 :tn[태도는 예전과 완전히 달라질 것이다]{is="원문은 영어 동사 `act`를 코드 서식으로 감싼 뒤 중국어 보어 표지 ‘得’에 바로 붙였다. 의도적으로 어색한 언어 혼용이 상대가 일부러 다른 태도를 연기하는 느낌을 준다."}. 더는 예전처럼 아는 사람끼리 돕는 것이 아니라, 둘 사이에 보이지 않는 거리가 놓인 듯할 것이다……
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-26T06:50:41.299424Z
      seconds: 210.115590208
      tokens: 27646
