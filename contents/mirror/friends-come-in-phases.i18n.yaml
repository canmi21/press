    ja-JP:
      text: 特にTwitterでは、ときどき「自分の友達が誰か別の人の友達になってしまった」と感傷的になることがある。でも、よく考えれば、それはごく自然なことだ。そもそも、この世界に同じタイムラインは二つとなく、僕とあなたのタイムラインが運よく交わったこと自体、すでに幸運なのだ。あるコミュニティーに入って人と知り合えば、そこにいる人たちも互いに知り合えるのと同じだ。従来のグループチャットでは、そうした交流は個別のやり取りなので、その過程が目に入ることはない。けれどもTwitterは、残念ながらその境界を取り払ってしまった。誰もが公開しているツイートの中では、たいていこの動きを簡単に見て取れる。他人と自分を結ぶ関係が周期的に入れ替わり始めると、その現象はいとも簡単に目につくようになる。
