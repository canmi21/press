    zh-CN:
      text: 但其实我也一样。第一次意识到别人这样对我以后，我也反思过自己是否曾对别人做过类似的事。现在看来，答案是肯定的。这样想也许有些残忍，但俗话说得好：“日久见人心。”不是每个偶然遇到的人都能和我聊得来，也不是每个人的行为都能让我感到舒服。对于一开始没看清的人，出于礼貌，我确实不会马上取消关注；但如果对方真的做得太过分，我会毫不犹豫地拉黑。也许有些时候，单向、不会显示通知、也不会过滤通过 `@mention` 发给你的消息的 `mute`，才是最好的选择。很多时候，你让别人感到不舒服，自己却未必察觉；或者说，那就是最真实的你：你不觉得自己的行为有什么问题，别人却不以为然。也许别人感到不适的时候，就是我被静音的时候吧？（但如果大多数人都不会静音你，那多半只是对方太:tn[玻璃心]{is="原文用网络说法“玻璃心”，把人的敏感脆弱比作一颗易碎的玻璃心，通常还带有嘲讽意味。"}；也可能反过来。）
