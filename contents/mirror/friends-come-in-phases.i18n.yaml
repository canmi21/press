      text: 'Dabei hatte ich diese Richtung in den letzten ein, zwei Jahren längst geahnt, nur bin ich dem Thema immer ausgewichen. Bis ich vor einiger Zeit eines Abends so lange durch Twitter scrollte, bis ich :tn[trübsinnig]{is="Im Original steht das lateinisch geschriebene englische Wort „emo“ direkt als chinesisches Prädikat – „我 emo 了“ –, ein Netzausdruck für gedrückte Stimmung mit halb selbstironischem Ton."} wurde: Da sah ich Leute, die einander früher kannten, :tn[Twitter-Kumpels]{is="Das Original schreibt 推油, eine gleichlautende Spielform von 推友 („Twitter-Freund“); sie trägt die Zärtlichkeit eines chinesischen Netz-Kosenamens."}, die sich :tn[aneinanderschmiegten]{is="Das Original schreibt 贴贴, ein verdoppeltes Netzwort, das einen schmusigen, kindlichen Tonfall nachahmt; ein schlichtes „Umarmen“ verliert dieses Kleinkindhafte."} und umarmten, sich guten Morgen und gute Nacht wünschten, einander sogar antworteten – und erst da wurde mir klar: Vielleicht bin ich der Überflüssige … Dieser ganze Kreis besteht noch. Nur mein eigener Freundeskreis ist längst nicht mehr der von damals, und ich glaube, vielleicht bin ich der „Außenstehende“.'
