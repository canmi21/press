  8e01bc84022d819699f363bd4473aebf:
    de-DE:
      text: 'Diese „Phasen“ lassen sich vielleicht mit einer Liebesbeziehung vergleichen: Es gibt eine Phase des Neuen und eine leidenschaftliche Phase. Bei Gesprächen und Kontakten unter Freunden ist es ähnlich. In den ersten Tagen nach dem Kennenlernen tauscht man sich meist sehr rege aus und gräbt womöglich sogar deine **:tn[peinliche Vergangenheit]{is="Im Original steht 黑历史, ein aus der japanischen Subkultur hervorgegangener chinesischer Internetausdruck für eine beschämende Vergangenheit, an die man selbst nicht erinnert oder von anderen nicht erinnert werden möchte. Gemeint ist keine gewöhnliche dunkle Geschichte; der Ausdruck klingt spöttisch und spielerisch."}** aus; danach geht die Beziehung in eine Phase beständigen Austauschs über, die von etwas Langfristigem getragen wird. Vielleicht arbeitet man zusammen, besucht dieselbe Schulklasse, teilt als Onlinebekanntschaft ein Interesse oder jemand wendet sich wegen eines Problems an dich, das sich nicht kurzfristig lösen lässt. Es ist, als hätten sich zwei Linien, die einander ursprünglich nie kreuzten, plötzlich umeinandergewunden – und genauso tauchen diese Menschen unvermittelt in deinem Leben auf.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-26T06:50:51.421148Z
      seconds: 67.40813625
      tokens: 22257
      review: false
    en-US:
      text: 'The “phases” can probably be compared to dating: there is a novelty phase and a passionate phase. Friendships and conversations work the same way. During the first few days after meeting, people communicate enthusiastically and may even dig up your **:tn[embarrassing past]{is="The original uses 黑历史, Chinese internet slang derived from Japanese subculture for an embarrassing past someone would rather not revisit or have others uncover—not an ordinary dark history."}**; afterward, the relationship settles into a phase of steady interaction sustained by something long-running. It might be working together, being classmates in the same class, sharing an interest with someone you met online, or someone approaching you with a problem that cannot be solved quickly. It is as though two lines that never intersected suddenly became entwined; that is how these people abruptly appeared in your life.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-26T06:50:51.421148Z
      seconds: 67.40813625
      tokens: 22257
      review: false
    es-ES:
      text: 'Estas «etapas» quizá puedan compararse con una relación amorosa: hay una etapa de novedad y otra de pasión. Las conversaciones y la interacción entre amigos funcionan igual. Durante los primeros días después de conocerse, las personas suelen comunicarse con mucho entusiasmo e incluso desenterrar tu **:tn[pasado vergonzoso]{is="El original emplea 黑历史, jerga china de internet procedente de la subcultura japonesa. Con un tono burlón, alude a un pasado embarazoso que uno preferiría no recordar ni ver expuesto por otros, no simplemente a una historia oscura."}**; después, la relación entra en una etapa de comunicación estable sostenida por algo duradero. Puede ser que trabajéis juntos, que seáis compañeros de la misma clase, que compartáis un interés tras haberos conocido por internet o que alguien acuda a ti con un problema que no puede resolverse en poco tiempo. Es como si dos líneas que nunca se cruzaban se enredaran de repente: así es como esas personas aparecen inesperadamente en tu vida.'
      provider: openai
      model: gpt-5-6-sol-xhigh
      at: 2026-08-26T06:50:51.421148Z
      seconds: 67.40813625
      tokens: 22257
      review: false
    fr-FR:
      text: 'On pourrait sans doute comparer ces « phases » à une relation amoureuse : il y a celle de la nouveauté, puis celle de la passion. Les échanges et les conversations entre amis suivent le même schéma. Durant les premiers jours après une rencontre, on communique avec beaucoup d’enthousiasme, au point d’aller parfois déterrer ton **:tn[passé embarrassant]{is="L’original emploie 黑历史, un terme d’argot d’Internet chinois issu de la sous-culture japonaise. Sur un ton moqueur, il désigne un passé gênant que l’on préférerait oublier ou ne pas voir exhumé par les autres, et non une simple histoire sombre."}** ; puis la relation entre dans une phase d’échanges réguliers, entretenue par quelque chose qui s’inscrit dans la durée. Il peut s’agir de travailler ensemble, d’être dans la même classe, de partager un centre d’intérêt avec une personne rencontrée en ligne, ou encore de quelqu’un qui vient te voir pour un problème impossible à résoudre rapidement. C’est comme si deux lignes qui ne devaient jamais se croiser s’étaient soudain entortillées l’une autour de l’autre : c’est ainsi que ces personnes surgissent brusquement dans ta vie.'
      provider: openai
      model: gpt-5-6-sol-xhigh
