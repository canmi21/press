    ko-KR:
      text: 특히 Twitter에서는 가끔 내 친구가 다른 사람의 친구가 되어 버렸다는 생각에 서글퍼지곤 한다. 하지만 곰곰이 생각해 보면 사실 지극히 자연스러운 일이다. 애초에 세상에는 똑같은 타임라인이 존재하지 않으며, 나와 당신의 타임라인이 운 좋게 마주친 것만으로도 이미 행운이다. 어떤 무리에 들어가 사람들을 알게 되면, 그 안의 사람들끼리도 서로 알게 될 수 있는 것과 같다. 기존의 단체 채팅 구조에서는 그런 교류가 개인 대화로 이루어지기 때문에 그 과정을 알 수 없다. 하지만 안타깝게도 Twitter는 그 경계를 허물어 버렸다. 모두가 공개한 게시물 속에서는 대개 이런 움직임을 아주 쉽게 관찰할 수 있다. 다른 사람과 나를 잇는 관계가 주기적으로 바뀌기 시작하면, 그 현상은 너무나 쉽게 눈에 들어온다.
