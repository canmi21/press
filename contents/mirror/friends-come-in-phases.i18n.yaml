    fr-FR:
      text: 'Pourtant, depuis un an ou deux, je sentais déjà confusément que les choses prenaient cette direction, mais je n’avais cessé d’éviter le sujet. Jusqu’à ce soir, il y a quelque temps, où faire défiler Twitter m’a :tn[mis en mode emo]{is="Dans l’original, le mot anglais emo est directement employé comme prédicat chinois, donnant à cette baisse de moral un ton très Internet et à moitié autodérisoire."}. En voyant des :tn[potes de Twitter]{is="Dans l’original, tuiyou est un surnom Internet affectueux pour les amis rencontrés sur Twitter, écrit comme un jeu de mots homophone."} qui se connaissaient autrefois :tn[se faire des câlinous]{is="Dans l’original, un mot Internet redoublé imite une voix enfantine et câline pour évoquer le fait de se blottir ou d’afficher ouvertement son affection."}, s’embrasser, se souhaiter bonjour et bonne nuit, et même se répondre, j’ai enfin compris : c’était peut-être moi, la personne de trop... Tous les gens de ce cercle étaient encore là ; c’était seulement mon cercle d’amis qui, depuis longtemps déjà, n’était plus celui d’autrefois. Peut-être étais-je, moi, « l’étrangère ».'
