    ja-JP:
      text: 私が人と知り合うきっかけは、実のところかなり限られている。たいていはグループチャットで何かが突然持ち上がったり、何らかの「関係」ができたりすることから始まる。「関係」というと長く続きそうに聞こえるけれど、はっきり言えば、その多くは自分ではどうにもできない成り行きから生まれたものだ。同僚や同級生だったり、単に同じことに興味があったり、たまたま同じようなことをしていたりする人たちだ。最初は必要に迫られて連絡先を追加することが多く、追加した後はそのまま放置する。相手から連絡してこなければ、おそらく一生メッセージを交わすことはない。でも、ある日何かをきっかけに相手が突然連絡してきたら、たいていはこの段階に入ることになる。
