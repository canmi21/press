  b34a6b1c2f0d0b56c028aa46eed14e9b:
    de-DE:
      text: (Ähnliches passiert auch auf Twitter.) Konkret zeigt es sich darin, dass die Interaktionen allmählich abnehmen und diese Menschen dann langsam aus deiner Timeline verschwinden. Gelegentlich gehst du deine Liste der abonnierten Konten durch, öffnest ihre Profile und stellst fest, dass sie noch immer ähnliche Dinge tun und dasselbe Leben teilen – doch es ist, als gäbe es zwischen euch keine Verbindung mehr. Manchmal folgt ihr euch sogar weiterhin gegenseitig, aber einer von euch schaltet den anderen stumm. Früher habt ihr euch bestens verstanden, heute tauchen sie nicht mehr in deinem Umfeld auf; doch weil es diese Beziehung einmal gab, wäre es aus Rücksicht auf die gemeinsame Vergangenheit zu unangenehm, ihnen nicht mehr zu folgen, und so schenken sie dir stattdessen das kälteste und zugleich unsichtbarste Schweigen...
      provider: openai
      model: gpt-5-6-sol-high
      at: 2026-08-20T05:23:45.367267Z
      seconds: 36.48205125
      tokens: 20680
      review: false
    en-US:
      text: (Similar things happen on Twitter, too.) Specifically, interactions gradually dwindle, and then these people slowly disappear from your timeline. Occasionally, you scroll through your following list and click on their profiles, only to find that they are still doing the same kinds of things and sharing the same life, but it is as though they no longer have any connection with you. Sometimes, even though you still follow each other, one of you ends up muting the other. You used to be so close, yet now they no longer appear around you; but because you once shared that kind of relationship, unfollowing them would feel too awkward, so instead they give you the coldest yet most invisible kind of silence...
      provider: openai
      model: gpt-5-6-sol-high
      at: 2026-08-20T05:23:45.367267Z
      seconds: 36.48205125
      tokens: 20680
      review: false
    es-ES:
      text: (Algo parecido también sucede en Twitter.) En concreto, las interacciones disminuyen gradualmente y, después, esas personas desaparecen poco a poco de tu cronología. De vez en cuando repasas la lista de cuentas que sigues, entras en sus perfiles y descubres que siguen haciendo el mismo tipo de cosas y compartiendo la misma vida, pero es como si ya no existiera ningún vínculo entre vosotros. A veces, aunque continuéis siguiéndoos mutuamente, uno acaba silenciando al otro. Antes os llevabais muy bien, pero ahora ya no aparecen a tu alrededor; sin embargo, como una vez tuvisteis esa clase de relación, dejar de seguirlos resultaría demasiado incómodo por consideración a lo vivido, así que, en su lugar, te ofrecen el silencio más frío y, a la vez, más invisible...
      provider: openai
      model: gpt-5-6-sol-high
      at: 2026-08-20T05:23:45.367267Z
      seconds: 36.48205125
      tokens: 20680
