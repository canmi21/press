      seconds: 70.972586375
      tokens: 23417
      review: false
    es-ES:
      text: 'Las personas también somos animales emocionales, y es completamente normal sentir que queremos a nuestros amigos solo para nosotros. Eso no significa que debas poseerlos de verdad ni controlar la conducta o los pensamientos de los demás, sino que te importan y que tú y esa persona sois `close friend`. Pero, como ya he dicho, tus amigos también son personas. Deberían tener su propia vida y su propio timeline, así que es perfectamente normal que se conviertan en `mutual friend` con alguien más. Si hay que culpar a algo, que sea a Twitter por :tn[rasgar el fino velo que cubría esta verdad]{is="El original emplea chuanghuzhi, una metáfora idiomática china en la que se perfora el papel de una ventana para revelar algo que todos saben pero nadie dice. Aquí Twitter es la fuerza que deja al descubierto la verdad de las relaciones."} y obligarte a presenciar el proceso. Pero quizá eso no sea malo. Al mostrártelo te entristece, aunque también te da más oportunidades de conocer gente, ¿no? Dejar atrás el modelo tradicional centrado en las conversaciones privadas, sin la presión de mantener a largo plazo una `close friend`, y limitarse a darse las buenas noches y :tn[publicar sin freno por pura pasión]{is="El original usa fadian, una expresión humorística de las comunidades chinas de internet para publicar contenido a raudales movido por el entusiasmo, el enamoramiento o el deseo, mucho más que producir electricidad en sentido literal."}: eso también es socializar en su forma más pura. Que ver `mutual friend` te entristezca o no depende, en realidad, de ti. No importa qué medio utilices, ni siquiera fuera de internet puedes impedir que este proceso suceda. Si logras aceptarlo, quizá ya no te duela y poco a poco aprendas a dejar ir.'
