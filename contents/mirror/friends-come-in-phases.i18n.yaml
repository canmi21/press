    zh-CN:
      text: 人与人关系的「阶段」大概可以比作谈恋爱：既有新鲜期，也有热烈期，朋友之间的互动和聊天也是如此。刚认识的几天里，彼此会非常积极地交流，甚至深挖你的**:tn[尴尬旧事]{is="原文用的是网络词“黑历史”，源自日本亚文化，特指本人不愿回顾或被人翻出的尴尬过往，并非一般意义上的黑暗历史。"}**；随后，关系便会进入长期而稳定的交流阶段。你们可能一起工作，可能是在学校同班，可能是网上认识后因共同兴趣而来往，也可能是对方因为某个短时间内无法解决的问题来找你。就像两条原本互不相交的线突然缠在了一起，他们也就这样猝不及防地出现在了你的生活里。
