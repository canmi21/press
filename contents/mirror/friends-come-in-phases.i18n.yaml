      text: 'L’être humain est aussi un animal affectif, et il est parfaitement normal d’éprouver le désir de garder ses amis pour soi. Cela ne signifie pas qu’il faille réellement les posséder ni contrôler leur comportement ou leurs pensées, mais simplement qu’ils comptent pour toi et que vous êtes `close friend`. Cependant, comme je l’ai dit, tes amis sont eux aussi des êtres humains. Ils ont droit à leur propre vie et à leur propre fil d’actualité ; il est donc tout à fait normal qu’ils deviennent `mutual friend` avec quelqu’un d’autre. S’il faut accuser quelque chose, accusons Twitter d’avoir :tn[déchiré le voile ténu qui recouvrait cette vérité]{is="L’original emploie chuanghuzhi, une métaphore idiomatique chinoise où l’on perce le papier d’une fenêtre pour révéler ce que tout le monde sait sans le dire. Ici, Twitter est la force qui dévoile la vérité des relations."} et de t’avoir forcé à assister à ce processus. Mais ce n’est peut-être pas une mauvaise chose. En te le montrant, Twitter te rend triste, mais te donne aussi davantage d’occasions de rencontrer des gens, non ? Abandonner le modèle traditionnel centré sur les conversations privées, ne pas subir la pression d’entretenir durablement une `close friend`, se contenter de se souhaiter bonne nuit et de :tn[publier à profusion sous le coup de la passion]{is="L’original emploie fadian, terme plaisant des communautés chinoises en ligne qui désigne le fait de produire abondamment du contenu sous l’effet de l’enthousiasme, de l’engouement ou du désir, bien au-delà du sens littéral de produire de l’électricité."} : c’est peut-être aussi la forme la plus pure de sociabilité. Être triste ou non en voyant `mutual friend` dépend en réalité de toi. Quels que soient les moyens employés, même hors ligne, tu ne peux pas empêcher ce processus de se produire. Si tu parviens toi-même à l’accepter, alors peut-être ne seras-tu plus triste et apprendras-tu peu à peu à lâcher prise.'
