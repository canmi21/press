  764ab5e3a41884365925b92929d8c193:
    de-DE:
      text: 'Und wie genau wird es kalt? Es ist nie ein einzelner Moment. Viel wahrscheinlicher ist, dass ein Kontakt sich Stück für Stück von dir entfernt: Die Nachrichten werden weniger und weniger, es bleibt nichts Substanzielles darin, bis alles zu einer Art :tn[Strähne-am-Leben-Halten]{is="Im Original stand 续火花, der chinesische Ausdruck dafür, jemandem nur deshalb täglich zu schreiben, um das Flammen- oder Serien-Abzeichen einer Chat-App zu erhalten — eine Produktmechanik, die Freundschaft in einen Zähler verwandelt, der nicht zurückspringen darf."} wird? Und am Ende verkommt es zu vollständigem Ignorieren. Wie ein Frosch im langsam erwärmten Wasser: Die Wärme versickert, und sie verschwinden aus deinem Leben. Der Kontakt wird vielleicht nie gelöscht, aber das macht keinen wirklichen Unterschied dazu, dass sie aus deiner Welt verschwunden sind. Und wenn danach doch etwas sie zu dir zurückführt, werden sie sich völlig anders als früher :tn[in Pose werfen]{is="Das Original setzte das englische Verb `act` in Code-Formatierung und hängte eine chinesische Grammatikpartikel daran; der absichtlich holprige Sprachwechsel lässt die veränderte Haltung des anderen gestellt und künstlich wirken."} — kein selbstverständlicher Gefallen mehr unter Vertrauten, sondern etwas über eine unsichtbare Distanz hinweg …'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:28:31.870873Z
      seconds: 65.594309625
      tokens: 32837
      review: false
    en-US:
      text: 'As for how exactly it goes cold? It is never a single moment. What is far more likely is that one contact drifts away from you bit by bit: messages get fewer and fewer, with no real substance left in them, until they turn into something like :tn[keeping the streak alive]{is="The original said 续火花, the Chinese term for messaging someone daily only to preserve a chat app''s flame or streak badge — a product mechanic that turns friendship into a counter you must not let reset."}? And in the end it degrades into being ignored entirely. Like a frog in slowly heating water, the warmth drains away, and they vanish from your life. The contact may never be deleted, but that makes no real difference from their having vanished from your world. And if something does bring them back to you afterwards, they will :tn[put on an act]{is="The original wrote the English verb `act` inside code formatting and bolted a Chinese grammatical particle onto it; the deliberately clumsy code-switch makes the other person''s change of manner look staged and artificial."} completely unlike before — no longer the easy favour between people who know each other, but something across an invisible distance...'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:28:31.870873Z
      seconds: 65.594309625
      tokens: 32837
      review: false
    es-ES:
      text: '¿Y cómo se enfría exactamente? Nunca es un instante concreto. Lo mucho más probable es que un contacto se vaya alejando de ti poco a poco: los mensajes se hacen cada vez más escasos, ya no queda nada sustancial en ellos, hasta convertirse en una especie de :tn[mantener viva la racha]{is="El original decía 续火花, la expresión china para escribirle a alguien a diario solo para conservar la llama o la insignia de racha de una aplicación de mensajería: un mecanismo del producto que convierte la amistad en un contador que no se puede dejar caer."} ? Y al final degenera en ignorarte por completo. Como la rana en agua que se calienta despacio: el calor se escapa, y desaparecen de tu vida. Puede que nunca borren el contacto, pero eso no supone ninguna diferencia real frente a haber desaparecido de tu mundo. Y si después algo los trae de vuelta a ti, van a :tn[adoptar una pose]{is="El original encerró el verbo inglés `act` en formato de código y le pegó una partícula gramatical china; esa mezcla de idiomas deliberadamente torpe hace que el cambio de actitud del otro parezca actuado."} completamente distinta de antes: ya no es el favor fácil entre conocidos, sino algo al otro lado de una distancia invisible…'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:28:31.870873Z
      seconds: 65.594309625
      tokens: 32837
      review: false
    fr-FR:
      text: 'Et comment cela refroidit-il, au juste ? Ce n''est jamais un instant précis. Ce qui arrive bien plus souvent, c''est qu''un contact s''éloigne de toi petit à petit : les messages se raréfient, plus rien de substantiel n''y subsiste, jusqu''à devenir une sorte de :tn[maintien de la série en vie]{is="L''original disait 续火花, l''expression chinoise pour écrire à quelqu''un chaque jour dans le seul but de conserver la flamme ou le badge de série d''une messagerie — un mécanisme de produit qui transforme l''amitié en un compteur qu''il ne faut surtout pas laisser retomber."} ? Et à la fin, cela dégénère en indifférence totale. Comme la grenouille dans l''eau qui chauffe lentement : la chaleur s''en va, et ils disparaissent de ta vie. Le contact ne sera peut-être jamais supprimé, mais cela ne change rien au fait qu''ils ont disparu de ton monde. Et si quelque chose les ramène ensuite vers toi, ils vont :tn[se composer une attitude]{is="L''original enfermait le verbe anglais `act` dans un formatage de code et y accolait une particule grammaticale chinoise ; ce mélange de langues volontairement bancal fait paraître le changement d''attitude de l''autre comme une pose jouée."} tout autre qu''avant — plus ce service qu''on se rend entre proches, mais quelque chose par-dessus une distance invisible…'
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:28:31.870873Z
      seconds: 65.594309625
      tokens: 32837
      review: false
    ja-JP:
      text: では、どうやって冷めていくのか。それは決して一瞬の出来事ではない。もっとありそうなのは、ある連絡先が少しずつあなたから離れていくことだ。メッセージは減っていき、中身のある内容もなくなり、やがて :tn[連続記録をつなぐためだけのやりとり]{is="原文は中国語の「続火花」。チャットアプリで毎日やりとりを続けないと消えてしまう「炎」や連続記録のバッジを維持するためだけに送り合う行為を指す言い方で、友情がカウンターの維持作業に変わってしまうことを表す。"} のようなものになる。そして最後には完全に無視されるところまで退化する。ぬるま湯で茹でられる蛙のように、温度がゆっくり抜けていき、あなたの生活から消えていく。連絡先は消されないかもしれないが、あなたの世界から消えたのと実際には変わらない。そのあとで何か用があって連絡してきたとしても、その態度は以前とはまったく違う :tn[芝居がかったもの]{is="原文は英語の動詞 `act` をコード書式で囲み、そこに中国語の助詞をつなげている。わざとぎこちなくした言語の混ぜ方が、相手の変わった態度をわざとらしい演技のように見せている。"} になる。かつてのような、気心の知れた者どうしの頼みごとではなく、見えない距離を挟んだ何かになるのだ……
      provider: anthropic
      model: claude-opus-5
      at: 2026-08-29T22:28:31.870873Z
      seconds: 65.594309625
      tokens: 32837
      review: false
    ko-KR:
