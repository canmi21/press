[env]
# jj's repo config lives outside the working copy and cannot be version controlled.
# JJ_CONFIG merges a colon-separated list left to right, so this keeps the user's personal
# jj settings and layers the repo's rules (see jj.toml) on top. mise scopes this to the
# directory, so it applies here and nowhere else.
JJ_CONFIG = "{{env.HOME}}/.config/jj/config.toml:{{config_root}}/jj.toml"

# Read by both the Rust binary that binds it and the Vite config that proxies to it, which is
# why it lives here rather than in libs/urls -- Rust cannot read a TypeScript library.
# Pinned, never auto-incremented; see spec/toolchain.md.
CMS_PORT = "26521"

# Credentials, decrypted by mise on entering the directory. The file is committed encrypted;
# only the age private key opens it. See spec/toolchain.md for the key setup and for why this
# is JSON rather than a dotenv.
_.file = "secrets.json"

# rclone is configured entirely through the environment, so there is no rclone.conf holding a
# second copy of anything. Only the parts that are actually secret live in secrets.json; these
# three are public facts about which service it is.
RCLONE_CONFIG_R2_TYPE = "s3"
RCLONE_CONFIG_R2_PROVIDER = "Cloudflare"
RCLONE_CONFIG_R2_REGION = "auto"

# The bucket mirrors data/public, and is named `public` so the two paths read the same
# segment for segment: data/public/favicon/x.svg <-> r2:public/favicon/x.svg. A different
# name would add a translation step for a reader to get wrong.
R2_REMOTE = "r2:public"

[tasks.test]
description = "Run every test in the workspace"
run = "pnpm exec vitest run"

[tasks.check]
description = "Type check every workspace package"
run = "pnpm exec tsc --noEmit"

[tasks.check-fonts]
description = "Check the font manifest, published chunks, stylesheets, and splitter runtime"
run = ".mise/tasks/fonts --check"

[tasks.lint]
description = "Lint the workspace"
run = "oxlint ."

[tasks.test-rust]
description = "Run the Rust test suites"
run = "cargo test --workspace"

[tasks.lint-rust]
description = "Lint the Rust crates"
run = "cargo clippy --workspace --all-targets"

# wrangler is a devDependency of each worker rather than a mise tool, because it participates
# in the npm resolution model -- so it is never on $PATH and always needs `pnpm exec`. These
# wrap that, since "which incantation reaches wrangler" is not worth remembering.
[tasks.cf-login]
description = "Authenticate wrangler with Cloudflare (interactive)"
dir = "apps/api"
run = "pnpm exec wrangler login"

[tasks.deploy-site]
description = "Build and deploy the site worker"
dir = "apps/site"
# Two steps because the adapter writes the worker that wrangler then uploads, and the build is
# also where source maps go to Sentry. Cloudflare will run the same two commands once the repo
# is connected; this is the same path, run from here.
run = ["pnpm run build", "pnpm exec wrangler deploy"]

[tasks.deploy-api]
description = "Deploy the API worker"
dir = "apps/api"
# The package command applies committed remote D1 migrations immediately before upload.
run = "pnpm run deploy"

[tasks.deploy-cdn]
description = "Deploy the CDN worker"
dir = "apps/cdn"
# `--env=""` names the top-level environment explicitly. Defining any environment at all makes
# wrangler refuse to guess, and the one it would be guessing between here is production and
# the dev config that mounts data/public as assets -- picking wrong would upload every file in
# it alongside the worker.
run = 'pnpm exec wrangler deploy --env=""'

[tasks.dev-api]
description = "Run the API worker"
dir = "apps/api"
run = "pnpm run dev"

[tasks.dev-site]
description = "Run the site worker"
dir = "apps/site"
run = "pnpm run dev"

[tasks.dev-cdn]
description = "Run the CDN worker against data/public"
dir = "apps/cdn"
run = "pnpm run dev"

[tasks.dev-cms]
description = "Run the CMS desktop client"
dir = "apps/cms"
run = "pnpm run dev"

[tasks.check-site]
description = "Type check the site, which needs SvelteKit's generated declarations"
dir = "apps/site"
run = "pnpm run check"

[tasks.verify]
description = "Everything a change has to pass, across both languages"
depends = [
	"secrets",
	"check",
	"check-site",
	"check-fonts",
	"lint",
	"test",
	"refs",
	"lint-rust",
	"test-rust",
]

[tools]
node = "latest"
rust = "stable"
pnpm = "latest"
jj = "latest"
oxlint = "latest"
oxfmt = "latest"
rclone = "latest"

[tasks.gc]
description = "Compact the object stores and list published assets no article references"
# Run when you want to, not on every commit: these walk the whole repository, and paying that
# on each of a dozen commits an hour buys nothing. git also does this itself via gc.auto.
#
# The asset sweep only reports here. Compacting an object store loses nothing, while deleting
# a published variant changes what R2 serves on the next sync, so the two do not deserve the
# same trigger even when they are convenient to run together.
run = ["jj util gc", "git gc", "cargo run -q -p cms -- gc"]

[tasks.gc-assets]
description = "Delete the published assets that `gc` listed"
# Separate because this is the irreversible half. Recoverable in practice -- data/image still
# holds the originals and `cms image` rebuilds from a content id -- but only while that is
# true, which is a fact about this repository rather than a guarantee of the command.
run = "cargo run -q -p cms -- gc --live"
